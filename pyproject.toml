[project]
name = "redress-mcp"
version = "0.1.0"
description = "Verified contacts, playbooks and escalation paths for 180+ US companies, as an MCP server for AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "LICENSE-DATA"]
authors = [{ name = "Alex Gao" }]
keywords = ["mcp", "model-context-protocol", "consumer-protection", "complaints", "refunds", "ai-agents", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "mcp>=1.9",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/alexgaoth/redress"
Directory = "https://intro.alexgaoth.com/redress/"
Issues = "https://github.com/alexgaoth/redress/issues"

[project.scripts]
redress = "redress.cli:main"
redress-mcp = "redress.cli:serve_main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redress"]

# Ship the registry, schema and skills inside the wheel, so `uvx redress-mcp` works without a checkout.
[tool.hatch.build.targets.wheel.force-include]
"registry" = "redress/data/registry"
"schema" = "redress/data/schema"
"skills" = "redress/data/skills"

[tool.hatch.build.targets.sdist]
include = ["src", "registry", "schema", "skills", "docs", "tests", "LICENSE", "LICENSE-DATA", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
