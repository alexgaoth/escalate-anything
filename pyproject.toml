[project]
name = "escalate-anything"
version = "0.2.1"
description = "Get the upper hand on any big US company when they wrong you. An MCP server that gives your AI agent the contacts, playbooks and escalation paths for 270+ companies."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "LICENSE-DATA"]
authors = [{ name = "Alex Gao" }]
keywords = ["mcp", "model-context-protocol", "consumer-protection", "complaints", "refunds", "ai-agents", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]
dependencies = [
    "mcp>=1.9",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/alexgaoth/escalate-anything"
Directory = "https://intro.alexgaoth.com/escalate-anything/"
Issues = "https://github.com/alexgaoth/escalate-anything/issues"

[project.scripts]
escalate = "escalate_anything.cli:main"
escalate-anything = "escalate_anything.cli:serve_main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/escalate_anything"]

# Ship the registry, schema and skills inside the wheel, so `uvx escalate-anything` works without a checkout.
[tool.hatch.build.targets.wheel.force-include]
"registry" = "escalate_anything/data/registry"
"schema" = "escalate_anything/data/schema"
"skills" = "escalate_anything/data/skills"

[tool.hatch.build.targets.sdist]
include = ["src", "registry", "schema", "skills", "docs", "tests", "LICENSE", "LICENSE-DATA", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
