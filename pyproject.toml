[project]
name = "redress"
version = "0.1.0"
description = "Index of how to resolve problems with large US companies, with an MCP server and agent skills."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.9",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
    "httpx>=0.27",
]

[project.scripts]
redress = "redress.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redress"]

[tool.pytest.ini_options]
testpaths = ["tests"]
