name: mcp-registry
# Publishes server.json to the official MCP Registry after each PyPI release, with GitHub OIDC
# (no stored token; the io.github.alexgaoth namespace is proven by the repository).
# Also runs by hand (Actions > mcp-registry > Run workflow) to republish the current main.
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # MCP Registry login with GitHub OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Wait until PyPI serves this version
        # The registry checks that the package version exists on PyPI before it accepts server.json.
        run: |
          version=$(python3 -c 'import json; print(json.load(open("server.json"))["version"])')
          for i in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/escalate-anything/$version/json" >/dev/null; then echo "PyPI has $version"; exit 0; fi
            sleep 20
          done
          echo "PyPI does not have $version after 10 minutes" >&2; exit 1
      - name: Install mcp-publisher
        run: curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
