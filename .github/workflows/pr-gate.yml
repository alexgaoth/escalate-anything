name: pr-gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pr-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest
      - run: escalate validate
      - run: pytest -q
      - name: Wheel works outside the checkout
        run: |
          pip install build && python -m build
          python -m venv /tmp/wheel && /tmp/wheel/bin/pip install dist/*.whl
          cd /tmp && /tmp/wheel/bin/escalate stats > /dev/null && /tmp/wheel/bin/escalate-anything --help > /dev/null
