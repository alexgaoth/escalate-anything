name: pr-gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pr-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest
      - run: redress validate
      - run: pytest -q
