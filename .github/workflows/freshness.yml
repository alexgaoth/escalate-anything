name: freshness
on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: redress check-links --output linkcheck.md --fail-on-dead
      - run: redress stale --days 180 | tee stale.txt
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freshness-report
          path: |
            linkcheck.md
            stale.txt
