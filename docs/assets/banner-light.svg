<text x="66" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#1f2328">Get the upper hand on any big company when they wrong you.</text>
<text x="66" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#59636e">Big companies count on you giving up. This repo will make your agent hunt them down.</text>
<rect x="64" y="214" rx="15" width="127" height="30" fill="#f6f8fa" stroke="#59636e" stroke-opacity="0.35"/><text x="128" y="234" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328">279 companies</text><rect x="201.2" y="214" rx="15" width="211" height="30" fill="#f6f8fa" stroke="#59636e" stroke-opacity="0.35"/><text x="307" y="234" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328">51 states + DC agencies</text><rect x="422.4" y="214" rx="15" width="211" height="30" fill="#f6f8fa" stroke="#59636e" stroke-opacity="0.35"/><text x="528" y="234" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328">1,995 verified contacts</text><rect x="643.6" y="214" rx="15" width="127" height="30" fill="#f6f8fa" stroke="#59636e" stroke-opacity="0.35"/><text x="707" y="234" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328">960 playbooks</text><rect x="780.8" y="214" rx="15" width="169" height="30" fill="#f6f8fa" stroke="#59636e" stroke-opacity="0.35"/><text x="865" y="234" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328">every fact sourced</text>
