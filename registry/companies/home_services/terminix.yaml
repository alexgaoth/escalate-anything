    source: https://www.terminix.com/myaccount-faq/
    last_verified: 2026-10-13
  - id: text-line
    type: sms
    label: Text Terminix customer service
    value: '+1-866-980-8669'
    hours: "Mon-Fri 7am-7pm CST; Sat 7am-3pm CST"
    purposes: [billing_error, poor_service]
    source: https://www.terminix.com/contact-us/
    last_verified: 2026-10-13
  - id: live-chat
    type: chat
    label: Online chat with a representative (start from the "Chat" link on the contact page)
    value: https://www.terminix.com/contact-us/
    hours: "Mon-Fri 7am-7pm CST; Sat 7am-3pm CST"
    purposes: [billing_error, poor_service]
    source: https://www.terminix.com/contact-us/
    last_verified: 2026-10-13
  - id: residential-inquiry-form
    type: web_form
    label: Residential Customer Inquiries form (on the contact page)
    value: https://www.terminix.com/contact-us/
    purposes: [cancel_service, billing_error, poor_service, refund_request]
    access: open
    notes: The contact page says Terminix responds "within the next business day." The form opens from a "Click here" link on the contact page; it has no separate URL. Do not use the "Corporate Inquiries" form, which says it is not for current or potential customers.
