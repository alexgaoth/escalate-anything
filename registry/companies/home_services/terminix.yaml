id: terminix
name: Terminix
aliases: [terminix international, terminix global holdings, rentokil terminix]
sector: home_services
parent: Rentokil North America, Inc. (Rentokil Initial plc)
website: https://www.terminix.com
account_url: https://www.terminix.com/my-account/
official_domains: [terminix.com]
regulators: [ftc]
notes: >-
  Pest and termite control. The terminix.com footer reads "© 2026 Rentokil North America, Inc.", and
  the privacy policy is hosted on the parent's site, rentokil-initial.com. Terminix does not publish its
  residential Service Contract online: the online Terms of Agreement page says the service
  representative provides a copy of the Service Contract to sign. The contract term, renewal terms,
  cancellation notice period, early termination charges, guarantee conditions and any 3-business-day
  cancellation notice in that contract could not be sourced. No Terminix page about scams or
  impersonation was found.

