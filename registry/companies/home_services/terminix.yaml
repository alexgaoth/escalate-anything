  - id: legal-notice-mail
    type: mail
    label: Written Notice of Dispute (terminix.com Terms of Use)
    value: "Rentokil North America, Inc., ATTN: Legal Department, 1125 Berkshire Blvd., Suite 150, Wyomissing, PA 19610"
    purposes: [poor_service, billing_error, refund_request]
    notes: The website Terms of Use say "Your Notice of Dispute to the Company must be sent by mail to Rentokil North America, Inc." at this address, and give 60 days from receipt to resolve the dispute before a formal proceeding. These Terms of Use cover the website; a signed Service Contract can name a different notice address.
