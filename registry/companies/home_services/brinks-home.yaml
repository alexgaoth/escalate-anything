notes: >-
  Home security monitoring company, BH Security, LLC dba Brinks Home, 1501 Lyndon B Johnson Fwy, Suite 700,
  Dallas, TX 75234. Brinks Home says independent Sales Representatives and Dealers sell its products,
  including door-to-door. Promotions on its terms page require a minimum 36-month monitoring contract. The
  monitoring contract itself is not published; the FAQ says an early termination fee may be charged "as set
  forth in the monitoring contract." The optional Brinks Home Plus extended service plan has its own terms
  and its own early termination charge. The terms page requires binding arbitration, with small claims
  court allowed for qualifying individual claims.

