id: boost-mobile
name: Boost Mobile
aliases: [boost, boost subscriberco]
sector: wireless
parent: EchoStar Corporation (Boost SubscriberCo L.L.C.)
website: https://www.boostmobile.com
regulators: [fcc]
notes: >-
  Boost Mobile is a division of Boost SubscriberCo L.L.C., an EchoStar brand. In August 2025
  EchoStar agreed to sell its 3.45 GHz and 600 MHz spectrum to AT&T and amended its network
  agreement into a hybrid MNO relationship: primary connectivity on AT&T's towers, with continued
  access to the T-Mobile network. The AT&T spectrum sale closed on July 28, 2026. DISH DBS and
  affiliated entities including DISH Wireless L.L.C. were in Chapter 11 from June 30, 2026 and
  emerged on October 1, 2026. EchoStar's August 3, 2026 release on the separate Hughes Chapter 11
  filing said it had no impact on Boost Mobile.

channels:
  - id: customer-care-phone
    type: phone
    label: Customer Care (general questions), 833-50-BOOST
    value: +1-833-502-6678
    hours: Every day, 8 a.m. to midnight ET
    purposes: [billing_error, cancel_service, equipment_return, service_outage]
    notes: The Terms say billing dispute information is available by calling 833-50-BOOST.
    source: https://help.boostmobile.com/docs/contact-our-support-teams
    last_verified: 2026-10-12
  - id: site-header-phone
    type: phone
    label: Phone number in the boostmobile.com site header
    value: +1-833-212-6678
    notes: The home page does not state what this number is for.
    source: https://www.boostmobile.com/
    last_verified: 2026-10-12
  - id: activation-phone
    type: phone
    label: Activation Support
    value: +1-866-957-8278
    hours: Every day, 8 a.m. to midnight ET
    source: https://help.boostmobile.com/docs/contact-our-support-teams
    last_verified: 2026-10-12
  - id: chat
    type: chat
    label: Boost Mobile Chat (chat icon on the help center)
    value: https://help.boostmobile.com/docs/contact-our-support-teams
    hours: Every day, 8 a.m. to midnight ET
    purposes: [billing_error, cancel_service, equipment_return, service_outage]
    source: https://help.boostmobile.com/docs/contact-our-support-teams
    last_verified: 2026-10-12
  - id: dispute-notice-mail
    type: mail
    label: Dispute Resolution Notice (written, by mail)
    value: "Boost SubscriberCo, Attn: P.O. Box 9033, Littleton, Colorado 80120-9033"
    purposes: [billing_error, cancel_service, service_outage, poor_service]
