known_blockers:
  - EE help and contact pages are JavaScript apps; they render empty to plain fetches (values here were read in a browser).
  - The Service Status Checker, EE app, online PAC/STAC request and bill views need an EE login.
  - EE publishes no executive or CEO complaints route.

notes: >-
  EE Limited is part of BT Group plc, together with BT and Plusnet. In April 2022 BT Group said EE would become its
  flagship consumer brand; in May 2026 it reintroduced the BT brand instead (FY26 results), and BT Mobile now sells
  SIM-only plans only to BT Broadband customers, with handsets from "our partner EE" (bt.com/mobile). No current BT or
  EE page found says BT consumer customers are being moved to EE. The two brands share systems - the same returns
  process and charges for BT and EE kit, the same Ofcom automatic compensation rates, and the BT Home Essentials
  social tariff for eligible EE customers. EE's live pages give 150, 07953 966 150 and 0330 123 1105; the complaints
  code gives 0800 079 8586. EE's complaints code and broadband complaint page already say six weeks for ADR, which
  matches Ofcom's April 2026 change. The "PAC to 65075" and "STAC to 75075" texts are Ofcom's text-to-switch scheme.
  Price rises are fixed pound amounts under Ofcom's rule (uk-ofcom-price-rise-pounds-and-pence).

