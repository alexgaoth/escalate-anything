id: t-mobile
name: T-Mobile
aliases: [t-mobile us, tmobile, t mobile, uscellular, us cellular, united states cellular, t-mobile home internet, t-mobile fiber, t-mobile prepaid]
sector: wireless
also_sectors: [internet_tv]
parent: T-Mobile US, Inc.
website: https://www.t-mobile.com
regulators: [fcc]
notes: >-
  T-Mobile postpaid and prepaid wireless, T-Mobile 5G Home Internet and T-Mobile Fiber. T-Mobile
  completed its acquisition of UScellular's wireless business on August 1, 2025; UScellular customers
  moved to T-Mobile (the T-Mobile unlock policy page still points current UScellular customers to the
  UScellular unlocking policy). T-Mobile also owns Mint Mobile (Ka'ena Corporation) and Metro by
  T-Mobile, which have their own entries. The Terms and Conditions (effective September 1, 2026) send
  billing disputes and Notices of Dispute to T-Mobile Customer Relations in Albuquerque. T-Mobile does
  not publish an Office of the President or executive escalation channel, and its support pages publish
  no outage credit policy.

