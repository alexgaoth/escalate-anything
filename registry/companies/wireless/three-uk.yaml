security:
  never_asks:
  - kind: policy
    claim: In its text-scam (smishing) advice, Three says it will never ask you for personal details, and links in Three's texts always contain '3.UK' or 'Three.co.uk' in the URL.
    source: https://www.three.co.uk/privacy-safety/fraud-to-watch-out-for
    last_verified: 2026-11-19
  - kind: policy
    claim: Three will never ask you to confirm any financial details by email.
    source: https://www.three.co.uk/privacy-safety/fraud-to-watch-out-for
    last_verified: 2026-11-19
  - kind: policy
    claim: Three says it will never contact you to arrange a return.
    source: https://www.three.co.uk/privacy-safety/report-a-problem
    last_verified: 2026-11-19
  known_scams:
  - kind: policy
    claim: SIM swap - a fraudster gains access to a customer's phone number by swapping the account to a different SIM card.
    source: https://www.three.co.uk/privacy-safety/fraud-to-watch-out-for
    last_verified: 2026-11-19
  - kind: policy
    claim: Account takeover - fraudsters take control of an account to commit upgrade fraud.
    source: https://www.three.co.uk/privacy-safety/fraud-to-watch-out-for
    last_verified: 2026-11-19
  - kind: policy
    claim: Smishing texts and phishing calls pretend to come from an organisation such as a bank or retailer and push you to visit a website or call a number.
    source: https://www.three.co.uk/privacy-safety/fraud-to-watch-out-for
    last_verified: 2026-11-19
  report_phishing:
  - id: spam-text-7726
    type: sms
    label: Forward scam texts to 7726 (free); include the sender's number
    value: "7726"
    notes: To report a nuisance call, text CALL followed by the caller's number to 7726.
    source: https://www.three.co.uk/privacy-safety/report-a-problem
    last_verified: 2026-11-19
  - id: phishing-email-gov
    type: email
    label: Forward suspicious emails to the UK government's phishing reporting service
    value: report@phishing.gov.uk
    source: https://www.three.co.uk/privacy-safety/fraud-to-watch-out-for
    last_verified: 2026-11-19
  - id: action-fraud
    type: phone
    label: Action Fraud (0300 123 2040)
    value: +44-300-123-2040
    notes: Three's page also gives https://www.actionfraud.police.uk/. In Scotland, call 101.
