known_blockers:
  - My3, the Three app and the "Leave Three" option need the account holder to sign in.
  - The PAC/STAC text must be sent from the Three phone itself, with the account holder's date of birth.
  - Three Community moderators cannot see accounts or consider compensation; use Live Chat or phone for account issues.

notes: >-
  Three UK (Hutchison 3G UK Ltd) is a consumer brand of VodafoneThree, formed when the Vodafone and Three UK merger
  completed on 31 May 2025 (https://www.vodafone.co.uk/newscentre/press-release/completion-vodafone-three-merger-uk/);
  Vodafone Group has owned 100% since 30 July 2026
  (https://www.vodafone.com/news/newsroom/corporate-and-financial/vodafone-takes-full-ownership-of-vodafonethree).
  For customers Three is still a separate brand with its own support, complaints code and CISAS membership. Three
  customers are offered an optional move to Vodafone at upgrade (https://www.three.co.uk/support/upgrades/more-choice),
  and new home broadband sales were planned to move under the Vodafone brand
  (https://www.vodafone.co.uk/newscentre/news/new-era-of-connectivity-for-uk/). Hutchison 3G UK Ltd's registered
  address is now Vodafone House, The Connection, Newbury, RG14 2FN (contact page); written complaints go to PO Box 333,
  Glasgow. SMARTY is a separate VodafoneThree brand with its own site (smarty.co.uk) and is Three's social-tariff
  route, so it is not an alias here. The 6-week CISAS wait in the code matches Ofcom's 6-week rule (uk-ofcom-adr).
  Three publishes no executive or CEO complaints route.

