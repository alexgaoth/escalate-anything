    value: +1-877-430-2355
    purposes: [billing_error, cancel_service, equipment_return, service_outage]
    notes: The contact page says to call from an alternate device for technical issues.
    source: https://www.straighttalk.com/support/contact
    last_verified: 2026-10-12
  - id: sales-phone
    type: phone
    label: Sales line (site banner)
    value: +1-866-664-3878
    source: https://www.straighttalk.com/
    last_verified: 2026-10-12
  - id: self-service-text
    type: sms
    label: Text self-service (balance, refills)
    value: "611611"
    hours: 24/7
    source: https://www.straighttalk.com/support/contact
    last_verified: 2026-10-12
  - id: chat
    type: chat
    label: Online chat (Contact Us page)
    value: https://www.straighttalk.com/support/contact
    hours: 8AM - 3AM (EST) 7 days a week
    purposes: [billing_error, cancel_service, equipment_return, service_outage]
    source: https://www.straighttalk.com/support/contact
