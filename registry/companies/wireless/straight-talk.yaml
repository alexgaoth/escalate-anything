id: straight-talk
name: Straight Talk Wireless
aliases: [straight talk, straighttalk]
sector: wireless
parent: Verizon (Verizon Value, Inc., formerly Tracfone Wireless)
website: https://www.straighttalk.com
regulators: [fcc]
notes: >-
  Prepaid brand. The Terms are an agreement between the customer and Verizon Value, Inc., a
  Delaware corporation; the site footer says Straight Talk is a registered trademark of Verizon
  Value, Inc, a Verizon company. Devices bought at Walmart follow Walmart's return policy.

