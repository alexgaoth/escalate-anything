      type: phone
      label: American Family Special Investigation Unit (report claim fraud)
      value: +1-608-242-4100 ext. 29510
      source: https://www.amfam.com/contact
      last_verified: 2026-10-12
    - id: siu-email
      type: email
      label: American Family Special Investigation Unit email (report claim fraud)
      value: askSIU@afics.com
      source: https://www.amfam.com/contact
      last_verified: 2026-10-12
