escalation:
  - {rung: frontline, channel: claims-phone, note: "Or the assigned claims representative."}
  - {rung: supervisor, note: "Ask for the claims representative's manager."}
  - {rung: written_complaint, channel: corporate-contact, note: "Use the Complaints link on the corporate contact page, or write to headquarters. Ask for the denial and the policy language it relies on, in writing."}
  - {rung: state_agency, agency_kind: insurance_department, note: "Liberty Mutual's state claim disclosures name the state insurance department for settlement disagreements."}
