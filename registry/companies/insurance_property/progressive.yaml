playbooks:
  - issue: claim_denial
    summary: Ask the claims rep for the reason and the valuation in writing, send counter-evidence, then complain to the state.
    evidence: [claim number, denial or valuation letter, policy and declarations page, photos, repair estimates, comparable vehicle listings for a total loss]
    steps:
      - do: Ask the claims rep for the denial reason and the policy language in writing. For a total loss, ask for the third-party valuation report and the comparable vehicles used.
        channel: claims-phone
      - do: Send your evidence and a written request for reconsideration through the contact form or by fax, with the claim number.
        channel: contact-form
      - do: If you disagree only about the amount, check the policy for an appraisal provision.
      - do: File a complaint with your state insurance department.
    facts:
      - kind: process
        claim: For a total loss, Progressive compares the vehicle's mileage, options and condition with current values of comparable vehicles, and works with a third party to determine actual cash value. It inspects the vehicle first.
        issues: [claim_denial]
        source: https://www.progressive.com/claims/total-loss/
        last_verified: 2026-10-12
      - kind: limit
        claim: If you have rental coverage, it covers up to three days after Progressive tells you the vehicle's value in a total loss.
        issues: [claim_denial, claim_delay]
        source: https://www.progressive.com/claims/total-loss/
        last_verified: 2026-10-12
  - issue: claim_delay
    summary: Check the claim online, call the claims line, and escalate to a manager and the state.
    evidence: [claim number, dates of each contact, documents sent]
    steps:
      - do: Check the claim status online and note what is pending.
        channel: claim-status
      - do: Call the claims line. Ask what is missing and when a decision will be made. Ask for a manager if there is no progress.
        channel: claims-phone
      - do: File a complaint with your state insurance department if the claim still does not move.
  - issue: bill_increase
    summary: Find what changed, then review coverage, deductibles and discounts, and compare quotes.
    evidence: [prior declarations page, renewal declarations page, list of recent claims, tickets, drivers and vehicles]
    steps:
      - do: Review recent changes (tickets, accidents, claims, vehicles, drivers, a move). A change may affect the rate only at renewal.
      - do: Ask customer service which discounts were lost and what a higher deductible or Snapshot would save.
        channel: customer-service-phone
      - do: Compare the rate with other insurers.
    facts:
      - kind: policy
        claim: Progressive lists tickets, at-fault accidents, comprehensive claims, added vehicles or drivers, local claim trends, moving, age, coverage lapses and lost discounts as reasons a rate can go up, and says a change may not affect the rate until renewal.
        issues: [bill_increase]
        source: https://www.progressive.com/answers/why-insurance-rates-go-up/
        last_verified: 2026-10-12

