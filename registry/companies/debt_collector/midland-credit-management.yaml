id: midland-credit-management
name: Midland Credit Management (Encore Capital Group)
aliases: [midland credit management, midland credit, mcm, midland funding, midland funding llc, encore capital, encore capital group]
sector: debt_collector
parent: Encore Capital Group, Inc.
website: https://www.midlandcredit.com
account_url: https://accounts.midlandcredit.com
official_domains: [midlandcredit.com]
security:
  known_scams:
    - kind: policy
      claim: Midland's FAQ says it does not recommend paying someone to dispute your debt, because you can dispute it for free directly with Midland.
      source: https://www.midlandcredit.com/help-center/faqs/
      last_verified: 2026-10-13
regulators: [cfpb, ftc]
notes: >-
  Encore Capital Group's U.S. family includes Midland Funding (which buys the debts), Midland Credit Management
  (which collects them) and Atlantic Credit & Finance. CFPB complaints are filed under "ENCORE CAPITAL GROUP INC.".
  Midland's NMLS ID is 934164.

channels:
