id: portfolio-recovery-associates
name: Portfolio Recovery Associates (PRA)
aliases: [pra, pra llc, pra group, portfolio recovery, portfolio recovery associates llc, prapay]
sector: debt_collector
parent: PRA Group, Inc.
website: https://www.portfoliorecovery.com
official_domains: [portfoliorecovery.com, pragroup.com]
regulators: [cfpb, ftc]
notes: >-
  Portfolio Recovery Associates, LLC is the U.S. debt buyer and collector of PRA Group, Inc. (Norfolk, VA).
  portfoliorecovery.com failed automated fetches on 2026-10-13 (certificate error), so its email, mailing
  address and disputes page were read from search-engine extracts. PRA Group's corporate site lists its
  headquarters as 150 Corporate Blvd, Norfolk, VA 23502; PRA's consumer contact page gives 120 Corporate Blvd.
  Use the dispute address printed on your validation notice first.

channels:
  - id: main-phone
    type: phone
    label: PRA main line (account questions)
    value: +1-800-772-1413
    purposes: [debt_collection, credit_report_error]
    access: human_only
    notes: Listed on PRA Group's corporate contact page; search-engine extracts of PRA's consumer contact page give the same number for account questions.
    source: https://www.pragroup.com/contact-us/
    last_verified: 2026-10-13
  - id: disputes-page
    type: web_form
    label: Disputes contact information (phone, live chat, email or mail)
    value: https://www.portfoliorecovery.com/prapay/contact-us/disputes
    purposes: [debt_collection, credit_report_error, identity_theft]
    notes: Seen in search results; the page could not be fetched to confirm its dispute address.
    source: https://www.portfoliorecovery.com/prapay/contact-us/disputes
    last_verified: 2026-10-13
  - id: customer-care-email
    type: email
    label: PRA customer care email
    value: pracustomercare@portfoliorecovery.com
    purposes: [debt_collection, credit_report_error]
    notes: >-
      Seen in a search-engine extract of PRA's Contact & FAQs page. Regulation F counts an email dispute as
      written only if the collector accepts electronic communication through that channel; also mail the dispute.
    source: https://www.portfoliorecovery.com/prapay/contact-us
    last_verified: 2026-10-13
  - id: consumer-mail
    type: mail
    label: PRA mailing address on its consumer contact page
    value: "Portfolio Recovery Associates, LLC, 120 Corporate Blvd, Norfolk, VA 23502"
    purposes: [debt_collection, credit_report_error]
    notes: Seen in a search-engine extract. If your validation notice gives a different dispute address, send the dispute there.
    source: https://www.portfoliorecovery.com/prapay/contact-us
    last_verified: 2026-10-13

escalation:
  - {rung: written_complaint, channel: consumer-mail, note: "Dispute in writing within the validation period in the notice; use the address on the notice."}
  - {rung: regulator, regulator: cfpb}
  - {rung: regulator, regulator: ftc}
  - {rung: state_agency, agency_kind: attorney_general}
  - {rung: small_claims}

playbooks:
  - issue: debt_collection
    summary: Dispute in writing before the validation period ends and ask for verification; PRA must pause collection until it answers.
    evidence: [validation notice with the end date of the validation period, PRA and original account numbers, proof of payment or identity theft report, copies of what you send]
    steps:
      - do: Find the date the validation notice gives as the end of the validation period, and the dispute address on the notice.
      - do: Before that date, send a written dispute by certified mail. Say which part you do not owe and ask for verification and for the name and address of the original creditor.
        channel: consumer-mail
      - do: Keep a copy and the mailing receipt. You can also email the dispute, but keep the mailed copy as proof.
        channel: customer-care-email
      - do: If the debt is from identity theft, attach your FTC identity theft report from IdentityTheft.gov.
        regulator: ftc
      - do: If PRA keeps collecting without sending verification, file a CFPB complaint.
        regulator: cfpb
    facts:
      - kind: process
        claim: If you dispute in writing within the validation period, a debt collector must stop collecting the debt, or the disputed part, until it sends verification of the debt or a copy of a judgment (Regulation F, 12 CFR 1006.38).
        issues: [debt_collection]
        source: https://www.consumerfinance.gov/rules-policy/regulations/1006/38/
        last_verified: 2026-10-13
      - kind: deadline
        claim: The FTC says to send a dispute letter within 30 days of receiving the validation information; if you do not dispute within 30 days, the collector can assume the debt is valid.
        issues: [debt_collection]
        source: https://consumer.ftc.gov/articles/debt-collection-faqs
        last_verified: 2026-10-13

  - issue: credit_report_error
    summary: Dispute the PRA entry with each credit bureau and directly with PRA at the address on your credit report.
    evidence: [credit report page with the PRA entry, proof of payment, bankruptcy discharge or identity theft report]
    steps:
      - do: Dispute the entry with each credit bureau that shows it.
      - do: Also send a direct dispute to PRA at the address on your credit report or the address PRA gives for disputes.
        channel: disputes-page
      - do: If the entry is not fixed, file a CFPB complaint.
        regulator: cfpb
    facts:
      - kind: process
        claim: A furnisher must investigate a direct dispute sent to the address on your credit report or the address it gives for disputes, and finish within the same time a credit bureau has (Regulation V, 12 CFR 1022.43).
        issues: [credit_report_error]
        source: https://www.consumerfinance.gov/rules-policy/regulations/1022/43/
        last_verified: 2026-10-13

facts:
  - claim: The CFPB received 20,723 complaints about Portfolio Recovery Associates, LLC from July 1, 2025 to June 30, 2026 (debt collection 16,518; credit reporting 3,989). 11,471 were closed with non-monetary relief and 9,250 with explanation; none show monetary relief. 155 responses were not timely.
    source: https://www.consumerfinance.gov/data-research/consumer-complaints/search/api/v1/?company=Portfolio%20Recovery%20Associates%2C%20LLC&date_received_min=2025-07-01&date_received_max=2026-06-30&size=0
    last_verified: 2026-10-13
  - claim: The most common CFPB issue for PRA in that period was "Attempts to collect debt not owed" (6,709), including 4,504 "Debt is not yours" and 1,830 "Debt was result of identity theft".
    source: https://www.consumerfinance.gov/data-research/consumer-complaints/search/api/v1/?company=Portfolio%20Recovery%20Associates%2C%20LLC&date_received_min=2025-07-01&date_received_max=2026-06-30&size=0
    last_verified: 2026-10-13
  - kind: policy
    claim: On April 13, 2023 a federal court (E.D. Va.) entered a CFPB order against PRA. The CFPB alleged that PRA violated a 2015 order and federal law, including by collecting unsubstantiated debt, suing on time-barred debt and mishandling credit reporting disputes. PRA must pay at least $12.18 million in redress and a $12 million civil penalty.
    source: https://www.consumerfinance.gov/enforcement/actions/portfolio-recovery-associates-llc/
    last_verified: 2026-10-13

tips:
  - kind: official
    text: PRA's consumer site has "Who's Calling From" pages for the phone and text numbers it uses, such as https://www.portfoliorecovery.com/prapay/phone/8006548818. Use them, or the number on your letter, to check a caller. Seen in search results; not fetched.
    issues: [debt_collection, fraud]
    source: https://www.portfoliorecovery.com/prapay/phone/8006548818
    last_verified: 2026-10-13

known_blockers:
  - portfoliorecovery.com failed automated fetches (certificate error); hand the browser to the person.
  - Phone lines verify the account holder by voice.
