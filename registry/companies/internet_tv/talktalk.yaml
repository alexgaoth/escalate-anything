  known_scams:
    - kind: policy
      claim: Fake refund calls - a caller claims you are due a refund, gets you to install remote-access software such as TeamViewer, AnyDesk or LogMeIn, makes it look as if you were over-refunded (for example £1,250 instead of £125), and asks you to send back the difference by Western Union or MoneyGram.
      verified_via: browser
      source: https://help-centre.talktalk.co.uk/Telephone/Telephone_security/Scam_Phone_calls
      last_verified: 2026-11-19
    - kind: policy
      claim: Callers posing as your broadband provider or a firm like Microsoft claim there is a fault and direct you to run Windows commands; other tactics are "press 1 for an engineer" premium-rate charges, fake websites and caller ID spoofing.
      source: https://help-centre.talktalk.co.uk/Telephone/Telephone_security/Scam_Phone_calls
      last_verified: 2026-11-19
    - kind: policy
      claim: Scam messages use authority (claiming to be a bank, delivery company or service provider), urgency, and emotion to push you to act.
      source: https://help-centre.talktalk.co.uk/Broadband/Security/Beat_the_scammers
      last_verified: 2026-11-19
