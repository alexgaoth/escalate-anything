escalation:
  - {rung: frontline, channel: customer-service-phone}
  - {rung: retention, channel: cancel-help, note: "The cancel page routes cost-related cancellations to 800.531.5000 for a personalized cancellation."}
  - {rung: written_complaint, channel: arbitration-notice, note: "DIRECTV publishes no general complaint address; the Notice of Dispute is its written dispute channel."}
  - {rung: regulator, regulator: fcc}
  - {rung: state_agency, agency_kind: utility_commission}
  - {rung: state_agency, agency_kind: attorney_general}
  - {rung: arbitration, channel: arbitration-notice, note: "Mail the Notice of Dispute and allow at least 60 days; then send a Demand for Arbitration to DIRECTV and the AAA. The consumer generally pays the $200 AAA filing fee."}

playbooks:
  - issue: cancel_service
    summary: Satellite customers cancel by phone; internet-only customers can cancel online. No prorated refund for partial months.
    evidence: [account number, cancellation confirmation, contract end date, equipment return tracking]
    steps:
      - do: Satellite customers call 800.531.5000. Internet-only customers can sign in and select "Cancel service".
        channel: cancel-help
      - do: Ask the agent which equipment must be returned. DIRECTV sends prepaid UPS, FedEx or US Mail return instructions. Dishes, outside equipment, cables, splitters and switches are yours to keep.
        channel: equipment-return
      - do: If you have a contract, ask for the exact early cancellation fee before you confirm.
    facts:
      - kind: policy
        claim: DIRECTV gives no prorated credit or refund for partial periods unless prohibited by law; service stays active until the end of the billing cycle.
        issues: [cancel_service, refund_request]
        source: https://www.directv.com/customer/cancel-help
        last_verified: 2026-10-12
      - kind: fee
        claim: Customers with a contract may need to pay a fee for the number of months left on the contract.
        issues: [cancel_service]
        source: https://www.directv.com/customer/cancel-help
        last_verified: 2026-10-12
      - kind: process
        claim: A customer in a free trial who cancels has service end immediately and is not charged.
        issues: [cancel_service]
        source: https://www.directv.com/customer/cancel-help
        last_verified: 2026-10-12

  - issue: equipment_return
    summary: Return only what the agent says, with DIRECTV's prepaid shipping, and keep tracking.
    evidence: [return tracking number, equipment serial or access card numbers]
    steps:
      - do: Ask which equipment must be returned and use the prepaid return instructions DIRECTV sends. Ship satellite receivers so they arrive within 21 days of termination, and DIRECTV STREAM devices within 14 days after cancellation.
        channel: equipment-return
      - do: Keep the tracking number. If a non-return fee appears, send the tracking number and ask for removal.
        channel: customer-service-phone
    facts:
      - kind: fee
        claim: Customers with DIRECTV equipment may have to return it to avoid a non-return fee; DIRECTV sends return instructions and prepays shipping via UPS, FedEx or US Mail.
        issues: [equipment_return]
        source: https://www.directv.com/customer/cancel-help
        last_verified: 2026-10-12
      - kind: fee
        claim: The DIRECTV Equipment Lease Agreement (2016 PDF) charges $45 for each standard receiver, HD receiver and Genie Mini, and $135 for each DVR, HD DVR and Genie HD DVR, if leased equipment is not received within 21 days of termination of base programming or is returned damaged.
        issues: [equipment_return, cancel_service]
        source: https://www.directv.com/dtvassets/dtv/directv_marketing/agreements_and_policies/EquipLeaseAgrmt_English.pdf
        last_verified: 2026-10-12
      - kind: fee
        claim: DIRECTV STREAM devices must be returned within 14 days after cancellation by USPS with the return label sent with the equipment (call 800.531.5000 for a label); otherwise, or if damaged beyond normal wear, the non-return fee is $120.
        issues: [equipment_return, cancel_service]
        source: https://www.directv.com/legal/directv-stream-cancellation-policy/
        last_verified: 2026-10-12

  - issue: billing_error
    summary: Chat or call first; if not resolved, mail a Notice of Dispute.
    evidence: [the bill, account number, offer or order confirmation]
    steps:
      - do: Ask chat or 1-800-531-5000 to correct the charge. Get a reference number.
        channel: customer-service-phone
      - do: If not resolved, mail a complete Notice of Dispute and keep a copy.
        channel: arbitration-notice
      - do: File an FCC complaint with the bill and notice.
        regulator: fcc
    facts:
      - kind: process
        claim: DIRECTV says most bill or service concerns can be resolved by chat or 1 (800) 531-5000; otherwise the dispute process starts with a Notice of Dispute and at least 60 days for DIRECTV to investigate.
        issues: [billing_error]
        source: https://www.directv.com/dtvassets/legal/dtv-arbitration-information_resolving-dispute.pdf
        last_verified: 2026-10-12

facts:
  - kind: policy
    claim: Claims within the small claims court's jurisdiction may be brought there instead of arbitration. Arbitration is individual only and administered by the AAA; the consumer is generally responsible for the $200 filing fee and DIRECTV pays the rest.
    source: https://www.directv.com/dtvassets/legal/dtv-arbitration-information_resolving-dispute.pdf
    last_verified: 2026-10-12
  - kind: process
    claim: Arbitration provisions in agreements before November 7, 2023 are posted separately in the legal policy center; the current Residential Terms of Service govern newer accounts.
    source: https://www.directv.com/legal/legal-policy-center/
    last_verified: 2026-10-12

known_blockers:
  - Satellite cancellation needs a phone call; only internet-only accounts can cancel online after sign-in.
  - The Residential Terms of Service, fee schedule and return article load by JavaScript and do not render for automated fetches; satellite non-return fees come from a 2016 lease PDF and may be out of date.

notes: >-
  DIRECTV (satellite, DIRECTV STREAM / via Internet) also serves U-verse TV customers; U-verse TV terms and fee
  schedules are in the DIRECTV legal policy center. Site trademarks are held by DIRECTV, LLC. Current ownership
  (TPG and AT&T) and the end of the 2024 DIRECTV-DISH deal were not confirmed on a fetched official page.

official_domains: [directv.com]
security:
  never_asks:
  - kind: policy
    claim: DIRECTV representatives will never reach out to ask for personal or account information.
    source: https://www.directv.com/support/article/000086841
    last_verified: 2026-10-12
  - kind: policy
    claim: DIRECTV representatives will never ask you to pay upfront for discounted services or promotions, or to replace your current equipment, and will not accept prepaid or third-party retail gift cards as payment.
    source: https://www.directv.com/support/article/000086841
    last_verified: 2026-10-12
  known_scams:
  - kind: policy
    claim: Scammers ask for advance payment for 'discounted services or upgraded equipment', often by prepaid credit card or retail gift card, and may give a toll-free number to seem legitimate.
    source: https://www.directv.com/support/article/000086841
    last_verified: 2026-10-12
  - kind: policy
    claim: Fake emails, texts or social media messages ask you to 'verify your account', or claim an order was cancelled, a payment failed or fraud was detected.
    source: https://www.directv.com/support/article/000086841
    last_verified: 2026-10-12
  report_phishing:
  - id: report-fraudulent-account
    type: web_form
    label: Report a DIRECTV account opened in your name (identity theft claim)
    value: https://accountverification.directv.com
    source: https://www.directv.com/support/article/000086841
    last_verified: 2026-10-12
