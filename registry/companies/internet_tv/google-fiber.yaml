    source: https://gfiber.com/legal/terms/residential/
    last_verified: 2026-10-12
  - id: support-chat
    type: chat
    label: gFiber "Chat with us"
    value: https://gfiber.com/support/?cardName=Chat%20with%20us
    purposes: [billing_error, cancel_service, service_outage, equipment_return]
    source: https://gfiber.com/support/en/
    last_verified: 2026-10-12
  - id: contact-form
    type: web_form
    label: Google Fiber support contact form (named in the residential terms)
    value: https://support.google.com/fiber/contact/fiber_general_open
    purposes: [billing_error, poor_service]
    source: https://gfiber.com/legal/terms/residential/
    last_verified: 2026-10-12
  - id: help-center
    type: portal
    label: gFiber Help Center
    value: https://gfiber.com/support/en/
    access: open
    source: https://gfiber.com/
    last_verified: 2026-10-12
  - id: arbitration-notice
    type: mail
    label: Notice of Dispute (arbitration)
