    last_verified: 2026-10-12
  - id: uptime-guarantee
    type: portal
    label: Uptime Guarantee Agreement (automatic outage credit)
    value: https://gfiber.com/legal/terms/residential/uga/
    purposes: [service_outage]
    access: open
    source: https://gfiber.com/
    last_verified: 2026-10-12
  - id: fee-schedule
    type: portal
    label: Equipment replacement fee schedule
    value: https://gfiber.com/legal/schedule/
