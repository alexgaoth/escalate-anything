    source: https://www.centurylink.com/home/help/contact.html
    last_verified: 2026-10-12
  - id: customer-service-phone-qwest-region
    type: phone
    label: CenturyLink account and tech support ("Q Only" and "OOR Only" regions on the contact page)
    value: +1-800-244-1111
    hours: Monday - Friday 8 am - 6 pm local time
    purposes: [billing_error, bill_increase, cancel_service, service_outage, equipment_return]
    source: https://www.centurylink.com/home/help/contact.html
    last_verified: 2026-10-12
  - id: support-chat
    type: chat
    label: CenturyLink chat (7 days a week)
    value: https://www.centurylink.com/home/help/contact.html
    purposes: [billing_error, cancel_service, service_outage, equipment_return]
    notes: Start chat with the "Chat" or "Let's Chat" control on the contact page.
