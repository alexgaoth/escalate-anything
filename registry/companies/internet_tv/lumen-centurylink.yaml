escalation:
  - {rung: frontline, channel: customer-service-phone}
  - {rung: retention, note: "CenturyLink publishes no retention number."}
  - {rung: written_complaint, channel: claim-notice-email, note: "CenturyLink requires a written Notice of Claim before any lawsuit."}
  - {rung: regulator, regulator: fcc}
  - {rung: state_agency, agency_kind: utility_commission}
  - {rung: state_agency, agency_kind: attorney_general}
  - {rung: small_claims, note: "The CenturyLink agreement sends disputes to court (bench trial, jury waived), not arbitration, after a 60-day resolution window. CenturyLink reimburses small claims filing fees when the terms are followed."}
  - {rung: arbitration, channel: quantum-fiber-arbitration-notice, note: "Quantum Fiber (AT&T) customers only. Send the Notice of Dispute first and allow 60 days after a complete notice."}

playbooks:
  - issue: billing_error
    summary: Call or chat before the due date; if not fixed, send a written Notice of Claim.
    evidence: [the bill, account number, order confirmation]
    steps:
      - do: Contact CenturyLink customer service before the bill due date. Charges continue unless you tell CenturyLink promptly.
        channel: customer-service-phone
      - do: If not resolved, email a written Notice of Claim with account number, facts, amount and supporting documents.
        channel: claim-notice-email
      - do: File an FCC complaint with the bill and the notice.
        regulator: fcc
      - do: Quantum Fiber customers have 180 days from the bill date to notify customer service or send a Notice of Dispute.
        channel: quantum-fiber-email
    facts:
      - kind: deadline
        claim: The CenturyLink agreement asks customers to contact customer service before the due date about a disputed charge; charges continue unless CenturyLink is informed promptly.
        issues: [billing_error]
        source: https://www.centurylink.com/aboutus/legal/internet-subscriber-agreement.html
        last_verified: 2026-10-12
      - kind: deadline
        claim: Quantum Fiber customers have 180 days from the bill date to notify customer service or submit a Notice of Dispute, or they waive the right to dispute the bill (except in states that prohibit this provision).
        issues: [billing_error]
        source: https://quantumfiber.com/on/demandware.static/Sites-QFCC-Site/Sites-QFCC-Library/-/legal/internet-subscriber-agreement.pdf
        last_verified: 2026-10-12

  - issue: bill_increase
    summary: CenturyLink must give 30 days written notice of a monthly charge increase.
    evidence: [bills before and after, the notice of change]
    steps:
      - do: Check the bill or email for the 30-day written notice. If there was none, dispute the increase as a billing error.
        channel: customer-service-phone
      - do: Ask for a lower plan or current offer. Write down every offer with the name and date.
    facts:
      - kind: policy
        claim: Increases to monthly recurring and non-recurring charges are effective upon 30 days written notice, including email and messages on or with the invoice.
        issues: [bill_increase]
        source: https://www.centurylink.com/aboutus/legal/internet-subscriber-agreement.html
        last_verified: 2026-10-12
      - kind: policy
        claim: For Quantum Fiber, a customer who does not accept a materially adverse change during a commitment must cancel within 14 days of the notice to avoid an early termination fee.
        issues: [bill_increase, cancel_service]
        source: https://quantumfiber.com/on/demandware.static/Sites-QFCC-Site/Sites-QFCC-Library/-/legal/internet-subscriber-agreement.pdf
        last_verified: 2026-10-12

  - issue: cancel_service
    summary: Cancel by phone or chat (not email), then return leased equipment within 30 days.
    evidence: [cancellation date and confirmation, UPS return receipt]
    steps:
      - do: Call or chat to cancel. The agreement says you cannot cancel by email.
        channel: cancel-help
      - do: Return any leased modem, router or Connected Voice equipment within 30 days.
        channel: equipment-return
      - do: Check the final bill. Any deposit and interest are applied to the final balance.
    facts:
      - kind: process
        claim: The agreement states customers cannot terminate service by email; they must call the number on the bill or use the listed websites.
        issues: [cancel_service]
        source: https://www.centurylink.com/aboutus/legal/internet-subscriber-agreement.html
        last_verified: 2026-10-12
      - kind: fee
        claim: The early termination charge for a term commitment is 100% of the monthly recurring charge times the months remaining in the first 12 months, plus 40% of the monthly charge for remaining months after that. It is waived if the customer notifies CenturyLink within 30 days of ordering.
        issues: [cancel_service]
        source: https://www.centurylink.com/aboutus/legal/internet-subscriber-agreement.html
        last_verified: 2026-10-12
      - kind: process
        claim: Satellite TV bought through CenturyLink (DIRECTV or DISH) must be cancelled directly with that provider.
        issues: [cancel_service]
        source: https://www.centurylink.com/home/help/account/how-to-cancel-your-centurylink-service.html
        last_verified: 2026-10-12

  - issue: equipment_return
    summary: Return leased equipment by UPS within 30 days; CenturyLink stores do not accept returns.
    evidence: [UPS receipt with tracking number, equipment serial number]
    steps:
      - do: Get a return label by email or a QR code for The UPS Store from the return page, and drop the box at an authorized UPS Shipping Center.
        channel: equipment-return
      - do: Keep the UPS receipt. If you are charged for returned equipment, send the tracking number by chat.
        channel: support-chat
    facts:
      - kind: deadline
        claim: Leased equipment must be returned within 30 days after termination; otherwise CenturyLink may charge up to the Equipment Charge.
        issues: [equipment_return]
        source: https://www.centurylink.com/aboutus/legal/internet-subscriber-agreement.html
        last_verified: 2026-10-12
      - kind: fee
        claim: Returning equipment within 30 days of cancelling avoids an equipment charge of up to $200.
        issues: [equipment_return]
        source: https://www.centurylink.com/home/help/account/how-to-cancel-your-centurylink-service.html
        last_verified: 2026-10-12

facts:
  - kind: process
    claim: CenturyLink disputes go to court, not arbitration. The customer must first present the claim in writing; a lawsuit may be filed only if the claim is not resolved within 60 days after CenturyLink receives the notice. Both sides waive a jury trial.
    source: https://www.centurylink.com/aboutus/legal/internet-subscriber-agreement.html
    last_verified: 2026-10-12
  - kind: policy
    claim: CenturyLink reimburses filing fees for a small claims lawsuit filed in line with the agreement's dispute terms, whether or not the customer wins.
    source: https://www.centurylink.com/aboutus/legal/internet-subscriber-agreement.html
    last_verified: 2026-10-12
  - kind: process
    claim: Quantum Fiber disputes need a Notice of Dispute to AT&T and 60 days after a complete notice before arbitration; legal action must start within two years of the event.
    source: https://quantumfiber.com/on/demandware.static/Sites-QFCC-Site/Sites-QFCC-Library/-/legal/internet-subscriber-agreement.pdf
    last_verified: 2026-10-12

known_blockers:
  - CenturyLink chat opens from a page control and has no direct URL.
  - CenturyLink stores do not accept equipment returns; returns go through UPS only.

notes: >-
  "CenturyLink" is a trade name of affiliates of Lumen Technologies, Inc. (per the Internet Subscriber Agreement
  effective November 1, 2025). Quantum Fiber is now "Quantum Fiber from AT&T": its subscriber agreement
  (V.02.02.2026) is between AT&T and the customer and incorporates the AT&T Consumer Services Agreement, and
  quantumfiber.com carries AT&T branding. CenturyLink copper/DSL service remains with Lumen; its site does not
  mention AT&T. Quantum Fiber channels are kept here for lookup; for AT&T Fiber accounts use the AT&T file.
