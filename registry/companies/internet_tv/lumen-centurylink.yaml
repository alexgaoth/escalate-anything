id: lumen-centurylink
name: CenturyLink
aliases: [centurylink, lumen, lumen technologies, quantum fiber]
sector: internet_tv
parent: Lumen Technologies, Inc. (CenturyLink); AT&T (Quantum Fiber since its 2026 subscriber agreement)
website: https://www.centurylink.com
