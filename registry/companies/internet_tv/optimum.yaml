id: optimum
name: Optimum
aliases: [optimum communications, altice usa, altice, optimum mobile]
sector: internet_tv
also_sectors: [wireless]
parent: Optimum Communications, Inc. (NYSE - OPTU), formerly Altice USA
website: https://www.optimum.com
account_url: https://www.optimum.net
regulators: [fcc]

channels:
  - id: customer-service-phone
    type: phone
    label: Optimum customer service for existing customers
    value: +1-877-794-2724
    hours: 24/7
    purposes: [billing_error, bill_increase, price_negotiation, cancel_service, service_outage, equipment_return]
    source: https://www.optimum.com/contact-us
    last_verified: 2026-10-12
  - id: general-support-phone
    type: phone
    label: Optimum general, billing and technical support (also listed for "All other areas")
    value: +1-877-694-9474
    purposes: [billing_error, service_outage]
    source: https://www.optimum.net/support/contact-us
    last_verified: 2026-10-12
  - id: support-chat
    type: chat
    label: Optimum live chat (24/7)
    value: https://www.optimum.net/support/contact-us
    hours: 24/7
    purposes: [billing_error, bill_increase, service_outage, equipment_return]
    notes: The "Chat now" link on the contact page opens the chat. The My Optimum app also has chat in the My Account, WiFi and My Bill sections.
    source: https://www.optimum.com/articles/communities/how-to-contact-optimum
    last_verified: 2026-10-12
  - id: stores
    type: in_person
    label: Optimum store locator (equipment returns and swaps, bill payments)
    value: https://www.optimum.com/locations/
    purposes: [equipment_return, cancel_service]
    source: https://www.optimum.com/articles/communities/how-to-contact-optimum
    last_verified: 2026-10-12
  - id: equipment-shipping
    type: portal
    label: Optimum equipment return by mail (prepaid label from My Orders, drop at Walgreens or FedEx Office)
    value: https://www.optimum.net/pages/equipmentShippingInstructions.html
    purposes: [equipment_return, cancel_service]
    access: open
    notes: Start the return under My Orders - "Return item". Do not use a FedEx Drop Box; ask for a receipt as proof of mailing. Scientific Atlanta cable boxes, CableCARDs and most DOCSIS 3.0 and older modems (except TM1602A and TM804) do not need to be returned.
    source: https://www.optimum.net/pages/equipmentShippingInstructions.html
    last_verified: 2026-10-12
  - id: online-account
    type: portal
    label: Optimum online account (cancellation by signing in)
    value: https://www.optimum.net
    purposes: [cancel_service]
    access: login
    notes: Optimum offer terms say "Cancel any time at 877-694-9474 or by logging into account at optimum.net."
    source: https://www.optimum.com/moving
    last_verified: 2026-10-12
  - id: mobile-support
    type: portal
    label: Optimum Mobile support center
    value: https://support.optimummobile.com/hc/en-us/
    source: https://www.optimum.com/contact-us
    last_verified: 2026-10-12
  - id: arbitration-notice
    type: mail
    label: Notice of Dispute (certified mail)
    value: Optimum Shared Services, 1111 Stewart Ave, Bethpage, NY 11714, Attn - Customer Disputes
    notes: The terms require certified mail. Optimum has 60 days after receipt to investigate before arbitration can start.
    source: https://www.optimum.com/terms-of-service/residential
    last_verified: 2026-10-12
  - id: arbitration-opt-out-email
    type: email
    label: Arbitration opt-out by email (within 30 days of opening the account)
    value: NOARBITRATION@ALTICEUSA.COM
    notes: Include name, address, account number, a signature and a clear statement rejecting arbitration. By mail - Optimum Shared Services, 1111 Stewart Ave, Bethpage, NY 11714, ATTN - Arbitration.
    source: https://www.optimum.com/terms-of-service/residential
    last_verified: 2026-10-12
  - id: customer-agreement
    type: portal
    label: Residential General Terms and Conditions of Service
    value: https://www.optimum.com/terms-of-service/residential
    access: open
    source: https://www.optimum.com/terms-of-service
    last_verified: 2026-10-12
  - id: fee-schedule
    type: portal
    label: Optimum pricing and packages (schedule of fees, unreturned equipment charges)
    value: https://www.optimum.com/pricing-packages
    access: open
    source: https://www.optimum.com/pricing-packages
    last_verified: 2026-10-12

escalation:
  - {rung: frontline, channel: customer-service-phone}
  - {rung: retention, note: "Optimum publishes no separate retention number."}
  - {rung: written_complaint, note: "Bill disputes must be in writing within 30 days of receiving the bill. Optimum publishes no general complaint address; the contact page lists none."}
  - {rung: regulator, regulator: fcc}
  - {rung: state_agency, agency_kind: utility_commission}
  - {rung: state_agency, agency_kind: attorney_general}
  - {rung: arbitration, channel: arbitration-notice, note: "Send the Notice of Dispute by certified mail first. Arbitration can start after the later of 60 days from receipt or the date of any settlement discussion."}

playbooks:
  - issue: billing_error
    summary: Dispute the bill in writing within 30 days of receiving it.
    evidence: [the bill, account number, order confirmation or chat transcript with the expected price]
    steps:
      - do: Within 30 days of receiving the bill, raise the dispute in writing (chat transcript or letter) and give the documents Optimum needs to investigate.
        channel: support-chat
      - do: Call and ask for a correction and a reference number.
        channel: customer-service-phone
      - do: If not fixed, file an FCC complaint with the bill and the written dispute.
        regulator: fcc
    facts:
      - kind: deadline
        claim: Bill disputes must be raised in writing within 30 days of receiving the bill, or longer where applicable law provides. The dispute date is when Optimum receives enough documentation to investigate.
        issues: [billing_error]
        source: https://www.optimum.com/terms-of-service/residential
        last_verified: 2026-10-12

  - issue: cancel_service
    summary: Cancel before the last day of the billing period; there are no refunds for partial periods.
    evidence: [account number, cancellation confirmation, equipment return receipts]
    steps:
      - do: Cancel by calling 877-694-9474 or by signing in to your account at optimum.net, by the last day of the billing period before the period you want to end. Cancellation takes effect at the end of the current billing period.
        channel: online-account
      - do: Return all equipment promptly, at a store or by prepaid label at Walgreens or FedEx Office, and keep the receipt.
        channel: equipment-shipping
      - do: If you are on a promotion, check the Schedule of Fees for an early cancellation fee before you cancel.
        channel: fee-schedule
    facts:
      - kind: policy
        claim: Cancellation requests must be made by the last day of the billing period before the service period you want to end, and take effect at the end of the current billing period.
        issues: [cancel_service]
        source: https://www.optimum.com/terms-of-service/residential
        last_verified: 2026-10-12
      - kind: policy
        claim: The terms state that payments are nonrefundable and there are no refunds or credits for partially used subscription periods.
        issues: [cancel_service, refund_request]
        source: https://www.optimum.com/terms-of-service/residential
        last_verified: 2026-10-12
      - kind: process
        claim: Optimum offer terms say customers can cancel any time at 877-694-9474 or by logging into their account at optimum.net; cancellation is effective at the end of the then-current billing period except in CT and NJ.
        issues: [cancel_service]
        source: https://www.optimum.com/moving
        last_verified: 2026-10-12
      - kind: fee
        claim: Cancelling or downgrading before a promotional term ends requires paying the applicable early cancellation fee plus unpaid charges; amounts are in the Schedule of Fees.
        issues: [cancel_service]
        source: https://www.optimum.com/terms-of-service/residential
        last_verified: 2026-10-12

  - issue: equipment_return
    summary: Return equipment promptly at an Optimum store and keep the receipt; unreturned items are charged per the fee schedule.
    evidence: [store return receipt, equipment serial numbers]
    steps:
      - do: Return the equipment at an Optimum store, which handles equipment returns and swaps, and get a receipt. Or print a prepaid label under My Orders and drop the box at Walgreens, FedEx Office or an authorized FedEx location (not a drop box); ask for a receipt.
        channel: equipment-shipping
      - do: If charged for returned equipment, send the receipt by chat and ask for removal of the charge.
        channel: support-chat
    facts:
      - kind: policy
        claim: Equipment must be returned promptly after service ends, in the same condition apart from ordinary wear and tear. Optimum may charge for unreturned equipment under its then-current schedule, or keep billing a monthly fee until the equipment is returned, collected or paid for.
        issues: [equipment_return, cancel_service]
        source: https://www.optimum.com/terms-of-service/residential
        last_verified: 2026-10-12
      - kind: fee
        claim: Optimum's pricing page lists unreturned equipment fees per item, for example Optimum TV Box $132.00, Wireless Router $80.00, Ubee 1326 (Gateway 6) $130.00, Optimum Extender $75.00 and HD/DVR Receiver $345.00.
        issues: [equipment_return]
        source: https://www.optimum.com/pricing-packages
        last_verified: 2026-10-12

  - issue: service_outage
    summary: Ask for a credit after an outage; credits are discretionary and capped at one billing period.
    evidence: [outage dates and duration, ticket number]
    steps:
      - do: Report the outage and get a ticket number.
        channel: support-chat
      - do: Ask for a credit for the outage period. Check the next bill to confirm it.
        channel: customer-service-phone
    facts:
      - kind: limit
        claim: Credits for service interruptions are at Optimum's sole discretion, usually as a credit on a later bill. Damages are limited to service charges and equipment fees for one regular billing period, and no credit applies to interruptions caused by the subscriber, third parties or events beyond Optimum's control.
        issues: [service_outage]
        source: https://www.optimum.com/terms-of-service/residential
        last_verified: 2026-10-12

facts:
  - kind: process
    claim: A Notice of Dispute goes by certified mail to Optimum Shared Services, Attn Customer Disputes. Optimum has 60 days after receipt to investigate; either side may instead use small claims court in the subscriber's jurisdiction.
    source: https://www.optimum.com/terms-of-service/residential
    last_verified: 2026-10-12
  - kind: deadline
    claim: New subscribers can opt out of arbitration within 30 days of opening the account, by email to NOARBITRATION@ALTICEUSA.COM or by mail, with name, address, account number and signature.
    source: https://www.optimum.com/terms-of-service/residential
    last_verified: 2026-10-12
  - kind: fee
    claim: The standard late payment fee is $10.00 ($2.00 in West Virginia, $4.75 in California, $5.00 in Kansas, $6.00 in Oklahoma).
    issues: [billing_error]
    source: https://www.optimum.com/pricing-packages
    last_verified: 2026-10-12
  - kind: policy
    claim: Optimum may change the terms at any time with notice by website posting, email, mail, or phone or text; continued use after notice counts as acceptance. The terms set no minimum advance notice for price changes.
    issues: [bill_increase]
    source: https://www.optimum.com/terms-of-service/residential
    last_verified: 2026-10-12

known_blockers:
  - The contact page lists different phone numbers for different regions (Long Island, Bronx/Brooklyn/Westchester, Connecticut, New Jersey/Pennsylvania, North Carolina); 877-694-9474 is listed for all other areas.
  - Optimum's FAQ and chat pages are JavaScript apps that do not render for automated fetches.

notes: >-
  The listed company is now Optimum Communications, Inc. (NYSE - OPTU) per investors.optimum.com; alticeusa.com
  redirects to optimum.com. The residential terms (effective October 24, 2024) name CSC Holdings, LLC and affiliates as
  "Optimum". Optimum says it serves about 4.4 million customers in 21 states. Offer terms on optimum.com allow cancellation by
  phone (877-694-9474) or by signing in at optimum.net.

official_domains: [optimum.com, optimum.net, optimummobile.com]
security:
  never_asks:
  - kind: policy
    claim: Optimum will never ask you to make a payment by gift card, wire transfer, cryptocurrency, payment applications (Venmo, Zelle, Cash App, PayPal) or other nontraditional methods.
    source: https://www.optimum.net/pages/phishing-alerts.html
    last_verified: 2026-10-12
  - kind: policy
    claim: Optimum will never send you an email asking you to click on a link to make a payment, and will never contact you requesting personal information or passwords.
    source: https://www.optimum.net/pages/phishing-alerts.html
    last_verified: 2026-10-12
  - kind: policy
    claim: Optimum will never call you stating there is an issue with your equipment and a payment is required to fix it; Optimum says it never makes unsolicited phone calls to its customers.
    source: https://www.optimum.net/pages/phishing-alerts.html
    last_verified: 2026-10-12
  known_scams:
  - kind: policy
    claim: Fake third-party bill-payment websites and fake phone numbers pose as Optimum. Optimum says not to use search engines to pay or find contact numbers; use the number on your bill or the Contact Us page.
    source: https://www.optimum.net/pages/phishing-alerts.html
    last_verified: 2026-10-12
  - kind: policy
    claim: Tech-support calls claim your computer is infected, ask for remote access, then charge a fee.
    source: https://www.optimum.net/pages/phishing-alerts.html
    last_verified: 2026-10-12
