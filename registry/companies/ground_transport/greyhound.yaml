regulators: [fmcsa]
notes: >-
  Greyhound is owned by Flix (FlixBus acquired it in 2021). Tickets on greyhound.com are sold by FlixBus, Inc. ("Flix")
  as a broker for independent bus operators such as Greyhound; the operator of a trip is shown during booking. Greyhound
  keeps its own phone lines and help center (help.greyhound.com); FlixBus-branded trips use FlixBus channels (see flixbus).
  The Terms & Conditions of Purchase (dated 7/13/2026) state two different claim-notice deadlines (90 days and 21 days).

