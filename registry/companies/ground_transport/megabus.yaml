id: megabus
name: megabus (US)
aliases: [megabus.com, megabus us, us megabus]
sector: ground_transport
parent: Coach USA
website: https://us.megabus.com
account_url: https://us.megabus.com/contact-us
regulators: [fmcsa]
notes: >-
  The terms say "megabus.com" is a trade name, not a legal entity; the contract is with the regional operating carrier
  (for example Megabus Northeast LLC, 349 First St, Elizabeth, NJ 07206). The us.megabus.com footer shows "© 2026 Coach USA".
  Ownership changes at Coach USA in 2024-2026 were not confirmed from a fetched page. Terms last updated November 7, 2023.

