id: hyatt
name: Hyatt Hotels Corporation
aliases: [hyatt, hyatt hotels, world of hyatt, hyatt regency, grand hyatt, hyatt place, andaz]
sector: lodging
website: https://www.hyatt.com
account_url: https://www.hyatt.com/help/faqs/canceling-changing-an-online-reservation
regulators: [ftc]
notes: >-
  Hyatt completed its acquisition of Playa Hotels & Resorts on June 17, 2025, adding all-inclusive resorts in Mexico,
  the Dominican Republic and Jamaica; it later sold the Playa real estate and kept management agreements. Cancellation
  and deposit policies are set per hotel and rate. hyatt.com blocks most automated fetches; values here come from Hyatt
  pages as shown in official-domain search results, except where a fetched page is cited.

