escalation:
  - {rung: frontline, channel: customer-service-phone, note: "Front desk first while you are at the hotel."}
  - {rung: written_complaint, channel: stay-feedback-form}
  - {rung: written_complaint, channel: consumer-affairs-email}
  - {rung: payment_dispute}
  - {rung: state_agency, agency_kind: attorney_general}

playbooks:
  - issue: refund_request
    summary: Find the hotel's cancellation and deposit policy in the confirmation, cancel online, then ask Guest Care in writing.
    evidence: [confirmation number, cancellation and deposit policy from the confirmation email, cancellation number, card statement]
    steps:
      - do: Read the cancellation and deposit policy in the confirmation email; Hyatt says it is set per hotel and rate and given at booking.
      - do: Cancel on hyatt.com with your name and confirmation number, or with the card used to book. Third-party bookings must be cancelled with the third party.
        channel: cancel-change-page
      - do: For a California Hyatt booked through Hyatt channels, cancel within 24 hours of booking for a full refund when check-in is at least 72 hours away.
      - do: If a refund is not paid, call Guest Care, then send the request with the cancellation number by email or the feedback form.
        channel: customer-service-phone
    facts:
      - kind: policy
        claim: Hyatt says cancellation and deposit policies vary by hotel and confirmed rate, and the policy for a reservation is given when it is made.
        issues: [refund_request]
        source: https://www.hyatt.com/help/faqs/payment-and-cancellation
        last_verified: 2026-10-12
      - kind: policy
        claim: If a hotel charges a deposit, Hyatt says the card is charged as soon as the hotel can process it; the deposit policy shows during the online booking.
        issues: [refund_request, deposit_refund]
        source: https://www.hyatt.com/help/faqs/payment-and-cancellation
        last_verified: 2026-10-12
      - kind: deadline
        claim: For stays at Hyatt hotels in California booked through Hyatt channels, any reservation, including prepaid and nonrefundable ones, can be cancelled with Hyatt without penalty and with a full refund up to twenty-four (24) hours after booking, unless it was made less than seventy-two (72) hours before check-in.
        issues: [refund_request]
        source: https://www.hyatt.com/help/terms/hyatt
        last_verified: 2026-10-12
  - issue: billing_error
    summary: Ask the hotel, then Hyatt Guest Care in writing with the folio.
    evidence: [hotel bill, confirmation number, card statement]
    steps:
      - do: Ask the hotel to correct the bill. Hyatt's help center has a "Retrieve Hotel Bill" option for a copy.
      - do: If the hotel does not correct it, call Guest Care and then send the folio and the correct amount by email.
        channel: consumer-affairs-email
      - do: Dispute the charge with your card issuer if Hyatt does not correct it.

facts:
  - kind: fee
    claim: Hyatt hotel policy pages state destination or resort fees per room per night, for example "A daily destination fee of $25.00 (subject to change) is applied to each room of your stay" at Hyatt Regency New Orleans.
    source: https://www.hyatt.com/hyatt-regency/en-US/msyrn-hyatt-regency-new-orleans/policies
    last_verified: 2026-10-12

known_blockers:
  - hyatt.com returns HTTP 403 to automated fetches; an agent may need the person to open forms.
  - Regional phone numbers only work from the country or region of origin.
