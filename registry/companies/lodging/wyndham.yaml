escalation:
  - {rung: frontline, channel: customer-care-phone, note: "Front desk first while you are at the hotel."}
  - {rung: written_complaint, channel: about-my-stay-form}
  - {rung: payment_dispute}
  - {rung: state_agency, agency_kind: attorney_general}
  - {rung: arbitration, channel: legal-notice-mail, note: "Terms of Use require individual JAMS arbitration (NAM for mass filings)."}

playbooks:
  - issue: billing_error
    summary: Ask the hotel, then Customer Care, then put it in writing on the About My Stay form.
    evidence: [folio, confirmation number, card statement, rate quoted at booking]
    steps:
      - do: Ask the hotel to correct the folio.
      - do: If it does not, call Wyndham Customer Care with the folio and the correct amount.
        channel: customer-care-phone
      - do: Send the dispute in writing through the About My Stay form and keep the confirmation.
        channel: about-my-stay-form
      - do: If not corrected, dispute the charge with your card issuer.
  - issue: reservation_problem
    summary: Ask the hotel for an equal room; afterwards complain in writing to Wyndham.
    evidence: [confirmation number, photos, receipts for a replacement stay]
    steps:
      - do: Ask the front desk for an equal alternative at the hotel's cost.
      - do: Call Customer Care while you are still there if the hotel refuses.
        channel: customer-care-phone
      - do: Afterwards, ask for a refund and your extra costs through the About My Stay form.
        channel: about-my-stay-form

facts:
  - kind: deadline
    claim: Wyndham Best Rate claims must be filed within 24 hours of booking the reservation.
    source: https://www.wyndhamhotels.com/contact-us
    last_verified: 2026-10-12
  - kind: policy
    claim: Wyndham's Terms of Use require claims to be brought individually and filed with JAMS (NAM administers mass filings); for relief of $10,000 or less either party may elect arbitration by telephone, video or written submissions.
    source: https://www.wyndhamhotels.com/content/whg-ecomm-responsive/en-us/whg/about-us/terms-of-use-more-info.display.html
    last_verified: 2026-10-12

known_blockers:
  - Wyndham's cancellation, deposit-hold and resort-fee policies are set per hotel and were not found on a corporate page.
