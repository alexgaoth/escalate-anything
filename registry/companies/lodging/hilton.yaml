id: hilton
name: Hilton
aliases: [hilton worldwide, hilton hotels, hilton honors, hampton inn, doubletree, embassy suites, homewood suites]
sector: lodging
website: https://www.hilton.com
account_url: https://www.hilton.com/en/book/reservation/find/
regulators: [ftc]
notes: >-
  Hilton tells guests to take billing errors to the
  hotel first; the Help Center Billing Issue and Stay Feedback forms are the written channels after that. Hilton.com
  blocks most automated page fetches; values here come from Hilton pages as shown in official-domain search results.

channels:
  - id: honors-customer-care-phone
    type: phone
    label: Hilton reservations and Hilton Honors customer care (1-800-4HONORS)
    value: +1-800-446-6677
    purposes: [reservation_problem, refund_request, billing_error, poor_service]
    notes: The Help Center lists the number as +1-800-4HONORS; Hilton travel-agent resources give the digits 1-800-446-6677 for Hilton Honors reservations.
    source: https://www.hilton.com/en/portal/travel-agents/resources/
    last_verified: 2026-10-12
  - id: help-center-chat
    type: chat
    label: Hilton Help Center chat
    value: https://www.hilton.com/en/help-center/
    hours: 24/7
    purposes: [reservation_problem, refund_request, billing_error]
    source: https://www.hilton.com/en/help-center/
    last_verified: 2026-10-12
  - id: billing-issue-form
    type: web_form
    label: Report a Billing Issue (Help Center)
    value: https://www.hilton.com/en/help-center/reservations/report-a-billing-issue/
    purposes: [billing_error, deposit_refund, refund_request]
    notes: Hilton says to contact the hotel from the stay first; use this form if that does not resolve it.
    source: https://www.hilton.com/en/help-center/reservations/report-a-billing-issue/
    last_verified: 2026-10-12
  - id: stay-feedback-form
    type: web_form
    label: Stay Feedback form (Help Center)
    value: https://www.hilton.com/en/help-center/reservations/stay-feedback/
    purposes: [poor_service, reservation_problem]
    source: https://www.hilton.com/en/help-center/reservations/stay-feedback/
    last_verified: 2026-10-12
  - id: cancel-reservation-page
    type: portal
    label: How to cancel your reservation (Help Center)
    value: https://www.hilton.com/en/help-center/reservations/how-to-cancel-your-reservation/
    purposes: [refund_request]
    source: https://www.hilton.com/en/help-center/reservations/how-to-cancel-your-reservation/
    last_verified: 2026-10-12

escalation:
  - {rung: frontline, channel: honors-customer-care-phone, note: "For billing errors Hilton says to contact the hotel from the stay first."}
  - {rung: written_complaint, channel: billing-issue-form}
  - {rung: written_complaint, channel: stay-feedback-form}
  - {rung: payment_dispute, note: "Hilton warns that disputing an Advance Purchase charge while a Hilton refund is pending can cause a double credit that is later reversed."}
  - {rung: state_agency, agency_kind: attorney_general}

playbooks:
  - issue: refund_request
    summary: Cancel before the hotel's deadline; standard-rate deposits are refunded by the hotel, Advance Purchase rates are non-refundable.
    evidence: [confirmation number, rate details and cancellation policy, cancellation confirmation, card statement]
    steps:
      - do: Check the rate type and deadline under Rate details & policies in the reservation or confirmation email.
      - do: Cancel online (Find Stay, View/Edit Stay), in the Hilton Honors app, with the hotel, or through Customer Support.
        channel: cancel-reservation-page
      - do: For a deposit refund on a standard rate, ask the hotel that collected the payment; refunds can take up to 30 days.
      - do: For an Advance Purchase booking in the US, Canada, Mexico or the Caribbean, call at least three days before check-in to ask whether the hotel will accept a cancellation when you book a new Advance Purchase reservation; a service fee applies.
        channel: honors-customer-care-phone
      - do: If a refund you are owed does not arrive, report it through the billing issue form before you dispute the charge with your card issuer.
        channel: billing-issue-form
    facts:
      - kind: policy
        claim: Hilton says cancellation policies vary by rate type, stay dates and hotel; a late cancellation fee may apply after the hotel's window.
        issues: [refund_request]
        source: https://www.hilton.com/en/help-center/reservations/how-to-cancel-your-reservation/
        last_verified: 2026-10-12
      - kind: deadline
        claim: If you paid a deposit, the refund is processed by the hotel that collected the payment, and Hilton says refunds can take up to 30 days.
        issues: [refund_request, deposit_refund]
        source: https://www.hilton.com/en/help-center/reservations/how-to-cancel-your-reservation/
        last_verified: 2026-10-12
      - kind: policy
        claim: Hilton Advance Purchase terms say payments for Advance Purchase/Non-Refundable rates are not refundable and the bookings may not be modified.
        issues: [refund_request]
        source: https://www.hilton.com/en/hotels/laxavci-conrad-los-angeles/offers/advance-purchase-terms/
        last_verified: 2026-10-12
      - kind: process
        claim: Hilton warns that if you dispute an Advance Purchase charge with your card company instead of waiting for Hilton's refund, the double credit causes a new correcting charge when the dispute closes.
        issues: [refund_request]
        source: https://www.hilton.com/en/help-center/reservations/refund-reversals/
        last_verified: 2026-10-12
  - issue: billing_error
    summary: Ask the hotel first, then use the Help Center billing issue form.
    evidence: [folio, confirmation number, card statement, rate quoted at booking]
    steps:
      - do: Contact the hotel from the stay and ask it to correct the charge.
      - do: If the hotel does not fix it, submit the Report a Billing Issue form with the folio and the correct amount.
        channel: billing-issue-form
      - do: If Hilton does not correct it, dispute the charge with your card issuer.
  - issue: deposit_refund
    summary: The incidental hold should drop within 72 hours of checkout; card issuers can take longer.
    evidence: [final folio, checkout date, card statement showing the hold]
    steps:
      - do: Check the final folio for posted incidental charges.
      - do: If the hold remains well past 72 hours, ask the hotel to confirm the release, then contact your card issuer.
      - do: If the hotel charged the hold amount and you dispute it, use the billing issue form.
        channel: billing-issue-form
    facts:
      - kind: deadline
        claim: Hilton says that at checkout you are charged the final price and the incidental hold is released within 72 hours; depending on the card provider it may take longer.
        issues: [deposit_refund]
        source: https://www.hilton.com/en/hilton-honors/payment-security/
        last_verified: 2026-10-12

facts:
  - kind: fee
    claim: Hilton says resort charges vary by hotel; the amount is in the hotel website's "Rooms and suites" section and what it includes is under "Hotel policies".
    source: https://help.hilton.com/s/article/Is-there-a-resort-charge-at-the-hotel
    last_verified: 2026-10-12
  - kind: fee
    claim: Hilton Honors terms say members on Reward stays booked with all Points or a promotional free night reward certificate do not pay resort fees at participating hotels.
    source: https://www.hilton.com/en/hilton-honors/benefit-terms/
    last_verified: 2026-10-12
  - kind: policy
    claim: The Hilton Site Usage Agreement has no arbitration clause; it requires individual (non-class) claims filed in the U.S. District Court for the Eastern District of Virginia or Fairfax County, Virginia courts, and a one-year limit to bring claims.
    source: https://www.hilton.com/en/p/site-usage-agreement/
    last_verified: 2026-10-12

known_blockers:
  - hilton.com returns HTTP 403 to automated fetches; an agent may need the person to open Help Center pages and forms.
  - Billing disputes go to the individual hotel first; Hilton corporate forms are the second step.
