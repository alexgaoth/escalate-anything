id: peacock
name: Peacock
aliases: [peacock tv, peacocktv, peacock premium]
sector: subscription
parent: NBCUniversal
website: https://www.peacocktv.com
account_url: https://www.peacocktv.com/account
official_domains: [peacocktv.com]
regulators: [ftc]
notes: >-
  The service is "provided to you by Peacock TV LLC and its affiliated companies" (Terms). The Terms
  name NBCUniversal as Peacock's DMCA agent and link to the NBCUniversal privacy policy. The 2025-2026
  Versant spin-off was not checked on a Peacock page.

channels:
  - id: account
    type: portal
    label: Peacock account details page (cancel)
    value: https://www.peacocktv.com/account
    purposes: [cancel_service, billing_error]
    access: login
    notes: The Terms say to log in and follow the instructions on the account details page to cancel.
    source: https://www.peacocktv.com/account
    last_verified: 2026-10-12
  - id: help-center
    type: portal
    label: Peacock Help Center
    value: https://www.peacocktv.com/help
    purposes: [billing_error, refund_request, cancel_service]
    source: https://www.peacocktv.com/terms
    last_verified: 2026-10-12
  - id: cancel-plans
    type: portal
    label: Peacock account Plans page (Cancel All Subscriptions)
    value: https://www.peacocktv.com/account/plans
    purposes: [cancel_service]
    access: login
    notes: Select Cancel All Subscriptions (base plan and add-ons), or Remove Add-On for one add-on. A confirmation shows on screen and by email, which may take a few hours. If you cannot log in, the cancellation article offers cancellation by chat.
    source: https://www.peacocktv.com/help/article/cancellation
    last_verified: 2026-10-12
  - id: get-in-touch
    type: chat
    label: Peacock Get in Touch page (live chat or email message)
    value: https://www.peacocktv.com/help/get-in-touch
    hours: 9:00AM-1:00AM ET (live agent chat)
    purposes: [cancel_service, billing_error, refund_request]
    access: login
    notes: Sign in first. Peacock lists no phone number.
    source: https://www.peacocktv.com/help/article/contact-us-in-customer-service
    last_verified: 2026-10-12
  - id: peacocktvcare-x
    type: social
    label: PeacockTVCare on X (direct message)
    value: https://twitter.com/PeacockTVCare
    source: https://www.peacocktv.com/help/article/contact-us-in-customer-service
    last_verified: 2026-10-12
  - id: apple-cancel
    type: web_form
    label: Cancel Peacock billed through Apple
    value: https://support.apple.com/en-us/HT202039
    purposes: [cancel_service]
    source: https://www.peacocktv.com/help/article/cancellation
    last_verified: 2026-10-12
  - id: google-play-cancel
    type: web_form
    label: Cancel Peacock billed through Google Play
    value: https://support.google.com/googleplay/answer/7018481
    purposes: [cancel_service]
    source: https://www.peacocktv.com/help/article/cancellation
    last_verified: 2026-10-12
  - id: amazon-cancel
    type: web_form
    label: Cancel Peacock billed through Amazon
    value: https://pay.amazon.com/help/202042890
    purposes: [cancel_service]
    source: https://www.peacocktv.com/help/article/cancellation
    last_verified: 2026-10-12
  - id: roku-cancel
    type: web_form
    label: Cancel Peacock billed through Roku
    value: https://support.roku.com/article/208756478
