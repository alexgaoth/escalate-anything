security:
  known_scams:
    - kind: policy
      claim: 'TurboTax says "Phishing and identity theft are the most common tax scams." Scammers send phony emails that impersonate tax preparers or the IRS and "often pretend to be IRS agents." The article also warns about "ghost" tax preparers who charge fees based on a percentage of the refund.'
      source: https://turbotax.intuit.com/tax-tips/security/tax-time-scams-you-should-avoid/L0rtre77W
      last_verified: 2026-10-13
    - kind: policy
      claim: TurboTax says to contact the IRS Identity Protection Specialized Unit at 1-800-908-4490 if you think you are a victim of tax identity theft.
      source: https://turbotax.intuit.com/tax-tips/security/tax-time-scams-you-should-avoid/L0rtre77W
      last_verified: 2026-10-13
  report_phishing:
    - id: report-phishing-email
      type: email
      label: Forward suspicious emails that claim to come from TurboTax to Intuit
      value: security@intuit.com
      purposes: [fraud]
      notes: An older Intuit community thread names spoof@intuit.com; the current TurboTax article (updated August 31, 2026) names security@intuit.com.
      source: https://turbotax.intuit.com/tax-tips/security/tax-time-scams-you-should-avoid/L0rtre77W
      last_verified: 2026-10-13
    - id: irs-phishing-email
      type: email
      label: IRS address for suspicious emails that claim to be from the IRS (named by TurboTax)
      value: phishing@irs.gov
      purposes: [fraud]
      source: https://turbotax.intuit.com/tax-tips/security/tax-time-scams-you-should-avoid/L0rtre77W
      last_verified: 2026-10-13
regulators: [ftc]
notes: >-
  TurboTax Online is free to use until you pay, print or e-file; paying, printing or e-filing
  counts as acceptance and waives the satisfaction refund. The FTC's January 2024 order on
  "free" advertising was vacated by the Fifth Circuit on March 20, 2026 and remanded to the FTC.
  The 2022 multistate attorneys general settlement ($141 million) paid restitution automatically
  to eligible 2016-2018 filers. The Intuit Terms of Service require binding arbitration or small
  claims court and a class waiver.

