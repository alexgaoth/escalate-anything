escalation:
  - {rung: frontline, channel: member-services-phone, note: "Call the member services number on the back of the member ID card."}
  - {rung: written_complaint, channel: appeals-form, note: "Internal appeal or grievance online, or by mail to the address on the denial letter or EOB."}
  - {rung: state_agency, agency_kind: insurance_department, note: "External review for fully insured plans; complaint to the state."}
  - {rung: regulator, regulator: dol-ebsa, note: "Employer self-funded (ERISA) plans."}
  - {rung: regulator, regulator: cms-no-surprises, note: "Surprise bills under the No Surprises Act."}

playbooks:
  - issue: claim_denial
    summary: Appeal within 180 days of the denial (most plans) online or by mail, then ask for external review. Medicare Advantage members have 65 days.
    evidence: [denial letter or EOB, member ID card, medical records, provider letter of medical necessity, receipts]
    steps:
      - do: Log in and download the EOB for the denied claim.
        channel: claim-status
      - do: Call the number on the member ID card. Ask for the denial reason, the appeal deadline, the appeal address and a free copy of the documents relevant to the claim.
        channel: member-services-phone
      - do: File the appeal with the online form (one form per claim), or mail it to the address on the denial letter or EOB. Attach receipts and records; EOBs are not needed.
        channel: appeals-form
      - do: Medicare Advantage members file within 65 days at the Medicare appeals page or the address in the plan's Evidence of Coverage. Ask for an expedited appeal if waiting could seriously harm health.
        channel: medicare-appeals-page
      - do: After the final internal denial, ask for external review through the state insurance department (fully insured plans) or the plan's process. For employer self-funded plans, contact the Department of Labor if the plan does not follow the rules.
        regulator: dol-ebsa
    facts:
      - kind: deadline
        claim: UnitedHealthcare says most plans allow 180 days from receipt of the claim denial to submit an appeal; check your plan document for your appeal rights.
        issues: [claim_denial]
        source: https://member.uhc.com/myuhc/content/campaigns/myuhc-2-0/medical-appeals-grievances/address-rights-information/appeals-custom-address/jcr:content/par.html
        last_verified: 2026-10-12
      - kind: deadline
        claim: For UnitedHealthcare of California plans, a grievance may be submitted within 180 calendar days following the incident; UnitedHealthcare acknowledges it within 5 calendar days, answers within 30 calendar days for a standard review, and decides urgent problems within 3 calendar days.
        issues: [claim_denial, poor_service]
        source: https://memberforms.uhc.com/Memberappealsandgrievances.html
        last_verified: 2026-10-12
      - kind: deadline
        claim: For UnitedHealthcare Medicare Advantage plans, you may file an appeal within 65 calendar days of the date of the notice of the initial organization determination, and a grievance within 60 calendar days of the circumstance. Expedited Part C pre-service appeals are decided within 72 hours.
        issues: [claim_denial]
        source: https://www.uhc.com/medicare/resources/ma-pdp-information-forms/medicare-appeal.html
        last_verified: 2026-10-12
  - issue: billing_error
    summary: Compare the provider bill with the EOB, then call member services.
    evidence: [provider bill, EOB, member ID card]
    steps:
      - do: Compare the provider bill with the EOB.
        channel: claim-status
      - do: Call the number on the member ID card about a claim processed wrongly. Ask the provider to rebill to the EOB amount.
      - do: If it is not fixed, file an appeal or grievance with the online form.
        channel: appeals-form
  - issue: surprise_medical_bill
    summary: Compare the bill with the EOB, tell UnitedHealthcare and the provider, then contact the CMS help desk.
    evidence: [the bill, EOB, member ID card]
    steps:
      - do: Compare the bill with the EOB. Note whether it was emergency care or care at an in-network facility.
        channel: claim-status
      - do: Tell UnitedHealthcare (number on the ID card) and the provider that the bill may be a surprise bill.
      - do: Contact the CMS No Surprises Help Desk.
        regulator: cms-no-surprises

facts:
  - kind: contact
    claim: UnitedHealth Group tells health plan members to call the number on their health plan ID card, and people without an ID card to use the Contact UnitedHealthcare page.
    source: https://www.unitedhealthgroup.com/contact-us.html
    last_verified: 2026-10-12

known_blockers:
  - uhc.com and member.uhc.com return 403 to automated page readers; most values come from official-domain search results. The online appeal form (memberforms.uhc.com) is readable.
  - Member phone numbers and appeal addresses are plan-specific; use the ID card and the denial letter. The Medicare appeal address comes from 2024 plan documents.
  - The online appeal form needs email and phone verification codes, which an agent cannot receive without the member.
  - Claims and EOBs need a member login.

notes: UnitedHealthcare is the health benefits business of UnitedHealth Group. The UnitedHealthcare Medicare Solutions and Community Plan (Medicaid) sites redirect to uhc.com; AARP Medicare plan pages tell members to call the number on the back of the member ID card. Medicare and Medicaid plans have their own appeal rules.
