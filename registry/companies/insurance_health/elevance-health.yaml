escalation:
  - {rung: frontline, channel: member-contact, note: "Use the number on the back of the member ID card, or live chat."}
  - {rung: written_complaint, channel: medicare-appeals-mail, note: "Internal appeal or grievance. Medicare plans use this address; other plans use the address on the denial letter."}
  - {rung: state_agency, agency_kind: insurance_department, note: "External review for fully insured plans; complaint to the state."}
  - {rung: regulator, regulator: dol-ebsa, note: "Employer self-funded (ERISA) plans."}
  - {rung: regulator, regulator: cms-no-surprises, note: "Surprise bills under the No Surprises Act."}

playbooks:
  - issue: claim_denial
    summary: Read the EOB and denial letter, file the internal appeal at the address on the letter, then ask for external review or complain to the state or Medicare.
    evidence: [denial letter or EOB, member ID card, medical records, provider letter of medical necessity]
    steps:
      - do: Log in and download the EOB for the claim. Note the denial reason code.
        channel: claim-status
      - do: Ask member services or chat for the reason and the plan document section it relies on.
        channel: member-contact
      - do: File the internal appeal at the address and within the deadline printed on the denial letter. Medicare plan members use the Medicare appeals address or fax.
        channel: medicare-appeals-mail
      - do: After the final internal denial, request external review through the state insurance department (fully insured plans) or the plan's external review process. For employer self-funded plans, contact the Department of Labor.
        regulator: dol-ebsa
    facts:
      - kind: process
        claim: Anthem says that if a Medicare member has exhausted the options with Anthem, the member can submit feedback directly to Medicare through the Medicare complaint form.
        issues: [claim_denial]
        source: https://www.anthem.com/medicare/complaints-grievances
        last_verified: 2026-10-12
  - issue: billing_error
    summary: Compare the provider bill with the EOB, then ask Anthem and the provider to correct it.
    evidence: [provider bill, EOB, member ID card]
    steps:
      - do: Compare the provider bill with the EOB in the member account.
        channel: claim-status
      - do: If the provider billed more than the EOB patient responsibility, ask the provider to rebill. Ask Anthem by chat or phone to confirm the amount.
        channel: member-contact
      - do: If a claim was processed wrongly, file an appeal at the address on the EOB or denial letter.
  - issue: surprise_medical_bill
    summary: Check whether the No Surprises Act applies, then tell Anthem and the provider, and contact the CMS help desk.
    evidence: [the bill, EOB, member ID card]
    steps:
      - do: Compare the bill with the EOB. Note whether the care was emergency care or given at an in-network facility.
        channel: claim-status
      - do: Tell Anthem and the provider that the bill may be a surprise bill.
        channel: member-contact
      - do: Contact the CMS No Surprises Help Desk.
        regulator: cms-no-surprises

facts:
  - kind: process
    claim: Anthem says that typically the doctor or provider, especially an in-plan provider, submits the claim. Members who must file themselves use the forms library and should file promptly and within the time limit.
    issues: [claim_delay]
    source: https://www.anthem.com/member-resources/claims
    last_verified: 2026-10-12

known_blockers:
  - Member phone numbers, appeal forms and plan documents depend on the state and plan and are mostly behind member login.
  - Anthem publishes no public appeal address for employer or individual plans; use the address on the denial letter or EOB.

notes: Elevance Health, Inc. (Indianapolis) operates Anthem Blue Cross and Blue Shield affiliated health plans in 14 states, and Wellpoint affiliated health plans. Carelon is its health services business. The former Empire BlueCross BlueShield site (empireblue.com) now redirects to anthembluecross.com, which uses the Anthem Blue Cross and Anthem Blue Cross and Blue Shield names for eastern and southeastern New York. Medicare and Medicaid plans have their own appeal rules.

official_domains: [anthem.com, anthembluecross.com, elevancehealth.com, fighthealthcarefraud.com]
security:
  known_scams:
    - kind: policy
      claim: Anthem warns members to be careful with offers of free products or extra services, and with ads that say "covered by insurance".
      source: https://www.fighthealthcarefraud.com/
      last_verified: 2026-10-12
    - kind: policy
      claim: Medical identity thieves use a member's information to get services or submit false claims. This can use up the member's benefits and put false information in the health record.
      source: https://www.fighthealthcarefraud.com/
      last_verified: 2026-10-12
    - kind: policy
      claim: Some providers bill the health plan for services that were never performed. Anthem asks members to check that each explanation of benefits (EOB) matches the care they received.
      source: https://www.fighthealthcarefraud.com/
      last_verified: 2026-10-12
  report_phishing:
    - id: fraud-report-form
      type: web_form
      label: Anthem healthcare fraud report form (fighthealthcarefraud.com, linked as Healthcare Fraud Prevention in the anthem.com footer)
      value: https://www.fighthealthcarefraud.com/report-fraud-form/
      access: open
      source: https://www.fighthealthcarefraud.com/
      last_verified: 2026-10-12
    - id: fraud-hotline
      type: phone
      label: Anthem fraud hotline for states without their own listed number
      value: +1-866-847-8247
      notes: The same page lists separate fraud hotlines for California, Colorado, Connecticut, Georgia, Indiana, Kentucky, Maine, Missouri, Nevada, New Hampshire, New York, Ohio, Virginia and Wisconsin. Members can also call Member Services on the back of the ID card. Anonymous reports are possible.
      source: https://www.fighthealthcarefraud.com/
      last_verified: 2026-10-12
