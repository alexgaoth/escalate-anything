escalation:
  - {rung: frontline, note: "Call the number on the back of the member ID card. That is your local Blue company, an independent licensee of the Blue Cross Blue Shield Association."}
  - {rung: written_complaint, channel: fep-dispute-claim, note: "Internal appeal with the local Blue plan. FEP members: written reconsideration request to the Local Plan, then OPM."}
  - {rung: regulator, channel: opm-fehb-mail, note: "FEP members only: OPM review is the external step for federal employee plans."}
  - {rung: state_agency, agency_kind: insurance_department, note: "External review for fully insured non-federal plans; complaint to the state."}
  - {rung: regulator, regulator: dol-ebsa, note: "Employer self-funded (ERISA) plans administered by a Blue plan."}
  - {rung: regulator, regulator: cms-no-surprises, note: "Surprise bills under the No Surprises Act."}

playbooks:
  - issue: claim_denial
    summary: Appeal with your local Blue plan (address on the EOB). FEP members ask the Local Plan to reconsider within 6 months, then ask OPM.
    evidence: [EOB, denial letter, member ID card, physician letters, bills, medical records, the brochure provisions you rely on]
    steps:
      - do: Find which Blue company handles your plan. Use the number on the back of the ID card. FEP members can pick their state on the FEP Blue contact page.
        channel: find-local-plan
      - do: Ask the plan for the claim file. FEP members can call customer service or write to the EOB address to review and copy relevant materials free of charge.
        channel: fep-member-phone
      - do: FEP members write to the Local Plan within 6 months of the decision. Explain why the decision is wrong and cite the Service Benefit Plan brochure provisions. Other Blue members follow the appeal instructions on their denial letter.
        channel: fep-dispute-claim
      - do: FEP members who still disagree write to OPM within 90 days of the letter that upholds the denial.
        channel: opm-fehb-mail
      - do: Non-FEP members ask for external review after the final internal denial, through the state insurance department (fully insured plans) or the plan's process; employer self-funded plan members can contact the Department of Labor.
        regulator: dol-ebsa
    facts:
      - kind: deadline
        claim: For FEP (FEHB and PSHB) post-service claims, write to the Plan within 6 months of its decision. The Plan has 30 days to pay, maintain its denial or ask for more information; requested information is due within 60 days.
        issues: [claim_denial]
        source: https://www.fepblue.org/manage-your-health/manage-claims-records/dispute-claim
        last_verified: 2026-10-12
      - kind: deadline
        claim: FEP members who still disagree must write to OPM within 90 days of the Plan letter that upholds the denial, or within 120 days of their first letter if the Plan did not answer within 30 days. OPM issues a final decision or status update within 60 days.
        issues: [claim_denial]
        source: https://www.fepblue.org/manage-your-health/manage-claims-records/dispute-claim
        last_verified: 2026-10-12
      - kind: deadline
        claim: For an urgent FEP pre-service claim, request reconsideration within 6 months of the initial decision; the Plan notifies you of its decision within 72 hours after it receives the request. Verbal or electronic requests may be used for expedited review.
        issues: [claim_denial]
        source: https://www.fepblue.org/manage-your-health/manage-claims-records/dispute-claim
        last_verified: 2026-10-12
      - kind: process
        claim: FEP members can review and copy relevant claim materials free of charge, including expert reviews, by calling customer service or writing to the address on the EOB.
        issues: [claim_denial]
        source: https://www.fepblue.org/manage-your-health/manage-claims-records/dispute-claim
        last_verified: 2026-10-12
      - kind: deadline
        claim: After OPM's decision, an FEP member may sue in Federal court only by December 31 of the third year after the year of the service or denial. This deadline cannot be extended.
        issues: [claim_denial]
        source: https://www.fepblue.org/manage-your-health/manage-claims-records/dispute-claim
        last_verified: 2026-10-12
  - issue: billing_error
    summary: Compare the bill with the EOB from your local Blue plan, then ask the plan and the provider to fix it.
    evidence: [provider bill, EOB, member ID card]
    steps:
      - do: Compare the provider bill with the EOB. FEP members can view claims online.
        channel: fep-view-claims
      - do: Call the number on the ID card (FEP members can use 1-800-411-BLUE) about a claim processed wrongly. Ask the provider to rebill to the EOB amount.
        channel: fep-member-phone
      - do: If it is not fixed, dispute the claim with the plan in writing.
        channel: fep-dispute-claim
  - issue: surprise_medical_bill
    summary: Compare the bill with the EOB, tell the local Blue plan and the provider, then contact the CMS help desk.
    evidence: [the bill, EOB, member ID card]
    steps:
      - do: Compare the bill with the EOB. Note whether it was emergency care or care at an in-network facility.
      - do: Tell your local Blue plan (number on the ID card) and the provider that the bill may be a surprise bill.
        channel: fep-member-phone
      - do: Contact the CMS No Surprises Help Desk.
        regulator: cms-no-surprises

tips:
  - kind: official
    text: The Blue Cross Blue Shield Association does not handle member claims. Each Blue plan is a separate company; Anthem plans, for example, describe themselves as independent licensees of the Blue Cross Blue Shield Association. Contact the plan named on the member ID card.
    issues: [claim_denial, claim_delay, billing_error]
    source: https://www.anthembluecross.com/
    last_verified: 2026-10-12
  - kind: official
    text: FEP Blue says questions about claims, prior approval or care management go to your local BCBS company, which you find by selecting your state on the FEP Blue contact page.
    issues: [claim_denial, claim_delay]
    source: https://www.fepblue.org/contact-us
    last_verified: 2026-10-12

known_blockers:
  - The Association has no member service line for claims. Each local Blue plan has its own numbers, portals and appeal addresses.
  - FEP online claim disputes need a MyBlue account.
  - FEP eligibility questions go to the agency payroll office, retirement system or OWCP, not to the Plan.

notes: Blue Cross and Blue Shield plans are independent companies licensed by the Blue Cross Blue Shield Association. Members must use their own local Blue plan (named on the ID card) for claims and appeals. The Federal Employee Program (FEP Blue, the Service Benefit Plan) covers FEHB and Postal Service (PSHB) members; its external step is OPM review, not state external review. Separate registry entries cover Blue plans owned by Elevance Health (Anthem).

official_domains: [fepblue.org]

security:
