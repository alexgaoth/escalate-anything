      claim: FEP Blue warns that "free" services that ask for your insurance card may not be free and could be fraudulently billed to you or your insurance company.
      source: https://www.fepblue.org/legal/healthcare-fraud
      last_verified: 2026-10-12
    - kind: policy
      claim: FEP Blue warns members to avoid professionals who say they know how to bill for services the plan does not cover.
      source: https://www.fepblue.org/legal/healthcare-fraud
      last_verified: 2026-10-12
  report_phishing:
