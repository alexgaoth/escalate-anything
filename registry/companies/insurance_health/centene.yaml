escalation:
  - {rung: frontline, channel: plan-directory, note: "Call the member services number of your own plan (on the back of the member ID card)."}
  - {rung: written_complaint, channel: ambetter-fl-appeals-mail, note: "Internal appeal or grievance with the state plan. The Florida address is shown; other states use the address on the denial letter or the state forms page."}
  - {rung: state_agency, agency_kind: insurance_department, note: "External review for marketplace plans; complaint to the state."}
  - {rung: regulator, regulator: dol-ebsa, note: "Employer self-funded (ERISA) plans."}
  - {rung: regulator, regulator: cms-no-surprises, note: "Surprise bills under the No Surprises Act."}

playbooks:
  - issue: claim_denial
    summary: Appeal to your Ambetter state plan within 180 days of the denial notice, then ask for external review.
    evidence: [denial letter (Notice of Action) with tracking number, member ID card, medical records, provider letter of medical necessity]
    steps:
      - do: Call your state Ambetter member services number. Ask for the reason and the appeal address for your state.
        channel: plan-directory
      - do: Complete the state grievance and appeal form, or write a letter with the same information, including the tracking number from the upper left corner of the denial letter. In Florida, mail or fax it to the Appeal Department.
        channel: ambetter-fl-appeals-mail
      - do: After the final internal denial, ask for external review through your state insurance department.
      - do: Wellcare (Medicare) members can also file a complaint with Medicare after using the plan's process.
        channel: wellcare-contact
    facts:
      - kind: deadline
        claim: For Ambetter Health in Florida, you must file an appeal within 180 calendar days of the date of the Notice of Action letter, and a grievance within 365 calendar days of the date of the event.
        issues: [claim_denial]
        source: https://www.ambetterhealth.com/content/dam/centene/Sunshine/Ambetter/PDFs/FL_MbrGrivanceAppelConcern.pdf
        last_verified: 2026-10-12
      - kind: process
        claim: Ambetter Florida accepts either its grievance and appeal form or a letter with the same information, mailed to the Appeal Department; it lists separate fax numbers for appeals and for grievances.
        issues: [claim_denial]
        source: https://www.ambetterhealth.com/content/dam/centene/Sunshine/Ambetter/PDFs/FL_MbrGrivanceAppelConcern.pdf
        last_verified: 2026-10-12
  - issue: billing_error
    summary: Check the claim in the member portal, call your plan, then file a grievance.
    evidence: [provider bill, EOB, member ID card]
    steps:
      - do: Compare the provider bill with the claim in the Ambetter member portal.
        channel: ambetter-member-portal
      - do: Call your plan's member services and ask for a correction or reprocessing.
        channel: plan-directory
      - do: If it is not fixed, file a grievance with the state plan.
        channel: ambetter-fl-appeal-form
  - issue: surprise_medical_bill
    summary: Compare the bill with the EOB, tell the plan and the provider, then contact the CMS help desk.
    evidence: [the bill, EOB, member ID card]
    steps:
      - do: Compare the bill with the EOB. Note whether it was emergency care or care at an in-network facility.
        channel: ambetter-member-portal
      - do: Tell your plan and the provider the bill may be a surprise bill.
        channel: plan-directory
      - do: Contact the CMS No Surprises Help Desk.
        regulator: cms-no-surprises

facts:
  - kind: contact
    claim: Centene tells members to contact their health plan directly, not corporate headquarters, for questions about benefits, eligibility or authorizations.
    source: https://www.centene.com/contact.html
    last_verified: 2026-10-12

known_blockers:
  - Centene runs separate state plans; contact details, forms and appeal addresses differ by state and brand.
  - Claims view needs a member portal login.
  - Grievance forms are PDFs that must be mailed or faxed.

notes: Centene Corporation (St. Louis) runs marketplace plans under the Ambetter brand in 29 states, Medicare plans under Wellcare, and state Medicaid plans under local names (for example Sunshine Health, Superior HealthPlan, Peach State, Buckeye, Meridian, Health Net in California). Medicare and Medicaid plans have their own appeal rules.
