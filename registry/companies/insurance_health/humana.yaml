escalation:
  - {rung: frontline, channel: medicare-member-phone, note: "Use the number on the back of the member ID card."}
  - {rung: written_complaint, channel: appeals-online, note: "Internal appeal or grievance online, or by mail or fax with the appeal or grievance form. Employer plans use their own P.O. box."}
  - {rung: state_agency, agency_kind: insurance_department, note: "External review for fully insured plans; complaint to the state."}
  - {rung: regulator, regulator: dol-ebsa, note: "Employer self-funded (ERISA) plans."}
  - {rung: regulator, regulator: cms-no-surprises, note: "Surprise bills under the No Surprises Act."}

playbooks:
  - issue: claim_denial
    summary: Appeal within 65 days of the Medicare denial notice, online, by mail or fax, or by phone for expedited cases.
    evidence: [denial notice or EOB, member ID card, claim number, medical records, provider letter of medical necessity, receipts]
    steps:
      - do: Check the claim and the EOB in MyHumana.
        channel: claim-status
      - do: File the appeal online, or mail or fax the appeal or grievance form with receipts, records or a letter from your doctor.
        channel: appeals-online
      - do: For a service not yet received where waiting could seriously harm health, ask for an expedited appeal with a statement from the provider, or call the expedited appeals line.
        channel: expedited-appeals-phone
      - do: Employer plan members mail the appeal to the employer plans P.O. box, or file orally through the number on the ID card. After the final internal denial, ask for external review or contact the state insurance department (fully insured) or the Department of Labor (self-funded).
        channel: employer-appeals-mail
      - do: Medicare members who still disagree follow the further Medicare appeal levels in the Evidence of Coverage.
    facts:
      - kind: deadline
        claim: For Humana Medicare Advantage (Part C), you have 65 days from the date of the Notice of Denial of Medical Coverage (or Payment) to appeal. For Part D, you have 65 days from the Notice of Denial of Medicare Prescription Drug Coverage to request a redetermination.
        issues: [claim_denial]
        source: https://www.humana.com/member/exceptions-and-appeals
        last_verified: 2026-10-12
      - kind: process
        claim: Humana decides Part C pre-service appeals within 30 calendar days, Part C post-service appeals within 60 calendar days, and Part D appeals within 7 calendar days.
        issues: [claim_denial]
        source: https://www.humana.com/member/exceptions-and-appeals
        last_verified: 2026-10-12
      - kind: deadline
        claim: Humana's appeal or grievance form offers an expedited decision within 72 hours for services not yet received, when the provider supplies a statement that waiting could seriously harm the member's life, health or ability to regain maximum function.
        issues: [claim_denial]
        source: https://assets.humana.com/is/content/humana/G-A_Form_Clean_2024pdf
        last_verified: 2026-10-12
  - issue: billing_error
    summary: Compare the bill with the claim in MyHumana, then call member services.
    evidence: [provider bill, EOB, member ID card]
    steps:
      - do: Compare the provider bill with the claim and EOB in MyHumana.
        channel: claim-status
      - do: Call member services about a claim processed wrongly, and ask the provider to rebill to the EOB amount.
        channel: medicare-member-phone
  - issue: surprise_medical_bill
    summary: Check the bill against the EOB, tell Humana and the provider, then contact the CMS help desk.
    evidence: [the bill, EOB, member ID card]
    steps:
      - do: Compare the bill with the EOB. Note whether it was emergency care or care at an in-network facility.
        channel: claim-status
      - do: Tell Humana and the provider the bill may be a surprise bill.
      - do: Contact the CMS No Surprises Help Desk.
        regulator: cms-no-surprises

facts:
  - kind: policy
    claim: Humana's employer page lists group dental, vision, life and disability plans. It does not list employer group medical plans.
    source: https://www.humana.com/employer
    last_verified: 2026-10-12

known_blockers:
  - Claims and chat need a MyHumana login.
  - Medicaid plans are state-specific; use the Medicaid help page.

notes: Medicare Advantage, Part D and state Medicaid plans have their own appeal rules. Humana's employer offering on its website is group dental, vision, life and disability.

official_domains: [humana.com]

security:
  never_asks:
    - kind: policy
      claim: A Humana member fraud flyer says Humana will never offer "free" or "low-cost" healthcare services in exchange for identifying information about you.
      source: https://assets.humana.com/is/content/humana/SC_Detecting_Preventing_and_Reporting_Healthcare_Fraudpdf
      last_verified: 2026-10-12
  known_scams:
    - kind: policy
      claim: Medical identity thieves offer "free" or "low-cost" healthcare services in exchange for identifying information, such as a Humana, Medicare or Medicaid ID number.
      source: https://assets.humana.com/is/content/humana/SC_Detecting_Preventing_and_Reporting_Healthcare_Fraudpdf
      last_verified: 2026-10-12
    - kind: policy
      claim: Callers claim to be from a clinic, doctor's office, insurance company or pharmacy to get a member's ID number. Humana says not to give a Humana, Medicare or Medicaid ID number over the phone before you verify the caller's identity.
      source: https://assets.humana.com/is/content/humana/SC_Detecting_Preventing_and_Reporting_Healthcare_Fraudpdf
      last_verified: 2026-10-12
    - kind: policy
      claim: Callers offer to send medicine or medical equipment. Humana says to accept medicine or medical equipment in the mail only if your primary care provider or another healthcare provider ordered or prescribed it.
      source: https://assets.humana.com/is/content/humana/SC_Detecting_Preventing_and_Reporting_Healthcare_Fraudpdf
      last_verified: 2026-10-12
    - kind: policy
      claim: Humana lists agent fraud such as enrolling people in a non-existent plan, offering cash payments to enroll, unsolicited door-to-door marketing of Medicare Advantage or prescription drug plans, and misrepresenting plans.
      source: https://assets.humana.com/is/content/humana/Ethics%20Every%20Daypdf
      last_verified: 2026-10-12
  report_phishing:
    - id: siu-phone
      type: phone
      label: Humana Special Investigations Unit (report suspected fraud, waste and abuse)
      value: +1-800-614-4126
      source: https://assets.humana.com/is/content/humana/Ethics%20Every%20Daypdf
      last_verified: 2026-10-12
    - id: siu-email
      type: email
      label: Humana Special Investigations Unit referrals
      value: siureferrals@humana.com
      source: https://assets.humana.com/is/content/humana/Ethics%20Every%20Daypdf
      last_verified: 2026-10-12
    - id: ethics-help-line
      type: phone
      label: Humana Ethics Help Line (1-877-5-THE-KEY)
      value: +1-877-584-3539
      hours: 24 hours a day, seven days a week
      notes: Staffed by external, non-Humana representatives. Calls can be anonymous. Online reports at www.ethicshelpline.com.
      source: https://assets.humana.com/is/content/humana/Ethics%20Every%20Daypdf
      last_verified: 2026-10-12
