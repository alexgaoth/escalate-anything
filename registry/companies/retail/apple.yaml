id: apple
name: Apple
aliases: [apple store, apple online store, app store, itunes, applecare, apple account, apple id, apple.com/bill]
sector: retail
also_sectors: [subscription]
parent: Apple Inc.
website: https://www.apple.com
account_url: https://account.apple.com
regulators: [ftc]
notes: >-
  Two separate refund paths. Hardware bought from Apple (Apple Store or apple.com) follows the
  Sales and Refund Policy. App Store, Apple Media Services and subscription charges billed by
  Apple (statement descriptor apple.com/bill) are refunded through reportaproblem.apple.com.
  Products bought from another retailer go back to that retailer.

