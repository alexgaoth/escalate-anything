    last_verified: 2026-10-13

escalation:
  - {rung: frontline, channel: member-care-phone}
  - {rung: supervisor, channel: member-services-desk}
  - {rung: written_complaint, channel: customer-care-email}
  - {rung: payment_dispute, note: "Card dispute for a membership charge after a cancellation."}
  - {rung: state_agency, agency_kind: attorney_general}
  - {rung: public, regulator: bbb}

playbooks:
  - issue: cancel_service
    summary: Cancel at a club, by phone, chat, email or mail and ask for the current-period fee refund (first cancellation only); turning off Easy Renewal is separate and should be done at least 3 business days before the renewal billing date.
    evidence: [membership number, renewal billing date and amount, cancellation confirmation]
    steps:
      - do: Cancel at the member services desk, by calling 800-BJS-CLUB, through chat, by email or by mail, and ask for a refund of the fees paid for the current membership period.
        channel: member-care-phone
      - do: To stop only the next renewal, opt out of Easy Renewal at the member services desk, on BJs.com, or by phone. This does not cancel the membership.
        channel: member-services-desk
      - do: Do either at least 3 business days before the renewal billing date.
      - do: Dispute any renewal charge made after a confirmed cancellation with your card issuer.
    facts:
      - kind: policy
        claim: A dissatisfied primary member can cancel at any time and get a refund of the fees paid for the current membership period. Refunds are not paid for second or subsequent cancellations; upgrade and add-on fees are not refunded; cancelling forfeits all rewards balances. Read from search-result text on 2026-10-13; the page blocked automated fetches.
        issues: [cancel_service, refund_request]
        source: https://help.bjs.com/hc/en-us/articles/26709903274004-What-is-BJ-s-membership-money-back-guarantee
        last_verified: 2026-10-13
      - kind: deadline
        claim: '"Complete the cancellation at least 3 business days prior to your renewal billing date to ensure that you are not charged." Turning off Easy Renewal is separate from cancelling the membership. Read from search-result text on 2026-10-13; the page blocked automated fetches.'
        issues: [cancel_service]
        source: https://help.bjs.com/hc/en-us/articles/26709012696596-How-do-I-opt-out-of-Easy-Renewal
        last_verified: 2026-10-13

  - issue: refund_request
    summary: Most items within 365 days in new condition with accessories, electronics within 90 days, with proof of purchase; refunds go to the original form of payment.
    evidence: [membership card, receipt or order number, the item with all accessories]
    steps:
      - do: Return the item with proof of purchase at the member services desk of any club, or contact Member Care for an online order.
        channel: member-services-desk
      - do: For a membership fee refund, use the cancel_service steps.
        channel: member-care-phone
      - do: If BJ's refuses a refund you are owed, dispute the charge with your card issuer.
    facts:
      - kind: deadline
        claim: '"BJ''s accepts returns on most items within 365 days of purchase, unless otherwise specified. Items must be returned in new condition with all accessories intact." Electronics have a 90-day window; Final Sale items are non-refundable. Read from search-result text on 2026-10-13; the page blocked automated fetches.'
        issues: [refund_request]
        source: https://www.bjs.com/info/returns/
        last_verified: 2026-10-13
      - kind: policy
        claim: '"All returns require proof of purchase." "All refunds are issued to the original form of payment." Read from search-result text on 2026-10-13; the page blocked automated fetches.'
        issues: [refund_request]
        source: https://www.bjs.com/info/returns/
        last_verified: 2026-10-13

known_blockers:
  - bjs.com and help.bjs.com block automated fetches (HTTP 403); online cancellation and Easy Renewal changes need the member's sign-in.
