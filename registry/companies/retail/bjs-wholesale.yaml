id: bjs-wholesale
name: BJ's Wholesale Club
aliases: [bj's, bjs, bjs.com, bj's wholesale, bjs wholesale club, bj's membership, bj's easy renewal]
sector: retail
also_sectors: [subscription]
website: https://www.bjs.com
official_domains: [bjs.com]
regulators: [ftc]
notes: >-
  BJ's is a paid-membership warehouse club. Membership auto-renews each year through Easy Renewal.
  On 2026-10-13 bjs.com and help.bjs.com returned HTTP 403 to automated fetches, so every value in
  this file was read from search-result text of the named BJ's pages, not from the pages
  themselves. Recheck before relying on them. No BJ's page on phishing or impersonation scams was
  read.

