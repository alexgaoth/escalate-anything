    value: +1-800-257-2582
    hours: Mon-Fri 8am-7pm, Sat 8am-6pm, Sun 12pm-6pm ET
    purposes: [cancel_service, refund_request, damaged_item, lost_package, billing_error, unauthorized_charge]
    notes: Read from search-result text of the BJ's Help Center on 2026-10-13; the site blocked automated fetches. Have the membership number ready.
    source: https://help.bjs.com/hc/en-us
    last_verified: 2026-10-13
  - id: help-chat
