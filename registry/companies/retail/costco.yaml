id: costco
name: Costco
aliases: [costco wholesale, costco.com, costco membership, costco executive membership, kirkland signature]
sector: retail
also_sectors: [subscription]
parent: Costco Wholesale Corporation
website: https://www.costco.com
account_url: https://www.costco.com/OrderStatusCmd
regulators: [ftc]
notes: >-
  Costco is a paid-membership warehouse club. Its terms of use send legal actions to the state
  or federal courts in Seattle, Washington; no arbitration clause was found in the terms
  (last updated October 7, 2026).

