id: kroger
name: Kroger
aliases: [kroger.com, the kroger co, kroger delivery, kroger boost]
sector: retail
parent: The Kroger Co.
website: https://www.kroger.com
regulators: [ftc]
notes: >-
  Kroger delivery orders are fulfilled either by Kroger or by Instacart; missing items go to
  whichever company fulfilled the order. Kroger family banner stores may have their own
  websites. The Boost membership cancellation path and the general return policy were not
  confirmed (kroger.com pages timed out).

