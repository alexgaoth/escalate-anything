  - {rung: supervisor, channel: customer-service-phone}
  - {rung: written_complaint, channel: customer-service-email}
  - {rung: executive, channel: corporate-mail}
  - {rung: payment_dispute}
  - {rung: state_agency, agency_kind: attorney_general}
  - {rung: public, regulator: bbb}

playbooks:
  - issue: lost_package
    summary: Report missing delivery items to the company that fulfilled the order (Kroger or Instacart).
    evidence: [order number, receipt email, list of missing items]
    steps:
      - do: Check the order confirmation to see whether Kroger or Instacart fulfilled it.
      - do: For a Kroger-fulfilled order, call Kroger customer service.
        channel: customer-service-phone
      - do: For an Instacart-fulfilled order, contact Instacart.
        channel: instacart-phone
      - do: If you are not refunded, dispute the charge with your card issuer.
    facts:
      - kind: process
        claim: If the final delivery total is lower than the placed total for reasons other than out-of-stocks or substitutions, a refund for the difference may be applied to the payment card within 24-48 hours of delivery.
        issues: [refund_request, billing_error]
        source: https://www.kroger.com/hc/help/faqs/ways-to-shop/delivery
        last_verified: 2026-10-12
      - kind: compensation
        claim: Instacart refunds the $5 Express Delivery surcharge for express orders delivered more than 15 minutes late.
        issues: [refund_request]
        source: https://www.kroger.com/hc/help/faqs/ways-to-shop/delivery
        last_verified: 2026-10-12
  - issue: damaged_item
    summary: Report a damaged or wrong item from a delivery or pickup order to Kroger customer service.
    evidence: [photos of the item, order number or receipt]
    steps:
      - do: Photograph the item and keep the receipt.
      - do: Contact Kroger customer service through the contact page or by phone and ask for a refund.
        channel: contact-us
      - do: For an Instacart-fulfilled order, contact Instacart.
        channel: instacart-phone

known_blockers:
  - kroger.com pages often time out for automated fetches.
