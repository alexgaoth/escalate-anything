playbooks:
  - issue: unauthorized_charge
    summary: Freeze the card, report the payment in the app or by phone at once, and ask for the refund.
    evidence: [date and amount of each payment, where the card or device is now, date you noticed, any calls or messages before the payment]
    steps:
      - do: Freeze the card in the app or Online Banking (cards section). If it is lost or stolen, report it there or call the lost and stolen line.
        channel: lost-stolen-card-phone
      - do: In the app or Online Banking select the payment and use 'Report a dispute, fraud or scam'.
        channel: app-report-transaction
      - do: For a current account, call the 24/7 line; you will be asked security questions.
        channel: main-phone
      - do: For a personal credit card, call the credit card fraud line (24 hours).
        channel: credit-card-fraud-phone
      - do: If NatWest refuses the refund, complain in the app, then refer it to the Financial Ombudsman Service.
        regulator: uk-fos
    facts:
      - kind: process
        claim: If you are entitled to a refund of an unauthorised payment, NatWest refunds it by the end of the business day after you told it. It may take longer if the payment was more than 13 months before you told NatWest, or NatWest reasonably suspects fraud.
        issues: [unauthorized_charge, fraud]
        source: https://www.natwest.com/content/dam/natwest/personal/current-accounts/documents/your-current-account-terms.pdf
        verified_via: document
        last_verified: 2026-11-19
      - kind: limit
        claim: If you intentionally or with gross negligence failed to keep payment details safe or to tell NatWest promptly, it will not refund unauthorised payments made before you told it, unless part of the payment created an overdraft; then you may be responsible for the first £35 and NatWest refunds the rest of the overdrawn balance.
        issues: [unauthorized_charge, fraud]
        source: https://www.natwest.com/content/dam/natwest/personal/current-accounts/documents/your-current-account-terms.pdf
        verified_via: document
        last_verified: 2026-11-19

  - issue: fraud
    summary: If you were tricked into sending money (APP scam), call NatWest at once; payments by Faster Payments or CHAPS from 7 October 2024 can be refunded up to £85,000.
    evidence: [payment dates, amounts and payee details, messages, emails or call details from the scammer, police or Report Fraud reference]
    steps:
      - do: For a bank or Travel account, call the 24/7 line and say you were tricked into making a payment.
        channel: main-phone
      - do: For a personal credit card, call the credit card line (24/7).
        channel: credit-card-phone
      - do: If you gave security or card details on a suspicious call, call NatWest at once; if you cannot get through, freeze the card in the app or Online Banking.
        channel: main-phone
      - do: Forward suspicious emails to phishing@natwest.com and texts that mention NatWest to 88355.
        channel: phishing-email
      - do: If NatWest refuses or reduces the refund, complain, then refer it to the Financial Ombudsman Service.
        regulator: uk-fos
    facts:
      - kind: limit
        claim: NatWest's APP scam reimbursement covers payments made by Faster Payments or CHAPS in the UK on or after 7 October 2024, with claims up to a maximum of £85,000.
        issues: [fraud]
        source: https://www.natwest.com/fraud-and-security/how-we-protect-you/our-codes/app-scams.html
        last_verified: 2026-11-19
      - kind: deadline
        claim: NatWest excludes claims where the final scam payment was made more than 13 months before you report it.
        issues: [fraud]
        source: https://www.natwest.com/fraud-and-security/how-we-protect-you/our-codes/app-scams.html
        last_verified: 2026-11-19
      - kind: limit
        claim: A £100 excess could apply to any eligible APP claim, but not where personal circumstances had a material impact on your ability to protect yourself from the scam.
        issues: [fraud]
        source: https://www.natwest.com/fraud-and-security/how-we-protect-you/our-codes/app-scams.html
        last_verified: 2026-11-19
      - kind: process
        claim: In most cases NatWest aims to decide an APP claim in 5 business days; some decisions and refunds may take up to 35 business days.
        issues: [fraud]
        source: https://www.natwest.com/fraud-and-security/how-we-protect-you/our-codes/app-scams.html
        last_verified: 2026-11-19
      - kind: policy
        claim: NatWest excludes APP claims where you acted fraudulently, or where you did not meet the Consumer Standard of Caution through gross negligence. Payments up to and including 6 October 2024 fall under the earlier APP Scam Code.
        issues: [fraud]
        source: https://www.natwest.com/fraud-and-security/how-we-protect-you/our-codes/app-scams.html
        last_verified: 2026-11-19
      - kind: limit
        claim: The current account terms say APP refunds apply only to electronic payments in pounds sterling to a UK account you do not control, and not to debit card payments.
        issues: [fraud]
        source: https://www.natwest.com/content/dam/natwest/personal/current-accounts/documents/your-current-account-terms.pdf
        verified_via: document
        last_verified: 2026-11-19

  - issue: transaction_dispute
    summary: Give the retailer at least 14 days first, then raise a dispute in the app within 120 days of the payment; NatWest may use the Visa and Mastercard chargeback schemes.
    evidence: [account details, retailer name, amount and date of the payment, record of contact with the retailer]
    steps:
      - do: Contact the retailer first and give them at least 14 days to resolve it.
      - do: Check the payment is no longer pending; NatWest cannot raise a dispute on a pending payment.
      - do: For a debit card or Travel account, select the payment in the app or Online Banking and use 'Report a dispute, fraud or scam'.
        channel: app-report-transaction
      - do: For a credit card, use the 'Get started' dispute form or the same app link, which connects you to Cora.
        channel: credit-card-dispute-form
      - do: Without app or Online Banking access, call the number on the back of your card.
        channel: main-phone
      - do: If the dispute fails and you disagree, complain, then refer it to the Financial Ombudsman Service.
        regulator: uk-fos
    facts:
      - kind: deadline
        claim: NatWest says that if the payment was less than 120 days ago it can look into a card payment dispute, and asks you to give the retailer at least 14 days first.
        issues: [transaction_dispute]
        source: https://www.natwest.com/fraud-and-security/retaildisputes/card-payment-dispute.html
        last_verified: 2026-11-19
      - kind: process
        claim: NatWest tries to send an update within five working days and to sort out the dispute within 60 days. The retailer can disagree, and if the dispute fails the temporary refund is taken back.
        issues: [transaction_dispute]
        source: https://www.natwest.com/fraud-and-security/retaildisputes/card-payment-dispute.html
        last_verified: 2026-11-19
      - kind: policy
        claim: NatWest says the first step should always be to contact the retailer; if that does not work, NatWest may be able to help using the Visa and Mastercard chargeback schemes (for example goods not received, double or wrong charges, subscription problems).
        issues: [transaction_dispute]
        source: https://www.natwest.com/support-centre/help-with-your-card/transactions/how-do-i-dispute-a-credit-card-transaction.html
        last_verified: 2026-11-19

  - issue: fee_reversal
    summary: NatWest charges interest but no usage fees on overdrafts; if charges come from money problems, ask for support early through the app or Cora.
    evidence: [statements showing interest and unpaid transaction fees, income and spending, the payment you will miss]
    steps:
      - do: Check the charges against NatWest's overdraft rules (no usage fees, £1.55 per unpaid transaction, monthly cap £18.80).
      - do: For missed payments or going over a limit on a credit card, loan or overdraft, use the payment support journey in the app.
        channel: payment-support-app
      - do: To agree to pay later, Chat to Cora and type 'Webchat5' (team available Monday to Friday 9am to 5pm).
        channel: cora-chat
      - do: For a loan or credit card payment you will miss, call the relevant line.
        channel: credit-card-difficulty-phone
      - do: If you think a charge was wrong, complain in the app, then refer it to the Financial Ombudsman Service.
        channel: app-complaint
    facts:
      - kind: fee
        claim: NatWest says it charges no fees for using an overdraft, just interest, and charges £1.55 per unpaid transaction (for example a Direct Debit it returns unpaid).
        issues: [fee_reversal]
        source: https://www.natwest.com/support-centre/general-banking-information/general/can-you-tell-me-more-about-overdraft-charges.html
        last_verified: 2026-11-19
      - kind: limit
        claim: NatWest will not charge more than £18.80 in a monthly charging period for unarranged overdrafts and unpaid transactions.
        issues: [fee_reversal]
        source: https://www.natwest.com/support-centre/general-banking-information/general/can-you-tell-me-more-about-overdraft-charges.html
        last_verified: 2026-11-19
      - kind: policy
        claim: NatWest asks customers who have missed (or are about to miss) a loan, mortgage or credit card payment, or who are struggling with a current account or overdraft, to tell it as soon as possible so it can support them.
        issues: [fee_reversal]
        source: https://www.natwest.com/life-moments/Struggling-financially.html
        verified_via: browser
        last_verified: 2026-11-19

  - issue: frozen_funds
    summary: NatWest can restrict an account or payments, or close an account with 90 days' notice (or immediately in some cases); ask why and what it needs, then complain.
    evidence: [messages or letters from NatWest, date access was restricted, balance at that time, proof of identity and of the source of the money]
    steps:
      - do: If NatWest contacted you, call it back (03457 888 444 in the UK, +44 131 549 8888 from abroad).
        channel: main-phone
      - do: Ask why the account or payment is restricted, what NatWest needs from you, and when access will return.
        channel: cora-chat
      - do: If NatWest closes the account, ask in writing how and when the credit balance will be sent to you.
        channel: complaints-mail
      - do: If the problem continues after 8 weeks or the final response, refer it to the Financial Ombudsman Service.
        regulator: uk-fos
    facts:
      - kind: policy
        claim: NatWest may suspend or restrict accounts or services (such as the debit card or online banking) if it reasonably believes security details were not kept safe, suspects fraudulent use, suspects illegal use or serious crime, or you have seriously broken the agreement. It explains why unless it cannot contact you or a legal or security reason prevents it.
        issues: [frozen_funds]
        source: https://www.natwest.com/content/dam/natwest/personal/current-accounts/documents/your-current-account-terms.pdf
        verified_via: document
        last_verified: 2026-11-19
      - kind: policy
        claim: NatWest can close an account by giving at least 90 days' notice and its reason. It may close on less notice, including immediately and without a reason, if it cannot complete its checks, suspects use in connection with serious crime, is required by the UK government or regulator, or in other listed cases.
        issues: [frozen_funds]
        source: https://www.natwest.com/content/dam/natwest/personal/current-accounts/documents/your-current-account-terms.pdf
        verified_via: document
        last_verified: 2026-11-19
      - kind: process
        claim: When an account is closed, NatWest forwards any remaining credit balance after you repay money you owe it.
        issues: [frozen_funds]
        source: https://www.natwest.com/content/dam/natwest/personal/current-accounts/documents/your-current-account-terms.pdf
        verified_via: document
        last_verified: 2026-11-19
      - kind: policy
        claim: If NatWest's security systems flag a possible risk, it may limit the amount you can pay to a provider, from every account you hold, while it thinks there is a risk to you.
        issues: [frozen_funds, fraud]
        source: https://www.natwest.com/support-centre/general-banking-information/general/restricted-payments.html
        last_verified: 2026-11-19

facts:
  - kind: process
    claim: NatWest says it will confirm it has your complaint within 5 days, and if the issue takes longer it sends an acknowledgement within five working days and keeps you updated.
    issues: [poor_service]
    source: https://www.natwest.com/support-centre/how-to-complain.html
    verified_via: browser
    last_verified: 2026-11-19
  - kind: deadline
    claim: NatWest's complaints leaflet asks you to allow up to 8 weeks for a complaint to be resolved, and says it aims to resolve payment-related complaints within 15 business days.
    issues: [poor_service]
    source: https://www.natwest.com/content/dam/natwest/personal/support-centre/complaints/natwest_making_things_better_nov_2024.pdf
    verified_via: document
    last_verified: 2026-11-19
  - kind: deadline
    claim: If NatWest has not resolved your complaint within eight weeks, or you are not satisfied, you can refer it to the Financial Ombudsman Service; after a final response letter you must do this within 6 months of receiving it.
    issues: [poor_service]
    source: https://www.natwest.com/support-centre/how-to-complain.html
    verified_via: browser
    last_verified: 2026-11-19
  - kind: deadline
    claim: For a payment-related complaint, the leaflet says you can contact the Financial Ombudsman Service if you have not had an acknowledgement within 15 business days or a resolution within 35 business days.
    issues: [poor_service, transaction_dispute]
    source: https://www.natwest.com/content/dam/natwest/personal/support-centre/complaints/natwest_making_things_better_nov_2024.pdf
    verified_via: document
    last_verified: 2026-11-19

tips:
  - kind: official
    text: Have your customer number and PIN ready when you call; they are the same details you use to log in to Online Banking.
    issues: [poor_service, fraud, unauthorized_charge]
    source: https://www.natwest.com/support-centre/contact-us.html
    last_verified: 2026-11-19
  - kind: official
    text: If a NatWest complaint update is expected, check junk folders; complaint messages may come by email, SMS or WhatsApp, and some calls show as unknown or withheld.
    issues: [poor_service]
    source: https://www.natwest.com/content/dam/natwest/personal/support-centre/complaints/natwest_making_things_better_nov_2024.pdf
    verified_via: document
    last_verified: 2026-11-19

known_blockers:
  - Disputes, fraud reports and app complaints need the account holder to log in to the app or Online Banking.
  - Phone lines ask security questions (customer number and PIN) to confirm the account holder.
  - NatWest does not publish a Section 75 page among the pages read; the dispute pages mention only the Visa and Mastercard chargeback schemes.
  - Opening hours are not published for the lost and stolen card line or the financial difficulty lines.
