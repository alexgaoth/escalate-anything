official_domains: [natwest.com]
security:
  never_asks:
    - kind: policy
      claim: NatWest says it will never ask for your full PIN, full password or card reader codes by text, email or on the phone.
      source: https://www.natwest.com/fraud-and-security/report-fraud.html
      last_verified: 2026-11-19
    - kind: policy
      claim: NatWest says your bank or the police will never ask you to transfer money to a safe account or ask for your full PIN, password or passcode, and the bank will not phone you and ask you to approve a payment.
      source: https://www.natwest.com/fraud-and-security/fraud-guide/impersonation-scams.html
      verified_via: browser
      last_verified: 2026-11-19
    - kind: policy
      claim: NatWest says it will never ask you to generate a Get Cash code and share it with NatWest for authorisation purposes.
      source: https://www.natwest.com/fraud-and-security/fraud-guide/impersonation-scams.html
      verified_via: browser
      last_verified: 2026-11-19
    - kind: policy
      claim: NatWest says your bank, retailers, the police and fraud investigation teams will never ask you to hand over your card or PIN or buy items for collection; if someone does, it is a scam.
      source: https://www.natwest.com/fraud-and-security/fraud-guide/impersonation-scams.html
      verified_via: browser
      last_verified: 2026-11-19
  known_scams:
    - kind: policy
      claim: NatWest warns of fake messages or calls supposedly from NatWest that say a payment is on hold or ask you to verify a transaction.
      source: https://www.natwest.com/fraud-and-security/fraud-guide/impersonation-scams.html
      verified_via: browser
      last_verified: 2026-11-19
    - kind: policy
      claim: Scammers may pretend you are owed a refund to get your one-time passcodes, or ask you to approve a payment in the mobile app that you did not make.
      source: https://www.natwest.com/fraud-and-security/fraud-guide/impersonation-scams.html
      verified_via: browser
      last_verified: 2026-11-19
    - kind: policy
      claim: NatWest says scammers are copying NatWest emails about direct debits; do not click links or call numbers in them.
      source: https://www.natwest.com/fraud-and-security/fraud-guide/latest-scams.html
      last_verified: 2026-11-19
    - kind: policy
      claim: NatWest reports that scammers are sending couriers to collect cash, bank cards and high-value items; no bank, police officer or government department will send someone to collect your cash.
      source: https://www.natwest.com/fraud-and-security/fraud-guide/latest-scams.html
      last_verified: 2026-11-19
  report_phishing:
    - id: phishing-email
      type: email
      label: Forward suspicious emails to NatWest
      value: phishing@natwest.com
      purposes: [fraud]
      notes: NatWest says this is an automated mailbox; do not send other queries or personal information, including bank details.
      source: https://www.natwest.com/fraud-and-security/report-fraud.html
      last_verified: 2026-11-19
    - id: scam-text-88355
      type: sms
      label: Forward suspicious texts that refer to NatWest to 88355
      value: "88355"
      purposes: [fraud]
      notes: NatWest says 88355 is not a premium rate number; standard network rates apply. It is an automated service.
      source: https://www.natwest.com/fraud-and-security/report-fraud.html
      last_verified: 2026-11-19
regulators: [uk-fos, uk-fca]
notes: >-
  National Westminster Bank Plc (registered in England and Wales No. 929027; registered office 250 Bishopsgate, London
  EC2M 4AA; Financial Services Register number 121878). NatWest Group also owns Royal Bank of Scotland and Ulster Bank;
  those brands are not covered by this file. Domestic numbers: personal banking and fraud 03457 888 444 (also written
  0345 788 8444), lost or stolen cards 0370 600 0459, credit cards 0370 333 9091, credit card fraud 0800 161 5153. For
  most personal lines the overseas number is the same 0345 number in international format (+44 3457 888 444). The current
  account terms (October 2026) list some different numbers (for example fraud and complaints lines); this file uses the
  website contact pages. Business customers use separate pages (natwest.com/business).

