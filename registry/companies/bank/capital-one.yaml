  - id: dispute-online
    type: portal
    label: Dispute a credit card charge online or in the app
    value: https://www.capitalone.com/help-center/fraud-disputes/dispute-credit-charge/
    purposes: [transaction_dispute, unauthorized_charge, billing_error]
    access: login
    notes: Sign in, select the transaction, choose to report a problem and answer the questions. The page also has a printable dispute form.
