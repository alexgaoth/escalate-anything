id: capital-one
name: Capital One
aliases: [capital one bank, capitalone, capital one 360, capital one na]
sector: bank
parent: Capital One Financial Corporation
website: https://www.capitalone.com
regulators: [cfpb, occ]
notes: >-
  Capital One, N.A. is a national bank (OCC). Capital One completed its acquisition of Discover in May 2025;
  Discover Bank merged into Capital One, N.A. Discover card accounts keep their own service channels
  (see the discover file) and are moving to Capital One through 2026 and early 2027.

channels:
