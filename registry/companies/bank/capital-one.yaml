    value: +1-800-227-4825
    purposes: [transaction_dispute, unauthorized_charge, fraud, billing_error, fee_reversal]
    access: human_only
    source: https://www.capitalone.com/help-center/contact-us/
    last_verified: 2026-10-12
  - id: card-international-collect
    type: phone
    label: Credit card, calling collect from outside the U.S.
    value: +1-804-934-2001
    purposes: [unauthorized_charge, fraud]
    access: human_only
    source: https://www.capitalone.com/help-center/contact-us/
    last_verified: 2026-10-12
  - id: online-support-phone
    type: phone
    label: Credit card online account support
    value: +1-866-750-0873
    purposes: [account_access]
    source: https://www.capitalone.com/help-center/contact-us/
    last_verified: 2026-10-12
  - id: general-phone
    type: phone
    label: General help, not sure where to start (includes bank accounts)
    value: +1-877-383-4802
    purposes: [fee_reversal, frozen_funds, fraud]
    access: human_only
    source: https://www.capitalone.com/help-center/contact-us/
    last_verified: 2026-10-12
  - id: feedback-phone
    type: phone
    label: Feedback and complaints (includes "Discover, by Capital One" card accounts)
    value: +1-844-348-8660
    purposes: [poor_service, fee_reversal, frozen_funds, billing_error]
    access: human_only
    source: https://www.capitalone.com/help-center/contact-us/feedback/
