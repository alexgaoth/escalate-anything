  - {rung: state_agency, agency_kind: financial_regulator}

playbooks:
  - issue: fraud
    summary: Call the fraud line, then return the Fraud Investigation Form Synchrony mails you.
    evidence: [list of transactions you did and did not make (merchant, date, amount), police report, FTC identity theft report]
    steps:
      - do: Call Synchrony to report the fraud. A team member helps gather information to open a claim.
        channel: fraud-report-phone
      - do: List which transactions you made and which you did not, with merchant name, date and amount.
      - do: Watch for the Fraud Investigation Form (about two weeks). Mark each transaction, sign it and return it as its instructions say.
      - do: For questions on an open claim, call the existing fraud case line.
        channel: fraud-case-phone
      - do: Place a fraud alert with the credit bureaus, file a police report, and report identity theft to the FTC. Complain to the CFPB if Synchrony does not act.
        regulator: cfpb
    facts:
      - kind: process
        claim: Synchrony mails a Fraud Investigation Form, usually within about two weeks; failure to return it may affect your claim.
        issues: [fraud, unauthorized_charge]
        source: https://www.synchrony.com/legal/fraud-protection
        last_verified: 2026-10-12
      - kind: process
        claim: Fraud claims typically take about 60 days, and up to 90 days in some cases. A temporary credit is applied to the account pending the outcome.
        issues: [fraud, unauthorized_charge]
        source: https://www.synchrony.com/legal/fraud-protection
        last_verified: 2026-10-12
      - kind: policy
        claim: You are still responsible for payment on any non-fraudulent transactions you made.
        issues: [fraud, unauthorized_charge]
        source: https://www.synchrony.com/legal/fraud-protection
        last_verified: 2026-10-12

  - issue: unauthorized_charge
    summary: Report it as fraud by phone and follow the Fraud Investigation Form process.
    evidence: [statement with the charge, date you noticed it, card status]
    steps:
      - do: Call the fraud line.
        channel: fraud-report-phone
      - do: Return the signed Fraud Investigation Form when it arrives.
      - do: If Synchrony does not resolve it, complain to the CFPB.
        regulator: cfpb

  - issue: transaction_dispute
    summary: Contact the merchant, then dispute through the card's service number or a secure message in the online account.
    evidence: [statement showing the charge, receipt, record of contact with the merchant]
    steps:
      - do: Try the merchant first and keep proof.
      - do: Call the number on the back of the card, or sign in and send a secure message.
        channel: general-phone
      - do: For a billing error, also write to the billing rights address on your statement within 60 days.
      - do: If Synchrony does not resolve it, complain to the CFPB.
        regulator: cfpb

tips:
  - kind: official
    text: Synchrony says it will never email you with a request for information.
    issues: [fraud]
    source: https://www.synchrony.com/legal/fraud-protection
    last_verified: 2026-10-12

known_blockers:
  - Most store cards have their own service number; use the one on the back of the card.
  - Synchrony's contact pages list no dispute page, complaint form or complaint mailing address; disputes go by phone or secure message after sign-in.
