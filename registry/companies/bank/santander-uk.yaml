id: santander-uk
name: Santander UK
aliases: [santander uk plc, santander uk bank, santander united kingdom]
sector: bank
countries: [gb]
parent: Banco Santander, S.A.
website: https://www.santander.co.uk
account_url: https://retail.santander.co.uk/olb/app/logon/access/
official_domains: [santander.co.uk]
security:
  never_asks:
    - kind: policy
      claim: Santander says no one from Santander, not even its fraud team, will ask you for your PIN or One Time Passcode (OTP). If someone asks for this on the phone, it is fraud; hang up and call Santander.
      source: https://www.santander.co.uk/personal/support/fraud-and-security/how-to-report-fraud
      last_verified: 2026-11-19
    - kind: policy
      claim: Santander says it will never ask for your password, PIN or OTP, never ask you to move money to a 'safe account', and never contact you out of the blue asking for your security details. To check a call is genuine, call 159 or use the number on the back of your card or in the app.
      source: https://www.santander.co.uk/personal/TSB-acquisition
      last_verified: 2026-11-19
    - kind: policy
      claim: Santander says it will never send you a link to log in to Online or Mobile Banking. Its genuine emails address you personally and include the last 4 digits of your account or card number, or the last 3 characters of your postcode.
      source: https://www.santander.co.uk/personal/support/fraud-and-security/fraud-updates
      last_verified: 2026-11-19
    - kind: policy
      claim: When Santander texts you to check a payment, it only asks you to reply Y or N and will not ask you to reply with anything else.
      source: https://www.santander.co.uk/personal/support/fraud-and-security/our-approach-to-fraud-prevention
      last_verified: 2026-11-19
  known_scams:
    - kind: policy
      claim: Impersonation (safe account) scam. A caller on a spoofed, trusted-looking Santander number says they are from the fraud department, says your account is at risk and tells you to move your money to a new account. They coach you on what to select online or what to say in branch, so the money goes to the criminal.
      source: https://www.santander.co.uk/personal/support/fraud-and-security/spotting-fraud-or-scams
      last_verified: 2026-11-19
    - kind: policy
      claim: Phishing emails ask you to update your contact details through a link to a fake Santander website. The criminal captures your Personal ID and security number, logs on, changes your details, and an OTP is sent to you to authorise the change.
      source: https://www.santander.co.uk/personal/support/fraud-and-security/fraud-updates
      last_verified: 2026-11-19
    - kind: policy
      claim: Santander warns that criminals take advantage of the TSB acquisition by pretending to be Santander or TSB.
      source: https://www.santander.co.uk/personal/TSB-acquisition
      last_verified: 2026-11-19
    - kind: policy
      claim: Fake texts can appear in the same thread as earlier genuine Santander messages, such as previous OTPs. Any text with a link that asks you to update your banking details or log on is fake.
      source: https://www.santander.co.uk/personal/support/fraud-and-security/how-to-report-fraud
      last_verified: 2026-11-19
    - kind: policy
      claim: Remote access scams. Criminals ask you to download apps such as AnyDesk or TeamViewer, or click a link, so they can control your device and see your banking.
      source: https://www.santander.co.uk/personal/support/fraud-and-security/spotting-fraud-or-scams
      last_verified: 2026-11-19
    - kind: policy
      claim: Digital wallet fraud. A fake shop advert on social media collects your card details and an OTP, which the criminal uses to add your card to Apple Pay or Google Pay.
      source: https://www.santander.co.uk/personal/support/fraud-and-security/spotting-fraud-or-scams
      last_verified: 2026-11-19
  report_phishing:
    - id: phishing-email
      type: email
      label: Forward suspicious emails that look like they are from Santander
      value: phishing@santander.co.uk
      purposes: [fraud]
      source: https://www.santander.co.uk/personal/support/fraud-and-security/how-to-report-fraud
      last_verified: 2026-11-19
    - id: smishing-email
      type: email
      label: Report suspicious text messages that appear to be from Santander
      value: smishing@santander.co.uk
      purposes: [fraud]
      source: https://www.santander.co.uk/personal/support/fraud-and-security/how-to-report-fraud
      last_verified: 2026-11-19
    - id: spam-text-7726
      type: sms
      label: Forward suspicious text messages to your mobile network (7726)
      value: '7726'
      purposes: [fraud]
      source: https://www.santander.co.uk/personal/support/fraud-and-security
      last_verified: 2026-11-19
regulators: [uk-fos, uk-fca]
notes: >-
  Santander UK plc (registered number 2294747, FCA register number 106054) is authorised by the PRA and regulated by the
  FCA and the PRA. It is a different company from Santander Bank, N.A. in the US (see santander-bank). cahoot is a trading
  name of Santander UK plc. TSB joined the Santander group on 30 April 2026. TSB customers still bank with TSB for now;
  Santander proposes to transfer TSB's banking business to Santander UK on 22 March 2027 if the High Court approves it
  (hearing expected 15 February 2027). Santander says nothing changes for Santander customers. Domestic numbers: 0330 9 123 123
  (main), 0800 313 4321 (freephone), 0800 171 2171 (complaints).

channels:
  - id: main-phone
    type: phone
    label: Telephone Banking (main number for personal accounts and credit cards)
    value: +44-330-912-3123
    purposes: [fraud, unauthorized_charge, transaction_dispute, frozen_funds, account_access, poor_service]
    hours: "7 days a week, 8am to 6pm for most topics; 24 hours a day for fraud, lost or stolen cards and unrecognised transactions; Monday to Friday 8am to 8pm and Saturday to Sunday 8am to 6pm for account blocks"
    access: human_only
    notes: Written 0330 9 123 123. Santander says to call from your registered number. Hours differ by topic in the contact-us tool; they were read from its pop-up in a browser. Also the number for Section 75 claims.
    verified_via: browser
    source: https://www.santander.co.uk/personal/support/contact-us/cards-pins/debit-card/disputing-a-card-payment
    last_verified: 2026-11-19
  - id: fraud-freephone
    type: phone
    label: Fraud, scams and lost or stolen cards (freephone)
    value: +44-800-313-4321
    purposes: [fraud, unauthorized_charge, frozen_funds]
    hours: 24 hours a day, 7 days a week
    access: human_only
    notes: Written 0800 313 4321. Santander gives it as an alternative to 0330 9 123 123 for fraud, scams and suspicious calls; its fraud team is available 24 hours a day.
    source: https://www.santander.co.uk/personal/support/fraud-and-security/how-to-report-fraud
    last_verified: 2026-11-19
  - id: credit-card-abroad
    type: phone
    label: Fraud and lost or stolen credit cards, calling from outside the UK
    value: +44-151-264-8725
    purposes: [fraud, unauthorized_charge]
    access: human_only
    notes: Santander writes it as +44 1512 648 725. The how-to-report-fraud page gives it for fraud from abroad; the lost or stolen cards page gives it for credit cards from abroad.
    source: https://www.santander.co.uk/personal/support/fraud-and-security/how-to-report-fraud
    last_verified: 2026-11-19
  - id: debit-card-abroad
    type: phone
    label: Lost or stolen debit card, calling from outside the UK
    value: +44-1908-237-963
    purposes: [fraud, unauthorized_charge]
    access: human_only
    notes: Santander writes it as +44 1908 237 963. Santander does not publish a general from-abroad number for other queries on the pages read.
    source: https://www.santander.co.uk/personal/support/fraud-and-security/lost-or-stolen-cards
    last_verified: 2026-11-19
  - id: mobile-app
    type: app
    label: Santander Mobile Banking app (freeze or report a card, report fraud, raise and track card disputes)
    value: "Mobile Banking app > tap the transaction > Help with this transaction (cards: More options > Manage cards > Report card)"
    purposes: [fraud, unauthorized_charge, transaction_dispute]
    access: login
    notes: Santander says the app is the quickest way to report card fraud and to raise a dispute for goods not received or missing ATM cash. You can track a dispute in the app. Cards can be frozen and unfrozen in the app or in Online Banking.
    source: https://www.santander.co.uk/personal/support/fraud-and-security/how-to-report-fraud
    last_verified: 2026-11-19
  - id: chat
    type: chat
    label: Chat with Sandi, the digital assistant, in Mobile or Online Banking (hands over to a person)
    value: https://retail.santander.co.uk/olb/app/logon/access/
    purposes: [fraud, unauthorized_charge, transaction_dispute, poor_service, account_access]
    hours: 24/7 (a person joins when one is available)
    access: login
    notes: Log on and use 'Chat with us'. If Sandi cannot answer, you are put in touch with a real person once someone becomes available.
    source: https://www.santander.co.uk/personal/support/fraud-and-security/lost-or-stolen-cards
    last_verified: 2026-11-19
  - id: complaints-phone
    type: phone
    label: Complaints line (new and existing complaints)
    value: +44-800-171-2171
    purposes: [poor_service, transaction_dispute, unauthorized_charge, fraud, frozen_funds]
    hours: "Current accounts, savings and credit cards: Monday to Friday 8am to 6pm, Saturday 9am to 4pm, Sunday closed. Personal loans and mortgages: Monday to Friday 9am to 6pm, Saturday 9am to 2pm"
    access: human_only
    notes: Written 0800 171 2171, free from UK landlines and mobiles. Choose option 2 for an existing complaint. The contact-us tool pop-up shows Saturday 8am to 4pm, so Saturday opening time is uncertain. Textphone 18001 0800 171 2171 (Relay UK). Santander's calls back to you usually show as an 0800 number, but may appear as unknown or withheld.
    source: https://www.santander.co.uk/personal/support/customer-support/how-to-complain
    last_verified: 2026-11-19
  - id: complaints-chat
    type: chat
    label: Complaints by chat in Mobile or Online Banking (type 'speak to complaints')
    value: https://retail.santander.co.uk/olb/app/logon/access/
    purposes: [poor_service, transaction_dispute, unauthorized_charge, frozen_funds]
    access: login
    notes: Log on, use 'Chat with us' and type 'speak to complaints'. For an existing complaint, choose the option to talk about an existing complaint.
    source: https://www.santander.co.uk/personal/support/customer-support/how-to-complain
