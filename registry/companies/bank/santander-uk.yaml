    purposes: [poor_service, transaction_dispute, unauthorized_charge, fraud, frozen_funds]
    notes: Include your name and address, account details, what went wrong and how it affected you, when it happened, and a contact number with a convenient time to call.
    source: https://www.santander.co.uk/personal/support/customer-support/how-to-complain
    last_verified: 2026-11-19
  - id: branch
    type: in_person
    label: Santander branch (complaints, lost card cash access)
