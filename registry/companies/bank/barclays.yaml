id: barclays
name: Barclays
aliases: [barclays bank, barclays bank uk plc, barclays uk, barclays bank uk, barclaycard, barclaycard uk, amazon barclaycard]
sector: bank
countries: [gb]
parent: Barclays PLC
website: https://www.barclays.co.uk
official_domains: [barclays.co.uk, barclaycard.co.uk, barclays.com]
security:
  never_asks:
    - kind: policy
      claim: Barclays says it will never tell you to transfer money out of your account to keep it safe from fraud, and will never say your money isn't safe or your account is at risk.
      source: https://www.barclays.co.uk/fraud-and-scams/
      last_verified: 2026-11-19
    - kind: policy
      claim: Barclays says it will never ask for your PIN, PINsentry code, activation code, QR activation code or online banking passcodes, and will never ask for remote access to your device.
      source: https://www.barclays.co.uk/fraud-and-scams/
      last_verified: 2026-11-19
    - kind: policy
      claim: Barclays says it will never text you a link to make a payment, send a courier to your house to pick something up, ask you to help with an internal investigation, or tell you to lie to bank staff about a payment or withdrawal.
      source: https://www.barclays.co.uk/fraud-and-scams/
      last_verified: 2026-11-19
    - kind: policy
      claim: Barclays says that if it calls you it will never use a one-time passcode to confirm your identity, and it will never call and ask you to enter *21* and a long number (call forwarding).
      source: https://www.barclays.co.uk/fraud-and-scams/latest-scams/
      last_verified: 2026-11-19
    - kind: policy
      claim: Barclaycard says it will never ask for your online login details, PIN or full passcodes.
      source: https://www.barclaycard.co.uk/personal/customer/report-fraud
      last_verified: 2026-11-19
  known_scams:
    - kind: policy
      claim: Safe account scam. Criminals pose as your bank, the police or another trusted organisation, say your money is at risk and tell you to move it to a new account.
      source: https://www.barclays.co.uk/fraud-and-scams/impersonation-scams/
      last_verified: 2026-11-19
    - kind: policy
      claim: Scammers can fake Barclays' phone number and can keep your line open after you hang up. Barclays says to end an unexpected call, never call back the number that called you, and call from another phone using the number on your card, the Barclays app or 159.
      source: https://www.barclays.co.uk/fraud-and-scams/phone-number-checker/
      last_verified: 2026-11-19
    - kind: policy
      claim: Callers pretending to be the bank say your account is under threat and ask you to dial a code that sets up call forwarding, or ask for a one-time passcode.
      source: https://www.barclays.co.uk/fraud-and-scams/latest-scams/
      last_verified: 2026-11-19
    - kind: policy
      claim: Screen-sharing fraud. Criminals pose as your bank or an investment company, offer to help set up a new payee or account, and get you to install software that lets them control your computer.
      source: https://www.barclays.co.uk/fraud-and-scams/latest-scams/
      last_verified: 2026-11-19
    - kind: policy
      claim: Fake job offers collect personal details and start loan applications in your name, sometimes claiming Barclays is an identity verification provider. Barclays says it is not one.
      source: https://www.barclays.co.uk/fraud-and-scams/latest-scams/
      last_verified: 2026-11-19
  report_phishing:
    - id: phishing-email
      type: email
      label: Forward suspicious emails, texts or QR codes that claim to be from Barclays
      value: internetsecurity@barclays.com
      purposes: [fraud]
      notes: Barclays says to forward the message with any attachments.
      source: https://www.barclays.co.uk/fraud-and-scams/reporting-scams-and-reporting-fraud/
      last_verified: 2026-11-19
    - id: spam-text-7726
      type: sms
      label: Forward suspicious texts to 7726 (free)
      value: "7726"
      purposes: [fraud]
      source: https://www.barclays.co.uk/fraud-and-scams/
      last_verified: 2026-11-19
    - id: ncsc-phishing-email
      type: email
      label: Forward phishing emails to the National Cyber Security Centre
      value: report@phishing.gov.uk
      purposes: [fraud]
      notes: Government reporting address named on the Barclays fraud page. It does not reach Barclays.
      source: https://www.barclays.co.uk/fraud-and-scams/
      last_verified: 2026-11-19
regulators: [uk-fos, uk-fca]
notes: >-
  Barclays Bank UK PLC is the UK retail bank (registered office 1 Churchill Place, London E14 5HP).
  Barclaycard is Barclays' credit card brand. It has its own website (barclaycard.co.uk), phone lines,
  app and complaints address; those channels are prefixed "barclaycard-" in this file. Barclays debit
  cards and current accounts use the barclays.co.uk channels. Phone numbers starting 0800 are free from a
  UK landline or personal mobile; 03 numbers cost the same as 01 or 02 numbers.

