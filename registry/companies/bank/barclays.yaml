escalation:
  - {rung: frontline, channel: telephone-banking, note: "Or message in the Barclays app. Barclaycard customers use barclaycard-phone or the Barclaycard app."}
  - {rung: written_complaint, channel: complaints-post, note: "Or call the complaints line (complaints-phone). Barclaycard complaints go to barclaycard-complaints-post or 0333 200 9090."}
  - {rung: regulator, regulator: uk-fos, note: "After Barclays' final response, or if it has not sent one within 8 weeks (15 days, at most 35, for payment service complaints). Contact the Financial Ombudsman Service within 6 months of the final response letter."}

playbooks:
  - issue: unauthorized_charge
    summary: Freeze or report the card at once, then report the payment by phone or in the app and ask for a refund. You have up to 13 months by law.
    evidence: [statement or app screenshot of the payment, date you noticed it, whether the card was lost, stolen or still in your hand]
    steps:
      - do: Check the payment is not one you know about (a different trading name, another account holder, a subscription after a free trial, or a pending payment).
      - do: Freeze or report the debit card in the app, or call Telephone Banking (24/7 for lost or stolen cards).
        channel: app-report-lost-stolen
      - do: Report the unauthorised payment to the fraud line (24/7) and ask Barclays to refund it.
        channel: fraud-phone
      - do: For a Barclaycard credit card, call the Barclaycard fraud line (24/7).
        channel: barclaycard-fraud-phone
      - do: If Barclays refuses the refund, complain in writing and ask for a final response.
        channel: complaints-post
      - do: If you are unhappy with the final response, or have none after 8 weeks, refer the complaint to the Financial Ombudsman Service within 6 months.
        regulator: uk-fos
    facts:
      - kind: deadline
        claim: Barclays' personal terms say you must tell Barclays as soon as possible about an unauthorised payment, and by law you have a maximum of 13 months to tell it.
        issues: [unauthorized_charge, fraud]
        verified_via: document
        source: https://www.barclays.co.uk/content/dam/documents/personal/site-hygiene/9910542b_RCA_04.25%20_hi_res.pdf
        last_verified: 2026-11-19
      - kind: policy
        claim: Unless Barclays has reasonable grounds to think you are not entitled to a refund, it will put the account back as if the unauthorised payment had not happened, including refunding charges and interest you paid and paying interest you missed.
        issues: [unauthorized_charge, fraud]
        verified_via: document
        source: https://www.barclays.co.uk/content/dam/documents/personal/site-hygiene/9910542b_RCA_04.25%20_hi_res.pdf
        last_verified: 2026-11-19
      - kind: limit
        claim: Barclays' Online and Mobile Banking Guarantee says it won't refund you if it believes you acted fraudulently, or if you intentionally or with gross negligence failed to keep your security details safe (for example, leaving your PIN written down for someone to see).
        issues: [unauthorized_charge, fraud]
        source: https://www.barclays.co.uk/ways-to-bank/online-banking/online-mobile-banking-guarantee/
        last_verified: 2026-11-19
      - kind: policy
        claim: Barclays says it legally has to refund an unauthorised payment reported within 13 months of it taking place, but may still consider a refund if you tell it later. APP scams are not covered by this guarantee.
        issues: [unauthorized_charge]
        source: https://www.barclays.co.uk/ways-to-bank/online-banking/online-mobile-banking-guarantee/
        last_verified: 2026-11-19
      - kind: policy
        claim: Barclaycard says it will investigate and refund you if it finds fraud on your account.
        issues: [unauthorized_charge, fraud]
        source: https://www.barclaycard.co.uk/personal/customer/report-fraud
        last_verified: 2026-11-19

  - issue: fraud
    summary: Call Barclays at once on a number you know is genuine, stop further payments, and make an APP scam claim within 13 months if you were tricked into sending a bank transfer.
    evidence: [payment details (date, amount, payee name, sort code and account number), messages, emails or call logs from the scammer, police or Report Fraud reference number]
    steps:
      - do: End any suspicious call. Call back from a different phone using the number on your card, the app or 159.
        channel: stop-scams-159
      - do: For debit card fraud or any other fraud, call the fraud line (24/7). From abroad use the abroad number.
        channel: fraud-phone
      - do: If you were tricked into sending a bank transfer (an APP scam), call the scam line to report it and start a claim.
        channel: scam-payments-phone
      - do: For a Barclaycard credit card, call the Barclaycard fraud line (24/7).
        channel: barclaycard-fraud-phone
      - do: After contacting Barclays, report the crime to Report Fraud on 0300 123 2040 (Police Scotland on 101 in Scotland).
      - do: Forward phishing emails, texts or QR codes to Barclays.
        channel: phishing-email
      - do: If the claim is refused or you are unhappy with the result, complain, then refer to the Financial Ombudsman Service.
        regulator: uk-fos
    facts:
      - kind: deadline
        claim: Barclays says you need to make an APP scam claim within 13 months of your last payment to the scammer.
        issues: [fraud]
        source: https://www.barclays.co.uk/fraud-and-scams/app-scam-claims/
        last_verified: 2026-11-19
      - kind: limit
        claim: Barclays says the most it can cover under the APP scam rules will usually be £85,000, assessed case by case, and it might deduct a £100 excess.
        issues: [fraud]
        source: https://www.barclays.co.uk/fraud-and-scams/app-scam-claims/
        last_verified: 2026-11-19
      - kind: process
        claim: Barclays says it will contact you within 5 working days with a decision or update on an APP scam claim, and if the investigation is still open it aims to decide within 35 working days.
        issues: [fraud]
        source: https://www.barclays.co.uk/fraud-and-scams/app-scam-claims/
        last_verified: 2026-11-19
      - kind: limit
        claim: Barclays' APP scam claim page covers personal accounts, microenterprises and small charities. It does not cover payments made before 7 October 2024, or payments by card, cash, cheque or international transfer.
        issues: [fraud]
        source: https://www.barclays.co.uk/fraud-and-scams/app-scam-claims/
        last_verified: 2026-11-19
      - kind: limit
        claim: Barclays lists reasons it may reject an APP scam claim, including that you didn't take reasonable steps to protect your money, the payment went to your own account, or the receiving account is with a credit union, municipal bank or national savings bank.
        issues: [fraud]
        source: https://www.barclays.co.uk/fraud-and-scams/app-scam-claims/
        last_verified: 2026-11-19
      - kind: policy
        claim: Barclays' fraud reporting page still says Barclays is signed up to the voluntary Contingent Reimbursement Model code (effective 28 May 2019) and reviews each case individually.
        issues: [fraud]
        source: https://www.barclays.co.uk/fraud-and-scams/reporting-scams-and-reporting-fraud/
        last_verified: 2026-11-19

  - issue: transaction_dispute
    summary: Speak to the retailer first. Then dispute a debit card payment in the app (chargeback, often within 120 days), or make a Barclaycard Section 75 or chargeback claim online.
    evidence: [proof of purchase, the seller's terms and cancellation policy, evidence of the fault or non-delivery, your messages with the seller, the item itself if faulty]
    steps:
      - do: Contact the retailer or company first and keep a record of what they said.
      - do: Wait until the payment is no longer pending. Barclays cannot help with a pending payment.
      - do: For a Barclays debit card, open the payment in the app, choose Help with this transaction, Report problem, then Dispute transaction.
        channel: app-dispute-transaction
      - do: Or call the disputes line (24/7).
        channel: fraud-phone
      - do: For a Barclaycard credit card, use the online claim form (the fastest route; upload evidence) or the Barclaycard app.
        channel: barclaycard-dispute-form
      - do: Or call Barclaycard about the claim.
        channel: barclaycard-dispute-phone
      - do: If the claim is refused or badly handled, complain, then refer to the Financial Ombudsman Service.
        regulator: uk-fos
    facts:
      - kind: deadline
        claim: Barclays says you can only dispute some debit card payments within 120 days, starting from the date you paid, and to contact it as soon as possible.
        issues: [transaction_dispute]
        source: https://www.barclays.co.uk/help/report-fraud/
        last_verified: 2026-11-19
      - kind: policy
        claim: Barclays says any help it offers on a debit card dispute is governed by the Visa Europe cardholder chargeback terms and conditions, which do not affect your legal or statutory rights.
        issues: [transaction_dispute]
        source: https://www.barclays.co.uk/help/report-fraud/
        last_verified: 2026-11-19
      - kind: policy
        claim: Barclaycard says a Section 75 claim needs a purchase worth between £100 and £30,000, paid at least in part (a deposit is enough) by the main cardholder with the credit card, for a breach of contract such as faulty, undelivered or misdescribed goods, and under six years old.
        issues: [transaction_dispute]
        source: https://www.barclaycard.co.uk/personal/help-and-support/know-your-rights
        last_verified: 2026-11-19
      - kind: limit
        claim: Barclaycard says Section 75 does not cover debit, charge or prepaid cards, balance transfers or cash withdrawals, and purchases through third parties such as Amazon Marketplace, Klarna or Curve may not be covered.
        issues: [transaction_dispute]
        source: https://www.barclaycard.co.uk/personal/help-and-support/know-your-rights
        last_verified: 2026-11-19
      - kind: deadline
        claim: Barclaycard says chargeback comes from card scheme rules, not law, and most claims have a time limit, the most common being 120 days.
        issues: [transaction_dispute]
        source: https://www.barclaycard.co.uk/personal/help-and-support/know-your-rights
        last_verified: 2026-11-19
      - kind: deadline
        claim: For Pay by Bank app payments, Barclays says to claim within 90 days of the transaction date, or 270 days if you received the purchase after the transaction date.
        issues: [transaction_dispute]
        source: https://www.barclays.co.uk/current-accounts/debit-cards/purchase-support/
        last_verified: 2026-11-19

  - issue: fee_reversal
    summary: Barclays does not charge interest on an unarranged overdraft. If overdraft interest or card charges are a problem because money is tight, call early and ask for help.
    evidence: [statement showing the interest or charge, a summary of your income and outgoings]
    steps:
      - do: Check the charge against Barclays' overdraft terms (no interest if you are overdrawn by £15 or less, no interest on unarranged overdraft).
      - do: If you are struggling, call Telephone Banking or speak to a personal banker in a branch.
        channel: telephone-banking
      - do: For a Barclaycard, call the money worries line as soon as you think you may miss a payment.
        channel: barclaycard-financial-support-phone
      - do: If you think a charge is wrong, complain in writing.
        channel: complaints-post
      - do: If unhappy with the final response, refer to the Financial Ombudsman Service.
        regulator: uk-fos
    facts:
      - kind: fee
        claim: Barclays' overdraft page states an arranged overdraft annual interest rate of 35.0% EAR (variable).
        issues: [fee_reversal]
        source: https://www.barclays.co.uk/current-accounts/bank-account/overdrafts/
        last_verified: 2026-11-19
      - kind: policy
        claim: Barclays says it won't charge interest if you go overdrawn by £15 or less, won't charge interest on amounts that take you into an unarranged overdraft, and will always try to return a payment to help you avoid an unarranged overdraft.
        issues: [fee_reversal]
        source: https://www.barclays.co.uk/current-accounts/bank-account/overdrafts/
        last_verified: 2026-11-19
      - kind: process
        claim: Barclaycard says to call as soon as you think you might be facing financial difficulties, on 0800 056 1411 if you are worried you will miss a payment or 0800 161 5205 if you have missed one.
        issues: [fee_reversal]
        source: https://www.barclaycard.co.uk/personal/customer/money-worries
        last_verified: 2026-11-19

  - issue: frozen_funds
    summary: Ask Barclays why a card or account is blocked and what it needs from you. If Barclays closes the account, ask how to get the balance back.
    evidence: [letters, texts or app messages from Barclays, balance at the time of the block, ID and proof of address, evidence of where disputed money came from]
    steps:
      - do: Call Telephone Banking or message in the app. Ask why the account or card is blocked, what Barclays needs, and when access will return.
        channel: telephone-banking
      - do: Send any documents Barclays asks for. Keep copies.
      - do: If the block continues or the account is closed without a clear reason, make a written complaint.
        channel: complaints-post
      - do: If unhappy with the final response, refer to the Financial Ombudsman Service.
        regulator: uk-fos
    facts:
      - kind: policy
        claim: Barclays' terms say it may stop or suspend a payment tool (such as a card) to protect its security, if it suspects unauthorised or fraudulent use, or if there is a significantly increased risk you can't repay borrowing. It will explain why unless that would break the law, and unblock or replace it when the reason no longer applies.
        issues: [frozen_funds]
        verified_via: document
        source: https://www.barclays.co.uk/content/dam/documents/personal/site-hygiene/9910542b_RCA_04.25%20_hi_res.pdf
        last_verified: 2026-11-19
      - kind: policy
        claim: Barclays' terms say it can close an account by giving at least two months' notice, or immediately or on less notice if it reasonably believes you seriously or persistently broke the terms, gave false information, committed fraud, used the account illegally, or keeping it open could put Barclays in breach of law or regulation.
        issues: [frozen_funds]
        verified_via: document
        source: https://www.barclays.co.uk/content/dam/documents/personal/site-hygiene/9910542b_RCA_04.25%20_hi_res.pdf
        last_verified: 2026-11-19
      - kind: policy
        claim: Barclays' terms say it can close an account or restrict a service if you are not eligible for it, for example if you or a joint holder live outside the UK or you use a personal account for business.
        issues: [frozen_funds]
        verified_via: document
        source: https://www.barclays.co.uk/content/dam/documents/personal/site-hygiene/9910542b_RCA_04.25%20_hi_res.pdf
        last_verified: 2026-11-19

facts:
  - kind: process
    claim: Barclays says it will send a written final response to a complaint within 8 weeks of receiving it; if it needs more time it will write to you within that period.
    source: https://www.barclays.co.uk/complaints/
    last_verified: 2026-11-19
  - kind: process
    claim: For payment service complaints, Barclays says it will send a written final response within 15 days, or if it needs more time, no later than 35 days after receiving the complaint.
    source: https://www.barclays.co.uk/complaints/
    last_verified: 2026-11-19
  - kind: deadline
    claim: Barclays says that if you are unhappy with its final response you can ask the Financial Ombudsman Service to review it, and you must contact them within 6 months of the final response letter.
    source: https://www.barclays.co.uk/complaints/
    last_verified: 2026-11-19
  - kind: process
    claim: Barclaycard says it sends a final response to payment services complaints within 15 working days (up to 35 days in exceptional circumstances), and for other complaints a written update within four weeks, aiming to resolve within eight weeks.
    source: https://www.barclaycard.co.uk/personal/help-and-support/complaints
    last_verified: 2026-11-19

tips:
  - kind: official
    text: Contact the retailer before you dispute a card payment, and gather proof of purchase, the seller's terms and evidence of the fault. Keep a faulty item, as it may need to be examined.
    issues: [transaction_dispute]
    source: https://www.barclaycard.co.uk/personal/help-and-support/know-your-rights
    last_verified: 2026-11-19
  - kind: official
    text: To check a caller is really from Barclays, ask it to send a notification to your Barclays app, which shows the colleague's name.
    issues: [fraud]
    source: https://www.barclays.co.uk/fraud-and-scams/phone-number-checker/
    last_verified: 2026-11-19

known_blockers:
  - App disputes, app messages and the Call Us button need sign-in to the Barclays or Barclaycard app.
  - Fraud, scam and complaint phone lines speak only with the account holder.
  - Barclays and Barclaycard do not list an online complaint form; complaints go by phone, post, branch or app message.
  - Barclays pages give conflicting hours for some lines (for example the APP scam line and the Barclaycard financial support line).
