  - {rung: regulator, regulator: uk-fos, note: "After Lloyds' final response, or after 8 weeks without one. Lloyds says you can refer to the Financial Ombudsman Service within 6 months of the outcome, free of charge."}

playbooks:
  - issue: unauthorized_charge
    summary: Freeze or cancel the card at once, report the payment in the app or by phone, and claim within 13 months.
    evidence: [date and amount of each payment, where the card or device is now, date you noticed, any messages or calls before the payment]
    steps:
      - do: If the card is lost or stolen, report it in the app or call the lost and stolen line (24/7). If it is only misplaced, freeze it instead.
        channel: lost-stolen-card-phone
      - do: For an unrecognised debit card payment, open it in the app, select 'Help with this transaction', 'View your options', then 'Report this transaction'.
        channel: app-transaction-help
      - do: For credit card fraud, call the card fraud line (24/7).
        channel: card-fraud-phone
      - do: If money left the account through Internet Banking, or someone used your online banking, call the Internet Banking fraud line (24/7).
        channel: online-banking-fraud-phone
      - do: If Lloyds refuses the refund, make a complaint.
        channel: complaints-online
      - do: If you are still unhappy after the final response or after 8 weeks, refer the complaint to the Financial Ombudsman Service.
        regulator: uk-fos
    facts:
      - kind: deadline
        claim: To get a refund you must tell Lloyds about an unauthorised payment within 13 months of it leaving your account. The 13-month limit does not apply if the payment was taken from your overdraft.
        issues: [unauthorized_charge, fraud]
        source: https://www.lloydsbank.com/assets/media/pdfs/current-accounts/personal_banking_terms_and_conditions.pdf
        verified_via: document
        last_verified: 2026-11-19
      - kind: process
        claim: If Lloyds refunds an unauthorised payment, you receive it by the end of the working day after you told Lloyds. It may take longer if Lloyds reasonably suspects fraud or the payment came from your overdraft.
        issues: [unauthorized_charge, fraud]
        source: https://www.lloydsbank.com/assets/media/pdfs/current-accounts/personal_banking_terms_and_conditions.pdf
        verified_via: document
        last_verified: 2026-11-19
      - kind: limit
        claim: Lloyds will not refund you if you acted fraudulently, and usually will not refund payments made before you told it about a security concern if you were grossly negligent with your card, device or security details (for example, writing your PIN down and keeping it with the card).
        issues: [unauthorized_charge, fraud]
        source: https://www.lloydsbank.com/assets/media/pdfs/current-accounts/personal_banking_terms_and_conditions.pdf
        verified_via: document
        last_verified: 2026-11-19

  - issue: fraud
    summary: Report at once on the right fraud line; for a payment you were tricked into making (APP scam), claim within 13 months under the PSR reimbursement rules.
    evidence: [payment dates, amounts and payee details, messages, emails or call details from the scammer, Report Fraud or police reference]
    steps:
      - do: If you think you sent money to a fraudster, tell Lloyds right away. Call the Internet Banking fraud line (24/7).
        channel: online-banking-fraud-phone
      - do: For fraud on a card, report a debit card payment in the app or call the card fraud line (24/7).
        channel: card-fraud-phone
      - do: If a caller says they are from Lloyds, hang up and dial 159 from a phone you trust.
        channel: stop-scams-159
      - do: Forward scam emails to Lloyds and scam texts to 7726, then delete them.
        channel: phishing-email
      - do: Report the scam to Report Fraud and the police, or let Lloyds share information with the police if necessary.
      - do: If Lloyds refuses or reduces the refund, make a complaint, then refer it to the Financial Ombudsman Service.
        regulator: uk-fos
    facts:
      - kind: deadline
        claim: For APP scam payments made on or after 7 October 2024, you must claim within 13 months of the payment, or of the last payment if you sent more than one.
        issues: [fraud]
        source: https://www.lloydsbank.com/help-guidance/protecting-yourself-from-fraud/authorised-push-payment-scams/app-refunds.html
        verified_via: browser
        last_verified: 2026-11-19
      - kind: limit
        claim: Lloyds will refund APP scam claims up to a maximum of £85,000 and applies a fixed £100 excess per claim. It does not apply the excess if something prevented you from protecting yourself while making the payment.
        issues: [fraud]
        source: https://www.lloydsbank.com/help-guidance/protecting-yourself-from-fraud/authorised-push-payment-scams/app-refunds.html
        verified_via: browser
        last_verified: 2026-11-19
      - kind: process
        claim: Lloyds says it will investigate and refund within five working days, or up to 35 days if it needs more time. It will not refund if you give false details or pretend to be someone else.
        issues: [fraud]
        source: https://www.lloydsbank.com/help-guidance/protecting-yourself-from-fraud/authorised-push-payment-scams/app-refunds.html
        verified_via: browser
        last_verified: 2026-11-19
      - kind: policy
        claim: The APP refund rules cover only payments to another bank account by Faster Payment or CHAPS sent on or after 7 October 2024. Earlier Faster Payments or CHAPS payments may be covered by the CRM code, which Lloyds reviews case by case.
        issues: [fraud]
        source: https://www.lloydsbank.com/help-guidance/protecting-yourself-from-fraud/authorised-push-payment-scams/app-refunds.html
        verified_via: browser
        last_verified: 2026-11-19
      - kind: policy
        claim: Lloyds says it might not refund your money if you ignore its warnings when making a payment.
        issues: [fraud]
        source: https://www.lloydsbank.com/help-guidance/protecting-yourself-from-fraud/authorised-push-payment-scams.html
        verified_via: browser
        last_verified: 2026-11-19

  - issue: transaction_dispute
    summary: Contact the retailer first, then dispute the posted payment in the app; for credit card purchases of £100 to £30,000, call to make a Section 75 claim.
    evidence: [receipt, invoice or contract and terms, record of contact with the retailer, written summary of the case, payments made to the retailer by other methods, photos or warranties if relevant]
    steps:
      - do: Contact the retailer or supplier first. Lloyds says this is usually the fastest way to resolve it.
      - do: Wait until the payment is no longer pending. Pending transactions cannot be cancelled or disputed.
      - do: In the app, open the transaction, select 'Help with this transaction' and choose the relevant option.
        channel: app-transaction-help
      - do: If you cannot do it in the app, debit card customers call 0345 300 0000 (7am to 11pm, 7 days).
        channel: main-phone
      - do: Credit card customers call the credit card line. Section 75 claims must be made by phone.
        channel: card-fraud-phone
      - do: If Lloyds rejects the dispute or claim, make a complaint, then refer it to the Financial Ombudsman Service.
        regulator: uk-fos
    facts:
      - kind: process
        claim: If you raise a dispute through Lloyds, it aims to resolve the claim within 5 working days.
        issues: [transaction_dispute]
        source: https://www.lloydsbank.com/help-guidance/everyday-banking/statements/unrecognised-transactions.html
        verified_via: browser
        last_verified: 2026-11-19
      - kind: limit
        claim: Lloyds says Section 75 covers most single-item credit card purchases over £100 and up to £30,000 where there was a breach or misrepresentation of contract, or the company went into administration before delivery, even if only part (such as a deposit) was paid by credit card.
        issues: [transaction_dispute]
        source: https://www.lloydsbank.com/credit-cards/help-and-guidance/section75.html
        verified_via: browser
        last_verified: 2026-11-19
      - kind: limit
        claim: Lloyds says Section 75 does not apply if you change your mind, pay by money transfer or credit card cash, or for items under £100 each, and usually not when the card funded an account with a third-party provider.
        issues: [transaction_dispute]
        source: https://www.lloydsbank.com/credit-cards/help-and-guidance/section75.html
        verified_via: browser
        last_verified: 2026-11-19
      - kind: process
        claim: For a Section 75 claim Lloyds asks for a covering letter on the claim and what you have done with the company, a copy of the invoice, contract and terms, and copies of other payments to the company not on the credit card.
        issues: [transaction_dispute]
        source: https://www.lloydsbank.com/credit-cards/help-and-guidance/section75.html
        verified_via: browser
        last_verified: 2026-11-19
      - kind: deadline
        claim: Lloyds will refund a card payment to a UK or EEA seller where you did not agree an exact amount and more was taken than you reasonably expected, if you ask within 8 weeks of the payment; it refunds within 10 working days of the request or of further information.
        issues: [transaction_dispute, billing_error]
        source: https://www.lloydsbank.com/assets/media/pdfs/current-accounts/personal_banking_terms_and_conditions.pdf
        verified_via: document
