  - issue: fee_reversal
    summary: If overdraft or loan charges are a problem because money is tight, ask for financial support; Lloyds offers repayment plans and a 30-day hold without arranged overdraft interest.
    evidence: [recent statements showing charges or interest, monthly income and spending, account numbers]
    steps:
      - do: In the app search 'Need help with your debt or payments', or in online banking select 'Need help with your debt or payments?' for the account.
        channel: message-us
      - do: If you have already missed a payment, call the money worries line.
        channel: money-worries-missed-payment
      - do: If you are worried about future payments, call the future payments line.
        channel: money-worries-future-payments
      - do: Ask for an overdraft repayment plan or a 30-day hold, and ask whether interest and charges will stop during it.
      - do: If you think a charge was applied unfairly, make a complaint, then refer it to the Financial Ombudsman Service.
        channel: complaints-online
    facts:
      - kind: policy
        claim: Lloyds says that with an overdraft repayment plan you could clear an unarranged overdraft in 2 to 12 months, and it will not charge arranged overdraft interest during the plan. A plan may affect your credit file and future borrowing.
        issues: [fee_reversal]
        source: https://www.lloydsbank.com/help-guidance/support-and-wellbeing/managing-your-money/money-worries/how-we-can-help.html
        verified_via: browser
        last_verified: 2026-11-19
      - kind: policy
        claim: You can ask Lloyds to put a 30-day hold on an overdraft to get independent advice; it can stop collection calls and will not charge arranged overdraft interest during that time.
        issues: [fee_reversal]
        source: https://www.lloydsbank.com/help-guidance/support-and-wellbeing/managing-your-money/money-worries/how-we-can-help.html
        verified_via: browser
        last_verified: 2026-11-19
      - kind: policy
        claim: For loans, Lloyds says a repayment plan could bring the account up to date in 2 to 12 months, and it will not charge fees and interest during that time.
        issues: [fee_reversal]
        source: https://www.lloydsbank.com/help-guidance/support-and-wellbeing/managing-your-money/money-worries/how-we-can-help.html
        verified_via: browser
        last_verified: 2026-11-19

  - issue: frozen_funds
    summary: Lloyds can stop payments or close an account without notice in some cases; ask why and what it needs, then complain in writing.
    evidence: [messages or letters from Lloyds, date the account or card was stopped, balance at that time, proof of identity and of the source of the money]
    steps:
      - do: Message Lloyds or call and ask why payments are stopped, what Lloyds needs from you, and when access will return.
        channel: message-us
      - do: If Lloyds closes the account, ask in writing when and how the balance will be returned.
        channel: complaints-online
      - do: If the problem continues after the final response or 8 weeks, refer it to the Financial Ombudsman Service.
        regulator: uk-fos
    facts:
      - kind: policy
        claim: Lloyds can stop you making payments if it reasonably thinks it is necessary to keep the account secure, because it suspects unauthorised or fraudulent use, or to stop spending on an overdrawn account it thinks you cannot repay. It tells you first and why, unless a legal or security reason prevents it.
        issues: [frozen_funds]
        source: https://www.lloydsbank.com/assets/media/pdfs/current-accounts/personal_banking_terms_and_conditions.pdf
        verified_via: document
        last_verified: 2026-11-19
      - kind: policy
        claim: Lloyds can end the agreement without notice if it reasonably thinks there is or may be illegal or fraudulent activity, improper behaviour, regulator or legal risk, or a serious breach of the agreement. For any other reason it must give at least 2 months' notice.
        issues: [frozen_funds]
        source: https://www.lloydsbank.com/assets/media/pdfs/current-accounts/personal_banking_terms_and_conditions.pdf
        verified_via: document
        last_verified: 2026-11-19
      - kind: deadline
        claim: If Lloyds finds within two months that a payment into your account was made by mistake or fraud, it can remove it or stop you using it, and usually tells you it will return it. If you show within 15 working days that it was not a mistake or fraud, Lloyds will not return it.
        issues: [frozen_funds]
        source: https://www.lloydsbank.com/assets/media/pdfs/current-accounts/personal_banking_terms_and_conditions.pdf
        verified_via: document
        last_verified: 2026-11-19

  - issue: account_access
    summary: For online banking login problems call the online banking helpdesk; if someone else has used your online banking, call the fraud line.
    evidence: [username or User ID, device used, error messages, date the problem started]
    steps:
      - do: Call the online banking helpdesk (8am to 6pm, 7 days).
        channel: online-banking-helpdesk
      - do: If someone knows your password or memorable information, or used your online banking without approval, call the Internet Banking fraud line (24/7).
        channel: online-banking-fraud-phone
      - do: If the problem is not fixed, make a complaint.
        channel: complaints-online

facts:
  - kind: process
    claim: If Lloyds has not resolved a complaint within 5 working days it contacts you with an update or acknowledgement; if it is still investigating at 4 weeks it tells you; it sends a final response within 8 weeks and aims to resolve the complaint well before this.
    issues: [poor_service]
    source: https://www.lloydsbank.com/help-guidance/how-to-complain.html
    verified_via: browser
    last_verified: 2026-11-19
  - kind: deadline
    claim: For complaints about a payment or payment service (such as a Direct Debit or account statement), Lloyds aims to respond within 15 days and sometimes takes up to 35 days.
    issues: [poor_service, transaction_dispute]
    source: https://www.lloydsbank.com/help-guidance/how-to-complain.html
    verified_via: browser
    last_verified: 2026-11-19
  - kind: deadline
    claim: Lloyds says that if you are not happy with the outcome of your complaint you have the right to refer it to the Financial Ombudsman Service within 6 months, free of charge.
    issues: [poor_service]
    source: https://www.lloydsbank.com/help-guidance/how-to-complain.html
    verified_via: browser
    last_verified: 2026-11-19
  - kind: process
    claim: The Personal Banking Terms (4 October 2026) describe three complaint steps - raise it with the person or team, refer it to Customer Services, then contact the Financial Ombudsman Service.
    issues: [poor_service]
    source: https://www.lloydsbank.com/assets/media/pdfs/current-accounts/personal_banking_terms_and_conditions.pdf
