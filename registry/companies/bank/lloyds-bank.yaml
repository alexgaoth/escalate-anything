tips:
  - kind: official
    text: If you have the Lloyds app, call from inside the app (search 'Call us') to skip the security questions.
    issues: [transaction_dispute, unauthorized_charge, poor_service]
    source: https://www.lloydsbank.com/help-guidance/everyday-banking/statements/unrecognised-transactions.html
    verified_via: browser
    last_verified: 2026-11-19
  - kind: official
    text: Before reporting an unrecognised payment, check the date, time and location, ask joint account holders and family, and check for subscriptions, direct debits and different trading names.
    issues: [unauthorized_charge, transaction_dispute]
    source: https://www.lloydsbank.com/help-guidance/everyday-banking/statements/unrecognised-transactions.html
    verified_via: browser
    last_verified: 2026-11-19

known_blockers:
  - Message us, app disputes and app fraud claims need the account holder to log in to the app or online banking.
  - Section 75 claims and credit card fraud must be raised by phone; phone lines verify the account holder.
  - The complaints phone line has no published opening hours.
  - lloydsbank.com serves an error page (Error 1007) to some automated fetches; use a normal browser.
