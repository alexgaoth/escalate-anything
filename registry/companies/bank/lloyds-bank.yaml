id: lloyds-bank
name: Lloyds Bank
aliases: [lloyds, lloyds bank plc, lloyds tsb, club lloyds]
sector: bank
countries: [gb]
parent: Lloyds Banking Group plc
website: https://www.lloydsbank.com
account_url: https://online.lloydsbank.co.uk/personal/logon/login.jsp
official_domains: [lloydsbank.com, lloydsbank.co.uk, lloydsbanking.com, lloydsbank-online.co.uk, lloydsbankinggroup.com]
security:
  never_asks:
    - kind: policy
      claim: Lloyds says it will never ask you to tell it your account details, share your Personal Security Number, tell it your PIN or card expiry date, or move money to another account.
      source: https://www.lloydsbank.com/help-guidance/protecting-yourself-from-fraud/contact-us.html
      verified_via: browser
      last_verified: 2026-11-19
    - kind: policy
      claim: Lloyds says it will never call to tell you to move money to another account. To check that a call is really from Lloyds, hang up and dial 159.
      source: https://www.lloydsbank.com/help-guidance/protecting-yourself-from-fraud/scam-calls.html
      verified_via: browser
      last_verified: 2026-11-19
    - kind: policy
      claim: Lloyds says its emails will never send you to a web page that asks for your logon, personal or banking details, tell you to move money, ask you to make a test payment online, or link directly to the Internet Banking log on page. Genuine emails include your name and the last 4 digits of an account you hold.
      source: https://www.lloydsbank.com/help-guidance/protecting-yourself-from-fraud/scam-messages.html
      verified_via: browser
      last_verified: 2026-11-19
    - kind: policy
      claim: Lloyds says links in its genuine emails always start with email.lloydsbank.com or www.lloydsbank.com.
      source: https://www.lloydsbank.com/help-guidance/protecting-yourself-from-fraud/scam-messages.html
      verified_via: browser
      last_verified: 2026-11-19
    - kind: policy
      claim: Lloyds says only fraudsters would call to ask you for a passcode. If anyone calls to ask for a code that Lloyds sent you, hang up.
      source: https://www.lloydsbank.com/help-guidance/protecting-yourself-from-fraud/scam-calls.html
      verified_via: browser
      last_verified: 2026-11-19
  known_scams:
    - kind: policy
      claim: Scammers call pretending to be the Lloyds fraud team, say there is suspicious activity, tell you the caller ID matches the number on your card, and then tell you to move your money to another account.
      source: https://www.lloydsbank.com/help-guidance/protecting-yourself-from-fraud/scam-calls.html
      verified_via: browser
      last_verified: 2026-11-19
    - kind: policy
      claim: '"Lloyds new look" scam emails claim to be about the bank''s new brand and ask you to follow a link to keep using your account. Lloyds says to delete them without replying or clicking.'
      source: https://www.lloydsbank.com/help-guidance/protecting-yourself-from-fraud/latest-scams.html
      verified_via: browser
      last_verified: 2026-11-19
    - kind: policy
      claim: In the passcode scam, fraudsters pretend to be Lloyds on the phone to trick you into sharing a one-time passcode so they can use your account.
      source: https://www.lloydsbank.com/help-guidance/protecting-yourself-from-fraud/latest-scams.html
      verified_via: browser
      last_verified: 2026-11-19
    - kind: policy
      claim: Fraudsters on WhatsApp pretend to be a family member or friend ("Hi mum", "Hi mate") and ask you to pay money to an account you have never paid before.
      source: https://www.lloydsbank.com/help-guidance/protecting-yourself-from-fraud/latest-scams.html
      verified_via: browser
      last_verified: 2026-11-19
  report_phishing:
    - id: phishing-email
      type: email
      label: Forward suspicious emails that claim to be from Lloyds
      value: emailscams@lloydsbanking.com
      purposes: [fraud]
      notes: Lloyds says to forward the email and then delete it.
      source: https://www.lloydsbank.com/help-guidance/protecting-yourself-from-fraud/scam-messages.html
      verified_via: browser
      last_verified: 2026-11-19
    - id: scam-text-7726
      type: sms
      label: Forward scam texts to 7726 (free UK reporting service)
      value: "7726"
      purposes: [fraud]
      source: https://www.lloydsbank.com/help-guidance/protecting-yourself-from-fraud/scam-messages.html
      verified_via: browser
      last_verified: 2026-11-19
regulators: [uk-fos, uk-fca]
notes: >-
  Lloyds and Lloyds Bank are trading names of Lloyds Bank plc (registered in England and Wales No. 2065; FCA/PRA
  registration number 119278). It is part of Lloyds Banking Group, which also has the Halifax and Bank of Scotland brands;
  those brands are not covered by this file. On 2026-11-19 lloydsbank.com showed the banner "While the Halifax brand is
  changing to Lloyds, you can still count on the same support", and the complaints page says Lloyds current accounts are
  provided by Lloyds Bank plc and Bank of Scotland plc, so check which entity holds the account. Domestic numbers: main line
  0345 300 0000, lost or stolen cards 0800 096 9779, card fraud 0345 606 2172, online banking fraud 0800 917 7017,
  complaints 0800 072 3572. Business customers have a separate complaints page (lloydsbank.com/business/complaints.html).
  lloydsbank.com returned an error page to automated fetches, so all pages were read in a browser.

