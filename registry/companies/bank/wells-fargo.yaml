escalation:
  - {rung: frontline, channel: banking-phone}
  - {rung: written_complaint, channel: banking-mail, note: "For credit card billing errors, write to the billing rights address within 60 days instead. The feedback line also takes complaints."}
  - {rung: executive, channel: corporate-office-mail}
  - {rung: regulator, regulator: cfpb}
  - {rung: state_agency, agency_kind: financial_regulator}
  - {rung: arbitration, note: "Wells Fargo credit card agreements contain an AAA arbitration agreement; either side may use small claims court."}

playbooks:
  - issue: transaction_dispute
    summary: Call the card line or dispute in online banking, and send a written notice to the billing rights address within 60 days.
    evidence: [statement showing the charge, receipt or order, record of contact with the merchant]
    steps:
      - do: Try the merchant first and keep proof.
      - do: Call credit card customer service to open the dispute.
        channel: card-services-phone
      - do: To keep your legal rights for a credit card, write to the billing rights address within 60 days after the error appeared on your statement.
        channel: billing-rights-mail
      - do: Check the status of a credit card claim.
        channel: credit-claim-status-phone
      - do: If Wells Fargo does not resolve it, complain to the CFPB.
        regulator: cfpb
    facts:
      - kind: deadline
        claim: The Wells Fargo credit card agreement's billing rights notice says to write within 60 days after the error appeared on your statement.
        issues: [transaction_dispute, billing_error]
        source: https://www.wellsfargo.com/credit-cards/documents/active-cash-agreement
        last_verified: 2026-10-12

  - issue: unauthorized_charge
    summary: Call the number on the back of the card at once.
    evidence: [statement with the charge, date you noticed it, card status]
    steps:
      - do: For a credit card, call credit card customer service and report the card lost, stolen or misused.
        channel: card-services-phone
      - do: For a debit card or personal account, call general banking (24/7).
        channel: banking-phone
      - do: Check claim status on the claim status lines.
        channel: debit-claim-status-phone
      - do: If Wells Fargo does not resolve it, complain to the CFPB.
        regulator: cfpb
    facts:
      - kind: process
        claim: Wells Fargo says to contact it immediately by calling the number on the back of your credit or debit card if you see unauthorized transactions.
        issues: [unauthorized_charge, fraud]
        source: https://www.wellsfargo.com/privacy-security/fraud/report/
        last_verified: 2026-10-12

  - issue: fraud
    summary: Call the line for the type of fraud, then report to the FTC.
    evidence: [transaction details, messages from the scammer, police or FTC report number]
    steps:
      - do: For checking, savings, debit or ATM fraud and identity theft, call general banking.
        channel: banking-phone
      - do: For online banking, bill pay, Zelle or wire fraud, or if you answered a phishing message, call the online fraud line.
        channel: online-fraud-phone
      - do: Forward phishing emails or texts you did not respond to.
        channel: phishing-email
      - do: Report to the FTC at ReportFraud.ftc.gov, then complain to the CFPB if the bank does not act.
        regulator: cfpb
    facts:
      - kind: policy
        claim: Wells Fargo states that neither Wells Fargo nor Zelle offers purchase protection for payments made with Zelle.
        issues: [fraud]
        source: https://www.wellsfargo.com/privacy-security/fraud/report/
        last_verified: 2026-10-12

  - issue: fee_reversal
    summary: Check the overdraft rules (Extra Day Grace Period, $10 limits), then ask for a reversal.
    evidence: [statement showing the fee, available balance by date, deposit times]
    steps:
      - do: Check whether the fee should have been waived under the Extra Day Grace Period or the $10 rules.
      - do: Call general banking and ask for a reversal.
        channel: banking-phone
      - do: If refused, complain on the feedback line or in writing.
        channel: feedback-phone
      - do: Complain to the CFPB if the fee breaks the stated rules.
        regulator: cfpb
    facts:
      - kind: fee
        claim: The overdraft fee for consumer checking accounts is $35 per item, with no more than three overdraft fees per business day for personal accounts.
        issues: [fee_reversal]
        source: https://www.wellsfargo.com/checking/overdraft-services/
        last_verified: 2026-10-12
      - kind: policy
        claim: Wells Fargo does not charge an overdraft fee on items of $10 or less, or when both the ending daily balance and available balance are overdrawn by $10 or less.
        issues: [fee_reversal]
        source: https://www.wellsfargo.com/checking/overdraft-services/
        last_verified: 2026-10-12
      - kind: policy
        claim: Extra Day Grace Period - if your available balance is positive as of 11:59 pm Eastern Time on the extra day, pending overdraft fees for the prior business day are waived.
        issues: [fee_reversal]
        source: https://www.wellsfargo.com/checking/overdraft-services/
        last_verified: 2026-10-12
      - kind: policy
        claim: Wells Fargo does not charge a returned item (NSF) fee for items returned unpaid, and Clear Access Banking accounts have no overdraft fees.
        issues: [fee_reversal]
        source: https://www.wellsfargo.com/checking/overdraft-services/
        last_verified: 2026-10-12

  - issue: frozen_funds
    summary: Wells Fargo may freeze funds when it suspects questionable activity, until its concerns are resolved, a legal time limit passes, or a court orders otherwise.
    evidence: [notices from Wells Fargo, balance when frozen, proof of identity and source of funds]
    steps:
      - do: Call general banking and ask why the funds are frozen and what Wells Fargo needs to resolve its concerns.
        channel: banking-phone
      - do: Send the requested documents and ask in writing when and how the funds will be released.
        channel: banking-mail
      - do: If the funds are not released, complain to the CFPB.
        regulator: cfpb
    facts:
      - kind: policy
        claim: If Wells Fargo suspects suspicious, irregular, fraudulent, unauthorized or unlawful activity, it may freeze all or some funds and restrict access until the earliest of when its concerns are resolved, the time frame in applicable law, or a court order.
        issues: [frozen_funds]
        source: https://www.wellsfargo.com/fetch-pdf?formNumber=CCB2018C&subProductCode=ANY
        last_verified: 2026-10-12
      - kind: policy
        claim: If a state or federal agency asks Wells Fargo to restrict funds, the bank complies and notifies you unless the law prohibits notice.
        issues: [frozen_funds]
        source: https://www.wellsfargo.com/fetch-pdf?formNumber=CCB2018C&subProductCode=ANY
        last_verified: 2026-10-12

  - issue: billing_error
    summary: Write to the billing rights address within 60 days of the statement.
    evidence: [statement with the error, account number, amount, why it is wrong]
    steps:
      - do: Call credit card customer service to report the error.
        channel: card-services-phone
      - do: Send a written notice with your name, account number, the amount and why it is wrong.
        channel: billing-rights-mail
      - do: If the error is not fixed, complain to the CFPB.
        regulator: cfpb

facts:
  - kind: policy
    claim: Wells Fargo consumer credit card agreements include an arbitration agreement administered by the American Arbitration Association; you and the bank keep the right to use small claims court.
    source: https://www.wellsfargo.com/credit-cards/documents/autograph-visa-agreement/
    last_verified: 2026-10-12

known_blockers:
  - Wells Fargo does not list a fraud number for credit cards on its fraud page; it says to call the number on the back of the card.
  - Phone lines verify the account holder.
