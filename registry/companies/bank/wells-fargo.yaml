id: wells-fargo
name: Wells Fargo
aliases: [wells fargo bank, wellsfargo, wells fargo bank na, wf bank]
sector: bank
parent: Wells Fargo & Company
website: https://www.wellsfargo.com
regulators: [cfpb, occ]
notes: Wells Fargo Bank, N.A. is a national bank (OCC). It issues Wells Fargo credit cards and retail-branded cards.

