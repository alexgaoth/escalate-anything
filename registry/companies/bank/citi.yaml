website: https://www.citi.com
regulators: [cfpb, occ]
notes: >-
  Citibank, N.A. is a national bank (OCC). It issues Citi-branded cards, co-brand cards (Costco, AAdvantage)
  and store cards (Home Depot, Macy's, Best Buy and others). Citi's help and contact pages need JavaScript,
  so most phone numbers here come from the "Contact Phone" column of Citi's card agreements page.

