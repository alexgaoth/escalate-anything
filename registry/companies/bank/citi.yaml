id: citi
name: Citi
aliases: [citibank, citibank na, citicards, citi cards, citigroup, citi retail services]
sector: bank
parent: Citigroup Inc.
website: https://www.citi.com
regulators: [cfpb, occ]
notes: >-
  Citibank, N.A. is a national bank (OCC). It issues Citi-branded cards, co-brand cards (Costco, AAdvantage)
  and store cards (Home Depot, Macy's, Best Buy and others). Citi's contact pages need JavaScript, so
  per-card numbers come from the "Contact Phone" column of Citi's card agreements page, and banking
  channels from the Consumer Deposit Account Agreement (effective November 20, 2025).

