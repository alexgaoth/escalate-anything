id: nationwide-building-society
name: Nationwide Building Society
aliases: [nationwide uk, nationwide building society uk, nationwide bank uk]
sector: bank
countries: [gb]
website: https://www.nationwide.co.uk
account_url: https://onlinebanking.nationwide.co.uk/AccessManagement/IdentifyCustomer/IdentifyCustomer
official_domains: [nationwide.co.uk]
security:
  never_asks:
    - kind: policy
      claim: Nationwide says it will never ask you to disclose security details such as your PIN or a one-off card reader code over the phone, log in to the Internet Bank through a link in an email, text or social media message, transfer money to a safe account, or use, re-enable or re-sync your card reader over the phone.
      source: https://www.nationwide.co.uk/help/fraud-and-security/reporting-fraud-or-a-scam
      last_verified: 2026-11-19
    - kind: policy
      claim: Nationwide says that when it texts you about a suspicious transaction it always includes the last 4 digits of your card number, and that it will never pressure you or try to stop you checking who you are speaking to.
      source: https://www.nationwide.co.uk/help/fraud-and-security/reporting-fraud-or-a-scam
      last_verified: 2026-11-19
    - kind: policy
      claim: Nationwide says it will never ask for your account number or PIN in a fraud alert message.
      source: https://www.nationwide.co.uk/help/fraud-and-security/fraud-alert-messages
      last_verified: 2026-11-19
    - kind: policy
      claim: Nationwide says Nationwide and law enforcement will never ask you to transfer money to protect yourself from fraud.
      source: https://www.nationwide.co.uk/help/fraud-and-security/payment-systems-regulator-app-scams
      last_verified: 2026-11-19
  known_scams:
    - kind: policy
      claim: Safe account scam. A caller says they are from a bank, building society or the police, says a security breach puts your money at risk, and tells you to move it to a 'safe account' they have set up. You move the money yourself and lose it.
      source: https://www.nationwide.co.uk/help/fraud-and-security/scams
      last_verified: 2026-11-19
    - kind: policy
      claim: Courier scam. A caller claiming to be from your bank or the police asks for your help with an investigation and asks you to take out money or buy goods, or to give your card number or PIN.
      source: https://www.nationwide.co.uk/help/fraud-and-security/scams
      last_verified: 2026-11-19
    - kind: policy
      claim: Refund overpayment scam. A caller posing as a broadband or telecoms provider gets remote access to your computer, moves your own savings into your current account so it looks like an over-refund, and asks you to send the 'overpayment' back.
      source: https://www.nationwide.co.uk/help/fraud-and-security/scams
      last_verified: 2026-11-19
    - kind: policy
      claim: Nationwide warns that fraudsters try to take advantage of the Virgin Money transfer. Anyone who asks for financial information or tells you to move your money is a scammer.
      source: https://www.nationwide.co.uk/nationwide-and-virgin-money-transfer
      last_verified: 2026-11-19
    - kind: policy
      claim: Mobile payment (tokenised) fraud. Fraudsters add your card details to Apple Pay, Google Pay or Samsung Pay, then use the phone for contactless and in-app purchases.
      source: https://www.nationwide.co.uk/help/fraud-and-security/card-fraud
      last_verified: 2026-11-19
  report_phishing:
    - id: phishing-email
      type: email
      label: Forward suspicious emails, texts and messages that claim to be from Nationwide
      value: phishing@nationwide.co.uk
      purposes: [fraud]
      notes: Nationwide reviews every message but does not reply to every one.
      source: https://www.nationwide.co.uk/help/fraud-and-security/reporting-fraud-or-a-scam
      last_verified: 2026-11-19
    - id: spam-text-7726
      type: sms
      label: Forward suspicious texts from other organisations to 7726
      value: '7726'
      purposes: [fraud]
      source: https://www.nationwide.co.uk/help/fraud-and-security
      last_verified: 2026-11-19
regulators: [uk-fos, uk-fca]
notes: >-
  Nationwide Building Society is a mutual building society, authorised by the Prudential Regulation Authority and regulated
  by the FCA and the PRA (register number 106078). It is a different company from the US insurer Nationwide (see nationwide).
  Virgin Money's business legally transferred to Nationwide on 2 April 2026, but Virgin Money accounts still use Virgin Money's
  own apps, websites, branches, phone numbers and complaints process; this file covers Nationwide-branded products only.
  Customers with both must report issues to each separately. Domestic numbers: 03457 30 20 11 (current accounts), 03456 00 66 11
  (credit cards), 0800 055 66 22 (fraud and lost cards), 0800 30 20 15 (complaints).

