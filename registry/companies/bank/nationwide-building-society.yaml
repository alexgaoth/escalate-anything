escalation:
  - {rung: frontline, channel: current-account-phone, note: "Credit card customers use credit-card-phone. Or chat with Arti in the app or Internet Bank. Fraud: fraud-phone, 24/7."}
  - {rung: written_complaint, channel: complaints-chat, note: "Or call complaints-phone, write to complaints-post, or visit a branch. Nationwide does not accept complaints by email. It has 15 days (35 in exceptional cases) for payment transaction complaints and up to 56 days for others."}
  - {rung: regulator, regulator: uk-fos, note: "After the final response, or when Nationwide's time limit has passed. Refer within 6 months of the date on the final response letter."}

playbooks:
  - issue: unauthorized_charge
    summary: Report the card lost or stolen and call the fraud line (24/7). Ask for a refund within 13 months; Nationwide normally refunds by the end of the next working day.
    evidence: [statement or app screenshot of the payment, date and time and amount, date you noticed it, whether the card is lost, stolen or still with you]
    steps:
      - do: Check that no one with access to your account or linked devices made the payment, and check Nationwide's list of common trading names.
      - do: Report the card as lost or stolen in the app (profile icon > Manage Cards > Report as lost or stolen). It cannot be reactivated after this.
        channel: mobile-app
      - do: Call the fraud line with the date, time and amount of the payment.
        channel: fraud-phone
      - do: From abroad, call the number for your account type.
        channel: current-account-abroad
        note: Credit card fraud from abroad uses credit-card-abroad.
      - do: If the refund is refused or delayed, complain by chat, phone or post.
        channel: complaints-chat
      - do: Refer the complaint to the Financial Ombudsman Service after the final response or after 15 days (35 in exceptional cases).
        regulator: uk-fos
    facts:
      - kind: deadline
        claim: Nationwide's current account terms say you must contact it within 13 months of a payment made without your permission to ask for a refund. It normally refunds by the end of the next working day, including any interest or charges you paid because of the payment.
        issues: [unauthorized_charge, fraud]
        verified_via: document
        source: https://www.nationwide.co.uk/-/assets/nationwidecouk/documents/current-accounts/resources/p4410-current-accounts.pdf
        last_verified: 2026-11-19
      - kind: policy
        claim: Nationwide's terms say it will not refund an unauthorised payment if it can show you gave permission, if it thinks you are acting fraudulently and has told the police, or if you deliberately broke the terms or were very careless with your card or security details (unless the account was overdrawn at the time).
        issues: [unauthorized_charge]
        verified_via: document
        source: https://www.nationwide.co.uk/-/assets/nationwidecouk/documents/current-accounts/resources/p4410-current-accounts.pdf
        last_verified: 2026-11-19
      - kind: policy
        claim: Nationwide's Digital Banking Promise says it refunds money taken without authorisation through its app, internet bank or Open Banking service. You might not get a refund if a fraudster convinced you to make the payment, you did not take reasonable steps to keep your details safe, or you acted fraudulently, or if the transaction was more than 13 months ago.
        issues: [unauthorized_charge, fraud]
        source: https://www.nationwide.co.uk/help/fraud-and-security/digital-banking-promise
        last_verified: 2026-11-19
      - kind: policy
        claim: Nationwide says keeping a record of your PIN with your card, or sharing your PIN, breaks its terms; if you gave your PIN to a criminal or they found it, you will not get your money back.
        issues: [unauthorized_charge, fraud]
        source: https://www.nationwide.co.uk/help/fraud-and-security/reporting-fraud-or-a-scam
        last_verified: 2026-11-19

  - issue: fraud
    summary: Call the fraud line at once (24/7). For bank transfer scams (APP fraud) from 7 October 2024, Nationwide reimburses eligible Faster Payments and CHAPS claims up to £85,000 and has waived the £100 excess. Claim within 13 months of the last scam payment.
    evidence: [payment dates, amounts and payee details, messages, emails or call logs from the scammer, any warnings Nationwide showed, police or Report Fraud reference]
    steps:
      - do: Call the fraud line immediately. Be completely honest about what happened.
        channel: fraud-phone
      - do: Report the scam to the police or Report Fraud (reportfraud.police.uk), or let Nationwide report it for you. In Scotland, contact Police Scotland on 101.
      - do: Forward suspicious emails and texts that claim to be from Nationwide to phishing@nationwide.co.uk.
      - do: Answer any request for information about your claim quickly.
        channel: fraud-phone
      - do: If the claim is refused or not paid within 35 business days, complain.
        channel: complaints-chat
      - do: Refer the complaint to the Financial Ombudsman Service.
        regulator: uk-fos
    facts:
      - kind: limit
        claim: Nationwide reimburses APP scam payments made within the UK by Faster Payments or CHAPS from 7 October 2024, from personal accounts, micro-enterprises and certain charities, for payments up to £85,000.
        issues: [fraud]
        source: https://www.nationwide.co.uk/help/fraud-and-security/payment-systems-regulator-app-scams
        last_verified: 2026-11-19
      - kind: fee
        claim: Nationwide says it has chosen to waive the £100 excess allowed under the PSR rules, so it makes no deduction from an eligible refund.
        issues: [fraud]
        source: https://www.nationwide.co.uk/help/fraud-and-security/payment-systems-regulator-app-scams
        last_verified: 2026-11-19
      - kind: process
        claim: If an APP claim is valid, Nationwide says you should in most cases be reimbursed within five business days of making the claim, or up to 35 business days if it needs more information.
        issues: [fraud]
        source: https://www.nationwide.co.uk/help/fraud-and-security/payment-systems-regulator-app-scams
        last_verified: 2026-11-19
      - kind: deadline
        claim: Under the Consumer Standard of Caution you must report the fraud no more than 13 months after the last fraudulent payment, follow Nationwide's and law enforcement's warnings, answer requests for information, and report the fraud to the police. Nationwide may not reimburse you if you do not meet it.
        issues: [fraud]
        source: https://www.nationwide.co.uk/help/fraud-and-security/payment-systems-regulator-app-scams
        last_verified: 2026-11-19
      - kind: policy
        claim: The PSR rules do not cover payments by cash, cheque or card, international payments, civil disputes, your own fraud, gross negligence such as ignoring a scam warning, payments to your own accounts, unlawful payments, or payments made before 7 October 2024 or more than 13 months before the claim. Nationwide says it reviews such claims case by case and may still refund fully or partly.
        issues: [fraud]
        source: https://www.nationwide.co.uk/help/fraud-and-security/payment-systems-regulator-app-scams
        last_verified: 2026-11-19
      - kind: policy
        claim: Scam Protection Promise. If you ask the Scam Checker Service about a payment from your current account before you make it, and Nationwide did not tell you not to make it, Nationwide gives back every penny if it turns out to be a scam. Nationwide may change or withdraw the Promise with reasonable notice.
        issues: [fraud]
        source: https://www.nationwide.co.uk/help/fraud-and-security/scam-protection-promise
        last_verified: 2026-11-19

  - issue: transaction_dispute
    summary: Contact the seller first, then raise a Visa dispute (chargeback) in the app or with the online form, usually within 120 days. For credit card purchases of £100 to £30,000 you can also make a Section 75 claim with the credit card dispute form.
    evidence: [receipt or order confirmation, expected delivery date, record of contact with the seller (dates and replies), cancellation confirmation, photos of faulty goods, your customer number]
    steps:
      - do: Contact the seller and keep a note of each contact and what happened.
      - do: Check the payment is not pending (pending credit card payments cannot be disputed). Do not use the dispute route for fraud; report fraud instead.
      - do: For cancelled or undelivered goods, raise the dispute in the app (select the transaction > 'something wrong with this transaction' > Arti).
        channel: mobile-app
      - do: Or open the dispute page, choose your card and problem, and complete the linked online form.
        channel: dispute-page
      - do: For debit card duplicate payments, overcharges or payments already made another way, message 'Report unusual account activity' in the Internet Bank or call the Visa Dispute team.
        channel: visa-dispute-phone
      - do: For a credit card purchase of £100 to £30,000, ask for a Section 75 claim using the credit card dispute form.
        channel: credit-card-dispute-form
      - do: If the dispute is refused, complain, then refer it to the Financial Ombudsman Service.
        channel: complaints-chat
      - do: Refer the complaint to the Financial Ombudsman Service after the final response.
        regulator: uk-fos
    facts:
      - kind: deadline
        claim: For goods or services not received, Nationwide says you can raise the dispute 15 days after the payment left your account (earlier with proof of an expected delivery date) and generally within 120 days, or up to 540 days if the seller has gone into administration.
        issues: [transaction_dispute]
        source: https://www.nationwide.co.uk/help/payments/disputing-a-payment
        last_verified: 2026-11-19
      - kind: deadline
        claim: Nationwide says disputes for cancelled, faulty, incorrect or returned goods must be raised within 120 days of the payment. For debit card duplicate payments, overcharges or payments already made another way, the limit is 13 months.
        issues: [transaction_dispute]
        source: https://www.nationwide.co.uk/help/payments/disputing-a-payment
        last_verified: 2026-11-19
      - kind: process
        claim: If Nationwide accepts a dispute, it says the money is put back within 3 to 5 working days (3 days for some dispute types), and it confirms by letter or email. It updates you by letter and text, so there is no need to call.
        issues: [transaction_dispute]
        source: https://www.nationwide.co.uk/help/payments/disputing-a-payment
        last_verified: 2026-11-19
      - kind: policy
        claim: Nationwide says you can apply for a Section 75 refund on a credit card purchase costing between £100 and £30,000 if the goods or services were not received, faulty, not as described, or you were persuaded to buy on the basis of incorrect information, whether you paid in full, a deposit or part on the card. Section 75 only applies to credit cards.
        issues: [transaction_dispute]
        source: https://www.nationwide.co.uk/credit-cards/help/section-75-claims
        last_verified: 2026-11-19
      - kind: policy
        claim: If you paid through a platform like PayPal, Nationwide says you may need to raise the dispute through that platform instead.
        issues: [transaction_dispute]
        source: https://www.nationwide.co.uk/credit-cards/help/section-75-claims
        last_verified: 2026-11-19

  - issue: frozen_funds
    summary: A blocked card after a fraud alert stays blocked until you respond. Reply to the app alert or text, or call the fraud alert line. For other account blocks, ask Nationwide what it needs.
    evidence: [fraud alert message or letter, date of the block, documents Nationwide asked for]
    steps:
      - do: If you got a fraud alert, respond in the app within 2 hours or reply to the text. If you are unsure the message is genuine, call the fraud alert line.
        channel: fraud-alert-phone
        note: Credit card alerts use credit-card-alert-phone.
      - do: For any other block, call customer service and ask why the account is blocked and what you need to provide.
        channel: current-account-phone
      - do: If the block continues without a clear reason, complain.
        channel: complaints-chat
      - do: Refer the complaint to the Financial Ombudsman Service.
        regulator: uk-fos
    facts:
      - kind: process
        claim: If Nationwide's systems spot a suspicious transaction, it blocks your card and sends an app alert, text or automated call. You have 2 hours to respond to an app alert, and the card stays blocked until Nationwide hears from you by text or phone.
        issues: [frozen_funds, fraud]
        source: https://www.nationwide.co.uk/help/fraud-and-security/fraud-alert-messages
        last_verified: 2026-11-19
      - kind: policy
        claim: Nationwide's terms let it stop card, PIN, digital or telephone banking use, or block payments into the account, for suspected fraud, legal or regulatory reasons (including unanswered information requests or court orders), security concerns, a year of non-use, returned letters, suspected residence outside the UK, or credit risk. If it can, it tells you what it has done, why, and how to fix it.
        issues: [frozen_funds, account_access]
        verified_via: document
        source: https://www.nationwide.co.uk/-/assets/nationwidecouk/documents/current-accounts/resources/p4410-current-accounts.pdf
        last_verified: 2026-11-19

  - issue: account_access
    summary: After 3 wrong passnumber attempts, reset the passnumber in the app or Internet Bank with biometrics or a Visa debit card and card reader. If that fails, register for online banking again.
    evidence: [Visa debit card, card reader, registered mobile number]
    steps:
      - do: In the app, select Forgotten passnumber and follow the steps (photo check if biometrics are set up, otherwise debit card and card reader).
        channel: mobile-app
      - do: If you still cannot log in, or have no card reader, register for online banking again.
      - do: For further help, call customer service (other enquiries, including internet banking).
        channel: current-account-phone
    facts:
      - kind: process
        claim: Nationwide says you can log in with a Visa debit card and card reader if you were locked out for using the wrong passnumber 3 times; if that fails or you have no card reader, you need to register for online banking again.
        issues: [account_access]
        source: https://www.nationwide.co.uk/help/online-banking-help/locked-out-of-online-bank
        last_verified: 2026-11-19

facts:
  - kind: deadline
    claim: Nationwide aims to resolve a payment transaction complaint as soon as possible and no later than 15 days, or 35 days in exceptional circumstances. For any other complaint, allow up to 56 days.
    issues: [poor_service, transaction_dispute, unauthorized_charge, fraud]
    source: https://www.nationwide.co.uk/contact-us/make-a-complaint-or-send-us-feedback
    last_verified: 2026-11-19
  - kind: process
    claim: If Nationwide resolves a complaint to your satisfaction within 3 working days after the day it received it, it sends a Summary Resolution Communication with information about the Financial Ombudsman Service. Otherwise it sends a Final Response letter with its investigation, decision and FOS information.
    issues: [poor_service]
    source: https://www.nationwide.co.uk/contact-us/make-a-complaint-or-send-us-feedback
    last_verified: 2026-11-19
  - kind: deadline
    claim: Nationwide says that if you want to refer your complaint to the Financial Ombudsman Service after its Final Response, you must do so within 6 months of the date on the letter. The FOS needs Nationwide's consent to investigate earlier unless the handling time limit has passed.
    issues: [poor_service]
    source: https://www.nationwide.co.uk/contact-us/make-a-complaint-or-send-us-feedback
    last_verified: 2026-11-19
  - kind: contact
    claim: Nationwide says it cannot register complaints by email; to complain online, use its live chat.
    issues: [poor_service]
    source: https://www.nationwide.co.uk/contact-us/make-a-complaint-or-send-us-feedback
    last_verified: 2026-11-19
  - kind: policy
    claim: The legal transfer of Virgin Money's business to Nationwide completed on 2 April 2026. Virgin Money customers keep managing those accounts through Virgin Money's apps, websites, branches and contact numbers, and Virgin Money branded products follow Virgin Money's complaints process.
    source: https://www.nationwide.co.uk/nationwide-and-virgin-money-transfer
    last_verified: 2026-11-19

tips:
  - kind: official
    text: If a caller says they are from Nationwide, stay on the call, open the app, go to More > Call Checker, and it will confirm whether the call is really Nationwide. Without the app, hang up and call 159.
    issues: [fraud]
    source: https://www.nationwide.co.uk/help/fraud-and-security/reporting-fraud-or-a-scam
    last_verified: 2026-11-19
  - kind: official
    text: Nationwide says live chat is the quickest way to make a complaint.
    issues: [poor_service]
    source: https://www.nationwide.co.uk/contact-us/make-a-complaint-or-send-us-feedback
    last_verified: 2026-11-19

known_blockers:
  - Nationwide does not accept complaints by email.
  - App and Internet Bank chat need a log-in; a website chat needs a colleague to confirm your identity, and website agents work Monday to Friday 9am to 5pm only.
  - Card dispute forms are hosted on docusign.net and need your customer number.
  - Virgin Money accounts are handled separately through Virgin Money's own channels.
