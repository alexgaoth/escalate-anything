id: american-express
name: American Express
aliases: [amex, american express national bank, americanexpress, amex card]
sector: bank
parent: American Express Company
website: https://www.americanexpress.com
official_domains: [americanexpress.com]
security:
  never_asks:
    - kind: policy
      claim: American Express will never call you and ask for verification codes, logins or passwords.
      source: https://www.americanexpress.com/en-us/security/phishing-scam-awareness/
      last_verified: 2026-10-12
    - kind: policy
      claim: American Express will never call you and ask for your full ID details, your Card details or your PIN.
      source: https://www.americanexpress.com/en-us/security/phishing-scam-awareness/
      last_verified: 2026-10-12
    - kind: policy
      claim: American Express says institutions will not call you to ask for money by gift card, wire transfer, crypto or payment app.
      source: https://www.americanexpress.com/en-us/security/phishing-scam-awareness/
      last_verified: 2026-10-12
  known_scams:
    - kind: policy
      claim: Someone calls claiming to be from American Express, your bank or a government agency and asks for an unusual payment, such as a gift card, wire transfer, crypto or a payment app.
      source: https://www.americanexpress.com/en-us/security/phishing-scam-awareness/
      last_verified: 2026-10-12
    - kind: policy
      claim: Someone calls claiming to be from American Express, a tech support service or a retailer and asks for remote access to your device or account through a one-time password, verification code or American Express SafeKey code.
      source: https://www.americanexpress.com/en-us/security/phishing-scam-awareness/
      last_verified: 2026-10-12
    - kind: policy
      claim: Scammers fake caller ID to show a trusted number. If you did not make the call, do not share account numbers, logins, your Social Security number or one-time passcodes. Hang up and call the number on the back of your Card.
      source: https://www.americanexpress.com/en-us/security/phishing-scam-awareness/
      last_verified: 2026-10-12
    - kind: policy
      claim: Emails with false offers, such as paying off your account balance, ask you to share personal details like your Card number and security code.
      source: https://www.americanexpress.com/en-us/security/phishing-scam-awareness/
      last_verified: 2026-10-12
  report_phishing:
    - id: spoof-email
      type: email
      label: Report phishing emails or texts, or fake AMEX websites
      value: spoof@americanexpress.com
      purposes: [fraud]
      notes: The Security Center text shows this address, but its mailto link has a typo (americanexpress.oom). Type the address by hand.
      source: https://www.americanexpress.com/en-us/security/
      last_verified: 2026-10-12
regulators: [cfpb, occ]
notes: >-
  American Express National Bank is a national bank (OCC) and the issuer of U.S. consumer Amex cards.
  americanexpress.com blocks automated page fetches; the phone, dispute and savings channels come from
  americanexpress.com search results, and the arbitration channels from the cardmember agreements Amex
  files with the CFPB.

channels:
  - id: customer-service-phone
    type: phone
    label: Customer service, consumer cards (also for fraud)
    value: +1-800-528-4800
    hours: 24/7
    purposes: [transaction_dispute, unauthorized_charge, fraud, billing_error, fee_reversal, poor_service]
    access: human_only
    notes: Hearing-impaired callers dial 711, then this number. Amex's fraud FAQ gives the same number; from outside the U.S., call the number on the back of the card.
    source: https://www.americanexpress.com/en-us/support/contacts/
    last_verified: 2026-10-12
  - id: dispute-online
    type: portal
    label: Dispute a charge online
    value: https://www.americanexpress.com/us/customer-service/faq.dispute-a-charge.html
    purposes: [transaction_dispute, billing_error, unauthorized_charge]
    access: login
    notes: Log in, view your transactions, select the transaction and click "Dispute this Charge", then follow the prompts. Contact the merchant first.
    source: https://www.americanexpress.com/us/customer-service/faq.dispute-a-charge.html
    last_verified: 2026-10-12
  - id: billing-inquiry-documents-mail
    type: mail
    label: Documents for an existing billing inquiry (personal cards)
    value: "American Express Customer Service, P.O. Box 981535, El Paso, TX 79998"
    purposes: [transaction_dispute, billing_error]
    notes: Put your account number and inquiry reference number on every document. The same FAQ gives fax 1-623-444-3001 and an online Document Upload Center. The FAQ page may be several years old; prefer the Document Upload Center or the address on your latest statement.
    source: https://www.americanexpress.com/us/customer-service/faq.billing-inquiry-dispute-documentation.html
    last_verified: 2026-10-12
  - id: savings-dispute-phone
    type: phone
    label: American Express personal savings account, transaction disputes
    value: +1-800-446-6307
    purposes: [transaction_dispute, unauthorized_charge, frozen_funds]
    access: human_only
    source: https://www.americanexpress.com/us/customer-service/faq.dispute-transaction-on-personal-savings-account.html
    last_verified: 2026-10-12
  - id: savings-dispute-mail
    type: mail
    label: American Express personal savings account, written disputes
    value: "American Express, P.O. Box 30384, Salt Lake City, UT 84130"
    purposes: [transaction_dispute, unauthorized_charge]
    source: https://www.americanexpress.com/us/customer-service/faq.dispute-transaction-on-personal-savings-account.html
    last_verified: 2026-10-12
  - id: arbitration-rejection-mail
    type: mail
    label: Reject the arbitration provision (within 45 days after your first card purchase)
    value: "American Express, P.O. Box 981556, El Paso, TX 79998"
    notes: The notice must state that you reject the Arbitration provision and include name, address, account number and personal signature. Rejection also covers other open Amex consumer accounts.
    source: https://files.consumerfinance.gov/a/assets/credit-card-agreements/pdf/Q22026/AMERICAN_EXPRESS_NATIONAL_BANK/Blue_Cash_Everyday_Card_Cardmember_Agreement-255458.pdf
    last_verified: 2026-10-12
  - id: claim-notice-mail
    type: mail
    label: Claim notice before a lawsuit, mediation or arbitration
    value: "American Express ADR, c/o CT Corporation System, 28 Liberty Street, New York, New York 10005"
    purposes: [poor_service, billing_error]
    notes: The claim notice must describe the claim, state the specific relief demanded and include your name, address and account number.
    source: https://files.consumerfinance.gov/a/assets/credit-card-agreements/pdf/Q22026/AMERICAN_EXPRESS_NATIONAL_BANK/Blue_Cash_Everyday_Card_Cardmember_Agreement-255458.pdf
    last_verified: 2026-10-12
  - id: credit-bureau-unit-mail
    type: mail
    label: Dispute information Amex reported to a credit reporting agency
    value: "American Express Credit Bureau Unit, P.O. Box 981537, El Paso, TX 79998-1537"
    purposes: [credit_report_error]
    source: https://files.consumerfinance.gov/a/assets/credit-card-agreements/pdf/Q22026/AMERICAN_EXPRESS_NATIONAL_BANK/Blue_Cash_Everyday_Card_Cardmember_Agreement-255458.pdf
    last_verified: 2026-10-12

escalation:
  - {rung: frontline, channel: customer-service-phone}
  - {rung: written_complaint, channel: claim-notice-mail, note: "The agreement requires a written claim notice before mediation, arbitration or a lawsuit."}
  - {rung: regulator, regulator: cfpb}
  - {rung: state_agency, agency_kind: financial_regulator}
  - {rung: arbitration, note: "Either party may elect individual arbitration with JAMS or AAA. Amex will not elect arbitration for an individual claim pending only in small claims court."}

playbooks:
  - issue: unauthorized_charge
    summary: Call Amex right away at 1-800-528-4800 (24/7).
    evidence: [statement with the charge, date you noticed it, card status]
    steps:
      - do: Call Amex and report the card lost, stolen or used without permission. From outside the U.S., call the number on the back of the card.
        channel: customer-service-phone
      - do: For a billing error, write to the billing-rights address printed on your statement within 60 days.
      - do: If Amex does not resolve it, complain to the CFPB.
        regulator: cfpb
    facts:
      - kind: process
        claim: The Amex cardmember agreement says to contact Amex right away if your card is lost or stolen or your account is being used without your permission.
        issues: [unauthorized_charge, fraud]
        source: https://files.consumerfinance.gov/a/assets/credit-card-agreements/pdf/Q22026/AMERICAN_EXPRESS_NATIONAL_BANK/Blue_Cash_Everyday_Card_Cardmember_Agreement-255458.pdf
        last_verified: 2026-10-12

  - issue: transaction_dispute
    summary: Dispute the charge with Amex; if Amex credits you, it takes over your claim against the merchant.
    evidence: [statement showing the charge, receipt, record of contact with the merchant]
    steps:
      - do: Try the merchant first and keep proof.
      - do: Log in, select the transaction and click "Dispute this Charge", or call customer service.
        channel: dispute-online
      - do: Send any documents Amex asks for, with the account number and inquiry reference number.
        channel: billing-inquiry-documents-mail
      - do: If the dispute is denied and you still disagree, send a written claim notice before any mediation or arbitration.
        channel: claim-notice-mail
      - do: Complain to the CFPB.
        regulator: cfpb
    facts:
      - kind: policy
        claim: If you dispute a charge with a merchant, Amex may credit all or part of it; if it does, you assign your claims against the merchant to Amex for the credited amount.
        issues: [transaction_dispute]
        source: https://files.consumerfinance.gov/a/assets/credit-card-agreements/pdf/Q22026/AMERICAN_EXPRESS_NATIONAL_BANK/Blue_Cash_Everyday_Card_Cardmember_Agreement-255458.pdf
        last_verified: 2026-10-12

  - issue: fraud
    summary: Call Amex immediately; chat is also available after login.
    evidence: [transaction details, messages from the scammer, police or FTC report number]
    steps:
      - do: Call Amex immediately and report the fraud.
        channel: customer-service-phone
      - do: Dispute any fraudulent charges that remain on the statement.
        channel: dispute-online
      - do: Report to the FTC at ReportFraud.ftc.gov, then complain to the CFPB if Amex does not act.
        regulator: cfpb
    facts:
      - kind: contact
        claim: Amex's fraud FAQ asks U.S. cardmembers who believe they are fraud victims to call 1-800-528-4800 immediately; outside the U.S., use the number on the back of the card.
        issues: [fraud, unauthorized_charge]
        source: https://www.americanexpress.com/us/customer-service/faq.fraud.html
        last_verified: 2026-10-12

facts:
  - kind: deadline
    claim: For an American Express personal savings account, Amex must hear from you no later than 60 calendar days after it sent the first statement on which the problem or error appeared.
    issues: [transaction_dispute, unauthorized_charge]
    source: https://www.americanexpress.com/us/customer-service/faq.dispute-transaction-on-personal-savings-account.html
    last_verified: 2026-10-12
  - kind: deadline
    claim: You may reject the Amex arbitration provision by a written notice mailed within 45 days after your first card purchase.
    source: https://files.consumerfinance.gov/a/assets/credit-card-agreements/pdf/Q22026/AMERICAN_EXPRESS_NATIONAL_BANK/Blue_Cash_Everyday_Card_Cardmember_Agreement-255458.pdf
    last_verified: 2026-10-12
  - kind: process
    claim: Within 30 days after sending or receiving a claim notice, either party may submit the claim to JAMS or the AAA for mediation; Amex pays the mediation fees.
    source: https://files.consumerfinance.gov/a/assets/credit-card-agreements/pdf/Q22026/AMERICAN_EXPRESS_NATIONAL_BANK/Blue_Cash_Everyday_Card_Cardmember_Agreement-255458.pdf
    last_verified: 2026-10-12
  - kind: compensation
    claim: If the arbitrator rules for you for more than Amex's last offer, the award includes at least $5,000 plus reasonable attorneys' fees and costs.
    source: https://files.consumerfinance.gov/a/assets/credit-card-agreements/pdf/Q22026/AMERICAN_EXPRESS_NATIONAL_BANK/Blue_Cash_Everyday_Card_Cardmember_Agreement-255458.pdf
    last_verified: 2026-10-12
  - kind: policy
    claim: If you are a covered borrower under the Military Lending Act, the arbitration provision does not apply to you.
    source: https://files.consumerfinance.gov/a/assets/credit-card-agreements/pdf/Q22026/AMERICAN_EXPRESS_NATIONAL_BANK/Blue_Cash_Everyday_Card_Cardmember_Agreement-255458.pdf
    last_verified: 2026-10-12

known_blockers:
  - americanexpress.com rejects automated page fetches; an agent can link to its pages but may not be able to read them.
  - No separate U.S. consumer complaint form or executive office was found on americanexpress.com; the written claim notice is the formal escalation.
  - Disputes and secure messages need sign-in to the Amex account.
