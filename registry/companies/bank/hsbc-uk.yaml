id: hsbc-uk
name: HSBC UK
aliases: [hsbc uk bank, hsbc uk bank plc, hsbc bank uk, hsbc uk personal banking, hsbc premier uk, hsbc.co.uk]
sector: bank
countries: [gb]
parent: HSBC Holdings plc
website: https://www.hsbc.co.uk
official_domains: [hsbc.co.uk, hsbc.com]
security:
  never_asks:
    - kind: policy
      claim: HSBC says it will never ask you to tell it your card's 4-digit PIN, share a QR code or one-time passcode (from your Secure Key, text or email), transfer money anywhere including to a 'safe' account, or send it your card, cheque book or cash.
      source: https://www.hsbc.co.uk/help/security-centre/fraud-guide/
      last_verified: 2026-11-19
    - kind: policy
      claim: HSBC says it will never call and ask you for personal details or full passwords, PINs or security codes, and will never text you a link to its online banking log on page.
      source: https://www.hsbc.co.uk/help/security-centre/fraud-guide/common-methods/
      last_verified: 2026-11-19
    - kind: policy
      claim: HSBC says it will never contact you to ask you to share your security details or one-time passcodes, and that HSBC or the police will never call you to verify personal details or your PIN.
      source: https://www.hsbc.co.uk/help/security-centre/latest-scam-warnings/
      last_verified: 2026-11-19
  known_scams:
    - kind: policy
      claim: Safe account scam. Callers who claim to be from your bank or the police say your money is at risk and must be moved to a new account. HSBC says no legitimate bank will ask you to transfer money into a new account.
      source: https://www.hsbc.co.uk/help/security-centre/latest-scam-warnings/
      last_verified: 2026-11-19
    - kind: policy
      claim: Criminals pretend to be HSBC employees, often from the Wealth, Premier or Private Bank teams, and ask people to pay into fake high-interest "guaranteed" investment bonds.
      source: https://www.hsbc.co.uk/help/security-centre/latest-scam-warnings/
      last_verified: 2026-11-19
    - kind: policy
      claim: Courier fraud. Fraudsters posing as bank or police staff ask for your card, PIN or valuables and offer to send a courier to collect them.
      source: https://www.hsbc.co.uk/help/security-centre/latest-scam-warnings/
      last_verified: 2026-11-19
    - kind: policy
      claim: Fraudsters claiming to be from HSBC say your account is compromised and ask you to share a one-time passcode or delete the mobile banking app, or ask you to dial a code that diverts your calls to them.
      source: https://www.hsbc.co.uk/help/security-centre/latest-scam-warnings/
      last_verified: 2026-11-19
    - kind: policy
      claim: Fraudsters can fake the caller ID and keep your line open with a fake dial tone, so calling the number on your card may not reach your bank. HSBC says to disconnect fully, wait or use another phone, then call a number you have verified.
      source: https://www.hsbc.co.uk/help/security-centre/fraud-guide/common-methods/
      last_verified: 2026-11-19
  report_phishing:
    - id: phishing-email
      type: email
      label: Forward suspicious emails or texts that claim to be from HSBC
      value: phishing@hsbc.com
      purposes: [fraud]
      notes: Do not click links or open attachments in the message.
      source: https://www.hsbc.co.uk/help/security-centre/report-a-problem/
      last_verified: 2026-11-19
    - id: spam-text-7726
      type: sms
      label: Forward suspicious texts to your mobile operator on 7726 (free)
      value: "7726"
      purposes: [fraud]
      source: https://www.hsbc.co.uk/help/security-centre/received-a-text/
      last_verified: 2026-11-19
regulators: [uk-fos, uk-fca]
notes: >-
  HSBC UK Bank plc, the UK personal bank at hsbc.co.uk. This file does not cover first direct or HSBC
  outside the UK. HSBC UK lists contact numbers by customer type (existing customers, Premier,
  non-customers) rather than by topic; the same main number handles fraud, scams and complaints. HSBC's
  pages list no separate credit card phone number; credit cards are reported lost or stolen through the
  same app, online banking and 0800 routes.

