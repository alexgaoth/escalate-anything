escalation:
  - {rung: frontline, channel: member-support-phone}
  - {rung: written_complaint, channel: messenger, note: "BECU lists no complaint address; it points to member consultants and a suggestion form. Secure messages create a written record."}
  - {rung: regulator, regulator: ncua}
  - {rung: regulator, regulator: cfpb}

playbooks:
  - issue: unauthorized_charge
    summary: Call member support (or the after-hours card line), then sign the Written Statement of Unauthorized Debit.
    evidence: [statement with the charge, date you noticed it, card status]
    steps:
      - do: During business hours call member support; after hours call the debit or credit card line.
        channel: member-support-phone
      - do: After hours for a debit card, call the after-hours debit card line.
        channel: debit-card-after-hours-phone
      - do: After hours for a credit card, call the after-hours credit card line.
        channel: credit-card-after-hours-phone
      - do: Complete the Written Statement of Unauthorized Debit (consumer accounts) online or on paper.
        channel: dispute-fraud-forms
      - do: If BECU does not resolve it, complain to the NCUA.
        regulator: ncua

  - issue: transaction_dispute
    summary: Call member support or send a secure message (not for ACH disputes), and use the disputes forms.
    evidence: [statement showing the transaction, receipt, record of contact with the merchant]
    steps:
      - do: Try the merchant first and keep proof.
      - do: Call member support, or send a secure message for card disputes.
        channel: member-support-phone
      - do: Use the disputes and fraud forms when BECU asks for a signed statement.
        channel: dispute-fraud-forms
      - do: If BECU does not resolve it, complain to the NCUA or the CFPB.
        regulator: ncua

  - issue: fraud
    summary: Call member support if you lost money or shared information; report suspicious messages to phishing@becu.org.
    evidence: [transaction details, messages from the scammer, FTC or police report number]
    steps:
      - do: Call member support right away.
        channel: member-support-phone
      - do: Report the suspicious email, text or call.
        channel: phishing-email
      - do: For identity theft, complete the ID Theft Affidavit.
        channel: dispute-fraud-forms
      - do: Report to the FTC or the FBI's IC3; complain to the NCUA if BECU does not act.
        regulator: ncua

  - issue: payment_assistance
    summary: Call Member Assistance for hardship payment relief on a loan or credit card.
    steps:
      - do: Call Member Assistance, or request relief online with the loan and credit card payment relief form.
        channel: member-assistance-phone

known_blockers:
  - Phone lines verify the member.
  - Messenger and many forms need a BECU online banking sign-in or a signature.
