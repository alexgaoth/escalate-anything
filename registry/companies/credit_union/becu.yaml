id: becu
name: BECU
aliases: [boeing employees credit union, boeing employees' credit union, becu credit union]
sector: credit_union
website: https://www.becu.org
official_domains: [becu.org]
security:
  never_asks:
    - kind: policy
      claim: BECU will never call, email or text you asking for a one-time passcode, your account password, your debit card number or any other sensitive information.
      source: https://www.becu.org/fraud-and-security-center
      last_verified: 2026-10-13
  known_scams:
    - kind: policy
      claim: BECU warns of a scam that recruits members to open accounts, deposit checks or send money for someone else, and says that if anyone asks to use your account for their purposes, it is likely a scam.
      source: https://www.becu.org/fraud-and-security-center
      last_verified: 2026-10-13
  report_phishing:
    - id: phishing-email
      type: email
      label: Report suspicious emails, texts or calls to the BECU security team
      value: phishing@becu.org
      purposes: [fraud]
      notes: BECU says this mailbox is no-reply and is used to monitor trends; do not send confidential information. If you lost money or shared account details, call member support.
      source: https://www.becu.org/contact-us
      last_verified: 2026-10-13
regulators: [ncua, cfpb]
notes: BECU is a federally insured credit union (NCUA). Hours are Pacific Time. TTY users can dial 711 during business hours to reach member support.

channels:
