id: avis-budget
name: Avis Budget Group (Avis and Budget)
aliases: [avis, budget, budget rent a car, avis rent a car, avis budget]
sector: car_rental
website: https://www.avis.com
account_url: https://www.avis.com/en/reservation/get-e-receipt
regulators: [ftc]
notes: >-
  Avis and Budget have separate phone lines and customer service portals but the same damage claim administrators
  (Fleet Response and Viking) and the same insurance-details portal (Axle). Payless and Zipcar channels were not checked
  and are not included. Avis website Terms of Use last updated December 4, 2023.

