id: enterprise
name: Enterprise Mobility (Enterprise Rent-A-Car, National, Alamo)
aliases: [enterprise rent-a-car, enterprise rent a car, enterprise holdings, national car rental, alamo, alamo rent a car]
sector: car_rental
website: https://www.enterprise.com
account_url: https://www.enterprise.com/en/reserve/receipts.html
regulators: [ftc]
notes: >-
  Enterprise Mobility runs three rental brands with separate phone lines: Enterprise Rent-A-Car, National and Alamo.
  Post-rental balances, tolls and citations, and damage recovery payments for Enterprise US rentals go through the
  Consumer Collections Support pages (enterprise.com/en/payments). Enterprise does not publish a Damage Recovery Unit
  phone number or address on the pages checked.

