escalation:
  - {rung: frontline, channel: enterprise-customer-service-phone, note: "National and Alamo renters use their brand's customer service line."}
  - {rung: written_complaint, channel: collections-request-form, note: "For damage claims, ask for photos, repair invoices and the fleet utilization log."}
  - {rung: payment_dispute}
  - {rung: state_agency, agency_kind: attorney_general}
  - {rung: small_claims}

playbooks:
  - issue: damage_claim
    summary: Damage recovery bills for Enterprise US rentals are paid or questioned through Consumer Collections Support; ask for the evidence in writing before paying.
    evidence: [rental agreement, your photos at pickup and return, damage claim letter, Damage Waiver election, insurance and card benefit details]
    steps:
      - do: After an accident, call 911 or local police, then Roadside Assistance, which files the damage report.
        channel: enterprise-roadside-phone
      - do: When a damage recovery bill arrives, send a written request through the Submit a Request form with the rental agreement number, asking for photos, the repair invoice, and how loss of use and fees were calculated.
        channel: collections-request-form
      - do: Give the claim to your auto insurer or credit card benefit administrator if you declined the Damage Waiver.
      - do: If Enterprise charges your card without supporting evidence, dispute the charge with your card issuer.
    facts:
      - kind: policy
        claim: For US rentals, minor damage such as scratches, dents or a chipped windshield is covered by the optional Damage Waiver; without it you may have to pay out of pocket for repairs.
        issues: [damage_claim]
        source: https://www.enterprise.com/en/car-rental-faqs/us-general/car-rental-scratch-policy.html
        last_verified: 2026-10-12
  - issue: billing_error
    summary: Fuel, toll and citation charges each have a set path; submit proof through the collections form or citations email.
    evidence: [receipt, rental agreement, fuel gauge photo at return, toll or citation notice, proof of payment to the agency]
    steps:
      - do: Get the receipt online and compare it with the rental agreement.
        channel: receipts
      - do: For a toll or violation you already paid, email proof to citations or submit the Proof of Payment form; Enterprise says it responds within two business days.
        channel: citations-email
      - do: For other wrong charges, call customer service, then put it in writing through the Submit a Request form.
        channel: enterprise-customer-service-phone
      - do: If not corrected, dispute the charge with your card issuer.
    facts:
      - kind: fee
        claim: If you return the car with less fuel than at pickup, Enterprise charges the local Enterprise rate, which it says is typically above the local pump price; prepaid fuel is sold only as a full tank and is not refundable.
        issues: [billing_error]
        source: https://www.enterprise.com/en/car-rental-faqs/us-general/fueling-rental-car.html
        last_verified: 2026-10-12
      - kind: fee
        claim: Enterprise's standard administrative fee for citations and tolls still applies when local authorities bill you directly; notices typically arrive one to four weeks after the rental.
        issues: [billing_error]
        source: https://www.enterprise.com/en/payments/general-faqs.html
        last_verified: 2026-10-12
      - kind: process
        claim: Accepted proof for a toll or citation appeal includes proof of payment to the issuing agency, matching bank or card statements, a cashed check, an agency receipt, proof of a clerical error, or proof of whereabouts.
        issues: [billing_error]
        source: https://www.enterprise.com/en/payments/general-faqs.html
        last_verified: 2026-10-12
  - issue: deposit_refund
    summary: Credit card holds are released at return; debit card deposits are refunded to the bank account in about 5 to 10 business days.
    evidence: [rental agreement, return receipt, bank statement showing the deposit]
    steps:
      - do: Check the final receipt for added charges.
      - do: If a debit card deposit has not come back after 10 business days, call the renting branch, then customer service.
        channel: enterprise-customer-service-phone
      - do: If the deposit is still not returned, dispute it with your bank or card issuer.
    facts:
      - kind: deadline
        claim: For credit cards Enterprise says it immediately releases the authorization and charges only the rental amount; for debit cards the deposit is refunded to the account, typically in approximately 5 to 10 business days, and Enterprise says to call the renting branch if it has not appeared after 10 business days.
        issues: [deposit_refund]
        source: https://www.enterprise.com/en/car-rental-faqs/us-deposits-and-payments/car-rental-deposit-refunds.html
        last_verified: 2026-10-12
      - kind: deadline
        claim: For cash, check or money order payments, refunds are mailed by check within 20 business days after Enterprise confirms there are no additional charges.
        issues: [deposit_refund]
        source: https://www.enterprise.com/en/car-rental-faqs/us-deposits-and-payments/car-rental-deposit-refunds.html
        last_verified: 2026-10-12
      - kind: policy
        claim: Enterprise says the deposit amount varies by region, vehicle type and other factors, and to ask the renting location for the exact amount.
        issues: [deposit_refund]
        source: https://www.enterprise.com/en/car-rental-faqs/us-deposits-and-payments/how-much-is-a-rental-car-deposit.html
        last_verified: 2026-10-12

known_blockers:
  - The Submit a Request form has a reCAPTCHA.
  - Chat is open only Monday-Friday business hours (Central time).
  - No Damage Recovery Unit phone, email or address is published on the pages checked.

official_domains: [enterprise.com, nationalcar.com, alamo.com]
