escalation:
  - {rung: frontline, note: "Call the state line: CT 800-286-2000, Eastern MA 800-592-2000, Western MA 877-659-6326, NH 800-662-7764 (or the number on the bill)."}
  - {rung: supervisor, note: "Ask the representative for a supervisor. Write down the name and reference number."}
  - {rung: written_complaint, note: "New Hampshire: write to Eversource, PO Box 330, Manchester, NH 03105-0330. CT and MA complaint addresses were not confirmed; send a dated letter and keep call notes. Connecticut PURA asks customers to show they tried to resolve the issue with the utility first."}
  - {rung: state_agency, agency_kind: utility_commission, note: "Connecticut: Public Utilities Regulatory Authority (PURA). Massachusetts: Department of Public Utilities (DPU). New Hampshire: Public Utilities Commission; Eversource's NH bill insert names the NH Department of Energy (1-800-852-3793) for unresolved billing disputes."}
  - {rung: state_agency, agency_kind: attorney_general, note: "Attorney General of Connecticut, Massachusetts or New Hampshire, by the account's state."}

playbooks:
  - issue: billing_error
    summary: Dispute the bill with Eversource first and keep records; in Connecticut, PURA takes the complaint only after you tried the utility.
    evidence: [the disputed bill, previous bills, meter photos with dates, call notes with reference numbers]
    steps:
      - do: Call Eversource customer service for your state and dispute the bill. Get a reference number.
        channel: customer-service-phone-ct
        note: Use the line for the account's state or region.
      - do: If not resolved, complain to the state regulator (PURA, DPU or NH PUC) with your records.
    facts:
      - kind: process
        claim: PURA requires Connecticut customers to show they tried to resolve the issue with the utility first before PURA handles a complaint.
        issues: [billing_error]
        source: https://portal.ct.gov/pura/consumer-services/frequently-asked-questions
        last_verified: 2026-10-12

  - issue: disconnection
    summary: Ask for a payment plan and, in Connecticut, apply for financial hardship or medical protection for winter protection and the Matching Payment Program.
    evidence: [shutoff notice, account balance, benefit letters (CEAP, SNAP, TANF), physician's certification]
    steps:
      - do: Call Eversource and ask for a payment plan; service continues while plan payments are on time.
        channel: payment-assistance
      - do: In Connecticut, apply for Financial Hardship designation (renew each October) and the Matching Payment Program.
        channel: payment-assistance
      - do: If someone has a serious or life-threatening illness, ask for Medical Protection with a physician's certification.
        channel: customer-service-phone-ct
        note: Use the line for the account's state or region.
      - do: If Eversource does not help, contact the state regulator before the shutoff date.
    facts:
      - kind: policy
        claim: Eversource says service continues uninterrupted for the duration of a payment plan as long as monthly payments are made on time.
        issues: [disconnection]
        source: https://www.eversource.com/residential/account-billing/payment-assistance/payment-plans
        last_verified: 2026-10-12
      - kind: deadline
        claim: Connecticut law requires 13 days' written notice before a shutoff. Residential service cannot be shut off on a Friday, weekend, legal holiday, the day before a holiday, or within an hour of the office closing.
        issues: [disconnection]
        source: https://portal.ct.gov/PURA/Consumer-Services/Customer-Rights--Responsibilities
        last_verified: 2026-10-12
      - kind: policy
        claim: In Connecticut, financial hardship or medically protected customers cannot be terminated for non-payment during the winter moratorium, November 1 to May 1 (PURA FAQ states November 1 - April 30).
        issues: [disconnection]
        source: https://portal.ct.gov/pura/consumer-services/payment-assistance-programs
        last_verified: 2026-10-12
      - kind: policy
        claim: Eversource Connecticut Financial Hardship designation applies to customers receiving CEAP, SNAP, TANF or unemployment benefits, or with income at or below 60% of State Median Income. Medical Protection needs a physician's certification renewed annually and protects service in winter and at all times for life-threatening cases.
        issues: [disconnection]
        source: https://portal.ct.gov/pura/consumer-services/payment-assistance-programs
        last_verified: 2026-10-12
      - kind: policy
        claim: In Connecticut, the Matching Payment Program matches payments and energy assistance to clear past-due balances for hardship customers and gives year-round shut-off protection while payments are made. It replaced New Start, which closed to new enrollment on October 31, 2024. A Flexible Payment Arrangement over 18 months is available to all customers.
        issues: [disconnection]
        source: https://portal.ct.gov/pura/consumer-services/payment-assistance-programs
        last_verified: 2026-10-12

  - issue: service_outage
    summary: Report the outage online; Eversource does not reimburse damage from service interruptions caused by storms, equipment failure or other causes beyond its control.
    evidence: [outage dates and times, photos, itemized repair bills or estimates]
    steps:
      - do: Report the outage online with your phone number or account sign-in.
        channel: outage-report-online
      - do: For property damage you believe Eversource caused, call the Claims Department or use the property damage claim page. Keep damaged items until Eversource reviews them.
        channel: claims-phone
    facts:
      - kind: policy
        claim: Eversource says it will not reimburse damage from service interruptions caused by sudden equipment failure, storms, falling trees, weather, animals, motor vehicle accidents or other causes beyond its control. Interruption claims are handled under the state tariff schedule.
        issues: [service_outage]
        source: https://www.eversource.com/residential/services/claims/property-damage-claims
        last_verified: 2026-10-12
      - kind: process
        claim: The claims process takes approximately 30 days; complex reviews may take longer. A decision waits until Eversource receives itemized bills and estimates.
        issues: [service_outage]
        source: https://www.eversource.com/residential/services/claims/property-damage-claims
        last_verified: 2026-10-12

facts:
  - kind: policy
    claim: In New Hampshire, a customer who believes a medical emergency exists or would result from disconnection may be protected from disconnection; call 1-800-662-7764. Unresolved billing disputes can go to the New Hampshire Department of Energy at 1-800-852-3793.
    issues: [disconnection, billing_error]
    source: https://www.eversource.com/docs/bill-inserts/nh/nh-customer-rights-mar-24.pdf?sfvrsn=5c372677_1
    last_verified: 2026-10-12
  - kind: policy
    claim: When Eversource cannot read the meter it sends an estimated bill, and adjusts billing when an actual reading is obtained.
    issues: [billing_error]
    source: https://www.eversource.com/docs/bill-inserts/nh/nh-customer-rights-mar-24.pdf?sfvrsn=5c372677_1
    last_verified: 2026-10-12

known_blockers:
  - eversource.com renders phone numbers and state programs only after a town is selected; automated fetches see placeholders. Confirm the number on the customer's bill.
  - Outage reporting online needs the account phone number or a sign-in.
  - Medical Protection needs a physician's certification.
