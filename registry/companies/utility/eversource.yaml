id: eversource
name: Eversource Energy
aliases: [Eversource, Connecticut Light and Power, CL&P, NSTAR, Public Service of New Hampshire, PSNH, Yankee Gas]
sector: utility
website: https://www.eversource.com
notes: >-
  Electric and gas utility in Connecticut, Massachusetts and New Hampshire. Regulators by state:
  Connecticut Public Utilities Regulatory Authority (PURA), Massachusetts Department of Public Utilities
  (DPU), New Hampshire Public Utilities Commission; Eversource's March 2024 NH bill insert sends unresolved
  NH billing disputes to the New Hampshire Department of Energy. eversource.com shows phone numbers only
  after a town is selected; the state numbers below come from Eversource's static maintenance page, state
  pages and bill inserts. Eversource warns customers about fake numbers online and says to use the number
  printed on the bill. Massachusetts has separate Eastern (800-592-2000) and Western (877-659-6326) lines.
  Connecticut protections below are from PURA.

