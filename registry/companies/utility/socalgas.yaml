  - {rung: written_complaint, channel: complaint-mail}
  - {rung: state_agency, agency_kind: utility_commission, note: "California Public Utilities Commission (CPUC), Consumer Affairs Branch."}
  - {rung: state_agency, agency_kind: attorney_general, note: "California Attorney General."}

playbooks:
  - issue: billing_error
    summary: Dispute the bill with customer service and in writing; if SoCalGas does not fix it, complain to the CPUC.
    evidence: [the disputed bill, previous bills, meter photos with dates, call notes with reference numbers]
    steps:
      - do: Call SoCalGas, say you dispute the bill, and ask for a bill review and a meter check if usage looks wrong. Get a reference number.
        channel: customer-service-phone
      - do: Put the dispute in writing with the account number, bill date and disputed amount.
        channel: complaint-mail
      - do: If SoCalGas does not resolve it, file a complaint with the CPUC Consumer Affairs Branch.

  - issue: disconnection
    summary: Call customer service before the shut-off date, request a payment extension, and apply for CARE and Past Due Bill Forgiveness.
    evidence: [shut-off notice, account balance, CARE enrollment, Medical Baseline approval]
    steps:
      - do: Call customer service about the shut-off notice, or request a payment extension in My Account.
        channel: customer-service-phone
      - do: If you are on CARE with $250 or more past due (some over 90 days), enroll in Past Due Bill Forgiveness.
        channel: amp-application
      - do: Apply for CARE or LIHEAP through the assistance programs page.
        channel: payment-assistance
    facts:
      - kind: compensation
        claim: Past Due Bill Forgiveness forgives 1/12 of the eligible debt each time a current bill is paid in full and on time, up to $8,000 per enrollment period. It requires CARE enrollment, $250 or more past due with some at least 90 days old, six months as a customer and one on-time payment in the prior 24 months.
        issues: [disconnection]
        source: https://www.socalgas.com/billing-payment/assistance-programs/forgiveness
        last_verified: 2026-10-12
      - kind: limit
        claim: Missing two Past Due Bill Forgiveness payments in a row ends enrollment. Forgiven amounts stay forgiven; the remaining debt returns to the balance.
        issues: [disconnection]
        source: https://www.socalgas.com/billing-payment/assistance-programs/forgiveness
        last_verified: 2026-10-12
      - kind: compensation
        claim: The Gas Assistance Fund gives a one-time grant up to $100.00 toward the gas bill through local non-profit agencies. The page currently says the fund is closed.
        issues: [disconnection]
        source: https://www.socalgas.com/billing-payment/assistance-programs/gas-assistance-fund
        last_verified: 2026-10-12

  - issue: service_outage
    summary: For damage or loss you believe SoCalGas caused, file a claim online or by mail or fax.
    evidence: [dates, itemized losses with receipts, photos, repair estimates]
    steps:
      - do: File a claim online, or mail or fax the PDF claim form with supporting documents.
        channel: claims-form
      - do: Call the Claims Department Message Center for status.
        channel: claims-phone
    facts:
      - kind: process
        claim: A SoCalGas claims representative contacts the claimant within 3-5 business days. The goal is a final decision within 30-45 days; complex claims may take longer.
        issues: [service_outage]
        source: https://www.socalgas.com/claims
        last_verified: 2026-10-12

facts:
  - kind: policy
    claim: CARE gives 20% off the monthly gas bill for income-qualified households.
    issues: [disconnection]
    source: https://www.socalgas.com/billing-payment/assistance-programs
    last_verified: 2026-10-12
  - kind: policy
    claim: Medical Baseline eligibility is based on medical condition, not income. It gives a daily allowance of .822 therms (about 25 more therms per month) at the lowest baseline rate. Non-permanent conditions recertify every two years; permanent conditions every four years.
    issues: [disconnection]
    source: https://www.socalgas.com/billing-payment/assistance-programs/medical-baseline-allowance
    last_verified: 2026-10-12

known_blockers:
  - socalgas.com/contact-us returns 403 to automated fetches; use /about-us/contact-us.
  - Payment extensions and Past Due Bill Forgiveness enrollment need a My Account sign-in.
  - The Medical Baseline application needs a medical provider to complete Part 2.

official_domains: [socalgas.com]

security:
  never_asks:
    - kind: policy
      claim: SoCalGas will never ask for credit card or banking information over the phone.
      source: https://www.socalgas.com/safety/safety-and-prevention/scams
      last_verified: 2026-10-12
  known_scams:
    - kind: policy
      claim: Callers spoof caller ID to appear to be SoCalGas or a partner, then try to sell products, collect personal information, or say a payment is due when it is not.
      source: https://www.socalgas.com/safety/safety-and-prevention/scams
      last_verified: 2026-10-12
    - kind: policy
      claim: Callers or door-to-door impostors threaten to turn off service unless the customer pays immediately with prepaid cash cards, then send the customer to another phone number where the card's value is taken.
      source: https://www.socalgas.com/safety/safety-and-prevention/scams
      last_verified: 2026-10-12
    - kind: policy
      claim: Scammers say a "special government program" will pay utility bills and give a fake bank routing number for online payment. No such federal program exists.
      source: https://www.socalgas.com/safety/safety-and-prevention/scams
      last_verified: 2026-10-12
    - kind: policy
      claim: Unofficial websites or partners at the top of search results take "payments" or give a phone number where the customer is asked for billing and credit card information. The money goes to the scammer.
      source: https://www.socalgas.com/safety/safety-and-prevention/scams
      last_verified: 2026-10-12
    - kind: policy
      claim: Suspicious emails look like bills from another utility company and can contain the customer's real name or address.
      source: https://www.socalgas.com/safety/safety-and-prevention/scams
      last_verified: 2026-10-12
  report_phishing:
    - id: verify-phone
      type: phone
      label: Verify someone who claims to represent SoCalGas
      value: +1-800-427-2200
      source: https://www.socalgas.com/safety/safety-and-prevention/scams
      last_verified: 2026-10-12
    - id: verify-phone-spanish
      type: phone
      label: Verify someone who claims to represent SoCalGas (Spanish)
      value: +1-800-342-4545
      source: https://www.socalgas.com/safety/safety-and-prevention/scams
      last_verified: 2026-10-12
