id: washington-gas
name: Washington Gas Light Company
aliases: [Washington Gas, WGL, Washington Gas Light, washgas]
sector: utility
parent: WGL Holdings (AltaGas Ltd.)
website: https://www.washingtongas.com
account_url: https://my.washingtongas.com/portal/
notes: >-
  Natural gas utility for Washington, D.C., suburban Maryland and Northern Virginia, plus the Shenandoah Valley
  of Virginia (separate phone line). Regulated by the Public Service Commission of the District of Columbia,
  the Maryland Public Service Commission and the Virginia State Corporation Commission (Division of Public
  Utility Regulation). Customers who buy gas from a third-party supplier still call Washington Gas for leaks,
  service and delivery charges.

