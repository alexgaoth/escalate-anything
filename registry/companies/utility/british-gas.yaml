id: british-gas
name: British Gas
aliases: [British Gas Trading, British Gas energy, BG energy]
sector: utility
countries: [gb]
parent: Centrica plc
website: https://www.britishgas.co.uk
account_url: https://www.britishgas.co.uk/identity/
regulators: [uk-ofgem, uk-energy-ombudsman, uk-citizens-advice]
notes: >-
  British Gas is the trading name of British Gas Trading Limited, part of Centrica. This file covers household gas and
  electricity supply in Great Britain (England, Scotland, Wales) only; Northern Ireland has a different regulator.
  British Gas also sells HomeCare boiler and home cover (Home Services, a separate line, 0333 009 5784); this file does
  not cover HomeCare. In Scotland the same company trades as Scottish Gas (scottishgas.co.uk), which this file does not
  cover. The Energy Ombudsman lists customers moved to British Gas after Tomato Energy, Rebel Energy, Together Energy,
  Social Energy and People's Energy failed under British Gas, and tells former British Gas Evolve customers to continue
  their dispute with British Gas. Related rules: uk-energy-back-billing, uk-energy-guaranteed-standards,
  uk-energy-ombudsman-8-weeks, uk-energy-price-cap.

