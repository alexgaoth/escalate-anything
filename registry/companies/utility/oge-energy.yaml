id: oge-energy
name: Oklahoma Gas and Electric Company (OG&E)
aliases: [OG&E, OGE, Oklahoma Gas & Electric, OGE Energy, OGE Energy Corp]
sector: utility
parent: OGE Energy Corp.
website: https://www.oge.com
notes: >-
  Electric utility in Oklahoma and western Arkansas. Oklahoma service is regulated by the Oklahoma
  Corporation Commission (OCC), Public Utility Division, Consumer Services; Arkansas service by the
  Arkansas Public Service Commission (APSC). OG&E's contact page lists Oklahoma numbers only (OKC metro
  and all other areas); its Arkansas customer guide uses the same 800 numbers. Oklahoma and Arkansas rules
  on disconnection differ; the facts below say which state each applies to. The OG&E Arkansas customer
  guide used here is the 2024 edition.

