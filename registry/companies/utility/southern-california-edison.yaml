  - {rung: written_complaint, note: "SCE does not publish a complaint form or complaint address on the pages reviewed. Send a dated letter and keep call notes with reference numbers."}
  - {rung: state_agency, agency_kind: utility_commission, note: "California Public Utilities Commission (CPUC), Consumer Affairs Branch."}
  - {rung: state_agency, agency_kind: attorney_general, note: "California Attorney General."}

playbooks:
  - issue: billing_error
    summary: Dispute the bill with SCE customer service and get a reference number; if SCE does not fix it, complain to the CPUC.
    evidence: [the disputed bill, previous bills, meter photos with dates, call notes with reference numbers]
    steps:
      - do: Call SCE, say you dispute the bill, and ask for a bill review and, if usage looks wrong, a meter check. Get a reference number.
        channel: customer-service-phone
      - do: Put the dispute in writing with the account number, the bill date and the amount you dispute. Keep a copy.
      - do: If SCE does not resolve it, file a complaint with the CPUC Consumer Affairs Branch.

  - issue: disconnection
    summary: Call before the shutoff date, ask for a payment arrangement, and apply for AMP, CARE/FERA or the Energy Assistance Fund.
    evidence: [disconnection notice, account balance, CARE/FERA enrollment, Medical Baseline approval]
    steps:
      - do: Request a payment arrangement in My Account or by phone before the shutoff date.
        channel: payment-arrangement
      - do: If you are on CARE or FERA with more than $500 past due, apply for AMP debt forgiveness.
        channel: amp-application
      - do: Ask a local United Way agency for an Energy Assistance Fund grant.
        channel: payment-assistance
      - do: If someone in the home uses electric medical equipment, apply for Medical Baseline.
        channel: medical-baseline
    facts:
      - kind: compensation
        claim: The Arrearage Management Plan forgives 1/12 of the past-due amount for each on-time payment, up to $8,000. It needs CARE or FERA enrollment, more than $500 past due (some over 90 days), at least six months as a customer, and on-time payments for the next 12 months.
        issues: [disconnection]
        source: https://www.sce.com/save-money/income-qualified-programs/arrearage-management-plans
        last_verified: 2026-10-12
      - kind: limit
        claim: Missing two consecutive payments or three non-consecutive payments removes a customer from AMP. Net Energy Metering, Solar Billing Plan, Direct Access and master-metered customers cannot enroll.
        issues: [disconnection]
        source: https://www.sce.com/save-money/income-qualified-programs/arrearage-management-plans
        last_verified: 2026-10-12
      - kind: compensation
        claim: The Energy Assistance Fund pays up to $200 (up to $300 for an all-electric household) toward the SCE bill once in a 12-month period for income-qualified residential customers. Apply through a United Way or partner agency.
        issues: [disconnection]
        source: https://www.sce.com/save-money/rebates-financial-assistance/bill-assistance-programs/energy-assistance-fund
        last_verified: 2026-10-12

  - issue: service_outage
    summary: Report the outage; SCE pays claims for losses caused by its negligence, not for weather outages.
    evidence: [outage dates and times, itemized losses with receipts, photos, repair estimates]
    steps:
      - do: Report the outage online or by phone.
        channel: outage-report-online
      - do: If you believe SCE caused your loss, submit one claim online, by phone, email or mail.
        channel: claims-form
      - do: For Eaton Fire losses, use the Wildfire Recovery Compensation Program, not the general claims process.
    facts:
      - kind: policy
        claim: SCE is generally responsible for losses caused by its negligence. Outages and losses from forces outside its control, such as weather, are often not its responsibility. For damaged property it pays the least expensive of repair, fair market value or replacement.
        issues: [service_outage]
        source: https://www.sce.com/customer-service/request-support/claims
        last_verified: 2026-10-12
      - kind: deadline
        claim: The statute of limitations for an SCE claim is 3 years for property damage and 2 years for bodily injury. SCE's goal is to decide most claims within 30 days of receipt.
        issues: [service_outage]
        source: https://www.sce.com/customer-service/request-support/claims
        last_verified: 2026-10-12

facts:
  - kind: policy
    claim: Medical Baseline gives an extra 16.5 kWh per day at the lowest baseline rate, or a flat 11% discount on rate plans without a baseline such as Time-of-Use. A medical professional must sign the application.
    issues: [disconnection]
    source: https://www.sce.com/save-money/rebates-financial-assistance/bill-assistance-programs/medical-baseline-allowance
    last_verified: 2026-10-12
  - kind: deadline
    claim: Medical Baseline recertification is every four years for permanent conditions (customer completes Part 1) and every two years for non-permanent conditions (medical professional completes Part 2).
    issues: [disconnection]
    source: https://www.sce.com/save-money/rebates-financial-assistance/bill-assistance-programs/medical-baseline-allowance
    last_verified: 2026-10-12

known_blockers:
  - Payment arrangements online need a My Account sign-in.
  - The Medical Baseline application needs a medical professional's signature.
  - SCE's tariff rules (deposits, disputed bills, meter tests, disconnection) are hosted in a SharePoint folder that did not load for review.
