id: southern-california-edison
name: Southern California Edison
aliases: [SCE, Edison, So Cal Edison]
sector: utility
parent: Edison International
website: https://www.sce.com
account_url: https://www.sce.com/mysce/myaccount
notes: >-
  Electric utility for central, coastal and southern California (not San Diego). Regulated by the
  California Public Utilities Commission (CPUC). Claims for losses from the Eaton Fire are
  handled only through SCE's separate Wildfire Recovery Compensation Program, not the general claims process.
  SCE publishes 1-800-284-2365 as Customer Service/Customer Support and 1-800-655-4555 on the
  Medical Baseline page.

