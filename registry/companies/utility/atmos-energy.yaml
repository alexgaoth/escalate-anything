id: atmos-energy
name: Atmos Energy Corporation
aliases: [Atmos Energy, Atmos]
sector: utility
website: https://www.atmosenergy.com
account_url: https://www.atmosenergy.com/accountcenter/logon/login.html
notes: >-
  Natural gas distribution utility in eight states: Colorado, Kansas, Kentucky, Louisiana, Mississippi,
  Tennessee, Texas and Virginia. One customer service number serves all states. Each state has its own
  regulator and rules: Colorado Public Utilities Commission, Kansas Corporation Commission, Kentucky Public
  Service Commission, Louisiana Public Service Commission, Mississippi Public Service Commission, Tennessee
  Public Utility Commission, Virginia State Corporation Commission, and in Texas the Railroad Commission of
  Texas (RRC), which regulates gas utilities there (not the Public Utility Commission of Texas). In Texas,
  customers inside city limits complain to their city; the RRC has original jurisdiction outside city
  limits. Disconnection protections differ by state; the facts below say which state each covers.

