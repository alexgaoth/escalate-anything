id: oncor
name: Oncor Electric Delivery
aliases: [Oncor]
sector: utility
website: https://www.oncor.com
notes: >-
  Transmission and distribution utility (TDU) in the Texas competitive market. Oncor owns the poles, wires and meters and handles outages, meter tests and
  connections; it does not bill residential customers. Billing, payment plans and disconnection notices
  come from the customer's retail electric provider (REP), so billing complaints go to the REP. Regulated
  by the Public Utility Commission of Texas.

channels:
  - id: outage-phone
    type: phone
    label: Outages and emergencies (residential and small business)
    value: +1-888-313-4747
    hours: 24/7
    purposes: [service_outage]
    source: https://www.txu.com/-/media/Project/VistraApps/DT/Files/Content-Pages/Help-Center/YRAC.pdf
    last_verified: 2026-10-12

escalation:
  - {rung: frontline, channel: outage-phone, note: "For outages, meters and wires. Billing issues go to the retail electric provider."}
  - {rung: supervisor}
  - {rung: written_complaint}
  - {rung: state_agency, agency_kind: utility_commission, note: "Public Utility Commission of Texas."}
  - {rung: state_agency, agency_kind: attorney_general}

playbooks:
  - issue: service_outage
    summary: Report the outage to Oncor; the retail provider cannot restore power.
    evidence: [service address, ESI ID, outage start time]
    steps:
      - do: Call Oncor's outage line to report the outage or a downed line.
        channel: outage-phone
      - do: If someone at home depends on electric medical equipment, ask the retail provider for the Critical Care or Chronic Condition application. The TDU (Oncor) processes it and decides eligibility.
    facts:
      - kind: contact
        claim: Texas retail providers list Oncor's outage and emergency line as 1-888-313-4747, available 24 hours a day, 7 days a week.
        issues: [service_outage]
        source: https://www.reliant.com/en/residential/help-support/contact/report-an-outage
        last_verified: 2026-10-12
      - kind: process
        claim: The customer gets the Critical Care or Chronic Condition application from the REP; the local TDU processes it, decides eligibility and sends renewal applications. Critical Care designation lasts two years.
        issues: [service_outage, disconnection]
        source: https://www.txu.com/-/media/Project/VistraApps/DT/Files/Content-Pages/Help-Center/YRAC.pdf
        last_verified: 2026-10-12
  - issue: billing_error
    summary: Ask the retail provider to request a meter test from Oncor if you think the meter is wrong.
    evidence: [bills, meter readings, ESI ID]
    steps:
      - do: Ask your retail electric provider to request a meter test from Oncor. You may also request it yourself.
      - do: Dispute the bill amount with the retail provider; complain to the PUCT if it is not resolved.
    facts:
      - kind: fee
        claim: A customer may request a meter test, and the REP may request it from the TDU. If tested more than once in four years and the meter works properly, the customer may be charged the TDU's approved fee.
        issues: [billing_error]
        source: https://www.txu.com/-/media/Project/VistraApps/DT/Files/Content-Pages/Help-Center/YRAC.pdf
        last_verified: 2026-10-12

known_blockers:
  - oncor.com timed out on every automated request on 2026-10-12. The outage number comes from Texas retail providers' published documents.

official_domains: [oncor.com]

security:
  never_asks:
    - kind: policy
      claim: No Oncor employee will ever come to a customer's home to collect a payment, or ask by phone, text, in person or online for credit card information.
      source: https://www.oncor.com/content/oncorwww/wire/en/home/safety/oncor-recognizes-utility-scam-awareness-week.html
      last_verified: 2026-10-12
    - kind: policy
      claim: Oncor will never ask to collect money to avoid service disconnection or shutoff. Oncor representatives do not need to enter a customer's home for any reason.
      source: https://www.oncor.com/content/oncorwww/wire/en/home/safety/oncor-recognizes-utility-scam-awareness-week.html
      last_verified: 2026-10-12
    - kind: policy
      claim: Oncor will never ask customers to pay with a prepaid debit card, gift card, any form of cryptocurrency or a third-party digital payment app.
      source: https://www.oncor.com/content/oncorwww/wire/en/home/safety/oncor_raises_awareness_of_utility_scams_during_national_consumer_protection_week.html
      last_verified: 2026-10-12
  known_scams:
    - kind: policy
      claim: Impostors pose as Oncor employees to collect money or credit card information and imply that electric service will be disconnected if the customer does not pay. Oncor delivers electricity but does not sell it to customers directly.
      source: https://www.oncor.com/content/oncorwww/wire/en/home/safety/oncor-recognizes-utility-scam-awareness-week.html
      last_verified: 2026-10-12
    - kind: policy
      claim: Scammers tell the customer to buy a prepaid debit card for immediate bill payment, then ask for the card's number when the customer calls back.
      source: https://www.oncor.com/content/oncorwww/wire/en/home/safety/oncor-recognizes-utility-scam-awareness-week.html
      last_verified: 2026-10-12
    - kind: policy
      claim: Scammers ask for payment in cryptocurrency such as Bitcoin.
      source: https://www.oncor.com/content/oncorwww/wire/en/home/safety/oncor-recognizes-utility-scam-awareness-week.html
      last_verified: 2026-10-12
    - kind: policy
      claim: Door-to-door impostors say they are responding to reports of scammers in the neighborhood or doing unscheduled work that requires payment, such as a new meter or meter upgrade paid in cash or with a prepaid debit card.
      source: https://www.oncor.com/content/oncorwww/wire/en/home/safety/oncor_raises_awareness_of_utility_scams_during_national_consumer_protection_week.html
      last_verified: 2026-10-12
    - kind: policy
      claim: Scammers use fraudulent phone numbers or websites that appear in internet search results.
      source: https://www.oncor.com/content/oncorwww/wire/en/home/safety/oncor-recognizes-utility-scam-awareness-week.html
      last_verified: 2026-10-12
  report_phishing:
    - id: verify-employee-phone
      type: phone
      label: Confirm the identity of someone who claims to work for Oncor (general inquiries)
      value: +1-888-313-6862
      hours: Monday to Friday, 8 a.m. to 6 p.m. Central Time
      source: https://www.oncor.com/content/oncorwww/wire/en/home/safety/oncor-recognizes-utility-scam-awareness-week.html
      last_verified: 2026-10-12
