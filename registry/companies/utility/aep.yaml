id: aep
name: American Electric Power
aliases: [AEP, AEP Ohio, Ohio Power Company, Appalachian Power, Indiana Michigan Power, I&M, Kentucky Power, Public Service Company of Oklahoma, PSO, Southwestern Electric Power Company, SWEPCO, AEP Texas]
sector: utility
website: https://www.aep.com
notes: >-
  AEP operating companies and their states: AEP Ohio (Ohio Power Company, Ohio), Appalachian Power
  (Virginia, West Virginia, Tennessee), Indiana Michigan Power (Indiana, Michigan), Kentucky Power
  (eastern Kentucky), Public Service Company of Oklahoma (Oklahoma), SWEPCO (Louisiana, Arkansas, East
  Texas and the north Texas Panhandle) and AEP Texas (south and west Texas). Each has its own website and
  phone number; use the one on the bill. Texas retail electric providers list AEP Texas as the delivery
  utility (TDU) for outages, so customers there are billed by their retail provider and complain about
  bills to that provider. State commissions include the Public Utilities Commission of Ohio (PUCO),
  Virginia State Corporation Commission, Public Service Commission of West Virginia, Tennessee Public
  Utility Commission, Indiana Utility Regulatory Commission, Michigan Public Service Commission,
  Kentucky Public Service Commission, Oklahoma Corporation Commission, Louisiana Public Service
  Commission, Arkansas Public Service Commission and Public Utility Commission of Texas.

