id: duke-energy
name: Duke Energy
aliases: [Duke, Duke Energy Carolinas, Duke Energy Progress, Duke Energy Florida, Duke Energy Indiana, Duke Energy Ohio, Duke Energy Kentucky, Piedmont Natural Gas]
sector: utility
website: https://www.duke-energy.com
notes: >-
  Electric operating companies: Duke Energy Carolinas and Duke Energy Progress (North Carolina and South
  Carolina), Duke Energy Florida, Duke Energy Indiana, and Duke Energy Ohio/Kentucky (electric and gas).
  Piedmont Natural Gas is Duke's gas utility in the Carolinas. Phone numbers differ by operating company;
  the bill shows which one serves the account. Duke Energy Carolinas and Duke Energy Progress applied in
  2025 to combine into one utility; Duke targets January 1, 2027. Duke sold its Tennessee Piedmont Natural
  Gas business to Spire on March 31, 2026 (now Spire Tennessee). State commissions: North Carolina
  Utilities Commission (consumer complaints go to its Public Staff), Public Service Commission of South
  Carolina, Florida Public Service Commission, Indiana Utility Regulatory Commission, Public Utilities
  Commission of Ohio, Kentucky Public Service Commission.

