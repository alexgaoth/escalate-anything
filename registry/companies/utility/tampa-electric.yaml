id: tampa-electric
name: Tampa Electric Company
aliases: [Tampa Electric, TECO, TECO Tampa Electric]
sector: utility
parent: Emera Inc.
website: https://www.tampaelectric.com
account_url: https://account.tecoenergy.com
notes: >-
  Electric utility for the Tampa Bay area of Florida (the site footer says "Tampa Electric is an Emera
  company"). Account sign-in, online payment and outage reporting use tecoenergy.com subdomains
  (account.tecoenergy.com, outage.tecoenergy.com). Peoples Gas is a separate natural gas company and is
  not covered by this file. Regulated by the Florida Public Service Commission (PSC), Office of
  Consumer Assistance & Outreach, 1-800-342-3552; the PSC says to contact the utility first and to call
  the PSC if a billing complaint is not resolved. Florida rules for disconnection are in Rule 25-6.105,
  F.A.C., and Tampa Electric's tariff (Section 5, Rules and Regulations).

