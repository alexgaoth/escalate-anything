playbooks:
  - issue: billing_error
    summary: Dispute the bill with ComEd, ask for a supervisor, then file an informal complaint with the ICC Consumer Services Division.
    evidence: [the disputed bill, previous bills, meter photos with dates, call notes with reference numbers]
    steps:
      - do: Call ComEd and dispute the bill. If the representative cannot help, ask for a supervisor. Get a reference number.
        channel: customer-service-phone
      - do: Put the dispute in writing through the online contact form.
        channel: complaint-form
      - do: If a supervisor cannot resolve it, file an informal complaint with the ICC Consumer Services Division.
    facts:
      - kind: process
        claim: ComEd's handbook says to ask for a supervisor if a representative cannot help, then contact the ICC Consumer Services Division. During an ICC informal complaint, an ICC staff member and a ComEd representative are assigned, and ComEd has 14 days to attempt to resolve it. A formal ICC complaint requires an informal complaint first.
        issues: [billing_error, poor_service]
        source: https://www.comed.com/SiteCollectionDocuments/ComEd_Welcome_Kit.pdf
        last_verified: 2026-10-12

  - issue: disconnection
    summary: Ask for a deferred payment arrangement, call the assistance line, and send a medical certificate for 60 days of protection.
    evidence: [disconnection notice, account balance, medical certification, LIHEAP application]
    steps:
      - do: Set up a deferred payment arrangement online or by phone before the disconnection date.
        channel: payment-arrangement
      - do: Call the financial assistance line about LIHEAP and ComEd programs.
        channel: payment-assistance-phone
      - do: If someone in the home has a medical need for service, have a doctor or the local Board of Health send a medical certification.
        channel: medical-certification
      - do: If ComEd does not help, file an informal complaint with the ICC.
    facts:
      - kind: policy
        claim: A residential customer with a past-due amount is eligible for a deferred payment arrangement as long as they have not failed to complete one in the past 12 months.
        issues: [disconnection]
        source: https://www.comed.com/SiteCollectionDocuments/ComEd_Welcome_Kit.pdf
        last_verified: 2026-10-12
      - kind: policy
        claim: ComEd's deferred payment arrangement takes a down payment and spreads the rest over 4-12 months depending on eligibility, paid with the regular monthly bill.
        issues: [disconnection]
        source: https://www.comed.com/DPA
        last_verified: 2026-10-12
      - kind: policy
        claim: A medical certificate from a doctor or local Board of Health halts disconnection for 60 days if the customer has not used one in the past 12 months, or paid off the balance from the last one. ComEd then contacts the customer to set up a payment arrangement.
        issues: [disconnection]
        source: https://www.comed.com/my-account/customer-support/contact-us/medical-certification
        last_verified: 2026-10-12
      - kind: policy
        claim: Under ICC rules (83 Ill. Adm. Code 280), certified medical necessity gives temporary (60 days) protection from disconnection, and a section governs disconnection of residential heating service from December 1 through March 31.
        issues: [disconnection]
        source: https://www.icc.illinois.gov/consumers/rules-applicable-to-utilities
        last_verified: 2026-10-12
      - kind: deadline
        claim: If service was disconnected for non-payment and the payment covers the full amount needed, power should be restored within 2 hours.
        issues: [disconnection]
        source: https://www.comed.com/SiteCollectionDocuments/ComEd_Welcome_Kit.pdf
        last_verified: 2026-10-12

  - issue: service_outage
    summary: Report the outage; ComEd reimburses storm and equipment-failure losses only under Illinois law for large outages (more than 30,000 customers for 4+ hours).
    evidence: [outage dates and times, itemized list of spoiled food with prices, receipts, repair bills or estimates, photos]
    steps:
      - do: Report the outage online or by phone.
        channel: outage-report-online
      - do: To claim a loss, mail the claim form with documentation. Keep damaged items (except spoiled food) until ComEd authorizes disposal.
        channel: claims-mail
      - do: If you do not accept ComEd's proposed resolution, complain to the ICC.
    facts:
      - kind: policy
        claim: ComEd does not reimburse damage from storms, wind, ice, accidents beyond its control, vandalism, tree or wildlife contact, equipment failure, scheduled outages or normal operations, except possibly under 220 ILCS 5/16-125(e) and (f).
        issues: [service_outage]
        source: https://www.comed.com/SiteCollectionDocuments/MyAccount/CustomerSupport/comedclaimform.pdf
        last_verified: 2026-10-12
      - kind: compensation
        claim: Under 220 ILCS 5/16-125(e), a customer may claim actual damages when more than 30,000 customers have a continuous interruption of four hours or more; 16-125(f) covers replacement value of goods damaged by a surge affecting more than 30,000 customers. The ICC can waive this for unpreventable weather, tampering, unrest or animals, or third-party damage.
        issues: [service_outage]
        source: https://www.comed.com/SiteCollectionDocuments/MyAccount/CustomerSupport/comedclaimform.pdf
        last_verified: 2026-10-12
      - kind: process
        claim: Food spoilage claims need an itemized list of spoiled items with each price and the total, plus receipts or canceled checks if any.
        issues: [service_outage]
        source: https://www.comed.com/SiteCollectionDocuments/MyAccount/CustomerSupport/comedclaimform.pdf
        last_verified: 2026-10-12

  - issue: deposit_refund
    summary: ComEd refunds deposits with interest after 12 months of satisfactory payment; eligible residential customers are no longer charged deposits.
    evidence: [deposit receipt, 12 months of payment history]
    steps:
      - do: After 12 consecutive months with fewer than four late payments, ask ComEd to refund the deposit.
        channel: customer-service-phone
    facts:
      - kind: policy
        claim: Deposits earn interest at an ICC-set rate and are refunded after 12 consecutive months of service with fewer than four late payments, no disconnection for non-payment, no meter tampering and no past-due balance. Eligible residential customers are no longer assessed deposits.
        issues: [deposit_refund]
        source: https://www.comed.com/SiteCollectionDocuments/ComEd_Welcome_Kit.pdf
        last_verified: 2026-10-12

known_blockers:
  - comed.com HTML pages return empty to automated fetches; use the phone line or the PDF forms.
  - Medical certification must come from a doctor or the local Board of Health.
