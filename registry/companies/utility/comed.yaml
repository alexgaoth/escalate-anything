  - {rung: written_complaint, channel: complaint-form}
  - {rung: state_agency, agency_kind: utility_commission, note: "Illinois Commerce Commission (ICC), Consumer Services Division. Contact ComEd first; a formal complaint requires an informal complaint first."}
