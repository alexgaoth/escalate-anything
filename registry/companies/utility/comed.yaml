id: comed
name: Commonwealth Edison Company
aliases: [ComEd, Commonwealth Edison]
sector: utility
parent: Exelon Corporation
website: https://www.comed.com
notes: >-
  Electric utility for northern Illinois, including Chicago. Regulated by the Illinois Commerce Commission
  (ICC), whose disconnection, deposit and payment rules are in 83 Ill. Adm. Code 280. comed.com pages
  return empty to automated fetches; values below come from ComEd's customer handbook and claim form
  PDFs (2023) and comed.com search results.

