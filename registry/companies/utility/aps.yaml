escalation:
  - {rung: frontline, channel: main-phone}
  - {rung: supervisor}
  - {rung: written_complaint, channel: residential-email, note: "Or a letter to letters-mail."}
  - {rung: state_agency, agency_kind: utility_commission, note: "Arizona Corporation Commission."}
  - {rung: state_agency, agency_kind: attorney_general}

playbooks:
  - issue: billing_error
    summary: Dispute by phone, chat or email; escalate to the Arizona Corporation Commission.
    evidence: [the bill, meter readings, earlier bills, notes of each contact]
    steps:
      - do: Call or chat with APS. Ask whether the reading was estimated and ask for a correction or a meter test.
        channel: main-phone
      - do: Put the dispute in writing by email and keep the reply.
        channel: residential-email
      - do: If not resolved, complain to the Arizona Corporation Commission.
  - issue: disconnection
    summary: Customers owing $300 or less are not at risk of disconnection, and no residential disconnections happen June 1 to October 15; arrange up to 12 monthly payments.
    evidence: [past-due notice, account number]
    steps:
      - do: Set up a payment arrangement online or by calling the credit line.
        channel: payment-arrangement
      - do: Apply for Crisis Bill Assistance, APS CARE or the Energy Support discount.
        channel: assistance-page
    facts:
      - kind: policy
        claim: Between June 1 and October 15, APS does not disconnect power for nonpayment for residential customers, and charges no late fee during that period.
        issues: [disconnection]
        source: https://www.aps.com/en/Residential/Billing-and-Payment/Payment-Policies
        last_verified: 2026-10-12
      - kind: limit
        claim: Customers with a past-due balance of $300 or less are not at risk of disconnection.
        issues: [disconnection]
        source: https://www.aps.com/en/Residential/Billing-and-Payment/Payment-Policies
        last_verified: 2026-10-12
      - kind: fee
        claim: Residential customers seven days past due on the current bill may be charged a late fee of 1.5% of the past-due amount plus tax.
        issues: [disconnection, billing_error]
        source: https://www.aps.com/en/Residential/Billing-and-Payment/Payment-Policies
        last_verified: 2026-10-12
      - kind: policy
        claim: A payment arrangement can spread the balance over up to 12 monthly payments of at least $25; the 12-month option needs a balance over $300. Customers with a balance of $75 or more typically qualify. Budget Billing customers cannot set one up.
        issues: [disconnection]
        source: https://www.aps.com/en/Residential/Billing-and-Payment/Payment-Arrangement
        last_verified: 2026-10-12
      - kind: compensation
        claim: Crisis Bill Assistance gives up to $1,000 through partner agencies for a temporary hardship; APS CARE gives up to $500 through The Salvation Army regardless of income.
        issues: [disconnection]
        source: https://www.aps.com/en/Residential/Account/Assistance-Programs
        last_verified: 2026-10-12
      - kind: compensation
        claim: The Energy Support Program gives a monthly discount of up to 25% or 60% based on household income; qualifying customers who depend on life-saving medical equipment may get up to 35% or 60%.
        issues: [disconnection, bill_increase]
        source: https://www.aps.com/en/Residential/Account/Assistance-Programs
        last_verified: 2026-10-12
  - issue: service_outage
    summary: Report outages any time; register medical equipment users for planned-outage notices.
    evidence: [service address, outage start time]
    steps:
      - do: Call the outage hotline or report online.
        channel: outage-phone
      - do: For losses caused by an outage, file a claim.
        channel: claim-form
      - do: If someone has a life-threatening illness or uses critical medical equipment, apply for the Medical Care Program to get notices before planned outages.
        channel: medical-care-program-mail

known_blockers:
  - Online payment arrangements and account changes need sign-in.
  - The Medical Care Program application needs a licensed medical professional's section.

official_domains: [aps.com]

security:
  never_asks:
    - kind: policy
      claim: APS will never send QR codes or texts, or call, demanding immediate payment.
      source: https://www.aps.com/scams
      last_verified: 2026-10-12
    - kind: policy
      claim: APS will never require payment by QR code or prepaid card, and will never specify which payment method a customer must use.
      source: https://www.aps.com/scams
      last_verified: 2026-10-12
    - kind: policy
      claim: APS field personnel will never visit homes to offer refunds or deposits or to collect payments.
      source: https://www.aps.com/scams
      last_verified: 2026-10-12
    - kind: policy
      claim: Customers with past-due accounts get advance shut-off notices, such as a bill message or door hanger, and never a single notification one hour or less before shut-off.
      source: https://www.aps.com/scams
      last_verified: 2026-10-12
  known_scams:
    - kind: policy
      claim: Scammers say the energy bill is past due and service will be shut off unless a payment is made right away, usually within an hour or less.
      source: https://www.aps.com/scams
      last_verified: 2026-10-12
    - kind: policy
      claim: Scammers tell customers to buy a prepaid card and call back with the card number, which gives them instant access to the funds.
      source: https://www.aps.com/scams
      last_verified: 2026-10-12
    - kind: policy
      claim: Solar installers claim to be affiliated with APS or offer special deals or incentives by phone or door to door.
      source: https://www.aps.com/scams
      last_verified: 2026-10-12
    - kind: policy
      claim: Scammers spoof APS phone numbers on caller ID, and have also spoofed the numbers of community service organizations such as Chicanos Por La Causa.
      source: https://www.aps.com/scams
      last_verified: 2026-10-12
  report_phishing:
    - id: report-scam-phoenix-phone
      type: phone
      label: Report a scam or verify a contact (APS Customer Experience Center, metro Phoenix)
      value: +1-602-371-7171
      source: https://www.aps.com/scams
      last_verified: 2026-10-12
    - id: report-scam-phone
      type: phone
      label: Report a scam or verify a contact (APS Customer Experience Center, other areas)
      value: +1-800-253-9405
      source: https://www.aps.com/scams
      last_verified: 2026-10-12
