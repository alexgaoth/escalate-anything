id: aps
name: Arizona Public Service
aliases: [APS, Arizona Public Service Company]
sector: utility
website: https://www.aps.com
account_url: https://www.aps.com/Authorization/Login
notes: >-
  Electric utility in Arizona. Regulated by the Arizona Corporation Commission. APS does not disconnect residential customers for
  nonpayment from June 1 to October 15.

