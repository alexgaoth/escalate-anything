id: dte-energy
name: DTE Energy
aliases: [DTE, DTE Electric, DTE Gas]
sector: utility
parent: DTE Energy Company
website: https://www.dteenergy.com
notes: >-
  Electric (DTE Electric, southeast Michigan) and natural gas (DTE Gas, Michigan) utility. Regulated by
  the Michigan Public Service Commission (MPSC), whose rules set automatic outage credits. On 2026-10-12
  the DTE home page said website and app sign-in and payments were having technical issues.

