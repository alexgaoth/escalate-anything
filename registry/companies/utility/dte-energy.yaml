escalation:
  - {rung: frontline, channel: customer-service-phone}
  - {rung: supervisor, note: "Ask the representative for a supervisor. Write down the name and reference number."}
  - {rung: written_complaint, channel: complaint-form}
  - {rung: state_agency, agency_kind: utility_commission, note: "Michigan Public Service Commission (MPSC)."}
  - {rung: state_agency, agency_kind: attorney_general, note: "Michigan Attorney General."}

playbooks:
  - issue: billing_error
    summary: Dispute the bill by phone or the complaint form; if DTE does not fix it, complain to the MPSC.
    evidence: [the disputed bill, previous bills, meter photos with dates, call notes with reference numbers]
    steps:
      - do: Call DTE residential assistance, dispute the bill and ask for a meter check if usage looks wrong. Get a reference number.
        channel: customer-service-phone
      - do: Put the complaint in writing through the File a Complaint form.
        channel: complaint-form
      - do: If not resolved, complain to the Michigan Public Service Commission.

  - issue: disconnection
    summary: Call DTE for a payment agreement, enroll in the Winter Protection Plan (Nov 1-Mar 31) if eligible, and submit a medical hold for up to 21 days.
    evidence: [shutoff notice, account balance, household income documents, Medical Certification Form]
    steps:
      - do: Call DTE before the shutoff date and ask for a payment plan, or set up a Payment Agreement online.
        channel: customer-service-phone
      - do: If you are income-qualified or 65 or older, enroll in the Winter Protection Plan.
        channel: payment-assistance
      - do: For a medical emergency, send the Medical Certification Form signed by a physician or public health official.
        channel: medical-hold-email
      - do: Apply for State Emergency Relief through MI Bridges (not while on the Winter Protection Plan).
      - do: If DTE does not help, contact the MPSC before the shutoff date.
    facts:
      - kind: policy
        claim: The Winter Protection Plan runs November 1 through March 31 for income-qualified customers and seniors 65 and older regardless of income. Customers pay at least 7% of the estimated annual bill each month. Seniors disconnected before applying are reconnected without payment.
        issues: [disconnection]
        source: https://www.dteenergy.com/us/en/residential/billing-and-payments/energy-assistance/general-assistance.html
        last_verified: 2026-10-12
      - kind: policy
        claim: A medical emergency hold confirmed by a physician or public health official lasts up to 21 days. Critical Care (life-support or home medical equipment) uses the same form and must be renewed annually.
        issues: [disconnection]
        source: https://www.dteenergy.com/us/en/residential/billing-and-payments/energy-assistance/general-assistance.html
        last_verified: 2026-10-12
      - kind: policy
        claim: Active military protection gives up to 90 days, with possible extensions, when the customer or spouse is called to full-time active service; past-due amounts can go on a plan of up to 12 months.
        issues: [disconnection]
        source: https://www.dteenergy.com/us/en/residential/billing-and-payments/energy-assistance/general-assistance.html
        last_verified: 2026-10-12
      - kind: policy
        claim: Payment Agreements are available to all residential and commercial customers with a past-due balance. They need an initial down payment, with the rest in monthly installments without late fees.
        issues: [disconnection]
        source: https://www.dteenergy.com/us/en/residential/billing-and-payments/energy-assistance/payment-agreement.html
        last_verified: 2026-10-12

  - issue: service_outage
    summary: Report the outage; MPSC outage credits are automatic. DTE pays damage claims it is responsible for, not storm food loss.
    evidence: [outage dates and times, invoices, receipts, photos]
    steps:
      - do: Report the outage online or by phone.
        channel: outage-report-online
      - do: Check that the automatic outage credit appears within 1-2 billing cycles (up to 90 days). Ask DTE if it does not.
        channel: customer-service-phone
      - do: If you believe DTE caused property damage, submit the damage claim form with invoices, receipts and photos.
        channel: claims-form
    facts:
      - kind: compensation
        claim: Customers with a qualifying outage between Oct. 1, 2025 and Sept. 30, 2026 receive a $42 bill credit; outages after Oct. 1, 2026 receive $44. Qualifying outages are more than 16 hours (event affecting 1% or less of customers), more than 48 hours (event affecting more than 1%), more than 96 hours in catastrophic conditions, or six outages in 12 months.
        issues: [service_outage]
        source: https://www.dteenergy.com/us/en/residential/emergency-and-safety/problems/damages-claims.html
        last_verified: 2026-10-12
      - kind: process
        claim: Outage credit eligibility is determined automatically with no request needed; the credit posts within 1-2 billing cycles or up to 90 days after the outage.
        issues: [service_outage]
        source: https://www.dteenergy.com/us/en/residential/emergency-and-safety/problems/damages-claims.html
        last_verified: 2026-10-12
      - kind: policy
        claim: DTE is not responsible for hotel or lodging costs, food loss, or appliances damaged by voltage surges caused by storms or weather. Online damage claims get a decision within 30 days.
        issues: [service_outage]
        source: https://www.dteenergy.com/us/en/residential/emergency-and-safety/problems/damages-claims.html
        last_verified: 2026-10-12

known_blockers:
  - Payment Agreements are set up in the online account (sign-in required).
  - The Medical Certification Form must be completed in English by a physician or public health official.

official_domains: [dteenergy.com]

security:
  never_asks:
    - kind: policy
      claim: DTE does not endorse or require a prepaid debit card for payment, and does not require a specific form of payment.
      source: https://www.dteenergy.com/us/en/residential/emergency-and-safety/problems/energy-fraud-and-scams.html
      last_verified: 2026-10-12
    - kind: policy
      claim: DTE does not set unrealistic payment deadlines or threaten to disconnect power within a period of hours.
      source: https://www.dteenergy.com/us/en/residential/emergency-and-safety/problems/energy-fraud-and-scams.html
      last_verified: 2026-10-12
    - kind: policy
      claim: DTE does not collect cash or accept bill payments at homes or businesses, and its employees never deliver cash refunds or rebates to homes.
      source: https://www.dteenergy.com/us/en/residential/emergency-and-safety/problems/energy-fraud-and-scams.html
      last_verified: 2026-10-12
    - kind: policy
      claim: DTE will never come to a customer's home and ask to see the bill.
      source: https://www.dteenergy.com/us/en/residential/emergency-and-safety/problems/energy-fraud-and-scams.html
      last_verified: 2026-10-12
    - kind: policy
      claim: DTE does not charge for line clearance (tree-trimming) work.
      source: https://www.dteenergy.com/us/en/residential/emergency-and-safety/problems/energy-fraud-and-scams.html
      last_verified: 2026-10-12
    - kind: policy
      claim: DTE Energy will not ask for personal or account information in an email, unless the customer contacted DTE first and DTE is clarifying the request.
      source: https://www.dteenergy.com/us/en/residential/billing-and-payments/online-account/safety-and-security.html
      last_verified: 2026-10-12
  known_scams:
    - kind: policy
      claim: Scammers pretend to be DTE employees to get into homes, often targeting senior citizens, new homeowners and people who live alone.
      source: https://www.dteenergy.com/us/en/residential/emergency-and-safety/problems/energy-fraud-and-scams.html
      last_verified: 2026-10-12
    - kind: policy
      claim: People at the door claim to offer a DTE Electric or DTE Gas refund to get into the home.
      source: https://www.dteenergy.com/us/en/residential/emergency-and-safety/problems/energy-fraud-and-scams.html
      last_verified: 2026-10-12
    - kind: policy
      claim: Scammers place sponsored ads in search engine listings when customers search for DTE's website or try to start service or pay a bill.
      source: https://www.dteenergy.com/us/en/residential/emergency-and-safety/problems/energy-fraud-and-scams.html
      last_verified: 2026-10-12
    - kind: policy
      claim: Callers spoof caller ID to look like DTE and demand immediate payment or tell the customer to get a prepaid debit card.
      source: https://www.dteenergy.com/us/en/residential/emergency-and-safety/problems/energy-fraud-and-scams.html
      last_verified: 2026-10-12
    - kind: policy
      claim: Solar panel sellers claim to be associated with DTE. DTE does not sell solar panels or solar panel equipment.
      source: https://www.dteenergy.com/us/en/residential/emergency-and-safety/problems/energy-fraud-and-scams.html
      last_verified: 2026-10-12
  report_phishing:
    - id: report-scam-phone
      type: phone
      label: Report a suspected scam or verify a call or visit (customer service)
      value: +1-800-477-4747
      source: https://www.dteenergy.com/us/en/residential/emergency-and-safety/problems/energy-fraud-and-scams.html
      last_verified: 2026-10-12
