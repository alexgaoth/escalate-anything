id: pacificorp
name: PacifiCorp
aliases: [Rocky Mountain Power, RMP, Pacific Power]
sector: utility
website: https://www.pacificorp.com
account_url: https://csapps.pacificpower.net/idm/login
notes: >-
  Electric utility that operates as Rocky Mountain Power (rockymountainpower.net) in Utah, Wyoming and
  Idaho, and as Pacific Power (pacificpower.net) in Oregon, Washington and California. Both brands use
  customer service 1-888-221-7070 and outage line 1-877-508-5088; Rocky Mountain Power account sign-in is
  https://csapps.rockymountainpower.net/idm/login. State commissions: Utah Public Service Commission
  (informal complaints go first to the Utah Division of Public Utilities, 801-530-7622 or 800-874-0904),
  Wyoming Public Service Commission, Idaho Public Utilities Commission, Public Utility Commission of
  Oregon (503-378-6600 or 800-522-2404, puc.consumer@puc.oregon.gov), Washington Utilities and
  Transportation Commission, and California Public Utilities Commission. Wildfire: PacifiCorp's wildfire
  litigation page covers the 2020 Labor Day fires (Oregon), the Slater fire and the 2022 McKinney fire
  (California); it settles claims through litigation and settlements and publishes no wildfire claims
  intake process. Standard damage claims start with a claim form requested at 1-888-221-7070.

