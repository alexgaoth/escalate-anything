id: spire
name: Spire Inc.
aliases: [Spire, Spire Energy, Spire Missouri, Spire Alabama, Spire Gulf, Spire Mississippi, Spire Tennessee]
sector: utility
website: https://www.spireenergy.com
account_url: https://myaccount.spireenergy.com/
notes: >-
  Natural gas utility. Operating companies: Spire Missouri (Eastern and Western Missouri; Missouri Public
  Service Commission), Spire Alabama (Central and Northern Alabama) and Spire Gulf (the Mobile, Alabama
  area), both regulated by the Alabama Public Service Commission, and Spire Mississippi (Mississippi Public
  Service Commission). Each region has its own phone number, which is also its 24/7 gas emergency line.
  Since March 31, 2026, former Piedmont Natural Gas customers in Tennessee are served by Spire, but Piedmont
  keeps billing them until the transition is complete in 2027; they keep calling 800-752-7504. Spire's
  Cold Weather page prints 800-542-1234 for Western Missouri, while the contact page prints 800-582-1234;
  the contact page number is used here. The Missouri tariff facts below come from Spire Missouri's Rules
  and Regulations (P.S.C. MO. No. 9); Alabama and Mississippi rules were not checked.

