id: dominion-energy
name: Dominion Energy
aliases: [Dominion, Dominion Energy Virginia, Dominion Energy South Carolina, Virginia Electric and Power Company]
sector: utility
website: https://www.dominionenergy.com
account_url: https://myaccount.dominionenergy.com
notes: >-
  Electric utility in Virginia (Dominion Energy Virginia, legal name Virginia Electric and Power Company)
  and electric and gas utility in South Carolina (Dominion Energy South Carolina). Dominion sold its
  Ohio, Utah and North Carolina gas utilities to Enbridge in 2024; the last sale closed October 1, 2024,
  and the former Public Service Company of North Carolina now does business as Enbridge Gas North
  Carolina. Gas customers in those states should not use this file. State commissions: Virginia State
  Corporation Commission; Public Service Commission of South Carolina.

channels:
  - id: va-customer-service-phone
    type: phone
    label: Virginia customer service (1-866-DOM-HELP); also the number to report downed power lines
    value: +1-866-366-4357
    hours: Monday to Friday, 8 a.m. to 5 p.m. Eastern for customer service
    purposes: [billing_error, bill_increase, disconnection, deposit_refund, service_outage, poor_service]
    notes: Dominion says to call 911 in all emergencies. Outages can also be reported online at myaccount.dominionenergy.com or seen on outagemap.dominionenergy.com.
    source: https://www.dominionenergy.com/virginia/customer-support
    last_verified: 2026-10-12
  - id: va-payment-arrangement
    type: portal
    label: Virginia payment extension and payment plan request (sign-in)
    value: https://myaccount.dominionenergy.com/commonlanding/DeepLink/PaymentArrangement
    purposes: [disconnection]
    access: login
    source: https://www.dominionenergy.com/virginia/paying-my-bill/energy-assistance
    last_verified: 2026-10-12
  - id: va-energy-assistance-page
    type: portal
    label: Virginia energy assistance (EnergyShare, PIPP, state fuel assistance)
    value: https://www.dominionenergy.com/virginia/paying-my-bill/energy-assistance
    purposes: [disconnection]
    source: https://www.dominionenergy.com/virginia/paying-my-bill/energy-assistance
    last_verified: 2026-10-12
  - id: va-medical-email
    type: email
    label: Virginia Serious Medical Condition Certification form (physician-signed)
    value: demedical@domenergy.com
    purposes: [disconnection]
    notes: The form is on the Medical Conditions page and must be renewed every year.
    source: https://www.dominionenergy.com/virginia/start-stop-service/medical-conditions
    last_verified: 2026-10-12
  - id: sc-customer-support-phone
    type: phone
    label: South Carolina customer support (non-emergency)
    value: +1-800-251-7234
    hours: Monday to Friday, 7 a.m. to 6 p.m. ET
    purposes: [billing_error, bill_increase, disconnection, deposit_refund, poor_service]
    source: https://www.dominionenergy.com/south-carolina/customer-support
    last_verified: 2026-10-12
  - id: sc-email-form
    type: web_form
    label: South Carolina "Email Us" contact form for non-urgent account questions
    value: https://account.dominionenergysc.com/contact
    purposes: [billing_error, bill_increase, poor_service]
    source: https://www.dominionenergy.com/south-carolina/customer-support
