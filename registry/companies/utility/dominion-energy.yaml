    purposes: [service_outage]
    source: https://www.dominionenergy.com/south-carolina/report-outage-or-emergency
    last_verified: 2026-10-12
  - id: sc-gas-leak-phone
    type: phone
    label: South Carolina gas leak (call from a safe place)
    value: +1-800-815-0083
    hours: 24/7
