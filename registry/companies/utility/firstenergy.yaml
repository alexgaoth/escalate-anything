id: firstenergy
name: FirstEnergy
aliases: [FirstEnergy Corp., Ohio Edison, The Illuminating Company, CEI, Toledo Edison, Met-Ed, Metropolitan Edison, Penelec, Penn Power, West Penn Power, FirstEnergy Pennsylvania, Jersey Central Power & Light, JCP&L, Mon Power, Potomac Edison]
sector: utility
website: https://www.firstenergycorp.com
account_url: https://www.firstenergycorp.com/log_in.html
notes: >-
  FirstEnergy is the holding company for ten electric operating companies that together serve about 6 million
  customers: Ohio Edison, The Illuminating Company and Toledo Edison (Ohio); Met-Ed, Penelec, Penn Power and
  West Penn Power (Pennsylvania; consolidated into FirstEnergy Pennsylvania on January 1, 2024, brand names
  still used); Jersey Central Power & Light (New Jersey); Mon Power and Potomac Edison (West Virginia and
  Maryland). The FirstEnergy assistance page also lists a "Penelec NY" area. Each operating company has its
  own Customer Care number; use the one on the bill. Rules for shutoffs and complaints come from the state
  commission: Public Utilities Commission of Ohio (PUCO), Pennsylvania Public Utility Commission, New Jersey
  Board of Public Utilities, Public Service Commission of West Virginia, Maryland Public Service Commission
  (and the New York PSC for Penelec NY).

