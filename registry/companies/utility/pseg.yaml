id: pseg
name: Public Service Electric and Gas Company (PSE&G)
aliases: [PSE&G, PSEG, PSEG New Jersey, Public Service Electric & Gas]
sector: utility
parent: Public Service Enterprise Group (PSEG)
website: https://nj.pseg.com
account_url: https://nj.myaccount.pseg.com/user/login
notes: >-
  Electric and gas utility in New Jersey. Regulated by the New Jersey Board of Public Utilities (BPU);
  BPU's Utility Residential Customer Bill of Rights applies. This file covers New Jersey only. PSEG Long
  Island (the operator of the Long Island Power Authority's electric system in New York) has separate
  phone numbers, rules and a different regulator; see pseg-long-island.

