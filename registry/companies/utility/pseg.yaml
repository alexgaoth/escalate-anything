escalation:
  - {rung: frontline, channel: customer-service-phone}
  - {rung: supervisor, note: "Ask the representative for a supervisor. Write down the name and reference number."}
  - {rung: written_complaint, channel: complaint-email}
  - {rung: state_agency, agency_kind: utility_commission, note: "New Jersey Board of Public Utilities (BPU), Division of Customer Assistance. The BPU Bill of Rights says to call the utility first, then the BPU if the utility cannot help."}
  - {rung: state_agency, agency_kind: attorney_general, note: "New Jersey Attorney General (Division of Consumer Affairs)."}

playbooks:
  - issue: billing_error
    summary: Dispute the charge with PSE&G and pay the undisputed part; ask for a free meter test or a diversion-of-service investigation if usage looks too high; then go to the BPU.
    evidence: [the disputed bill, previous bills, meter photos with dates, call notes with reference numbers]
    steps:
      - do: Call PSE&G and dispute the charge. Pay the amount not in dispute so service stays on during the investigation.
        channel: customer-service-phone
      - do: If usage looks wrong, ask for a free meter test (once every 12 months) and, if usage is unexplainably high, a diversion-of-service investigation.
        channel: customer-service-phone
      - do: If PSE&G cannot help, contact the BPU Division of Customer Assistance.
    facts:
      - kind: policy
        claim: Under the BPU Bill of Rights, a customer may dispute a charge with the utility, and service may not be turned off while the utility investigates as long as the undisputed amount is paid.
        issues: [billing_error, disconnection]
        source: https://nj.pseg.com/-/media/pseg/public-site/saveenergyandmoney/paymentassistance/customer_bill_of_rights_v2_english.ashx
        last_verified: 2026-10-12
      - kind: fee
        claim: A customer may have the meter tested free of charge once every 12 months and may ask for a BPU employee to be present.
        issues: [billing_error]
        source: https://nj.pseg.com/-/media/pseg/public-site/saveenergyandmoney/paymentassistance/customer_bill_of_rights_v2_english.ashx
        last_verified: 2026-10-12
      - kind: policy
        claim: If usage on the bill appears unexplainably high or suspicious, the customer may have the utility perform a "diversion of service" investigation.
        issues: [billing_error]
        source: https://nj.pseg.com/-/media/pseg/public-site/saveenergyandmoney/paymentassistance/customer_bill_of_rights_v2_english.ashx
        last_verified: 2026-10-12

  - issue: disconnection
    summary: Ask for a deferred payment plan (at least one per year is a right), apply for LIHEAP/USF/NJ SHARES, and claim Winter Termination Program or medical protection.
    evidence: [shut-off notice, account balance, income documents, Critical Care form]
    steps:
      - do: Call the payment assistance line, or enroll in a Deferred Payment Arrangement in My Account.
        channel: payment-arrangement
      - do: Apply for LIHEAP and USF; if denied, apply to NJ SHARES.
        channel: payment-assistance
      - do: If you are eligible for the Winter Termination Program (November 15 to March 15), tell PSE&G.
        channel: payment-assistance-phone
      - do: If someone uses life-sustaining equipment or has a medical emergency, submit the Critical Care application.
        channel: medical-certification
      - do: If PSE&G cannot help, contact the BPU Division of Customer Assistance before the shutoff date.
    facts:
      - kind: deadline
        claim: The customer has the right to at least 10 days' written notice before service is turned off for non-payment.
        issues: [disconnection]
        source: https://nj.pseg.com/-/media/pseg/public-site/saveenergyandmoney/paymentassistance/customer_bill_of_rights_v2_english.ashx
        last_verified: 2026-10-12
      - kind: policy
        claim: Except for safety emergencies, service may not be turned off outside 8:00 a.m.-4:00 p.m. Monday through Thursday, on a Friday, weekend, New Jersey State holiday or the day before one, or if a valid medical emergency exists in the household.
        issues: [disconnection]
        source: https://nj.pseg.com/-/media/pseg/public-site/saveenergyandmoney/paymentassistance/customer_bill_of_rights_v2_english.ashx
        last_verified: 2026-10-12
      - kind: policy
        claim: Customers eligible for the Winter Termination Program have the right to utility service from November 15 to March 15. The customer must tell the utility they are eligible.
        issues: [disconnection]
        source: https://nj.pseg.com/-/media/pseg/public-site/saveenergyandmoney/paymentassistance/customer_bill_of_rights_v2_english.ashx
        last_verified: 2026-10-12
      - kind: policy
        claim: Customers have the right to at least one deferred payment plan per year for an unpaid bill, as long as they stay current on new charges. PSE&G will not discontinue service while a customer stays up to date with a DPA.
        issues: [disconnection]
        source: https://nj.pseg.com/-/media/pseg/public-site/saveenergyandmoney/paymentassistance/customer_bill_of_rights_v2_english.ashx
        last_verified: 2026-10-12
      - kind: compensation
        claim: USF gives a monthly bill credit of $20 to $200 for low-income households, and Fresh Start forgives past-due balances over $60 for USF applicants (once every 5 years).
        issues: [disconnection]
        source: https://nj.pseg.com/saveenergyandmoney/gethelppayingyourbill/backontrack
        last_verified: 2026-10-12

  - issue: service_outage
    summary: Report the outage; PSE&G pays claims only for damage it caused and does not pay for weather or equipment failure.
    evidence: [outage dates and times, photos, repair estimates or receipts, proofs of loss]
    steps:
      - do: Report the outage online or by phone.
        channel: outage-report-online
      - do: If you believe PSE&G damaged your property, file a claim online or email the claim form with proofs of loss.
        channel: claims-form
    facts:
      - kind: policy
        claim: PSE&G pays the reasonable cost to repair items it damaged, or the Actual Cash Value of items already replaced. It does not pay for damage from weather, animal contact, equipment failure, damage to its equipment by others, or accidents.
        issues: [service_outage]
        source: https://nj.myaccount.pseg.com/customersupport/claims
        last_verified: 2026-10-12
      - kind: process
        claim: PSE&G aims to investigate and decide a claim within 45-60 business days after it receives the completed form and proofs of loss.
        issues: [service_outage]
        source: https://nj.myaccount.pseg.com/customersupport/claims
        last_verified: 2026-10-12

  - issue: deposit_refund
    summary: The deposit must be returned when the account closes and the final bill is settled, as a credit or a check at the customer's choice.
    evidence: [deposit receipt, final bill, account closure date]
    steps:
      - do: After the final bill is settled, ask PSE&G to return the deposit and choose a check or account credit.
        channel: customer-service-phone
      - do: If it is not returned, contact the BPU Division of Customer Assistance.
    facts:
      - kind: policy
        claim: The customer has the right to have the deposit returned once the account is closed and the final bill is settled, and to choose an account credit or a separate check. Customers may not be required to pay an unreasonable deposit.
        issues: [deposit_refund]
        source: https://nj.pseg.com/-/media/pseg/public-site/saveenergyandmoney/paymentassistance/customer_bill_of_rights_v2_english.ashx
        last_verified: 2026-10-12

facts:
  - kind: policy
    claim: Residential customers should not be assessed a late payment charge on their utility bill.
    issues: [billing_error]
    source: https://nj.pseg.com/-/media/pseg/public-site/saveenergyandmoney/paymentassistance/customer_bill_of_rights_v2_english.ashx
    last_verified: 2026-10-12

known_blockers:
  - Deferred Payment Arrangements are set up in My Account or the mobile app (sign-in required).
  - The Critical Care form must be signed by the prescribing licensed medical professional every year.
