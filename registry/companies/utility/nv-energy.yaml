id: nv-energy
name: NV Energy
aliases: [Nevada Power Company, Nevada Power, Sierra Pacific Power Company, Sierra Pacific Power]
sector: utility
website: https://www.nvenergy.com
notes: >-
  Nevada Power Company (southern Nevada, electric) and Sierra Pacific Power Company (northern Nevada,
  electric and gas) do business as NV Energy. Regulated by the Public Utilities Commission of Nevada
  (PUCN). Termination rules are in NV Energy's Rule No. 6 tariffs. The PUCN tells customers to try the
  utility first, ask for a supervisor, then file an informal complaint with its Consumer Complaint
  Resolution Division.

