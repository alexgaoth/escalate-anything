    type: web_form
    label: Report an outage
    value: https://www.nvenergy.com/outages-and-emergencies/report-an-outage
    purposes: [service_outage]
    notes: URL taken from NV Energy's sitemap. The page loads with JavaScript; its content could not be read automatically.
    source: https://www.nvenergy.com/sitemap.xml
