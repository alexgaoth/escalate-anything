id: reliant-energy
name: Reliant Energy
aliases: [Reliant]
sector: utility
website: https://www.reliant.com
account_url: https://my.reliant.com
notes: >-
  Retail electric provider (REP) in the Texas competitive market, PUCT certificate #10007. Reliant bills
  the customer, but the local transmission and distribution service provider (TDSP or TDU), such as
  CenterPoint, Oncor, AEP Texas or TNMP, delivers the power and handles outages. Texas complaint path
  differs from other states: complain to Reliant first; under PUCT rules the REP must investigate and
  report within 21 days, and a supervisory review must be answered within 10 business days; then
  complain to the Public Utility Commission of Texas or the Texas Attorney General. While an informal
  complaint is pending at the PUCT, the REP may not start collection or disconnection on the disputed
  part of the bill. Reliant's Terms of Service, Electricity Facts Label and Your Rights as a Customer
  links on its website did not resolve to documents when checked.

