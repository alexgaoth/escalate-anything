    value: "105"
    purposes: [service_outage]
    hours: 24/7
    notes: Run by the local network operator, not Octopus. Octopus can fix an outage only when the meter is faulty.
    source: https://octopus.energy/blog/power-cut/
    last_verified: 2026-11-19
  - id: gas-emergency-phone
    type: phone
    label: Gas Emergency Line (0800 111 999)
    value: +44-800-111-999
    purposes: [service_outage]
