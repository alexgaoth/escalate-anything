    value: https://apps.apple.com/gb/app/octopus-energy/id1093452209
    access: login
    source: https://octopus.energy/contact-us/
    last_verified: 2026-11-19
  - id: priority-services
    type: portal
    label: Join the Priority Services Register (account settings)
    value: https://octopus.energy/dashboard/new/accounts/personal-details/priority-services/
    purposes: [payment_assistance, disconnection, service_outage]
