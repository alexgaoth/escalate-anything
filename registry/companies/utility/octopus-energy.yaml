id: octopus-energy
name: Octopus Energy
aliases: [Octopus, Octopus Energy Ltd, Octopus Energy UK]
sector: utility
countries: [gb]
parent: Octopus Energy Group
website: https://octopus.energy
account_url: https://octopus.energy/login/
regulators: [uk-ofgem, uk-energy-ombudsman, uk-citizens-advice]
notes: >-
  Octopus Energy Ltd supplies household gas and electricity. This file covers household supply in Great Britain
  (England, Scotland, Wales) only; Northern Ireland has a different regulator. Business customers use a separate line
  (020 3389 5613, business@octopus.energy), and heat pumps, solar and EV chargers have their own complaint pages.
  Octopus took over Bulb (acquisition completed December 2022; all 1.5 million customers moved by 30 June 2023) and
  Shell Energy Retail's UK home customers (acquired 1 December 2023; migration finished 28 March 2024). Ofgem also
  appointed Octopus to take on Avro Energy and Go Effortless Energy customers. The Energy Ombudsman tells ex-Bulb
  customers to complain under "Octopus Energy (formerly Bulb Energy)". Related rules: uk-energy-back-billing,
  uk-energy-guaranteed-standards, uk-energy-ombudsman-8-weeks, uk-energy-price-cap.

channels:
  - id: customer-service-phone
    type: phone
    label: Octopus Energy customer line (0808 164 1088, free)
    value: +44-808-164-1088
    purposes: [billing_error, bill_increase, payment_assistance, refund_request, cancel_service, disconnection, slamming]
    hours: "Mon-Thu 9am-5pm, Fri 9am-4pm; emergencies 24/7"
    access: open
    notes: >-
      Free from UK mobiles and landlines. At weekends Octopus asks customers to email hello@octopus.energy. The power-cut
      page says emergency lines on this number are open 8am-8pm Monday to Friday, with a voicemail for a priority
      callback at other times. British Sign Language users can use SignVideo (Mon-Thu 9am-5pm, Fri 9am-4pm).
    source: https://octopus.energy/contact-us/
    last_verified: 2026-11-19
  - id: hello-email
    type: email
    label: Octopus Energy customer email (hello@octopus.energy, 7 days a week)
    value: hello@octopus.energy
    purposes: [billing_error, bill_increase, payment_assistance, refund_request, cancel_service, disconnection, slamming]
    source: https://octopus.energy/contact-us/
    last_verified: 2026-11-19
  - id: complaints-email
    type: email
    label: Complaints email (issue resolution)
    value: issueresolution@octopus.energy
    purposes: [billing_error, bill_increase, refund_request, cancel_service, disconnection, slamming]
    notes: Include your contact details or account number, the background, the impact on you and the resolution you want.
    source: https://octopus.energy/unhappy/
    last_verified: 2026-11-19
  - id: complaints-mail
    type: mail
    label: Complaints by post
    value: "Octopus Energy Ltd, UK House, 5th floor, 164-182 Oxford Street, London, W1D 1NN"
    purposes: [billing_error, refund_request, cancel_service, disconnection, slamming]
    source: https://octopus.energy/unhappy/
    last_verified: 2026-11-19
  - id: ceo-email
    type: email
    label: Chief Executive (Greg) - complaint escalation
    value: greg@octopus.energy
    purposes: [billing_error, refund_request, disconnection]
    notes: Octopus says customers can email the CEO at any point after raising a complaint. Include account number, contact details with address, and the background.
    source: https://octopus.energy/unhappy/
    last_verified: 2026-11-19
  - id: emergency-email
    type: email
    label: Emergency email (put "emergency" in the subject)
    value: emergency@octopus.energy
    purposes: [disconnection, service_outage]
    hours: 24/7
    notes: For meter faults, prepayment meters with under £5 credit, or a lost or faulty key or card.
    source: https://octopus.energy/blog/power-cut/
    last_verified: 2026-11-19
  - id: online-account
