escalation:
  - {rung: frontline, channel: customer-service-phone}
  - {rung: supervisor, note: "Ask the representative for a supervisor. Write down the name and reference number."}
  - {rung: written_complaint, channel: complaint-mail}
  - {rung: state_agency, agency_kind: utility_commission, note: "California Public Utilities Commission (CPUC), Consumer Affairs Branch. PG&E's help center says billing disputes that PG&E staff cannot resolve go to the CPUC."}
  - {rung: state_agency, agency_kind: attorney_general, note: "California Attorney General."}

playbooks:
  - issue: billing_error
    summary: Ask PG&E to investigate the bill within five days so service stays on; ask for a meter test if usage looks wrong; take an unresolved dispute to the CPUC.
    evidence: [the disputed bill, previous bills for comparison, meter photos with dates, notes of calls with reference numbers]
    steps:
      - do: Call PG&E, say you dispute the bill and ask for a bill investigation. Do this within five days of receiving the bill to keep the disconnection hold. Keep paying bills that are not in dispute.
        channel: customer-service-phone
      - do: If the bill is based on an estimated read or usage looks too high, ask PG&E to test the meter (five working days' notice).
        channel: customer-service-phone
      - do: If PG&E says the bill is correct and you disagree, file a complaint with the CPUC Consumer Affairs Branch. You may deposit the disputed amount with the CPUC instead of paying PG&E; a residential customer who cannot pay the full amount does not have to deposit it.
    facts:
      - kind: policy
        claim: PG&E will not terminate residential service when the customer has started a complaint or asked for an investigation within five days of receiving a disputed bill, until the customer has had a review by PG&E or the CPUC. The customer must keep paying undisputed bills.
        issues: [billing_error, disconnection]
        source: https://www.pge.com/tariffs/assets/pdf/tariffbook/ELEC_RULES_11.pdf
        last_verified: 2026-10-12
      - kind: process
        claim: In place of paying a disputed bill, the customer may deposit the amount PG&E claims with the California Public Utilities Commission, with the bill and a statement of the basis for the dispute. A residential customer unable to pay the full disputed amount is not required to deposit it during Commission review.
        issues: [billing_error]
        source: https://www.pge.com/tariffs/assets/pdf/tariffbook/ELEC_RULES_10.pdf
        last_verified: 2026-10-12
      - kind: fee
        claim: A customer may require PG&E to test the electric meter on not less than five working days' notice. There is no charge, except a deposit of $1.00 to $5.00 per meter when a customer whose average monthly bill is under $150 asks within six months of installation or more often than once every six months; the deposit is returned if the meter is more than two percent fast or slow.
        issues: [billing_error]
        source: https://www.pge.com/tariffs/assets/pdf/tariffbook/ELEC_RULES_17.pdf
        last_verified: 2026-10-12
      - kind: compensation
        claim: If a residential meter registers more than two percent fast, PG&E refunds the overcharge for up to three years (or only the months of the error if shorter). If it is more than 25 percent slow, PG&E may back-bill up to three months.
        issues: [billing_error]
        source: https://www.pge.com/tariffs/assets/pdf/tariffbook/ELEC_RULES_17.pdf
        last_verified: 2026-10-12
      - kind: policy
        claim: Estimated bills are treated as a "billing error" under Rule 17.1 unless the estimate was caused by access problems, the customer, or a natural or man-made disaster.
        issues: [billing_error]
        source: https://www.pge.com/tariffs/assets/pdf/tariffbook/ELEC_RULES_17.pdf
        last_verified: 2026-10-12

  - issue: disconnection
    summary: Ask for the 24-month payment plan and enroll in assistance programs; PG&E cannot disconnect in forecast extreme heat or cold, on weekends or holidays, or while a LIHEAP pledge is pending.
    evidence: [15-day or 48-hour notice, account balance, Medical Baseline or LIHEAP documents]
    steps:
      - do: Call PG&E before the date on the notice. Say you cannot pay and ask for a 24-month payment arrangement, or set up a plan or extension online.
        channel: payment-arrangement
      - do: Ask PG&E to enroll you in every benefit program you qualify for (CARE, FERA, AMP) and apply for REACH or LIHEAP help.
        channel: payment-assistance
      - do: If someone in the home has a qualifying medical condition or device, apply for Medical Baseline.
        channel: medical-baseline
      - do: If you and PG&E cannot agree on payment arrangements, write to the CPUC Consumer Affairs Branch before the shutoff date.
    facts:
      - kind: deadline
        claim: A residential bill is past due if not paid within 19 days after it is mailed. PG&E then mails a 15-day notice, then a 48-hour notice, and makes a reasonable attempt to contact an adult by phone or in person at least 24 hours before shutoff.
        issues: [disconnection]
        source: https://www.pge.com/tariffs/assets/pdf/tariffbook/ELEC_RULES_8.pdf
        last_verified: 2026-10-12
      - kind: policy
        claim: PG&E must offer a 24-month payment arrangement to a residential customer who says they cannot pay, and will not disconnect a customer who is current on the 24-month plan and on monthly bills.
        issues: [disconnection]
        source: https://www.pge.com/tariffs/assets/pdf/tariffbook/ELEC_RULES_11.pdf
        last_verified: 2026-10-12
      - kind: policy
        claim: Residential service is not disconnected when PG&E forecasts temperatures above 100 degrees or below 32 degrees in a 72-hour look-ahead period, or on Saturdays, Sundays, legal holidays or when PG&E offices are closed.
        issues: [disconnection]
        source: https://www.pge.com/tariffs/assets/pdf/tariffbook/ELEC_RULES_11.pdf
        last_verified: 2026-10-12
      - kind: policy
        claim: PG&E does not disconnect a customer with a pending LIHEAP pledge, and must first offer to enroll eligible customers in all applicable PG&E benefit programs.
        issues: [disconnection]
        source: https://www.pge.com/tariffs/assets/pdf/tariffbook/ELEC_RULES_11.pdf
        last_verified: 2026-10-12
      - kind: policy
        claim: PG&E must visit Medical Baseline, Life Support or self-certified seriously ill customers in person within the 48 hours before, or at the time of, disconnection, and offer pay-by-phone or a 48-hour courtesy extension.
        issues: [disconnection]
        source: https://www.pge.com/tariffs/assets/pdf/tariffbook/ELEC_RULES_11.pdf
        last_verified: 2026-10-12
      - kind: policy
        claim: Residential customers disconnected for the first time on or after December 17, 2025 have service restored when they agree to a payment plan for the balance. Restoration is within 24 hours of payment for remote reconnections or one business day for field reconnections.
        issues: [disconnection]
        source: https://www.pge.com/tariffs/assets/pdf/tariffbook/ELEC_RULES_11.pdf
        last_verified: 2026-10-12
      - kind: compensation
        claim: REACH gives up to $800 toward a past-due bill after a disconnection notice; LIHEAP up to $1,000; the Arrearage Management Plan forgives up to $8,000 of debt for customers enrolled in CARE or FERA.
        issues: [disconnection]
        source: https://www.pge.com/en/account/billing-and-assistance/financial-assistance.html
        last_verified: 2026-10-12

  - issue: service_outage
    summary: Report the outage; PG&E pays an automatic Safety Net payment after 48+ hours in a severe storm, and otherwise pays claims only where it was at fault.
    evidence: [outage dates and times, itemized list of spoiled food with costs, receipts, photos, repair invoices]
    steps:
      - do: Report the outage online or by phone and note the outage times.
        channel: outage-report-online
      - do: For a loss you believe PG&E caused, file one claim per incident online, with itemized receipts and photos. Do not also file a paper claim.
        channel: claims-form
      - do: For a storm outage of 48 or more hours, do not file a claim; the Safety Net payment is automatic.
    facts:
      - kind: compensation
        claim: Residential customers without power for 48 consecutive hours or more because of severe storm conditions may get an automatic Safety Net payment of $25-100, paid about 60 days after the storm outage. Do not submit a claim form for it.
        issues: [service_outage]
        source: https://www.pge.com/en/account/customer-service/claims.html
        last_verified: 2026-10-12
      - kind: policy
        claim: PG&E evaluates claims based on negligence and says it is not responsible for outages, food loss or damage from forces outside its control, including weather and grid-operator curtailments.
        issues: [service_outage]
        source: https://www.pge.com/en/account/customer-service/claims.html
        last_verified: 2026-10-12
      - kind: deadline
        claim: Food spoilage claims are paid only if submitted and resolved within one year of the incident. Tangible property damage claims have a three-year limit; personal injury and business interruption claims two years.
        issues: [service_outage]
        source: https://www.pge.com/en/account/customer-service/claims.html
        last_verified: 2026-10-12
      - kind: process
        claim: PG&E's goal is to decide a claim within 30 days of receipt; complex claims or requests for more information can take longer.
        issues: [service_outage]
        source: https://www.pge.com/en/account/customer-service/claims.html
        last_verified: 2026-10-12

  - issue: deposit_refund
    summary: PG&E may not charge residential credit deposits for new service; nonresidential deposits are refunded at closing or after 12 months of good payment.
    evidence: [deposit receipt, final bill, account closure date]
    steps:
      - do: Ask PG&E to refund the deposit, or the part above unpaid bills, after service ends or after 12 months of on-time payment.
        channel: customer-service-phone
    facts:
      - kind: policy
        claim: Under CPUC Decision 20-06-003, PG&E is prohibited from requiring residential customers to pay establishment-of-credit deposits for new service.
        issues: [deposit_refund]
        source: https://www.pge.com/tariffs/assets/pdf/tariffbook/ELEC_RULES_7.pdf
        last_verified: 2026-10-12
      - kind: policy
        claim: When service ends, PG&E refunds the deposit or the part above unpaid bills. PG&E reviews accounts after 12 months and refunds the deposit if the customer had no more than two past-due bills and no disconnection for nonpayment in that period. Interest is paid at the 3-month prime commercial paper rate.
        issues: [deposit_refund]
        source: https://www.pge.com/tariffs/assets/pdf/tariffbook/ELEC_RULES_7.pdf
        last_verified: 2026-10-12

facts:
  - kind: process
    claim: A payment plan splits an existing balance into monthly payments and cannot be changed once set up; a due date extension moves the due date up to 30 days. Both can be set up online or at 1-877-660-6789.
    issues: [disconnection]
    source: https://www.pge.com/en/account/billing-and-assistance/pay-my-bill/payment-plan-and-due-date-extension.html
    last_verified: 2026-10-12
  - kind: policy
    claim: Medical Baseline eligibility is based on a qualifying medical condition or device, not income. It gives about 500 kWh of electricity and/or 25 therms of gas per month at the lowest price and extra alerts before a Public Safety Power Shutoff.
    issues: [disconnection]
    source: https://www.pge.com/en/account/billing-and-assistance/financial-assistance/medical-baseline-program.html
    last_verified: 2026-10-12
  - kind: deadline
    claim: Medical Baseline customers with non-permanent conditions must recertify every two years with a medical practitioner's signature; permanent conditions self-certify every four years.
    issues: [disconnection]
    source: https://www.pge.com/en/account/billing-and-assistance/financial-assistance/medical-baseline-program.html
    last_verified: 2026-10-12
  - kind: policy
    claim: Customers who do not qualify for Medical Baseline but whose health or safety would be at risk can set Self-Identified Vulnerable status in My Account. It gives extra notice before a nonpayment shutoff and lasts one year.
    issues: [disconnection]
    source: https://www.pge.com/en/account/billing-and-assistance/financial-assistance/vulnerable-customer-status.html
    last_verified: 2026-10-12

known_blockers:
  - help.pge.com articles render only with JavaScript.
  - Online payment arrangements, Self-Identified Vulnerable status and outage claims tracking need a My Account sign-in.
  - The Medical Baseline application needs a medical practitioner to complete Part B.

official_domains: [pge.com]

security:
  never_asks:
    - kind: policy
      claim: PG&E says it will never ask for your financial information over the phone.
      source: https://www.pge.com/en/account/customer-service/scams.html
      last_verified: 2026-10-12
    - kind: policy
      claim: PG&E says it will never request payment by gift card, MoneyPak card or payment apps such as Venmo or Zelle.
      source: https://www.pge.com/en/account/customer-service/scams.html
      last_verified: 2026-10-12
    - kind: policy
      claim: PG&E says it will never threaten to shut off power within the hour unless you make an immediate payment, and never asks business customers for an immediate payment with a prepaid cash card over the phone or in person.
      source: https://www.pge.com/en/account/customer-service/scams.html
      last_verified: 2026-10-12
    - kind: policy
      claim: PG&E says it will not call to ask for personal information when a power shutoff is about to happen, and its representatives will never call to sell a product or service.
      source: https://www.pge.com/en/account/customer-service/scams.html
      last_verified: 2026-10-12
  known_scams:
    - kind: policy
      claim: Scammers spoof caller ID so the call shows a real PG&E number, such as 1-800-743-5000, then ask for sensitive information or access to the home.
      source: https://www.pge.com/en/account/customer-service/scams.html
      last_verified: 2026-10-12
    - kind: policy
      claim: Callers say a refund, discount or federal tax refund is owed, or that a past-due balance must be paid now.
      source: https://www.pge.com/en/account/customer-service/scams.html
      last_verified: 2026-10-12
    - kind: policy
      claim: Callers pose as vendors that offer energy-usage insights and ask for the PG&E account number, login or Social Security number. PG&E says vendors do not need this information to get usage data.
      source: https://www.pge.com/en/account/customer-service/scams.html
      last_verified: 2026-10-12
    - kind: policy
      claim: Fake emails, some that look like PG&E bills, carry links or come from spoofed senders. PG&E says most of its emails come from addresses that end in pge.com (for example em.pge.com, myacct.pge.com, notifications.pge.com).
      source: https://www.pge.com/en/account/customer-service/scams.html
      last_verified: 2026-10-12
    - kind: policy
      claim: People come to the door claiming to be from PG&E, often offering a gas inspection. PG&E employees always carry ID and will show it.
      source: https://www.pge.com/en/account/customer-service/scams.html
      last_verified: 2026-10-12
  report_phishing:
    - id: scam-line
      type: phone
      label: Report an in-person scam or verify a PG&E caller or visitor (1-833-500-SCAM)
      value: +1-833-500-7226
      source: https://www.pge.com/en/account/customer-service/scams.html
      last_verified: 2026-10-12
    - id: scam-email
      type: email
      label: Report a scam email to PG&E
      value: ScamReporting@pge.com
      source: https://www.pge.com/en/account/customer-service/scams.html
      last_verified: 2026-10-12
    - id: scam-call-form
      type: web_form
      label: Report a scam call to PG&E
      value: https://forms.office.com/r/KiUQWWUH8P
      notes: A Microsoft Forms page linked from PG&E's scams page, so the domain is not pge.com.
      source: https://www.pge.com/en/account/customer-service/scams.html
      last_verified: 2026-10-12
