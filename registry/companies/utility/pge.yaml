id: pge
name: Pacific Gas and Electric Company
aliases: [PG&E, PGE, Pacific Gas & Electric]
sector: utility
parent: PG&E Corporation
website: https://www.pge.com
account_url: https://myaccount.pge.com/myaccount/s/login
notes: >-
  Electric and gas utility for northern and central California. Regulated by the California Public
  Utilities Commission (CPUC); billing complaints that PG&E does not resolve go to the CPUC Consumer
  Affairs Branch. PG&E publishes two general customer service numbers: 1-877-660-6789 (contact page,
  billing pages) and 1-800-743-5000 (claims page, help center). Residential nonpayment rules in
  Electric Rule 11 were revised effective December 17, 2025.

