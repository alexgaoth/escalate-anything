id: centerpoint-energy
name: CenterPoint Energy
aliases: [CenterPoint, CenterPoint Energy Houston Electric]
sector: utility
website: https://www.centerpointenergy.com
account_url: https://myaccount.centerpointenergy.com/
notes: >-
  Electric delivery in the Greater Houston area, and natural gas in Texas, Minnesota, Indiana and Ohio
  (Indiana also has CenterPoint electric service). In Houston, CenterPoint is the transmission and
  distribution utility (TDU): it handles outages and meters, but residential customers buy power from a
  retail electric provider and send billing complaints to that provider. State regulators include the
  Public Utility Commission of Texas (electric), the Railroad Commission of Texas (gas), the Minnesota
  Public Utilities Commission, the Indiana Utility Regulatory Commission and the Public Utilities
  Commission of Ohio.

