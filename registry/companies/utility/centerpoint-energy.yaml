playbooks:
  - issue: billing_error
    summary: Gas and Indiana customers dispute with CenterPoint; Houston electric customers dispute the bill with their retail provider, which can ask CenterPoint to test the meter.
    evidence: [the bill, meter readings, earlier bills]
    steps:
      - do: For a gas bill or an Indiana electric bill, call the customer service number for your state and ask for a review or a meter test.
        channel: houston-gas-phone
        note: Use your own state's number.
      - do: For a Houston electric bill, dispute it with your retail electric provider. It can request a meter test from CenterPoint.
      - do: Put the dispute in writing through the online contact form.
        channel: contact-form
  - issue: disconnection
    summary: Request a one-time due date extension or a payment arrangement in My Account, and apply for state assistance.
    evidence: [disconnection notice, account number]
    steps:
      - do: Sign in to My Account and request a due date extension or a payment arrangement. Keep paying current charges on time.
        channel: assistance-page
      - do: Apply for the assistance programs for your state (PIPP Plus and HEAP in Ohio, EAP in Indiana and Minnesota, CEAP in Texas), or call 211.
        channel: assistance-page
      - do: In Minnesota, ask about the Cold Weather Rule and the Medical Hardship Program.
        channel: minnesota-gas-phone
    facts:
      - kind: policy
        claim: CenterPoint offers a one-time due date extension for a few extra days, generally with no fee, and payment arrangements that split the bill into smaller payments if current charges are paid on time.
        issues: [disconnection]
        source: https://www.centerpointenergy.com/en-us/my-account/billing-payment/assistance-programs
        last_verified: 2026-10-12
      - kind: policy
        claim: "Minnesota: the Cold Weather Rule and Medical Hardship Program give late-fee grace periods and enrollment in Levelized Billing or a four-month payment plan."
        issues: [disconnection]
        source: https://www.centerpointenergy.com/en-us/my-account/billing-payment/assistance-programs
        last_verified: 2026-10-12
  - issue: service_outage
    summary: Houston electric outages go to CenterPoint; register for Critical Care if someone depends on electric medical equipment.
    evidence: [service address, ESI ID or meter number, outage start time]
    steps:
      - do: Report a Houston electric outage by phone or on the outage tracker (tracker.centerpointenergy.com).
        channel: houston-electric-phone
      - do: Register for Critical Care and update it every year. It gives notice of planned outages but does not guarantee power.
        channel: critical-care-page
    facts:
      - kind: policy
        claim: Registered Critical Care customers get notice before planned power outages, but registration does not guarantee uninterrupted power in emergencies or storms. Registration must be updated every year.
        issues: [service_outage]
        source: https://www.centerpointenergy.com/en-us/my-account/billing-payment/critical-care-customers
        last_verified: 2026-10-12

known_blockers:
  - Payment extensions and arrangements are set up in My Account (sign-in).
  - CenterPoint's contact page shows phone numbers whose dial links do not match the displayed numbers (Houston electric, Ohio gas).

official_domains: [centerpointenergy.com]

security:
  never_asks:
    - kind: policy
      claim: CenterPoint Energy phone agents will never personally ask for banking or credit card information over the phone. Customers who pay by phone are transferred to an automated system.
      source: https://www.centerpointenergy.com/en-us/savings-solutions/resource-hub/safety-reliability/public-utility-scams
      last_verified: 2026-10-12
    - kind: policy
      claim: CenterPoint Energy agents will never ask for payment by cash, Western Union or MoneyGram transfer, prepaid debit card such as Green Dot, gift card, PayPal, Venmo, Apple Pay or Square Pay.
      source: https://www.centerpointenergy.com/en-us/savings-solutions/resource-hub/safety-reliability/public-utility-scams
      last_verified: 2026-10-12
    - kind: policy
      claim: CenterPoint Energy field employees are not authorized to collect payments at a home or business.
      source: https://www.centerpointenergy.com/en-us/savings-solutions/resource-hub/safety-reliability/public-utility-scams
      last_verified: 2026-10-12
    - kind: policy
      claim: CenterPoint Energy will not disconnect service without first mailing an overdue bill and then a disconnection notice that states the disconnection date and time.
      source: https://www.centerpointenergy.com/en-us/savings-solutions/resource-hub/safety-reliability/public-utility-scams
      last_verified: 2026-10-12
  known_scams:
    - kind: policy
      claim: Scammers spoof caller ID so calls appear as CenterPoint Energy, and may threaten to disconnect utilities within the hour unless money is sent.
      source: https://www.centerpointenergy.com/en-us/savings-solutions/resource-hub/safety-reliability/public-utility-scams
      last_verified: 2026-10-12
    - kind: policy
      claim: Imposters call or visit about an overdue bill and threaten quick disconnection unless the customer loads money onto a prepaid debit card and shares its serial number.
      source: https://www.centerpointenergy.com/en-us/savings-solutions/resource-hub/safety-reliability/public-utility-scams/common-energy-scams
      last_verified: 2026-10-12
    - kind: policy
      claim: After severe storms, fake utility workers offer immediate power restoration for a cash fee and leave without restoring service.
      source: https://www.centerpointenergy.com/en-us/savings-solutions/resource-hub/safety-reliability/public-utility-scams/common-energy-scams
      last_verified: 2026-10-12
    - kind: policy
      claim: Imposters in official-looking clothing visit homes offering refunds of delivery fees, sometimes calling it a government program.
      source: https://www.centerpointenergy.com/en-us/savings-solutions/resource-hub/safety-reliability/public-utility-scams/common-energy-scams
      last_verified: 2026-10-12
    - kind: policy
      claim: Scammers describe fake federal programs that help pay utility bills and ask for Social Security numbers.
      source: https://www.centerpointenergy.com/en-us/savings-solutions/resource-hub/safety-reliability/public-utility-scams/common-energy-scams
      last_verified: 2026-10-12
