    hours: "Mon-Thu 9am-5pm, Fri 9am-4pm; closed weekends"
    notes: >-
      EDF says it usually answers within two minutes and that Monday 9am-12pm is the busiest time. An automated
      service runs outside these hours. The contact page writes the number as 03330 069 950. EDF's terms say calls
      to UK-wide numbers are in inclusive call plans, otherwise charged at a national rate. The complaints booklet
      (R63.08/25) gives longer hours (Mon-Thu 8am-6pm, Fri 8am-4pm). The complaints page gives this number for complaints.
