id: edf-energy
name: EDF
aliases: [EDF Energy, EDF Energy Customers Ltd, EDF UK]
sector: utility
countries: [gb]
parent: EDF Energy Holdings Ltd (EDF group, Electricite de France SA)
website: https://www.edfenergy.com
account_url: https://www.edfenergy.com/myaccount/login
regulators: [uk-ofgem, uk-energy-ombudsman, uk-citizens-advice]
notes: >-
  EDF is a trading name of EDF Energy Customers Ltd (Reg. No. 02228297, Nova North, 11 Bressenden Place,
  London SW1E 5BY). This file covers residential gas and electricity supply in Great Britain (England,
  Scotland and Wales) only. Northern Ireland has a different energy regulator and is not covered here.
  The website is edfenergy.com (old /for-home/ links redirect to the same pages). On 19 November 2026
  EDF announced that it agreed to buy Luxion Group, the owner of Utilita Energy. EDF expects completion in
  early 2027 after regulatory approval, the two companies run separately until then, and EDF says nothing
  changes for customers immediately. EDF documents give different phone hours; this file uses the hours on
  the live contact and complaints pages. The complaints booklet (R63) misprints the Citizens Advice
  number as 0909 223 1133; the complaints page and the terms give 0808 223 1133.

channels:
