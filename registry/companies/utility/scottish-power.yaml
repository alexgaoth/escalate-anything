known_blockers:
  - scottishpower.co.uk and its PDF host web-content.scottishpower.co.uk return HTTP 403 to automated fetches; values were read in a browser.
  - The complaint handling charter PDF linked from the complaints page downloads as a file and was not read.
  - The Director Support form is protected by reCAPTCHA and needs a complaint reference.
  - The online refund tool, Priority Services Register application and app need an account sign-in.

notes: >-
  The file covers ScottishPower's domestic gas and electricity supply in Great Britain (England, Scotland, Wales)
  only; Northern Ireland has a different regulator. ScottishPower is owned by Iberdrola. The same group runs SP Energy
  Networks, the electricity network operator in parts of Scotland, North Wales and England; network faults and power
  cuts go to 105, not to the supplier. Boiler Care and consumer finance complaints have separate routes.

