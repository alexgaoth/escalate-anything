id: con-edison
name: Consolidated Edison Company of New York
aliases: [Con Edison, Con Ed, ConEd, Consolidated Edison]
sector: utility
parent: Consolidated Edison, Inc.
website: https://www.coned.com
account_url: https://www.coned.com/en/accounts-billing/my-account
notes: >-
  Electric, gas and steam utility for New York City and Westchester County. Regulated by the New York
  State Public Service Commission (Department of Public Service, DPS). Residential customers are
  covered by the New York Home Energy Fair Practices Act (HEFPA). DPS requires customers to ask the
  utility for help first.

