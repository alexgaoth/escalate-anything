escalation:
  - {rung: frontline, channel: customer-service-phone}
  - {rung: supervisor, note: "Ask the representative for a supervisor. Write down the name and reference number."}
  - {rung: written_complaint, channel: complaint-form}
  - {rung: state_agency, agency_kind: utility_commission, note: "New York State Public Service Commission / Department of Public Service. DPS asks customers to contact the utility first. With a final termination notice, call the DPS shut-off hotline instead of using the online form."}
