id: national-grid
name: National Grid (US)
aliases: [National Grid, Niagara Mohawk, National Grid NY, National Grid MA, KeySpan, Brooklyn Union Gas, KEDNY, KEDLI]
sector: utility
parent: National Grid plc
website: https://www.nationalgridus.com
account_url: https://myaccount.nationalgrid.com/
notes: >-
  National Grid's US customer site has separate regions with different phone numbers and rules:
  Upstate New York (electric and gas), New York gas for Brooklyn, Queens and Staten Island (NY site),
  Long Island gas (Long Island NY site; electric on Long Island is PSEG Long Island), and Massachusetts
  (electric and gas). The site lists only Massachusetts and New York regions. New York customers are
  regulated by the New York State Public Service Commission (Department of Public Service) under HEFPA;
  Massachusetts customers by the Massachusetts Department of Public Utilities (DPU). Ask the customer
  which region the account is in before calling.

