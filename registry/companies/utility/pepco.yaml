id: pepco
name: Potomac Electric Power Company
aliases: [Pepco, PEPCO]
sector: utility
parent: Exelon Corporation
website: https://www.pepco.com
notes: >-
  Electric distribution utility for Washington, D.C. and suburban Maryland (Montgomery and Prince George's
  counties). Regulated by the Public Service Commission of the District of Columbia (DC PSC) and the Maryland
  Public Service Commission (MD PSC); the Office of the People's Counsel in each jurisdiction represents
  residential ratepayers. pepco.com HTML pages return no text to automated fetches; values below come from
  Pepco's "At Your Service" customer handbooks: the DC edition 2024-2025 and the Maryland edition 2023-2024.
  Rules differ between DC and Maryland, so each fact names its jurisdiction. Delmarva Power and Atlantic City
  Electric are separate Exelon utilities with their own websites and phone numbers; they are not covered here.

