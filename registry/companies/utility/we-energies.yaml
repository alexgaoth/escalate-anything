notes: >-
  Electric and natural gas utility in Wisconsin and Michigan's Upper Peninsula. Wisconsin customers are
  regulated by the Public Service Commission of Wisconsin (PSC); Michigan customers by the Michigan Public
  Service Commission. The Wisconsin rules below come from the PSC's Utility Customer Bill of Rights and
  General FAQ pages.

