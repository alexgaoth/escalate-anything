id: pseg-long-island
name: PSEG Long Island
aliases: [PSEG LI, PSEG Long Island, PSEGLI, LIPA]
sector: utility
parent: Public Service Enterprise Group (PSEG)
website: https://www.psegliny.com
notes: >-
  Electric service only, on Long Island and the Rockaways, New York. The Long Island Power Authority
  (LIPA), a not-for-profit public utility, owns the system and contracts PSEG Long Island to operate it
  day to day. Gas on Long Island is National Grid (see national-grid). Complaints go first to PSEG Long
  Island, then to LIPA Consumer Affairs or the Long Island office of the New York State Department of
  Public Service (DPS). LIPA's FAQ says the current contract with PSEG Long Island expires December 31,
  2025; psegliny.com was still in operation on 2026-10-12, and the post-2025 contract status was not
  confirmed. Separate from PSE&G in New Jersey (see pseg).

