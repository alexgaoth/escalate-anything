playbooks:
  - issue: billing_error
    summary: Dispute the bill with PSEG Long Island, then escalate to LIPA Consumer Affairs or the DPS Long Island office.
    evidence: [the disputed bill, previous bills, meter photos with dates, call notes with reference numbers]
    steps:
      - do: Call customer service or use the email form. State the charges you dispute and why. Get a reference number.
        channel: customer-service-phone
      - do: If not resolved, contact LIPA Consumer Affairs.
        channel: lipa-consumer-affairs-form
      - do: Or file a complaint with the Long Island office of the NY Department of Public Service.
    facts:
      - kind: process
        claim: LIPA asks customers to contact PSEG Long Island first. If the concern is not resolved, customers may contact LIPA Consumer Affairs, which escalates it to PSEG Long Island, or the Long Island office of DPS. The DPS process has three levels - complaint, informal hearing or review, and appeal to LIPA.
        issues: [billing_error, poor_service]
        source: https://www.lipower.org/contact-us/consumer-affairs/
        last_verified: 2026-10-12

  - issue: disconnection
    summary: Call customer service for a payment plan or hardship agreement; use the medical and special protections forms if they apply.
    evidence: [termination notice, account balance, medical certificate, hardship statement]
    steps:
      - do: Call customer service and ask for a payment plan or extension. If you cannot afford the standard terms, use the Financial Hardship Form.
        channel: payment-arrangement
      - do: For an illness or chronic medical condition, email the special protections application to keep service on while you arrange payment.
        channel: medical-certification
      - do: Apply for the Household Assistance Program or energy cost help.
        channel: payment-assistance
      - do: If PSEG Long Island does not help, contact LIPA Consumer Affairs or DPS before the shutoff date.
        channel: lipa-consumer-affairs-form
    facts:
      - kind: policy
        claim: For an unexpected illness or chronic medical condition, PSEG Long Island will continue service uninterrupted for 30 days while the customer works out a payment arrangement.
        issues: [disconnection]
        source: https://www.psegliny.com/en/myaccount/customersupport/financialassistance/PaymentPlans
        last_verified: 2026-10-12
      - kind: policy
        claim: Under the Peace of Mind Program, PSEG Long Island can extend the bill due date by 30 days if the customer or an immediate family member is hospitalized.
        issues: [disconnection]
        source: https://www.psegliny.com/en/myaccount/customersupport/financialassistance/PaymentPlans
        last_verified: 2026-10-12
      - kind: policy
        claim: Special protections may apply if the customer and everyone in the household are 62 or over, 18 or younger, blind or disabled.
        issues: [disconnection]
        source: https://www.psegliny.com/en/myaccount/customersupport/financialassistance/PaymentPlans
        last_verified: 2026-10-12
      - kind: policy
        claim: Customers with financial hardship may qualify for a below-standard payment agreement through the Financial Hardship Form.
        issues: [disconnection]
        source: https://www.psegliny.com/en/myaccount/customersupport/financialassistance
        last_verified: 2026-10-12

  - issue: service_outage
    summary: Report the outage at 1-800-490-0075; PSEG Long Island pays claims only for damage it caused, not weather or equipment failure.
    evidence: [outage dates and times, photos, repair estimates or receipts, proofs of loss]
    steps:
      - do: Report the outage by phone or online.
        channel: outage-phone
      - do: If you believe PSEG Long Island damaged your property, submit a claim with proofs of loss.
        channel: claims-form
    facts:
      - kind: policy
        claim: If PSEG Long Island is responsible, it pays the reasonable cost to repair damaged items, or the Actual Cash Value of replaced items. It does not pay for weather-related conditions, animal contacts, equipment failure, damage to its equipment by others, or accidents.
        issues: [service_outage]
        source: https://www.psegliny.com/en/myaccount/customersupport/claims
        last_verified: 2026-10-12
      - kind: process
        claim: PSEG Long Island aims to decide claims within 30-45 business days after the Corporate Claims Department receives the completed form and proofs of loss.
        issues: [service_outage]
        source: https://www.psegliny.com/en/myaccount/customersupport/claims
        last_verified: 2026-10-12
      - kind: policy
        claim: The Critical Care Program gives enhanced notifications to customers who depend on electric life-support equipment but does not guarantee priority power restoration.
        issues: [service_outage]
        source: https://www.psegliny.com/en/SafetyAndReliability/stormsafety/CriticalCare
        last_verified: 2026-10-12

facts:
  - kind: compensation
    claim: The Household Assistance Program gives a monthly bill credit (advertised as "Save $45 or More a Month") to customers who receive benefits from certain assistance programs.
    issues: [disconnection]
    source: https://www.psegliny.com/en/myaccount/customersupport/financialassistance
    last_verified: 2026-10-12

known_blockers:
  - The LIPA Consumer Affairs form has a CAPTCHA.
  - Medical certificates must come from a doctor, local Board of Health, nurse practitioner or physician assistant.
