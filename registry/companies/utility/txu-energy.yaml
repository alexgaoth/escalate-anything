id: txu-energy
name: TXU Energy
aliases: [TXU, TXU Energy Retail Company]
sector: utility
parent: Vistra
website: https://www.txu.com
notes: >-
  Retail electric provider (REP) in the Texas competitive market, PUCT certificate No. 10004. TXU bills
  the customer, but the local transmission and distribution utility (TDU), such as Oncor, CenterPoint,
  AEP Texas or TNMP, owns the wires and meters and handles outages. Texas complaint path differs from
  other states: complain to TXU first; TXU must investigate and report within 21 days; ask for a
  supervisory review (answer within 10 business days); then complain to the Public Utility Commission of
  Texas or the Texas Attorney General Consumer Protection Division. While an informal billing complaint is
  pending at the PUCT, TXU may not start collection or disconnection on the disputed part of the bill.
  Contract terms are in the Terms of Service Agreement (TOSA), the Electricity Facts Label (EFL) and Your
  Rights as a Customer (YRAC).

