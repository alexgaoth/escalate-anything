id: eon-next
name: E.ON Next
aliases: [E.ON, E.ON Energy, EON Next, Eon Next, EON, E.ON Next Energy Limited]
sector: utility
countries: [gb]
parent: E.ON UK (E.ON SE group)
website: https://www.eonnext.com
account_url: https://www.eonnext.com/dashboard/login
regulators: [uk-ofgem, uk-energy-ombudsman, uk-citizens-advice]
notes: >-
  E.ON Next is the brand of E.ON Next Energy Limited (Reg. No. 03782443, Trinity House, 2 Burton Street,
  Nottingham NG1 4BX), part of the E.ON group. This file covers residential gas and electricity supply in
  Great Britain (England, Scotland and Wales) only; Northern Ireland has a different energy regulator and is
  not covered. E.ON moved its home energy customers to E.ON Next: the "Joining us from E.ON" help page says
  all E.ON home and small-to-medium business energy customers get an E.ON Next account and are then supplied
  by E.ON Next Energy Limited, and Kraken (E.ON Next's platform) says 5.8M customers moved between June 2020
  and June 2022 (https://www.kraken.tech/case-studies/eon-next). The old eonenergy.com login page tells moved
  customers to log in at E.ON Next (search snippet; eonenergy.com blocks automated reading). So "E.ON" is an
  alias here. eonenergy.com is still an E.ON UK site (E.ON Next's privacy policy is there). eon.co.uk is NOT
  E.ON; it is EON Productions, a film company. Former npower home customers were all moved to E.ON Next and
  npower stopped trading as a residential and SME supplier (npower Business Solutions still serves large
  businesses). Sainsbury's Energy is supplied by E.ON Next Energy Limited but has its own website and
  support, so it is not covered here. E.ON Next's complaints procedure says "final offer letter"; its terms
  (clause 8.4) call the same letter a "deadlock letter".

