  (PSC), Consumer Affairs Division; the Maryland Office of People's Counsel represents residential
  ratepayers. bge.com HTML pages return empty to automated fetches; values below come from bge.com search
  results, BGE's 2022-2023 residential Consumer Reference Guide PDF, and the PSC consumer FAQs.

