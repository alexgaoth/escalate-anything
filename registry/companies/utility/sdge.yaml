id: sdge
name: San Diego Gas & Electric
aliases: [SDG&E, SDGE, San Diego Gas and Electric]
sector: utility
parent: Sempra
website: https://www.sdge.com
account_url: https://myenergycenter.com/
notes: >-
  Electric and natural gas utility for the San Diego, California area.
  Regulated by the California Public Utilities Commission (CPUC). Sister company of SoCalGas
  (both owned by Sempra).

