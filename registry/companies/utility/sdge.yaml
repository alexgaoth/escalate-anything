    value: +1-800-411-7343
    hours: "Mon-Fri 7 a.m.-8 p.m., Sat 7 a.m.-6 p.m.; emergencies only at other times"
    purposes: [billing_error, bill_increase, disconnection, poor_service, service_outage]
    notes: The claims page also lists this Customer Service Center number for filing a claim by phone.
    source: https://www.sdge.com/residential/customer-service/contact-us
    last_verified: 2026-10-12
  - id: emergency-phone
    type: phone
    label: Electric or gas emergency, suspected gas leak (evacuate, call 911 from a safe place, then SDG&E)
    value: +1-800-611-7343
    hours: 24/7
    source: https://www.sdge.com/residential/customer-service/contact-us
    last_verified: 2026-10-12
  - id: outage-report-online
