    value: https://www.pse.com/en/logcustomerfeedback
    purposes: [billing_error, poor_service]
    source: https://www.pse.com/en/contactpse
    last_verified: 2026-10-13
  - id: secure-messaging
    type: portal
    label: Secure messaging in the PSE account
    value: https://www.pse.com/en/account-and-billing/secure-messaging
    purposes: [billing_error, poor_service]
    access: login
    source: https://www.pse.com/en/contactpse
    last_verified: 2026-10-13
  - id: payment-arrangement
    type: portal
    label: Payment arrangement (weekly, bi-weekly or monthly)
    value: https://www.pse.com/account-and-billing/Payment%20Assistance/payment-arrangement
    purposes: [disconnection, payment_assistance]
