    source: https://www.pse.com/account-and-billing/Payment%20Assistance/payment-arrangement
    last_verified: 2026-10-13
  - id: bill-assistance-application
    type: web_form
    label: Apply for Bill Discount Rate, PSE HELP or Past Due Bill Forgiveness
    value: https://www.pse.com/en/BPCC/signin
