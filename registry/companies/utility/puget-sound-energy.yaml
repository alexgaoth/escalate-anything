id: puget-sound-energy
name: Puget Sound Energy
aliases: [PSE, Puget Sound Energy Inc.]
sector: utility
website: https://www.pse.com
notes: >-
  Electric and natural gas utility in western Washington. Regulated by the Washington Utilities and
  Transportation Commission (UTC), Consumer Protection Section. PSE's rights and responsibilities
  brochure says to call PSE first, then ask for a supervisor, and the supervisor must tell you of
  your right to contact the UTC (1-888-333-9882, consumer@utc.wa.gov). The same number,
  1-888-225-5773, is used for customer service, gas and electric emergencies and outages.
  Disconnection rules come from WAC 480-100-128 (electric) and the winter low-income payment
  program in WAC 480-100-143.

channels:
  - id: customer-service-phone
    type: phone
    label: PSE Customer Care Center (billing, account, disconnection notices)
    value: +1-888-225-5773
    hours: "Mon-Fri 7:30 a.m.-6:30 p.m.; 24-hour emergency and outage service only at other times"
    purposes: [billing_error, bill_increase, disconnection, payment_assistance, poor_service]
    notes: Translator services for other languages are available on this number. TTY 1-800-962-9498; TRS 1-866-831-5161.
    source: https://www.pse.com/en/contactpse
    last_verified: 2026-10-13
  - id: emergency-outage-phone
    type: phone
    label: Gas or electric emergency, downed power line or power outage (24 hours)
    value: +1-888-225-5773
    hours: 24/7
    purposes: [service_outage]
    source: https://www.pse.com/-/media/PDFs/6275_WB_2025.pdf
