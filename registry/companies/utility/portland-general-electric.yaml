id: portland-general-electric
name: Portland General Electric
aliases: [Portland General, Portland General Electric Company]
sector: utility
website: https://portlandgeneral.com
account_url: https://portlandgeneral.com/secure/account/summary
notes: >-
  Electric utility for the Portland and Salem areas of Oregon. Not the same company as PG&E (Pacific
  Gas and Electric, California); PGE's fraud page warns that scam emails sometimes say "PG&E". Regulated
  by the Public Utility Commission of Oregon (Oregon PUC), Consumer Services: 503-378-6600 or
  800-522-2404 (TTY 711), puc.consumer@puc.oregon.gov, complaint form https://puc.oregon.gov/complaint.
  The PUC says to try to resolve the problem with the utility first. PGE emails use the pgn.com domain
  (for example LiabilityClaims@pgn.com).

