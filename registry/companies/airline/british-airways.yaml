    hours: 24 hours daily
    purposes: [flight_cancellation, flight_delay, refund_request, delayed_baggage, poor_service]
    notes: >-
      The contact page says the AI assistant (English only) opens from the icon at the bottom of the screen and can
      connect you to a customer service advisor 24/7. The contact page calls live chat the most convenient way to get
      further baggage help.
    verified_via: browser
    source: https://www.britishairways.com/content/en/gb/information/help-and-contacts/contact-us
    last_verified: 2026-11-19
  - id: complaints-claims-portal
    type: web_form
    label: Feedback and Claims Portal (complaints, compensation, disruption expenses, baggage, downgrade)
