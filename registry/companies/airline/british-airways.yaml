      The complaints page says to use it if you have already travelled or had a delay or cancellation; if you have not
      travelled yet, use the contact page instead. "Raise a new case" uses the booking reference and personal details;
      you can also log in. "Track an existing case" uses the case reference number. BA asks you not to open a second
