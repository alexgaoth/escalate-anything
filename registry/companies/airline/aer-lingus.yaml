    notes: >-
      The page prints "(01) 761 7834" for calls within Ireland and gives no hours. The cancellations page says to
      contact customer service if you cannot rebook online, have a connecting flight, or booked another way.
    verified_via: browser
    source: https://www.aerlingus.com/support/customer-care/contact-us/
    last_verified: 2026-11-19
  - id: customer-service-phone-uk
    type: phone
    label: Customer service, when in the United Kingdom
    value: +44-333-004-5000
    purposes: [flight_cancellation, flight_delay, denied_boarding, refund_request, poor_service]
    notes: >-
      No hours given. The same page lists numbers for Austria, Belgium, France, Germany (+49 800 7244574), Italy,
      Luxembourg, Netherlands, Portugal, Spain (+34 918 362265; customer services freephone +34 900 031071),
      Switzerland (+41 44 52 46 766), the USA (+1 516 622 4222) and Canada (+1 800 474 7424).
    verified_via: browser
    source: https://www.aerlingus.com/support/customer-care/contact-us/
    last_verified: 2026-11-19
  - id: chat
    type: chat
    label: Chat with Erin (chat bot 24/7; ask Erin for a live agent to change a booking)
    value: https://www.aerlingus.com/support/customer-care/contact-us/
    hours: 24/7
