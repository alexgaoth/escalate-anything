    notes: >-
      The "Chat now" button is on the Contact us page. The bot answers general queries; live chat agents handle
      booking changes such as bags, seats and name changes. The Stay Safe Online page says the official WhatsApp chat
      is under "Chat with us" on this page.
    verified_via: browser
    source: https://www.aerlingus.com/support/customer-care/contact-us/
    last_verified: 2026-11-19
  - id: eu261-compensation-form
    type: web_form
    label: Flight Disruption Compensation Claim Form (EU261)
    value: https://www.aerlingus.com/app/support/forms/flight-disruption-compensation-form
    purposes: [flight_cancellation, flight_delay, denied_boarding]
    access: open
    notes: >-
      Starts with booking reference and family name, entered exactly as on the booking. Needs details of all flights
      claimed for, name and contact details, bank account details, and a letter of authorisation if claiming for
      someone else. Do not submit a second claim if one is already open.
    verified_via: browser
    source: https://www.aerlingus.com/legal/regulation/
    last_verified: 2026-11-19
  - id: eu261-expenses-form
    type: web_form
    label: Flight Disruption Expenses Claim Form (meals, hotel, transport)
    value: https://www.aerlingus.com/app/support/forms/flight-disruption-expenses-form
    purposes: [flight_cancellation, flight_delay, denied_boarding]
    access: open
    notes: >-
      For flights operated by Aer Lingus or Emerald Airlines. Needs the booking reference, flight details, contact and
      bank details, a letter of authorisation if claiming for someone else, and itemised receipts (date and time,
      vendor, items, total and currency). Credit card receipts alone and screenshots of bank or payment apps are not
