known_blockers:
  - There is no complaint email address; complaints and claims go through online forms, which ask for the booking reference (6 characters beginning A-G).
  - Virgin Atlantic only talks to the passenger named in the booking or a representative with written permission.
  - Compensation needs one claim form per flight; passengers on different bookings must claim separately with a different email address.
  - The February 2025 compensation leaflet still gives virginatlantic.com/euclaimapplication for claims; on 2026-11-19 that address redirected to my.virginatlantic.com and failed with a certificate error. Use the help-centre form instead.
  - Lost and damaged bag claims need a PDF log filled in, saved and attached before the online form is sent.

notes: >-
  Read on virginatlantic.com and help.virginatlantic.com in the browser on 2026-11-19 (pages render with JavaScript).
  Conditions of Carriage Revision 58, effective 17 August 2026, read as a PDF. Virgin Atlantic's own complaints page
  confirms AviationADR (trading as Airline Dispute Resolution by Consumer Dispute Resolution Ltd), matching the CAA
  list. Inconsistencies on Virgin's pages - the article "Am I entitled to compensation if there has been a change to
  my flight?" gives delay thresholds of "three hours or more if flying 1500 km to 3000 km; four hours or more in all
  other cases" and links two "Apply for compensation" buttons to the expenses form; the February 2025 leaflet tables
  are used here. The leaflet names the CAA (45-59 Kingsway, London) as the enforcement body for complaints about
  assistance during disruption. The AviationADR postal address on Virgin's page (Kingsbridge) differs from the one in
  easyJet's terms (Milton Keynes); check the regulator file.

