escalation:
  - {rung: frontline, channel: live-chat}
  - {rung: written_complaint, channel: eu261-claim-form, note: "Compensation claims under EC261 / UK261 go through this form; expenses through expense-claim-form."}
  - {rung: written_complaint, channel: contact-form, note: "The notice of rights page sends complaints to the Contact Form."}
  - {rung: regulator, regulator: eu-air-passenger-nebs, note: "National Enforcement Body of the country where the incident happened (departure airport; for flights into the EU on an EU carrier, the arrival airport). See regulators/eu-air-passenger-nebs."}
  - {rung: regulator, regulator: de-sruv, note: "The Schlichtungsstelle Reise & Verkehr member list (Stand: 19. Oktober 2026) names 'Easyjet Airline Company Ltd.' Free conciliation for flights to or from Germany or for a passenger in Germany, after you have complained to easyJet first. The list does not name easyJet UK Limited, easyJet Europe Airline GmbH or easyJet Switzerland S.A. separately. See regulators/de-sruv."}
  - {rung: regulator, regulator: fr-mtv, note: "Listed as 'EASYJET AIRLINE COMPANY LIMITED (SF)' among the airline members of Médiation Tourisme et Voyage (member list read 2026-11-19). After a written complaint with a negative answer or no answer within 60 days; apply within 12 months of the first written complaint. Free; the opinion binds neither side."}
  - {rung: regulator, regulator: es-aesa, note: "For a flight that departed from Spain, or flew to Spain from outside the EU on an EU airline, from 2 June 2023: AESA's dispute resolution is mandatory for every airline and its decision binds the airline (not the passenger). Claim from the airline first; if it does not answer within one month or you reject the answer, file with AESA within one year of that claim. Not for baggage."}
  - {rung: regulator, regulator: eu-ecc-net, note: "Free help from the European Consumer Centre in your country when the airline is based in another EU country, Iceland or Norway."}
  - {rung: payment_dispute, note: "Card chargeback for a refund the airline owes but has not paid."}
  - {rung: small_claims, note: "European Small Claims Procedure for cross-border claims up to EUR 5,000 (rules/eu-small-claims-procedure); otherwise the national court. Time limits for EU261 claims are set by national law."}

playbooks:
  - issue: flight_delay
    summary: If you arrive more than 3 hours late, claim EC261 compensation on the claim form; claim care costs you paid yourself on the expense form. If the delay is longer than 5 hours you may cancel for a full refund.
    evidence: [booking reference (starts with E or K), flight number (EZY, EJU or EZS), scheduled and actual arrival times, itemised receipts or invoices on headed paper, bank account in the claimant's name]
    steps:
      - do: At the airport, ask for the refreshment voucher (after a 2-hour delay on flights up to 1,500 km, 3 hours on longer flights). If no voucher is given, keep receipts.
      - do: If the delay runs overnight, wait at the airport for ground crew to give hotel and transport details. A hotel you book yourself when easyJet could have provided one is not reimbursed.
      - do: If the delay is longer than 5 hours and you no longer want to fly, ask ground crew or customer service to cancel for a full refund or move to a later date.
        channel: live-chat
      - do: Claim compensation if the arrival delay was more than 3 hours and the cause was not an extraordinary circumstance.
        channel: eu261-claim-form
      - do: Claim reasonable expenses (standard-class transport, 3-star hotel, food and drink without alcohol) with itemised receipts.
        channel: expense-claim-form
      - do: If easyJet rejects the claim or does not answer, complain in writing.
        channel: contact-form
      - do: Then complain to the National Enforcement Body for the departure airport.
        regulator: eu-air-passenger-nebs
      - do: For flights to or from Germany, you can ask Schlichtungsstelle Reise & Verkehr for free conciliation.
        regulator: de-sruv
    facts:
      - kind: compensation
        claim: easyJet's notice of rights says a passenger who arrives at least 3 hours after the scheduled arrival may be entitled to £220 / €250 (1,500 km or less), £350 / €400 (within Europe over 1,500 km, and other flights of 1,500-3,500 km) or £520 / €600 (other flights of 3,500 km or more), except where the cause is extraordinary circumstances. The amount is reduced by 50% if the re-routed flight arrives within 2, 3 or 4 hours of the original arrival, depending on distance.
        issues: [flight_delay, flight_cancellation, denied_boarding]
        verified_via: browser
        source: https://www.easyjet.com/en/terms-and-conditions/notice-of-rights-for-flight-delays-and-cancellations
        last_verified: 2026-11-19
      - kind: policy
        claim: easyJet gives a refreshment voucher worth £6 or €9 after a 2-hour delay on flights up to 1,500 km and a 3-hour delay on flights over 1,500 km, or reimburses up to the same amount against receipts. If an overnight hotel cannot provide food, easyJet reimburses up to £25 per person per day (EUR/CHF equivalent).
        issues: [flight_delay]
        verified_via: browser
        source: https://www.easyjet.com/en/help/boarding-and-flying/delays-and-cancellations
        last_verified: 2026-11-19
      - kind: process
        claim: All expense claims must be supported by valid itemised receipts or invoices on headed paper. The delays page says credit card receipts are not accepted as proof of payment; the expense form says cardholder copies are accepted as supporting documents for receipts.
        issues: [flight_delay, flight_cancellation]
        verified_via: browser
        source: https://www.easyjet.com/en/help/boarding-and-flying/delays-and-cancellations
        last_verified: 2026-11-19

  - issue: flight_cancellation
    summary: In Manage Bookings, choose a free transfer, a 12-month voucher or a full refund (processed within 7 days). Compensation is possible if easyJet cancelled within 14 days of departure for a reason it is responsible for.
    evidence: [booking reference, cancellation email, flight number and date, receipts for hotel, meals and alternative transport, bank account in the claimant's name]
    steps:
      - do: Sign in to Manage Bookings and choose a free transfer, a voucher or a refund. If you take a voucher or refund, you cannot claim accommodation or expenses.
        channel: manage-bookings
      - do: If the next flight is the following day, request a hotel room in Manage Bookings after you transfer. For a wheelchair-accessible room, contact customer services.
        channel: live-chat
      - do: If easyJet cannot fly you within 24 hours, you may travel by another airline, train, bus or hire car under comparable conditions and claim reasonable costs with itemised receipts. You cannot claim both a refund and re-routing.
        channel: expense-claim-form
      - do: Claim compensation if the cancellation was within 14 days of departure.
        channel: eu261-claim-form
      - do: If the refund is not paid, complain in writing, then to the National Enforcement Body, then dispute the card payment.
        channel: contact-form
      - do: Complain to the National Enforcement Body for the departure airport.
        regulator: eu-air-passenger-nebs
    facts:
      - kind: policy
        claim: After a cancellation easyJet offers a refund of the full booking value, paid to the account used for the booking; it says it processes refund requests within 7 days and the money may take a few extra days to reach the bank account. A voucher for the full booking value is valid for 12 months from issue.
        issues: [flight_cancellation, refund_request, travel_credit]
        verified_via: browser
        source: https://www.easyjet.com/en/help/boarding-and-flying/delays-and-cancellations
        last_verified: 2026-11-19
      - kind: compensation
        claim: The notice of rights says no compensation is due if you were told of the cancellation at least 2 weeks before departure; or 2 weeks to 7 days before and offered re-routing departing no more than 2 hours early and arriving less than 4 hours late; or less than 7 days before and offered re-routing departing no more than 1 hour early and arriving less than 2 hours late; or if the cause was extraordinary circumstances.
        issues: [flight_cancellation]
        verified_via: browser
        source: https://www.easyjet.com/en/terms-and-conditions/notice-of-rights-for-flight-delays-and-cancellations
        last_verified: 2026-11-19
      - kind: policy
        claim: easyJet will try to get you an easyJet flight to your final destination within 24 hours of the original flight; if none is available you may take another airline, train, bus or hire car under comparable transport conditions (for example economy or standard fare) and claim reasonable costs.
        issues: [flight_cancellation]
        verified_via: browser
        source: https://www.easyjet.com/en/help/boarding-and-flying/delays-and-cancellations
        last_verified: 2026-11-19

  - issue: denied_boarding
    summary: Speak to ground crew at the airport; easyJet pays reasonable transfers, hotel and food until the next seat, and EC261 compensation is due if you were denied boarding against your will.
    evidence: [booking reference, boarding pass, written confirmation from ground crew, receipts, arrival time of the new flight]
    steps:
      - do: Ask ground crew for alternative travel, compensation information, or a refund or voucher if you choose not to travel.
      - do: Claim compensation, choosing "Denied Boarding" (or "Voluntarily Offloaded" if you volunteered).
        channel: eu261-claim-form
      - do: Claim expenses you paid while waiting.
        channel: expense-claim-form
      - do: If easyJet does not pay, complain to the National Enforcement Body for the departure airport.
        regulator: eu-air-passenger-nebs
    facts:
      - kind: policy
        claim: easyJet's delays page says a passenger denied boarding is paid reasonable ground transfers, accommodation and food and drink in line with its expenses policy until the next seat is available, and is entitled to compensation under EC261. On overbooked flights easyJet first asks for volunteers at Bag Drop or the gate.
        issues: [denied_boarding]
        verified_via: browser
        source: https://www.easyjet.com/en/help/boarding-and-flying/delays-and-cancellations
        last_verified: 2026-11-19

  - issue: delayed_baggage
    summary: Report the bag on the Baggage Portal within 24 hours of arrival, then claim essential items (up to £75 per person) within 21 days of the flight.
    evidence: [bag tag, WorldTracer file reference, boarding pass, booking reference, dated receipts for essential items]
    steps:
      - do: If airport staff cannot find the bag, report it on the Baggage Portal within 24 hours of the flight arriving.
        channel: delayed-bag-report
      - do: Check the bag status online. easyJet says more than 90% of delayed bags are found within five days.
        channel: bag-tracker
      - do: Buy only essential items (toiletries, basic clothing, over-the-counter medicine) and keep receipts; submit them within 21 days of the flight.
        channel: luggage-claims-form
      - do: If the bag is delayed more than 5 days, chat with the Delayed Baggage Tracing Team.
        channel: delayed-bag-tracing-chat
      - do: If the bag is not found after 45 days, claim it as lost (see lost_baggage).
        channel: luggage-claims-form
    facts:
      - kind: deadline
        claim: easyJet's baggage page says to report a delayed bag on the Baggage Portal within 24 hours of the flight arriving, and to submit receipts for essential items (up to £75 per person) within 21 days of the flight. A claim is only valid if you were away from home and have receipts for all purchases.
        issues: [delayed_baggage]
        verified_via: browser
        source: https://www.easyjet.com/en/help/baggage/damaged-delayed-or-lost-luggage
        last_verified: 2026-11-19
      - kind: deadline
        claim: easyJet's Terms and Conditions say that if baggage is delayed for more than 24 hours on an outbound flight you can spend up to £25 per day per person on essential items for a maximum of three days, claimed in writing on the online form within 21 days of the flight; a claim for delay of baggage must be made in writing within 21 days from when the baggage was made available to you.
        issues: [delayed_baggage]
        verified_via: browser
        source: https://www.easyjet.com/en/help-centre/policy-terms-and-conditions/terms-and-conditions
        last_verified: 2026-11-19
      - kind: policy
        claim: easyJet cannot deliver delayed bags in Egypt or Morocco (collect at the airport), or to mainland Spain for bags that arrived in Gibraltar.
        issues: [delayed_baggage]
        verified_via: browser
        source: https://www.easyjet.com/en/help/baggage/damaged-delayed-or-lost-luggage
        last_verified: 2026-11-19

  - issue: lost_baggage
    summary: A bag not found 45 days after it was reported is treated as lost; claim compensation online with receipts.
    evidence: [WorldTracer file reference, bag tag, contents list with values, proof of purchase receipts, booking reference]
    steps:
      - do: Make sure the bag was reported as delayed on the Baggage Portal within 24 hours of arrival.
        channel: delayed-bag-report
      - do: Between 6 and 45 days, the tracing team keeps searching; check status or chat with the team.
        channel: delayed-bag-tracing-chat
      - do: After 45 days, claim compensation online with receipts for the contents.
        channel: luggage-claims-form
      - do: If easyJet rejects or ignores the claim, complain in writing.
        channel: contact-form
    facts:
      - kind: policy
        claim: easyJet considers a bag lost if it is not found after 45 days; the amount paid depends on the contents and the receipts you have as proof of purchase. easyJet keeps the details and tells you if the bag is found later.
        issues: [lost_baggage]
        verified_via: browser
        source: https://www.easyjet.com/en/help/baggage/damaged-delayed-or-lost-luggage
        last_verified: 2026-11-19

  - issue: damaged_baggage
    summary: Photograph the damage before leaving the airport and report and register the claim online within 7 days of the flight.
    evidence: [photos of the damage taken at the airport, airport damage report if made, bag tag, boarding pass, booking reference]
    steps:
      - do: Take photos of the damage before you leave the airport and report it to staff if you can.
      - do: Report the damage and register the claim on the damaged luggage page within 7 days of the flight, even if you reported it at the airport.
        channel: damaged-bag-report
      - do: For damaged items inside the bag, contact your travel insurer.
      - do: If easyJet rejects the claim, complain in writing.
        channel: contact-form
    facts:
      - kind: deadline
        claim: easyJet's baggage page says to complete the damage report and claim registration within 7 days of the flight; its Terms and Conditions say a claim for damage must be made in writing as soon as you discover it and at the latest within seven days, with supporting documentation such as photographs.
        issues: [damaged_baggage]
        verified_via: browser
        source: https://www.easyjet.com/en/help/baggage/damaged-delayed-or-lost-luggage
        last_verified: 2026-11-19
      - kind: policy
        claim: easyJet is not responsible for superficial or external damage such as scuffs and scratches, damage due to overpacking, damage from water, rain or snow, or damage to fragile or perishable items inside the bag. Non-UK residents are offered a replacement bag instead of a repair.
