  - id: eu261-claim-form
    type: web_form
    label: EC261 compensation claim form (delay, cancellation, denied boarding)
    value: https://www.easyjet.com/claim/en/eu261
    purposes: [flight_delay, flight_cancellation, denied_boarding]
    access: captcha
    notes: >-
      The contact page links https://www.easyjet.com/en/claim/EU261, which redirects here. Needs the booking reference
      (starts with E or K), the flight number digits (flights start with EZY, EJU or EZS), the original flight date, the
      reason (delayed, cancelled, denied boarding, voluntarily offloaded; choose delayed for a diverted flight), the
      claimant's address, an email and mobile number that must match the booking, and UK-style bank details (sort code
      and account number) for an account in the claimant's name. Only the lead passenger can claim for other passengers
      on the booking. Supporting documents are optional (pdf, html, gif, bmp, png, jpg; under 5 MB). A reCAPTCHA is on
      the confirmation step. Submitting it does not refund an unused ticket.
    verified_via: browser
    source: https://www.easyjet.com/en/help-centre/contact/contact-us
    last_verified: 2026-11-19
  - id: expense-claim-form
    type: web_form
    label: Expense claim form (hotel, meals, transport after a delay, cancellation or diversion)
    value: https://www.easyjet.com/claim/en/welfare
    purposes: [flight_delay, flight_cancellation, denied_boarding]
    access: captcha
    notes: >-
      The contact page links https://www.easyjet.com/en/claim/welfare, which redirects here. Same booking, contact and
      bank details as the compensation form, plus one receipt upload per expense (amount and currency must match the
      receipt). easyJet does not pay pre- or post-travel costs such as hotels at your destination, airport parking or
      transport from the destination airport. A reCAPTCHA is on the confirmation step.
    verified_via: browser
    source: https://www.easyjet.com/en/help/boarding-and-flying/delays-and-cancellations
    last_verified: 2026-11-19
