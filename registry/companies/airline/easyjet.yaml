facts:
  - kind: process
    claim: easyJet's Terms and Conditions say passengers must submit EC261 / UK261 compensation claims directly to easyJet and allow 28 days (or less if the law requires) to respond before engaging a third party. easyJet will not process a third-party claim unless it includes documentation showing the third party's authority to act for the passenger. Compensation is paid only to a bank account held by a passenger on the booking.
    issues: [flight_delay, flight_cancellation, denied_boarding]
    verified_via: browser
    source: https://www.easyjet.com/en/help-centre/policy-terms-and-conditions/terms-and-conditions
    last_verified: 2026-11-19
  - kind: deadline
    claim: easyJet's Terms and Conditions say the limitation period for APR 2019 and EU261 claims is set by the law of the court where the case is heard; in England and Wales it is six years from the date of the flight. Court actions under the Montreal or Warsaw Convention must be brought within two years.
    issues: [flight_delay, flight_cancellation, denied_boarding, delayed_baggage, lost_baggage, damaged_baggage]
    verified_via: browser
    source: https://www.easyjet.com/en/help-centre/policy-terms-and-conditions/terms-and-conditions
    last_verified: 2026-11-19
  - kind: process
    claim: If easyJet cannot resolve a complaint, you may refer it to AviationADR (approved by the UK Civil Aviation Authority) within 12 months of easyJet's final response; easyJet also points to the European Commission's online dispute form, but the EU Online Dispute Resolution platform was discontinued on 20 July 2025 (see regulators/eu-ecc-net).
    issues: [poor_service, flight_delay, flight_cancellation]
    verified_via: browser
    source: https://www.easyjet.com/en/terms-and-conditions/notice-of-rights-for-flight-delays-and-cancellations
    last_verified: 2026-11-19
  - kind: policy
    claim: easyJet fares and fees are non-refundable, except that cancelling in full within 24 hours of booking gives a full refund minus the cancellation fee. Requests for a refund of government taxes on an unused flight must be submitted within six calendar months of the scheduled departure date.
    issues: [refund_request, ancillary_fee_refund]
    verified_via: browser
    source: https://www.easyjet.com/en/help/booking-and-check-in/cancelling-your-flight
    last_verified: 2026-11-19
  - kind: policy
    claim: Flights numbered EZY are normally operated by easyJet UK Limited (London Luton Airport, UK), EJU by easyJet Europe Airline GmbH (Vienna, Austria) and EZS by easyJet Switzerland S.A. (Geneva, Switzerland).
    verified_via: browser
    source: https://www.easyjet.com/en/help-centre/policy-terms-and-conditions/terms-and-conditions
    last_verified: 2026-11-19
  - kind: policy
    claim: If you booked an alternative-airline flight through Manage Bookings during disruption and had to pay for hold luggage again, easyJet asks you to send a refund request to Customer Services with the alternative booking and the receipt.
    issues: [ancillary_fee_refund, flight_cancellation]
    verified_via: browser
    source: https://www.easyjet.com/en/help/boarding-and-flying/delays-and-cancellations
    last_verified: 2026-11-19

known_blockers:
  - The EC261 compensation form, the expense form and the contact form have a reCAPTCHA.
  - Claim forms need the booking reference, flight number and date, and an email and phone number that match the booking; payment goes only to a bank account in the claimant's name.
  - Rebooking, vouchers and refunds after a cancellation are done in Manage Bookings, which needs sign-in (account, or booking reference and last name).
  - Live chat is a page widget, not a static form.

notes: >-
  Checked on 2026-11-19 in a browser (easyjet.com blocks plain fetches with HTTP 403). The EU261 and expense form URLs on
  the contact page (/en/claim/EU261, /en/claim/welfare) redirect to /claim/en/eu261 and /claim/en/welfare. Countries:
  easyJet UK Limited (gb), easyJet Europe Airline GmbH (Austria, the EU carrier) and easyJet Switzerland S.A. (ch); the
  claim form's airport list also includes Norwegian and Icelandic airports, but no/is were not added. Conflicts: the delays
  page says credit card receipts are not accepted, while the expense form accepts cardholder copies as supporting
  documents; the baggage page gives essential items as "up to £75 per person" for a delay of 24 hours or more, while the
  Terms and Conditions give "up to £25 per day per person" for a maximum of three days and only for an outbound flight.
  The "track my refund" link on the delays page (/en/track-my-refund-request-hub) returned Access Denied, so it is not
  listed. No scam or fake-account warning was found on easyjet.com, so security.known_scams is empty; the claim forms
  themselves say not to enter credit card details. easyJet also names AviationADR (UK) for unresolved complaints.

