    purposes: [flight_cancellation, flight_delay, denied_boarding, refund_request, poor_service]
    notes: Printed as "+44 113 868 4151"; charged at local call rates, mobiles may cost more. Same calling conditions as the Ireland line.
    verified_via: browser
    source: https://help.ryanair.com/hc/en-gb/articles/16113200464401-Call-Us-UK
