known_blockers:
  - The EU261 compensation and expenses forms, the baggage claim form, the feedback form and support cases all need a myRyanair login.
  - EU261 claims need identity verification of a named passenger with a travel document; a claim for another passenger must be made from that passenger's own myRyanair account.
  - Baggage claims need the 10-character PIR file reference from the arrival airport report.
  - The refund application form has an "Enter the code shown" check and accepts one application per booking.
  - Phone agents expect a call from the mobile number on the booking; queries more than 30 days before departure are sent to chat.
  - Bookings made through a third-party agent must be verified (ID, passport or national ID, front-facing camera) before you can manage them or get a direct refund.

notes: >-
  Checked on 2026-11-19 in a browser: ryanair.com blocks plain fetches, and the Help Centre (help.ryanair.com) was read
  through its public article API inside the browser tab. The General Terms page shows "Effective Date: 25 June 2026".
  Conflicts: the help centre links the expenses claim both as /myryanair/requests/new/eu-261/expenses and as the old
  onlineform.ryanair.com/ie/en/eu-261 (now a redirect to the myRyanair login); OTA refund verification is linked both as
  onlineform.ryanair.com/ie/en/customer-verification (checked) and /contact-us-ota (not checked). The damaged-bag
  deadline is "7 days from the date of damage" in the help centre and "within seven days of getting your baggage" in the
  General Terms. Liability is stated as 1,519 SDR "for each piece of baggage". Countries: Ryanair DAC (ie) and Ryanair UK
  (gb); the help centre also has a Norway locale, but Norwegian routes were not checked, so no is not added. No
  passenger-facing warning about fake social media accounts was found on ryanair.com, help.ryanair.com or
  corporate.ryanair.com; the security entries come from Ryanair's own help centre and a December 2023 corporate release.
  Ryanair has no stated allowance for essential items while a bag is delayed.

