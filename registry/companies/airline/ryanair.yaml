channels:
  - id: chat
    type: chat
    label: Live chat (Molli chatbot 24/7, agents 7 days a week)
    value: https://www.ryanair.com/ie/en/lp/chat
    hours: Chatbot 24/7; agents Monday-Friday 08:00-20:00 GMT, Saturday and Sunday 09:00-18:00 GMT
    purposes: [flight_cancellation, flight_delay, denied_boarding, refund_request, poor_service, delayed_baggage]
    notes: >-
      You need the booking number, and the details you give must match the booking exactly. Ryanair says mornings and
      late afternoons have long waits and suggests 11:00-15:00 GMT. The phone pages send queries made more than 30 days
      before departure to chat.
    verified_via: browser
    source: https://help.ryanair.com/hc/en-ie/articles/12892454290321-Let-s-Chat
    last_verified: 2026-11-19
  - id: phone-ireland
    type: phone
    label: Customer service, Ireland
    value: +353-1-691-7177
    hours: Monday-Friday 08:00-20:00 GMT; Saturday and Sunday 09:00-18:00 GMT
    purposes: [flight_cancellation, flight_delay, denied_boarding, refund_request, poor_service]
    notes: >-
      Printed as "+353 1 691 7177"; calls are charged at local call rates and mobiles may cost more. Call from the
      mobile number used on the booking (update it in myRyanair if needed) and have the booking reference ready.
      Bookings or changes made through the contact centre cost more if they could have been made online.
    verified_via: browser
    source: https://help.ryanair.com/hc/en-ie/articles/12893510195345-Call-Us-Ireland
    last_verified: 2026-11-19
