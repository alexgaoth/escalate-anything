    last_verified: 2026-11-19
  - id: data-access-request-form
    type: web_form
    label: Data access request form
    value: https://privacyportal-de.onetrust.com/webform/e12acd0a-fa4e-45df-999a-2d2066658f49/22fc437a-98d6-40a3-adef-5ed53e74d0ce
    purposes: [privacy_request]
    notes: Hosted by OneTrust for Ryanair. Needs a copy of photo ID (passport or national ID) and email verification. Ryanair responds within one month, extendable by up to two months for complex requests.
    verified_via: browser
