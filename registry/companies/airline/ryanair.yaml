escalation:
  - {rung: frontline, channel: chat}
  - {rung: written_complaint, channel: eu261-claim-form, note: "Compensation claims; expenses go through eu261-expenses-form."}
  - {rung: written_complaint, channel: feedback-form, note: "Other complaints; Ryanair says it replies within 10 working days."}
  - {rung: regulator, regulator: eu-air-passenger-nebs, note: "National Enforcement Body of the country where the incident happened (departure airport; for flights into the EU on an EU carrier, the arrival airport). See regulators/eu-air-passenger-nebs."}
  - {rung: regulator, regulator: de-sruv, note: "The Schlichtungsstelle Reise & Verkehr member list (Stand: 19. Oktober 2026) names 'Ryanair DAC' and 'Malta Air Limited'. Ryanair's own ADR page also lists SRUV for Germany, all topics. Free conciliation for flights to or from Germany or for a passenger in Germany, after you have complained to Ryanair first. See regulators/de-sruv."}
  - {rung: regulator, regulator: fr-mtv, note: "Listed as 'RYANAIR (also RYANAIR – MALTA AIR)' among the airline members of Médiation Tourisme et Voyage (member list read 2026-11-19). After a written complaint with a negative answer or no answer within 60 days; apply within 12 months of the first written complaint. Free; the opinion binds neither side."}
  - {rung: regulator, regulator: es-aesa, note: "For a flight that departed from Spain, or flew to Spain from outside the EU on an EU airline, from 2 June 2023: AESA's dispute resolution is mandatory for every airline and its decision binds the airline (not the passenger). Claim from the airline first; if it does not answer within one month or you reject the answer, file with AESA within one year of that claim. Not for baggage."}
  - {rung: regulator, regulator: eu-ecc-net, note: "Free help from the European Consumer Centre in your country when the airline is based in another EU country, Iceland or Norway."}
  - {rung: payment_dispute, note: "Card chargeback for a refund the airline owes but has not paid."}
  - {rung: small_claims, note: "European Small Claims Procedure for cross-border claims up to EUR 5,000 (rules/eu-small-claims-procedure); otherwise the national court. Time limits for EU261 claims are set by national law."}

playbooks:
  - issue: flight_delay
    summary: If you arrive 3 or more hours late, check and claim compensation in myRyanair; claim expenses separately. If the delay is 5 hours or more and you decide not to fly, apply for a refund.
    evidence: [booking reference, flight number and date, scheduled and actual arrival times, itemised receipts, travel document for identity verification]
    steps:
      - do: At the airport, take the assistance offered (meal coupons; hotel and transport if the delay runs to the next day). If care is not offered, keep itemised receipts, and contact Ryanair before arranging transport.
        channel: chat
      - do: Claim reasonable receipted expenses.
        channel: eu261-expenses-form
      - do: Check eligibility and claim compensation. Ryanair says it can take 24-96 hours to establish why a flight was delayed.
        channel: eu261-claim-form
      - do: If the delay is 5 hours or more and you choose not to travel, apply for a refund.
        channel: refund-application-form
      - do: If you disagree with the decision, contact the ADR body listed for your country; for Germany this is Schlichtungsstelle Reise & Verkehr.
        regulator: de-sruv
      - do: Complain to the National Enforcement Body for the departure airport.
        regulator: eu-air-passenger-nebs
    facts:
      - kind: compensation
        claim: Ryanair's EU261 page states compensation of €250 for flights of 1,500 km or less, €400 for intra-EU flights over 1,500 km and other flights of 1,500-3,500 km, and €600 for non-internal EU flights over 3,500 km, subject to eligibility criteria.
        issues: [flight_delay, flight_cancellation, denied_boarding]
        verified_via: browser
        source: https://help.ryanair.com/hc/en-ie/articles/12891928880401-Regulation-EU261
        last_verified: 2026-11-19
      - kind: policy
        claim: Ryanair says it does not pay compensation when the delay or cancellation is due to extraordinary circumstances (it lists adverse weather, de-icing, lightning strikes, runway or airport closure, strike action, air traffic control, bird strike, foreign object debris, external handling difficulties, security and medical emergencies), when a cancellation was notified more than 14 days before departure, or when the arrival delay is less than 3 hours.
        issues: [flight_delay, flight_cancellation]
        verified_via: browser
        source: https://help.ryanair.com/hc/en-ie/articles/12891028627729-Compensation-will-not-be-paid-for-the-following-reasons
        last_verified: 2026-11-19
      - kind: policy
        claim: Assistance at the airport, including meal coupons, starts at an expected delay of 2 hours for flights up to 1,500 km and 3 hours for intra-EU flights over 1,500 km and other flights of 1,500-3,500 km. If Ryanair offered care and you made your own arrangements anyway, additional costs may not be reimbursed.
        issues: [flight_delay]
        verified_via: browser
        source: https://help.ryanair.com/hc/en-ie/articles/12889869090705-If-my-flight-has-been-delayed-by-2-hours-or-more-What-are-my-options
        last_verified: 2026-11-19

  - issue: flight_cancellation
    summary: Use the refund link in the cancellation email, My Bookings or the refund form; the refund reaches your Ryanair Wallet within 24 hours and can be moved to your card within 5 working days. Compensation is possible if you were told less than 14 days before departure.
    evidence: [booking reference, cancellation email, flight number and date, receipts for meals, hotel and transport, travel document for identity verification]
    steps:
      - do: Choose a refund, a free change to new times or dates on the same route, or re-routing, using the link in the cancellation email or My Bookings.
        channel: my-bookings
      - do: If you cannot use My Bookings, apply for the refund on the refund application form (one application per booking).
        channel: refund-application-form
      - do: If no suitable Ryanair flight exists, contact Ryanair before making other arrangements; you may be told to rebook yourself and submit receipts.
        channel: chat
      - do: If you were told of the cancellation less than 14 days before departure, check and claim compensation.
        channel: eu261-claim-form
      - do: Claim meals, hotel and transport you paid for while waiting to be re-routed.
        channel: eu261-expenses-form
      - do: If you booked through an online travel agent, complete customer verification so Ryanair can refund you directly.
        channel: ota-customer-verification
      - do: If the refund is not paid, complain to the National Enforcement Body, then dispute the card payment.
        regulator: eu-air-passenger-nebs
    facts:
      - kind: deadline
        claim: If you booked directly on ryanair.com and are entitled to a refund after a disruption, Ryanair pays it into your Ryanair Wallet within 24 hours; when you choose to transfer it, it reaches the original payment method within 5 working days. Refunds for bookings made through an online travel agent may take longer because Ryanair must verify your details first.
        issues: [flight_cancellation, refund_request]
        verified_via: browser
        source: https://help.ryanair.com/hc/en-ie/articles/12896664457873-How-long-will-it-take-for-my-refund-to-be-paid
        last_verified: 2026-11-19
      - kind: policy
        claim: Ryanair's General Terms (clause 10.2) say an involuntary refund equals the fare paid for the flight you cannot take plus the associated taxes, fees and charges.
        issues: [flight_cancellation, refund_request, ancillary_fee_refund]
        verified_via: browser
        source: https://www.ryanair.com/ie/en/useful-info/help-centre/terms-and-conditions
        last_verified: 2026-11-19
      - kind: policy
        claim: Ryanair says the care entitlements (meals, two calls or emails, hotel and transport) apply if you choose to be re-routed as soon as possible, and do not apply if you choose re-routing at a later date or a refund.
        issues: [flight_cancellation, flight_delay]
        verified_via: browser
        source: https://help.ryanair.com/hc/en-ie/articles/12892190923665-EU261-Care-Entitlements-and-Passenger-Rights
        last_verified: 2026-11-19

  - issue: denied_boarding
    summary: Ask ground staff for your rights information, then claim EU261 compensation and expenses in myRyanair.
    evidence: [booking reference, boarding pass, written confirmation of denied boarding, receipts, arrival time of the new flight]
    steps:
      - do: Ask Ryanair staff at the airport for the information on your rights to assistance and compensation.
      - do: Claim compensation.
        channel: eu261-claim-form
      - do: Claim expenses.
        channel: eu261-expenses-form
      - do: If Ryanair does not pay, complain to the National Enforcement Body for the departure airport.
        regulator: eu-air-passenger-nebs
    facts:
      - kind: policy
        claim: Ryanair's General Terms (clause 9.4) say that if Ryanair does not let you board because a space is no longer available, it will compensate you in line with any relevant law and give you information about your rights to practical help and compensation.
        issues: [denied_boarding]
        verified_via: browser
        source: https://www.ryanair.com/ie/en/useful-info/help-centre/terms-and-conditions
        last_verified: 2026-11-19

  - issue: delayed_baggage
    summary: Report the bag at the arrival airport's Lost Property desk to get a PIR, then submit a separate claim in myRyanair within 21 days of the date the bag was given back to you.
    evidence: [Property Irregularity Report with 10-character file reference, bag tag, boarding pass, receipts]
    steps:
      - do: Before leaving the arrival airport, report the bag at the Lost Property desk and get the Property Irregularity Report (PIR).
      - do: Track the bag with the PIR file reference.
        channel: bag-tracker
      - do: Submit a documented claim no later than 21 days from the date the bag was placed at your disposal. Reporting at the airport is not a claim.
        channel: baggage-claim-form
      - do: Check the claim status in your support cases.
        channel: support-cases
      - do: If you disagree with the assessment, contact the ADR body Ryanair lists for your country (for Germany, Schlichtungsstelle Reise & Verkehr).
        regulator: de-sruv
    facts:
      - kind: deadline
        claim: Ryanair's help centre says a claim for misplaced baggage must be reported at the arrival airport and a documented claim submitted to Ryanair no later than 21 days from the date the baggage was placed at your disposal (limits set by the Montreal Convention 1999 and Ryanair's baggage regulations).
        issues: [delayed_baggage]
        verified_via: browser
        source: https://help.ryanair.com/hc/en-ie/articles/12890077647889-When-do-I-need-to-make-a-claim
        last_verified: 2026-11-19
      - kind: process
        claim: Ryanair says damaged and delayed baggage claims are processed within 15 working days, and lost baggage claims within 28 working days or once the full tracing process is complete; it contacts you by post or email.
        issues: [delayed_baggage, lost_baggage, damaged_baggage]
        verified_via: browser
        source: https://help.ryanair.com/hc/en-ie/articles/12890116485137-How-do-I-check-the-status-on-my-bag-claim-and-when-will-it-be-paid
        last_verified: 2026-11-19

  - issue: lost_baggage
    summary: Report at the arrival airport, keep the PIR, and claim in myRyanair; Ryanair's liability is limited to 1,519 SDR per piece unless you made a special declaration of value.
    evidence: [PIR with 10-character file reference, bag tag, boarding pass, contents list with values, receipts]
    steps:
      - do: Report the missing bag at the arrival airport's Lost Property desk and get the PIR.
      - do: Submit the claim with the PIR file reference.
        channel: baggage-claim-form
      - do: Follow the claim in your support cases.
        channel: support-cases
      - do: If Ryanair rejects or underpays the claim, contact the ADR body Ryanair lists for your country (for Germany, Schlichtungsstelle Reise & Verkehr).
        regulator: de-sruv
    facts:
      - kind: limit
        claim: Ryanair's General Terms (clause 14.4.4) limit liability for loss of or damage to baggage to 1,519 SDR for each piece of baggage, or up to 2,262 SDR if you made a special declaration of interest before check-in and paid the fee.
        issues: [lost_baggage, damaged_baggage, delayed_baggage]
        verified_via: browser
        source: https://www.ryanair.com/ie/en/useful-info/help-centre/terms-and-conditions
        last_verified: 2026-11-19

  - issue: damaged_baggage
    summary: Report the damage at the arrival airport to get a PIR, then claim in myRyanair within 7 days.
    evidence: [PIR with 10-character file reference, photos of the damage, bag tag, boarding pass, repair estimate or receipt]
    steps:
      - do: Report the damage at the Lost Property desk at the arrival airport and get the PIR. This also applies to damaged wheelchairs and mobility equipment.
      - do: Submit the claim within 7 days.
        channel: baggage-claim-form
      - do: If you disagree with the assessment, contact the ADR body Ryanair lists for your country (for Germany, Schlichtungsstelle Reise & Verkehr).
        regulator: de-sruv
    facts:
      - kind: deadline
        claim: Ryanair's help centre says that once damage is reported at the arrival airport, the claim must be submitted to Ryanair within 7 days from the date of damage. The General Terms (clause 15.1.2) say to write within seven days of getting your baggage.
        issues: [damaged_baggage]
        verified_via: browser
        source: https://help.ryanair.com/hc/en-ie/articles/12890077647889-When-do-I-need-to-make-a-claim
        last_verified: 2026-11-19

facts:
  - kind: policy
    claim: Ryanair says passengers with valid compensation claims should submit them directly through its compensation form to receive 100% of the entitlement, and that claims management companies may deduct up to 50% in fees.
    issues: [flight_delay, flight_cancellation, denied_boarding]
    verified_via: browser
    source: https://help.ryanair.com/hc/en-ie/articles/12890736320529-Claims-Management-Companies
    last_verified: 2026-11-19
  - kind: process
    claim: Ryanair's General Terms (clause 15.2, effective 25 June 2026) require passengers to submit EU261 claims directly and allow 14 days (or less if the law sets less) before engaging a third party; a third-party claim made earlier is processed only if it includes the passenger's contact and payment details so Ryanair can pay the passenger directly, and other third-party claims need documents proving the third party's authority.
    issues: [flight_delay, flight_cancellation, denied_boarding]
    verified_via: browser
    source: https://www.ryanair.com/ie/en/useful-info/help-centre/terms-and-conditions
    last_verified: 2026-11-19
  - kind: policy
    claim: Clause 15.3 of Ryanair's General Terms says assignment of a right to compensation, damages or refund is valid only to other passengers on the booking or travel group, or to a guardian; other assignments to third parties are invalid unless required by law, and the clause does not apply to EU261 claims that comply with clauses 15.2.1-15.2.7.
    issues: [flight_delay, flight_cancellation, denied_boarding]
    verified_via: browser
    source: https://www.ryanair.com/ie/en/useful-info/help-centre/terms-and-conditions
    last_verified: 2026-11-19
  - kind: deadline
