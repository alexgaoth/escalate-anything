      booking reference, the name on the reservation, an ID or passport and a front-facing camera. Standard
      verification is free; Express verification (GetID facial recognition) costs £/€0.59. After verification Ryanair
      pays refunds directly to you. One refund article links a different form
      (https://onlineform.ryanair.com/ie/en/contact-us-ota), which was not checked.
