  - id: eu261-claim-form
    type: web_form
    label: EU261 compensation claim (myRyanair)
    value: https://www.ryanair.com/ie/en/myryanair/requests/new/eu-261
    purposes: [flight_delay, flight_cancellation, denied_boarding]
    access: login
    notes: >-
      Redirects to the myRyanair login. The claimant must verify that they are a named passenger on the booking by
      confirming their travel document; claims for family or friends must be made through their own myRyanair account.
      A UK-site version of the link (/gb/en/myryanair/requests/new/eu-261) also appears in the help centre.
    verified_via: browser
    source: https://help.ryanair.com/hc/en-ie/articles/12889869090705-If-my-flight-has-been-delayed-by-2-hours-or-more-What-are-my-options
    last_verified: 2026-11-19
  - id: eu261-expenses-form
    type: web_form
    label: EU261 expenses claim (meals, hotel, transport) in myRyanair
    value: https://www.ryanair.com/ie/en/myryanair/requests/new/eu-261/expenses
    purposes: [flight_delay, flight_cancellation, denied_boarding]
    access: login
    notes: >-
      Submit itemised receipts for reasonable expenses when Ryanair could not provide care. Compensation and expense
      requests are submitted and reviewed separately. One help article links the old form
      https://onlineform.ryanair.com/ie/en/eu-261 for expenses; it now redirects to the myRyanair login.
    verified_via: browser
    source: https://help.ryanair.com/hc/en-ie/articles/12889869090705-If-my-flight-has-been-delayed-by-2-hours-or-more-What-are-my-options
    last_verified: 2026-11-19
  - id: refund-application-form
    type: web_form
    label: Refund Application Form (cancelled flight, or delay over 5 hours and not travelling)
    value: https://refundclaims.ryanair.com/
    purposes: [flight_cancellation, flight_delay, refund_request]
    access: captcha
    notes: >-
      No sign-in. Asks for the reason (flight cancelled, or delayed more than 5 hours and you will not travel), the
      reservation number, the airline code (FR, RK, AL or LW), the affected flight number and date, name and email, and
      whether to refund all passengers and flights or only some. An "Enter the code shown" check is at the end. Only one
