escalation:
  - {rung: frontline, channel: service-line-uk}
  - {rung: written_complaint, channel: claim-form}
  - {rung: regulator, regulator: eu-air-passenger-nebs, note: "National Enforcement Body of the country where the incident happened (departure airport; for flights into the EU on an EU carrier, the arrival airport). See regulators/eu-air-passenger-nebs."}
  - {rung: regulator, regulator: de-sruv, note: "Air France is on the Schlichtungsstelle Reise & Verkehr member list (Stand: 19. Oktober 2026) as 'Air France'. Free conciliation in Germany, for example for a flight to or from Germany, after you have complained to Air France first. See regulators/de-sruv."}
  - {rung: regulator, regulator: fr-mtv, note: "Listed as 'AIR FRANCE' among the airline members of Médiation Tourisme et Voyage (member list read 2026-11-19). After a written complaint with a negative answer or no answer within 60 days; apply within 12 months of the first written complaint. Free; the opinion binds neither side."}
  - {rung: regulator, regulator: es-aesa, note: "For a flight that departed from Spain, or flew to Spain from outside the EU on an EU airline, from 2 June 2023: AESA's dispute resolution is mandatory for every airline and its decision binds the airline (not the passenger). Claim from the airline first; if it does not answer within one month or you reject the answer, file with AESA within one year of that claim. Not for baggage."}
  - {rung: regulator, regulator: eu-ecc-net, note: "Free help from the European Consumer Centre in your country when the airline is based in another EU country, Iceland or Norway."}
  - {rung: payment_dispute, note: "Card chargeback for a refund the airline owes but has not paid."}
  - {rung: small_claims, note: "European Small Claims Procedure for cross-border claims up to EUR 5,000 (rules/eu-small-claims-procedure); otherwise the national court. Time limits for EU261 claims are set by national law."}

playbooks:
  - issue: flight_delay
    summary: If you arrived 3 hours or more late, claim EU261 compensation on the claim form, and choose cash or a larger non-refundable voucher. Claim expenses on the same form.
    evidence: [booking reference, ticket number, boarding passes, scheduled and actual arrival times, receipts for meals, hotel and transport, bank details in your name]
    steps:
      - do: At the airport, from a 2-hour delay, ask for meals and refreshments, and a hotel if an overnight stay becomes necessary. Keep all receipts.
      - do: If the delay is at least 5 hours and you do not want to travel, request a refund of the unused segments.
        channel: refund-form
      - do: Submit the claim form for compensation and for unexpected costs. Compensation cannot be paid at the airport. Choose cash if you do not want a non-refundable voucher.
        channel: claim-form
      - do: Make the claim yourself first. Air France handles a third party's claim only after the passenger has used its form and waited 28 days.
      - do: If Air France rejects the claim or does not reply, complain to the National Enforcement Body.
        regulator: eu-air-passenger-nebs
      - do: For a flight to or from Germany, ask for free conciliation.
        regulator: de-sruv
      - do: If you live in another EU country, Iceland or Norway, ask your European Consumer Centre for help.
        regulator: eu-ecc-net
    facts:
      - kind: compensation
        claim: Air France's passenger rights page says that if you arrive at your final destination 3 hours or more after the scheduled time, you are entitled to compensation unless the delay was caused by extraordinary circumstances. You can choose a non-refundable transportation credit voucher of EUR 350, 500 or 800, or cash of EUR 250, 400 or 600, by distance; for flights of 3,500 km and more, the amount may be reduced by 50% if the flight landed 3 to 4 hours late.
        issues: [flight_delay]
        verified_via: browser
        source: https://wwws.airfrance.co.uk/information/legal/assistance-et-indemnisation
        last_verified: 2026-11-19
      - kind: process
        claim: Air France's compensation contact topic lists three criteria for lump-sum compensation (cancellation or arrival more than 3 hours late, not caused by circumstances such as extreme weather, sudden political instability or third-party strikes, and travel to or from an EU country) and says to keep invoices for unexpected costs such as taxis and hotels.
        issues: [flight_delay, flight_cancellation]
        verified_via: browser
        source: https://wwws.airfrance.co.uk/contact/topic/flight-disruption/subtopic/compensation
        last_verified: 2026-11-19

  - issue: flight_cancellation
    summary: Choose rebooking or a refund of the unused segments; claim EU261 compensation (cash or voucher) through the claim form.
    evidence: [booking reference, ticket number, cancellation notice and the date you received it, new itinerary, receipts, bank details in your name]
    steps:
      - do: Choose rerouting as soon as possible, rerouting at a later date, or a refund. Ask for meals, and a hotel if a stay becomes necessary.
      - do: For a refund, use the refund form, or My Bookings. Travel agency bookings go to the agency first.
        channel: refund-form
      - do: Claim compensation and expenses on the claim form. Compensation is not paid at the airport.
        channel: claim-form
      - do: If the refund form does not work, call the Service Line.
        channel: service-line-uk
      - do: If Air France rejects the claim or does not reply, complain to the National Enforcement Body.
        regulator: eu-air-passenger-nebs
      - do: If the refund is not paid, dispute the card charge with your card issuer.
    facts:
      - kind: compensation
        claim: Air France's passenger rights page says cancellation compensation is a non-refundable transportation credit voucher of EUR 350, 500 or 800, or cash of EUR 250, 400 or 600, by distance, unless the cancellation was caused by extraordinary circumstances or you were told at least 2 weeks before departure (or later with a rerouting within the stated time limits). It cannot be paid at the airport.
        issues: [flight_cancellation]
        verified_via: browser
        source: https://wwws.airfrance.co.uk/information/legal/assistance-et-indemnisation
        last_verified: 2026-11-19
      - kind: deadline
        claim: EU Regulation 261/2004 (Article 8) requires the refund of the ticket within seven days when the passenger chooses reimbursement after a cancellation.
        issues: [flight_cancellation, refund_request]
        source: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32004R0261
        last_verified: 2026-11-19

  - issue: denied_boarding
    summary: If you are bumped against your will, Air France pays compensation at the airport (cash or voucher) and offers a refund or rerouting.
    evidence: [boarding pass, booking reference, ticket number, written denied boarding notice, arrival time of the new flight]
    steps:
      - do: Volunteers get compensation in transportation credit vouchers on agreed terms. If you are denied boarding involuntarily, ask for the compensation at the airport and choose cash or voucher.
      - do: If you were not paid, submit the claim form.
        channel: claim-form
      - do: If you do not travel and want a refund after denied boarding, use the special-case refund form.
        channel: special-refund-form
      - do: If Air France still does not pay, complain to the National Enforcement Body.
        regulator: eu-air-passenger-nebs
    facts:
      - kind: compensation
        claim: Air France's passenger rights page says denied boarding compensation is issued at the airport, as a non-refundable transportation credit voucher of EUR 350, 500 or 800 or cash of EUR 250, 400 or 600 by distance, reduced by 50% if the alternative flight arrives within 2, 3 or 4 hours of the original arrival time. No compensation is due if boarding was denied for health, safety or security reasons or inadequate travel documents.
        issues: [denied_boarding]
        verified_via: browser
        source: https://wwws.airfrance.co.uk/information/legal/assistance-et-indemnisation
        last_verified: 2026-11-19

  - issue: delayed_baggage
    summary: Declare the bag at the airport (PIR) or online within 7 days of arrival, then claim basic necessities within 21 days of getting the bag back.
    evidence: [baggage receipt (tag) number, claim number or PIR, booking reference, boarding pass, receipts for essential purchases]
    steps:
      - do: Before you leave the airport, go to the Air France KLM baggage office and fill out a Property Irregularity Report (PIR). Keep the claim number.
      - do: Or declare the bag online, or in the Air France app, within 7 days of arrival, with the baggage receipt number.
        channel: missing-baggage-report
      - do: Track the claim and update your details with the claim number. You can share an AirTag location.
        channel: baggage-tracker
      - do: Within 21 days of receiving the bag, submit a reimbursement request for basic necessities (toiletries, essential clothing) with proof of purchase.
        channel: claim-form
      - do: If you need help, use WhatsApp or Messenger.
        channel: whatsapp
      - do: If Air France does not answer, ask the European Consumer Centre in your country for help.
        regulator: eu-ecc-net
    facts:
      - kind: deadline
        claim: Air France's baggage page says to declare missing baggage online within 7 days of arrival or at the AIR FRANCE KLM baggage office before leaving the airport, and that you have 21 days from the date you receive your baggage to submit a reimbursement request for basic necessities through the online claim form.
        issues: [delayed_baggage]
        verified_via: browser
        source: https://wwws.airfrance.co.uk/information/bagages/bagage-manquant-airfrance
        last_verified: 2026-11-19
      - kind: deadline
        claim: The General Conditions of Carriage (Article 20.1) require a written complaint as soon as possible and at the latest within seven (7) days for damage or destruction, and twenty-one (21) days for delay, from the date the baggage was made available; otherwise all action is inadmissible except for fraud. An action for damages must be filed within two years.
        issues: [delayed_baggage, damaged_baggage, lost_baggage]
        verified_via: browser
        source: https://wwws.airfrance.co.uk/information/legal/edito-cg-airfrance
        last_verified: 2026-11-19

  - issue: lost_baggage
    summary: If the bag is not found within 72 hours, complete the inventory and claim form; if it is not found within 21 days, the inventory is the basis of compensation.
    evidence: [claim number, baggage receipt number, detailed contents list with the value of each item, receipts or proof of purchase]
    steps:
      - do: Make sure the bag was declared (PIR at the airport or online within 7 days) and keep the claim number.
        channel: missing-baggage-report
      - do: If the bag is not found within 72 hours, complete the inventory and claim form in the online baggage search tool, with the value of each item.
        channel: worldtracer
      - do: Check the claim status, or ask for help by WhatsApp or Messenger.
        channel: baggage-tracker
      - do: If Air France does not answer, ask the European Consumer Centre in your country for help.
        regulator: eu-ecc-net
    facts:
      - kind: limit
        claim: Air France says that if your baggage is not found within 21 days of your request, the items you inventoried are the basis of your compensation, on presentation of receipts and within the Montreal Convention liability limits, expressed in Special Drawing Rights. A higher value can be declared, for extra cost, at check-in.
        issues: [lost_baggage]
        verified_via: browser
        source: https://wwws.airfrance.co.uk/information/bagages/bagage-manquant-airfrance
        last_verified: 2026-11-19

  - issue: damaged_baggage
    summary: Report damage at the Air France baggage office before leaving, or online within 7 days of receiving the bag; get written approval before any repair.
    evidence: [boarding pass or ticket, baggage tag, claim number, professional repair estimate or statement that the bag cannot be repaired, photos, original documents]
    steps:
      - do: At the arrival airport, report the damage at the Air France baggage office. You get a baggage irregularity report, repair information and a claim number.
      - do: If you have left the airport, submit the compensation request online within 7 days of receiving the bag, with your boarding pass or ticket, baggage tag and a professional repair estimate or statement of inability to repair.
        channel: claim-form
      - do: Do not repair or replace the bag before Air France authorizes it in writing.
      - do: For an item missing from the bag, report it at the baggage office or online within 7 days. For arrivals in metropolitan France, Guadeloupe, Guyana, Martinique, Reunion Island or French Polynesia, an online preliminary police complaint (pre-plainte-en-ligne.gouv.fr) is available; elsewhere Air France recommends reporting it to the local police.
        channel: claim-form
    facts:
      - kind: deadline
        claim: Air France says you have 7 days from the day you received your baggage to submit a compensation request for damage, and that you must receive written authorization from Air France before any exchange or repair, or the costs are yours. A request for a missing item after 7 days is not compensated.
        issues: [damaged_baggage]
        verified_via: browser
        source: https://wwws.airfrance.co.uk/information/bagages/bagage-manquant-airfrance
        last_verified: 2026-11-19

facts:
  - kind: process
    claim: General Conditions of Carriage Article 12.3 says Air France handles EU261 compensation claims made by a third party (other than a legal guardian or another passenger on the same booking) only if the passenger first made the claim directly through the form on the Air France website and gave Air France 28 days to reply. Article 12.5 says any assignment of the passenger's right to compensation, damages or refund is deemed null and void, subject to applicable law, and Article 12.6 says compensation is paid by wire transfer to the passenger's or legal guardian's bank account.
    issues: [flight_delay, flight_cancellation, denied_boarding]
    verified_via: browser
    source: https://wwws.airfrance.co.uk/information/legal/edito-cg-airfrance
    last_verified: 2026-11-19
  - kind: fee
    claim: General Conditions of Carriage Article 14.1 says booking fees, service fees and payment fees are non-refundable, whatever the ticket conditions; with a non-refundable ticket you can still request a refund of unused airport taxes, but not carrier-imposed surcharges.
    issues: [refund_request]
    verified_via: browser
    source: https://wwws.airfrance.co.uk/information/legal/edito-cg-airfrance
    last_verified: 2026-11-19
  - kind: policy
    claim: Air France's passenger rights page says that to claim compensation without paying fees to a third party, the European Commission advises passengers to contact the airline directly, and that all reimbursement and compensation requests must go to the carrier that operated or was to operate the flight.
    issues: [flight_delay, flight_cancellation, denied_boarding]
    verified_via: browser
    source: https://wwws.airfrance.co.uk/information/legal/assistance-et-indemnisation
    last_verified: 2026-11-19
  - kind: contact
    claim: Air France's UK complaint contact topic says that if you already made a claim and are unsatisfied with the response, you can contact AviationADR through its website (https://www.cdrl.org.uk/) or by email at aviation@cdrl.org.uk.
    issues: [flight_delay, flight_cancellation, poor_service]
    verified_via: browser
    source: https://wwws.airfrance.co.uk/contact/topic/refund-compensation/subtopic/complaint
    last_verified: 2026-11-19

