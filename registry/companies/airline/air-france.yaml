security:
  never_asks:
    - kind: policy
      claim: Air France says its commercial emails (promotions, offers, new destinations) will never ask you to provide personal details in response, and that genuine trip emails always contain information you recognize, such as your booking reference or Flying Blue number.
      verified_via: browser
      source: https://wwws.airfrance.co.uk/information/legal/edito-phishing
      last_verified: 2026-11-19
  known_scams:
    - kind: policy
      claim: Air France warns of fraudulent emails, WhatsApp messages and websites that appear to come from Air France and try to obtain bank details or ID documents. Warning signs include offers of free tickets, "your vouchers are about to expire", pressure to fill out a refund form or make a payment, and senders on Gmail, Yahoo or Hotmail addresses.
      verified_via: browser
      source: https://wwws.airfrance.co.uk/information/legal/edito-phishing
      last_verified: 2026-11-19
    - kind: policy
      claim: Air France advises against searching for its phone number online, because you may land on a fake website with a fraudulent call center, and warns of fraudulent websites reached through social networks with fake offers. Use only its official websites.
      verified_via: browser
      source: https://wwws.airfrance.co.uk/information/legal/edito-phishing
      last_verified: 2026-11-19

known_blockers:
  - The claim, refund and missing baggage forms need the booking reference and the passenger's name (or a sign-in). The missing baggage form also needs the baggage receipt number; the trackers need the claim number.
  - Air France handles a third party's EU261 claim only after the passenger has filed it directly on the Air France form and waited 28 days (Conditions of Carriage Article 12.3).
  - Air France's website terms prohibit robots, screen scraping and automated extraction for commercial use, and use of the websites for commercial purposes by intermediaries acting on behalf of third parties; violations can lead to IP blocking.
  - Some arrival airports do not allow online missing baggage declarations; the page lists them.
  - Plain HTTP fetches of airfrance.co.uk timed out; the pages load in a browser.

notes: >-
  Checked on 2026-11-19 by loading wwws.airfrance.co.uk and wwws.airfrance.fr/en in a browser (plain fetches timed
  out). Phones are printed with unusual grouping ("+44 20 766 00 337", "+44 20 76 60 28 78", "+33 9 69 39 36 54") and
  converted here; all say national standard rates. The UK Service Line shows different hours on different contact
  topics (Mon-Fri 09:00-17:30 on complaint and compensation topics; Mon-Fri 08:00-20:00 and weekends 09:00-17:30 on the
  refund topic). The "Delayed or missing baggage" contact topic shows no UK baggage phone. The General Conditions of
  Carriage were updated December 28, 2024; the passenger rights page was updated September 2024. The privacy policy
  names a DPO but gives no email; it points to the privacy form. klm.com is listed in official_domains because Air
  France's own refund topic links refunds.klm.com. Air France's privacy page gives KLM's privacy email as
  KLMPrivacyOffice@klm.com, which differs from KLM's own page.
