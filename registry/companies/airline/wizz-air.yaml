    value: https://www.wizzair.com/en-gb/wizz-credit-conversion-request
    purposes: [refund_request, travel_credit, flight_cancellation]
    access: login
    notes: >-
      For the booking owner. The refund goes to the bank account or the original payment method; amounts paid with
      WIZZ credits or a voucher are refunded as WIZZ credits, and a booking paid fully with credits or a voucher is not
      eligible.
    verified_via: browser
    source: https://www.wizzair.com/en-gb/wizz-credit-conversion-request
    last_verified: 2026-11-19
  - id: bag-report-tracker
