      claims within 30 days and warns that duplicate claims are merged and not processed; if more than 30 days pass,
      check spam and reply to the first claim email. The claim status is in the WIZZ Account under "Your Claims".
    verified_via: browser
    source: https://www.wizzair.com/en-gb/help-centre/contact-us
    last_verified: 2026-11-19
  - id: wizz-account
