    label: WIZZ Account (rebook, WIZZ credits or refund after a cancellation or long delay; claim status)
    value: https://www.wizzair.com/en-gb/profile
    purposes: [flight_cancellation, flight_delay, refund_request, travel_credit]
    access: login
    notes: Log in with the account used to make the booking and open the booking to see the options. The selection is available up to 3 hours before the original departure time.
    verified_via: browser
    source: https://www.wizzair.com/en-gb/help-centre/delay-cancellation-and-refund/cancelled-flight/cancelled-flight-what-to-do
