    purposes: [flight_cancellation, flight_delay, denied_boarding, refund_request, accessibility]
    notes: >-
      Shown as "+443333000233" after choosing country United Kingdom and language English on the contact page; price
      "local rates". The €15.00 per passenger Call Centre Transaction Fee applies to transactions that are also
      available online.
    verified_via: browser
    source: https://www.wizzair.com/en-gb/help-centre/contact-us
    last_verified: 2026-11-19
  - id: claim-form
    type: web_form
    label: Claim form (compensation, expenses, refunds, bag delay, loss and damage, complaints)
    value: https://www.wizzair.com/en-gb/information-and-services/compliments-and-complaints
    purposes: [flight_delay, flight_cancellation, denied_boarding, delayed_baggage, lost_baggage, damaged_baggage, refund_request, poor_service, accessibility]
