how_complaints_work: >-
  Complain to the company first and keep the reference number. If it does not fix the problem, wait for its final
  response (a "deadlock letter") or for the time limit for the sector to pass, then take the complaint to the
  approved ombudsman or dispute scheme, which is free for consumers: the Communications Ombudsman or CISAS for phone
  and broadband, the Energy Ombudsman for energy, the Financial Ombudsman Service for banks and insurers. Regulators
  such as Ofcom, Ofgem and the FCA do not resolve individual complaints. Small claims in England and Wales go through
  Money Claim Online. Scotland and Northern Ireland have their own courts, and some rules differ there.
notes: Energy data covers Great Britain; Northern Ireland has its own energy regulator.
