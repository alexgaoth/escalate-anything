  - id: me-puc
    kind: utility_commission
    name: Maine Public Utilities Commission, Consumer Assistance and Safety Division
    covers_sectors: [utility]
    website: https://www.maine.gov/mpuc/consumer-assistance/file-complaint
    channels:
      - id: complaint-form
        type: web_form
        label: Residential customer complaint form
        value: https://mpuc-cms.maine.gov/CQM.Public.WebUI/CAD/CADResidentialComplaint.aspx
        access: open
        source: https://www.maine.gov/mpuc/consumer-assistance/file-complaint
        last_verified: 2026-10-12
      - id: hotline
        type: phone
        label: Consumer Assistance Hotline
        value: +1-800-452-4699
        hours: Monday through Friday, 9:00 a.m. to 4:00 p.m.
        source: https://www.maine.gov/mpuc/consumer-assistance/file-complaint
        last_verified: 2026-10-12
      - id: mail
        type: mail
        label: MPUC by mail
        value: Maine Public Utilities Commission, 18 State House Station, Augusta, ME 04333-0018
        source: https://www.maine.gov/mpuc/consumer-assistance
        last_verified: 2026-10-12
    notes: You must first contact the utility and try to resolve the complaint, except for slamming and cramming on telephone service. The Commission regulates electric, telephone (landline), water and natural gas utilities. It does not regulate cable TV companies, cellular or wireless phone companies (except some aspects of Unicel's service), propane, sewer districts or fuel oil. Internet service is not mentioned.
