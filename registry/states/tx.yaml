id: tx
name: Texas
agencies:
  - id: tx-ag
    kind: attorney_general
    name: Office of the Attorney General of Texas, Consumer Protection Division
    website: https://www.texasattorneygeneral.gov/consumer-protection
    notes: The office reviews complaints for informational purposes and does not resolve individual complaints or act as a private attorney. Complaints and attachments are public and can be obtained through open records requests.
    channels:
      - id: complaint-form
        type: portal
        label: Consumer Complaint Portal
        value: https://consumerprotection.texasattorneygeneral.gov/consumercomplaintportal/s/
        notes: The portal cannot save an in-progress complaint; finish it in one session. Separate forms exist for general, privacy and AI complaints.
        source: https://www.texasattorneygeneral.gov/consumer-protection/file-consumer-complaint
        last_verified: 2026-10-12
      - id: hotline
        type: phone
        label: Consumer Protection Hotline, toll-free
        value: +1-800-621-0508
        source: https://www.texasattorneygeneral.gov/contact-us
        last_verified: 2026-10-12
  - id: tx-puc
    kind: utility_commission
    name: Public Utility Commission of Texas, Consumer Protection Division
    covers_sectors: [utility]
    website: https://www.puc.texas.gov/agency/about/consumer-protection/
    notes: The PUCT handles complaints about retail electric providers (REPs), electric utilities and telephone utilities, and is authorized to resolve disputes between a retail customer and a retail electric provider. It has no authority over wireless (cell phone) service, internet or VoIP service; for cable TV it can only forward the complaint to the company. Municipal utilities are governed locally, and for electric cooperatives the PUCT only forwards complaints.
    channels:
      - id: complaint-form
        type: web_form
        label: Electric complaint form (retail electric providers and utilities)
        value: https://www.puc.texas.gov/Complaints/Index
        notes: Contact the electric service provider first and let it investigate; then file with the PUCT Consumer Protection Division.
        source: https://www.puc.texas.gov/Complaints/Index
        last_verified: 2026-10-12
      - id: consumer-affairs
        type: phone
        label: Consumer Protection, toll-free in Texas
        value: +1-888-782-8477
        notes: Other callers use +1-512-936-7120.
        source: https://www.puc.texas.gov/agency/about/consumer-protection/
        last_verified: 2026-10-12
      - id: consumer-affairs-local
        type: phone
        label: Consumer Protection, Austin
        value: +1-512-936-7120
        source: https://www.puc.texas.gov/agency/about/consumer-protection/
        last_verified: 2026-10-12
    facts:
      - kind: policy
        claim: The PUCT does not regulate wireless telecommunications service (pager and cellular phone); the FCC oversees wireless, long distance and cable television service.
        source: https://www.puc.texas.gov/consumer-help/utilitiesnot/
        last_verified: 2026-10-12
  - id: tx-insurance
    kind: insurance_department
    name: Texas Department of Insurance
    covers_sectors: [insurance_property, insurance_health]
    website: https://www.tdi.texas.gov/
    channels:
      - id: complaint-form
        type: web_form
        label: Get help with an insurance complaint (choose the type of insurance to reach the right form)
        value: https://www.tdi.texas.gov/consumer/get-help-with-an-insurance-complaint.html
        source: https://www.tdi.texas.gov/consumer/get-help-with-an-insurance-complaint.html
        last_verified: 2026-10-12
      - id: hotline
        type: phone
        label: Help Line
        value: +1-800-252-3439
        hours: Mon-Fri 8 a.m.-5 p.m. Central
        source: https://www.tdi.texas.gov/consumer/get-help-with-an-insurance-complaint.html
        last_verified: 2026-10-12
    facts:
      - kind: process
        claim: If you are not happy with your health plan appeal, or were denied care for a life-threatening condition, you can ask for a free external review by an independent reviewer. TDI can help with fully insured plans but cannot overturn the reviewer's decision.
        issues: [claim_denial]
        source: https://www.tdi.texas.gov/consumer/complaint-health.html
        last_verified: 2026-10-12
  - id: tx-financial
    kind: financial_regulator
    name: Texas Department of Banking
    covers_sectors: [bank, payments]
    website: https://www.dob.texas.gov/
    notes: Handles complaints about state-chartered banks, trust companies, foreign bank agencies and money services businesses (and prepaid funeral and cemetery companies). State credit unions go to the Texas Credit Union Department (https://cud.texas.gov/), consumer finance companies to the Office of Consumer Credit Commissioner (https://occc.texas.gov), state savings banks to the Department of Savings and Mortgage Lending, and national banks to the OCC.
    channels:
      - id: complaint-form
        type: web_form
        label: File a complaint (choose the type of institution)
        value: https://www.dob.texas.gov/file-complaint
        source: https://www.dob.texas.gov/file-complaint
        last_verified: 2026-10-12
