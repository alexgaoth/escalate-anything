      - id: main-phone
        type: phone
        label: Insurance consumers
        value: +1-802-828-3302
        source: https://dfr.vermont.gov/consumers/file-complaint/insurance/insurance-complaints
        last_verified: 2026-10-12
      - id: email
        type: email
        label: Insurance information email
        value: dfr.insuranceinfo@vermont.gov
        source: https://dfr.vermont.gov/consumers/file-complaint/insurance/insurance-complaints
        last_verified: 2026-10-12
    facts:
      - kind: process
        claim: After the insurer's first-level internal appeal, DFR forwards a health claim denial to an Independent Review Organization, an independent third party unrelated to the insurer or consumer, which decides the external appeal.
        issues: [claim_denial]
        source: https://dfr.vermont.gov/consumers/file-complaint/insurance/healthcare-external-appeal
        last_verified: 2026-10-12
      - kind: deadline
        claim: Request the external appeal within 120 days or 4 months (whichever is longer) of receiving the insurer's final denial letter.
        issues: [claim_denial]
        source: https://dfr.vermont.gov/consumers/file-complaint/insurance/healthcare-external-appeal
        last_verified: 2026-10-12
  - id: vt-financial
    kind: financial_regulator
    name: Vermont Department of Financial Regulation, Banking Division
    covers_sectors: [bank, credit_union, payments, student_loan]
    website: https://dfr.vermont.gov/
    notes: Covers state-chartered banks and credit unions and licensed providers such as mortgage companies, lenders, money transmitters and debt adjusters. National banks go to the OCC, federal credit unions to the NCUA.
