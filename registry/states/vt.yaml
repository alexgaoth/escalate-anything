  - id: vt-puc
    kind: utility_commission
    name: Vermont Department of Public Service, Consumer Affairs and Public Information (CAPI)
    covers_sectors: [utility]
    website: https://publicservice.vermont.gov/consumer-affairs-and-public-information
    notes: The Department of Public Service (not the Public Utility Commission) runs CAPI, which helps consumers reach informal resolution of disputes with regulated utilities; the department covers energy, telecommunications, water and wastewater. The pages seen do not say whether it handles wireless, internet or cable TV complaints, and refer federal-regulation concerns to the FCC.
    channels:
      - id: complaint-form
        type: web_form
        label: Online utility complaint form
        value: https://capi.epsd.vermont.gov/?q=node/51
        notes: While uploads are unavailable, email attachments to PSD.Consumer@vermont.gov.
        source: https://publicservice.vermont.gov/complaint-reporting-and-information
        last_verified: 2026-10-12
      - id: consumer-affairs
        type: phone
        label: CAPI hotline
        value: +1-800-622-4496
        hours: Mon-Fri 7:45 a.m.-4:30 p.m. (department office hours)
        source: https://publicservice.vermont.gov/contact
        last_verified: 2026-10-12
      - id: email
        type: email
        label: Consumer email
        value: psd.consumer@vermont.gov
        source: https://publicservice.vermont.gov/contact
        last_verified: 2026-10-12
