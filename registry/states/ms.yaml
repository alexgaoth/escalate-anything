  - id: ms-puc
    kind: utility_commission
    name: Mississippi Public Service Commission
    covers_sectors: [utility]
    website: https://www.psc.ms.gov/
    channels:
      - id: complaint-form
        type: web_form
        label: File a utility complaint
        value: https://ctsportal.psc.ms.gov/portal/Workflow/Run?workflowId=gb7c65056-6fc2-40df-965e-81966b7748da
        source: https://www.psc.ms.gov/
        last_verified: 2026-10-12
      - id: hotline-northern
        type: phone
        label: Northern District Commissioner (toll-free)
        value: +1-800-356-6428
        source: https://www.psc.ms.gov/home/psc-contacts
        last_verified: 2026-10-12
      - id: hotline-central
        type: phone
        label: Central District Commissioner (toll-free)
        value: +1-800-356-6430
        source: https://www.psc.ms.gov/home/psc-contacts
        last_verified: 2026-10-12
      - id: hotline-southern
        type: phone
        label: Southern District Commissioner (toll-free)
        value: +1-800-356-6429
        source: https://www.psc.ms.gov/home/psc-contacts
        last_verified: 2026-10-12
    notes: The PSC lists gas, electric, water, sewer and telecom as regulated utilities. Its home page also has "Report Lack of Service" links for cellular and internet, but does not say it takes billing complaints about wireless, cable or internet. Contacts are by commissioner district.
  - id: ms-insurance
    kind: insurance_department
    name: Mississippi Insurance Department
    covers_sectors: [insurance_property, insurance_health]
    website: https://www.mid.ms.gov/mississippi-insurance-department/consumers/file-a-complaint/
    channels:
      - id: complaint-form
        type: web_form
        label: File company complaint (use for claim-related complaints)
        value: https://www.mid.ms.gov/mississippi-insurance-department/consumers/file-a-complaint/file-company-complaint/
        source: https://www.mid.ms.gov/mississippi-insurance-department/consumers/file-a-complaint/
