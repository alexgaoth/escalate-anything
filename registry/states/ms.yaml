      - id: hotline
        type: phone
        label: Consumer Help Line (toll-free)
        value: +1-800-562-2957
        source: https://www.mid.ms.gov/
        last_verified: 2026-10-12
      - id: phone
        type: phone
        label: Consumer Help Line (Jackson area)
        value: +1-601-359-2453
        source: https://www.mid.ms.gov/
        last_verified: 2026-10-12
      - id: mail
        type: mail
        label: Insurance Department by mail
        value: Mississippi Insurance Department, P.O. Box 79, Jackson, MS 39205
        source: https://www.mid.ms.gov/mississippi-insurance-department/consumers/file-a-complaint/
        last_verified: 2026-10-12
    facts:
      - kind: process
        claim: The department explains how to request an external review of an adverse determination of a health claim; the review is done by health care professionals with no association with your insurance company.
        source: https://www.mid.ms.gov/mississippi-insurance-department/healthcare/health-care-external-review/
        last_verified: 2026-10-12
  - id: ms-financial
    kind: financial_regulator
    name: Mississippi Department of Banking and Consumer Finance
    covers_sectors: [bank, credit_union, payments]
    website: https://dbcf.ms.gov/complaint-form/
    channels:
      - id: complaint-form
        type: web_form
        label: Online complaint form
        value: https://dbcf.ms.gov/complaint-form/
        notes: Try to resolve the issue with the institution first. Submit only one form per institution, and do not also email, fax or mail it.
        source: https://dbcf.ms.gov/complaint-form/
        last_verified: 2026-10-12
      - id: phone
        type: phone
        label: Department of Banking and Consumer Finance
        value: +1-601-321-6901
        source: https://dbcf.ms.gov/complaint-form/
        last_verified: 2026-10-12
      - id: mail
        type: mail
        label: Department of Banking and Consumer Finance by mail
        value: Mississippi Department of Banking and Consumer Finance, P.O. Box 12129, Jackson, MS 39236-2129
        source: https://dbcf.ms.gov/complaint-form/
        last_verified: 2026-10-12
    notes: The form covers banks, credit unions, check cashers, mortgage companies, pawnshops, small loan companies and title pledge lenders.
