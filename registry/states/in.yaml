    notes: The IURC strongly advises trying to resolve the issue with the utility first. It handles disputes for customers of jurisdictional utilities only; its page does not say whether wireless, cable or internet providers are covered. The Office of Utility Consumer Counselor (OUCC) is a separate agency.
