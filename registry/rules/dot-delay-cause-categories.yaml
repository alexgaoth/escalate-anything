id: dot-delay-cause-categories
title: DOT delay and cancellation cause categories - ten Section 511(b) events are not "Air Carrier" (controllable) causes from October 19, 2026
citation: 14 CFR 234.4 as amended by 91 FR 56588 (September 3, 2026), FR Doc. 2026-18040, docket DOT-OST-2026-1257, RIN 2105-AF29; FAA Reauthorization Act of 2024 (Pub. L. 118-63) section 511(b)
jurisdiction: us-federal
status: in_effect
applies_to:
  sectors: [airline]
  issues: [flight_cancellation, flight_delay]
summary: >-
  Final rule, effective October 19, 2026. The airlines that report on-time data to DOT must not report ten
  event types as "Air Carrier" causes of a delay or cancellation. They report them in a new "Section 511(b)"
  category. The ten events include unscheduled maintenance that cannot be deferred, a medical emergency, removal
  of an unruly passenger, aircraft damage from extreme weather or foreign object debris, cybersecurity attacks,
  unexpected government system failures, and airport closures for volcanic ash, wind or wind shear. DOT has
  aligned "controllable" on its airline dashboard with the "Air Carrier" category, and it expects airlines to
  give meals, hotels and other amenities for fewer disruptions (rule dot-airline-commitments). The rule changes
  only the reporting categories in 14 CFR 234.4. It does not change refund rights (rule dot-refunds-rule), it does
  not change the text of any airline's customer service plan, and it does not create a right to compensation.
points:
  - kind: policy
    claim: >-
      From October 19, 2026, 14 CFR 234.4 says "Air Carrier cancellations are due to circumstances that were
      within the control of the air carrier (e.g., lack of flight crew, maintenance, etc.). Cancellations due to
      events listed in paragraph (h)(5) of this section must not be reported as Air Carrier." The same applies to
      delays (paragraph (i)(6)). These events get a new cancellation code "E-Section 511(b)" and a new delay cause
      "Section 511(b)".
    issues: [flight_cancellation, flight_delay]
    source: https://www.federalregister.gov/documents/2026/09/03/2026-18040/cause-of-airline-delay-and-cancellation-categories-under-section-511b-of-the-faa-reauthorization-act
    last_verified: 2026-10-14
  - kind: policy
    claim: >-
      The ten Section 511(b) events are: (1) aircraft cleaning necessitated by the death of a passenger; (2)
      aircraft damage caused by extreme weather, foreign object debris, or sabotage; (3) a baggage or cargo loading
      delay caused by an outage of a bag system not controlled by a carrier or its contractor; (4) cybersecurity
      attacks, if the carrier complies with applicable cybersecurity regulations; (5) an unexpected shutdown or
      system failure of government systems that directly affects the carrier's ability to conduct flights safely;
      (6) overheated brakes due to a safety incident resulting in the use of emergency procedures; (7) unscheduled
      maintenance, including in response to an airworthiness directive, manifesting outside a scheduled
      maintenance program that cannot be deferred or must be addressed before flight; (8) an emergency that
      required medical attention through no fault of the carrier; (9) the removal of an unruly passenger; and (10)
      an airport closure due to the presence of volcanic ash, wind, or wind shear.
    issues: [flight_cancellation, flight_delay]
    source: https://www.federalregister.gov/documents/2026/09/03/2026-18040/cause-of-airline-delay-and-cancellation-categories-under-section-511b-of-the-faa-reauthorization-act
    last_verified: 2026-10-14
  - kind: policy
    claim: >-
      Only these ten events leave the "Air Carrier" category. The maintenance exclusion covers unscheduled
      maintenance that cannot be deferred or must be addressed before flight; other maintenance stays an example
      of an "Air Carrier" cause in 14 CFR 234.4(h)(1). Lack of flight crew also stays an "Air Carrier" cause. The
      cleaning and baggage exclusions are narrow: cleaning after the death of a passenger, and an outage of a bag
      system that the carrier or its contractor does not control.
    issues: [flight_cancellation, flight_delay]
    source: https://www.federalregister.gov/documents/2026/09/03/2026-18040/cause-of-airline-delay-and-cancellation-categories-under-section-511b-of-the-faa-reauthorization-act
    last_verified: 2026-10-14
  - kind: policy
    claim: >-
      DOT's economic analysis of the rule says "the number of delays and cancellations for which air carriers
      provide amenities and compensation to consumers is expected to be reduced", because all reporting carriers
      that sell tickets commit in their customer service plans to amenities for controllable delays and
      cancellations. DOT says it cannot estimate how much, because it "does not have visibility into the frequency"
      of the ten events.
    issues: [flight_cancellation, flight_delay]
    source: https://www.federalregister.gov/documents/2026/09/03/2026-18040/cause-of-airline-delay-and-cancellation-categories-under-section-511b-of-the-faa-reauthorization-act
    last_verified: 2026-10-14
  - kind: policy
    claim: >-
      DOT stated in December 2025 that it "has aligned the 'controllable' standard for its dashboard with the Air
      Carrier causal category that airlines use when reporting cancellations and delays", and that section 506 of
      the FAA Reauthorization Act of 2024 requires the dashboard to explain non-controllable circumstances
      consistent with 14 CFR 234.4.
    issues: [flight_cancellation, flight_delay]
    source: https://www.federalregister.gov/documents/2025/12/10/2025-22415/airline-customer-service-commitments-for-controllable-flight-disruptions-unscheduled-maintenance-in
    last_verified: 2026-10-14
  - kind: policy
    claim: >-
      The rule does not change refund rights. DOT says that if an airline cancels or significantly changes a
      flight, "regardless of the reason", it must give a prompt refund to a passenger who does not accept the
      alternative, and that the airlines' delay and cancellation commitments "do not impact your entitlement to a
      refund".
    issues: [flight_cancellation, flight_delay]
    verified_via: browser
    source: https://www.transportation.gov/airconsumer/airline-cancellation-delay-dashboard
    last_verified: 2026-10-14
  - kind: policy
    claim: >-
      The rule does not change which airlines must report or which flights they report (13 carriers report for
      calendar year 2026). It does not yet create the separate category for delays caused by FAA air traffic
      control instructions that section 511(a) of the 2024 Act requires, and it does not act on the Airlines for
      America petition for further changes. DOT says it will handle those in a future rulemaking with notice and
      comment.
    issues: [flight_cancellation, flight_delay]
    source: https://www.federalregister.gov/documents/2026/09/03/2026-18040/cause-of-airline-delay-and-cancellation-categories-under-section-511b-of-the-faa-reauthorization-act
    last_verified: 2026-10-14
status_note: >-
  Final rule published September 3, 2026 (91 FR 56588), effective October 19, 2026. DOT issued it without notice
  and comment because it uses the statutory text of section 511(b) without interpretation. Before October 19,
  2026 the old five cause categories apply; since December 10, 2025 DOT has already not enforced the commitments
  for non-deferrable unscheduled maintenance required by an airworthiness directive (rule
  dot-airline-commitments). The rule says DOT will seek OMB approval of the revised information collection (OMB
  Control No. 2138-0041); whether OMB has approved it was not checked. No later Federal Register document that
  changes this rule was found on 2026-10-14. The rule does not amend 14 CFR 259.5 or any airline's customer service
  plan, and each plan uses its own words for "within our control"; check the airline's current plan and ask the
  airline for the cause of the disruption.
source: https://www.federalregister.gov/documents/2026/09/03/2026-18040/cause-of-airline-delay-and-cancellation-categories-under-section-511b-of-the-faa-reauthorization-act
last_verified: 2026-10-14
