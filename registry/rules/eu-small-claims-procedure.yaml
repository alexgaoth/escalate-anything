id: eu-small-claims-procedure
title: European Small Claims Procedure (cross-border claims up to EUR 5,000)
citation: Regulation (EC) No 861/2007 of 11 July 2007, as amended by Regulation (EU) 2015/2421 of 16 December 2015
jurisdiction: eu
status: in_effect
applies_to:
  sectors: [airline, travel_agency, lodging, car_rental, retail]
  issues: [flight_cancellation, flight_delay, denied_boarding, refund_request, delayed_baggage, lost_baggage, damaged_baggage]
summary: >-
  A written court procedure, using standard forms, for civil and commercial claims of up to EUR 5,000 (excluding
  interest, expenses and disbursements) when at least one party lives in a different EU country from the court. No
  lawyer is needed. It does not apply in Denmark. Your Europe names it as the court route for EU air passenger claims;
  for a claim against an airline in the same country, use the national small claims or civil court instead.
points:
  - kind: limit
    claim: >-
      Article 2(1) as amended: the procedure applies, in cross-border cases, to civil and commercial matters where the value
      of a claim does not exceed EUR 5 000 when the court receives the claim form, excluding all interest, expenses and
      disbursements. The EUR 5 000 limit applies from 14 July 2017.
    issues: [flight_cancellation, flight_delay, denied_boarding, refund_request, delayed_baggage, lost_baggage, damaged_baggage]
    verified_via: browser
    source: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32015R2421
    last_verified: 2026-11-19
  - kind: policy
    claim: >-
      Article 3(1): a cross-border case is one in which at least one of the parties is domiciled or habitually resident in
      a Member State other than the Member State of the court seised. It is assessed on the date the court receives the
      claim form.
    issues: [flight_cancellation, flight_delay, denied_boarding, refund_request]
    verified_via: browser
    source: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32007R0861
    last_verified: 2026-11-19
  - kind: policy
    claim: >-
      Article 10: representation by a lawyer or other legal professional is not mandatory. Article 11: Member States must
      make sure the parties can get practical help in filling in the forms.
    issues: [flight_cancellation, flight_delay, denied_boarding, refund_request]
    verified_via: browser
    source: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32007R0861
    last_verified: 2026-11-19
  - kind: limit
    claim: >-
      In Regulation 861/2007 "Member State" means the Member States with the exception of Denmark, so the procedure is not
      available in Danish courts.
    issues: [flight_cancellation, flight_delay, denied_boarding, refund_request]
    verified_via: browser
    source: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32007R0861
    last_verified: 2026-11-19
  - kind: process
    claim: >-
      Your Europe (air passenger rights): a passenger may claim EU261 compensation in court using the European Small Claims
      procedure; for flights by an EU airline the claim can be filed at the place of departure or arrival, or where the
      airline is registered. Time limits to sue are set by national law.
    issues: [flight_cancellation, flight_delay, denied_boarding]
    source: https://europa.eu/youreurope/citizens/travel/passenger-rights/air/index_en.htm
    last_verified: 2026-11-19
status_note: >-
  In force. Regulation (EC) No 861/2007 applies from 1 January 2009; the amendments in Regulation (EU) 2015/2421
  (including the EUR 5,000 limit) apply from 14 July 2017. Both texts were read on EUR-Lex in the
  built-in browser on 2026-11-19. The European e-Justice Portal page with the claim forms
  (https://e-justice.europa.eu/42/EN/small_claims) returned HTTP 403 (blocked by country) from this machine and was not
  read; court fees, the forms and online filing are not recorded here.
source: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32007R0861
last_verified: 2026-11-19
