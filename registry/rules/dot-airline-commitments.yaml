id: dot-airline-commitments
title: DOT Delay and Cancellation Dashboard - airline commitments for controllable disruptions
citation: 14 CFR 259.5 (Customer Service Plans); FAA Reauthorization Act of 2024 (Pub. L. 118-63) section 506
jurisdiction: us-federal
status: in_effect
applies_to:
  sectors: [airline]
  issues: [flight_cancellation, flight_delay]
summary: >-
  The largest U.S. airlines commit in their customer service plans to help passengers when a cancellation or
  significant delay is within the airline's control. DOT's dashboard, checked on October 14, 2026, lists nine
  airlines: all nine commit to a meal (wait of 3 hours or more) and free rebooking on the same airline, eight (all
  except Frontier) commit to a hotel and ground transportation for an overnight disruption, and none commits to
  cash compensation. Airlines must adhere to their plans. DOT has aligned "controllable" on its dashboard with the
  "Air Carrier" cause category of 14 CFR 234.4. From October 19, 2026 ten event types, among them unscheduled
  maintenance that cannot be deferred, medical emergencies and removal of an unruly passenger, are not "Air
  Carrier" causes (rule dot-delay-cause-categories), so DOT expects airlines to give amenities for fewer
  disruptions. Ask the airline for the cause before you claim a meal or hotel, and do not promise one for these
  ten causes. These are voluntary commitments, not a federal compensation rule, and they do not affect refund
  rights (rule dot-refunds-rule).
points:
  - kind: policy
    claim: >-
      DOT said on November 17, 2025 that the 10 largest U.S. passenger carriers keep voluntary commitments in
      their customer service plans (required by 14 CFR 259.5) to assist passengers affected by cancellations and
      significant delays that are controllable by the carrier. At that time all 10 guaranteed a meal and rebooking
      without charge on the ticketed airline, 9 guaranteed hotel accommodation and ground transportation to and
      from the hotel for controllable overnight delays and cancellations, and four committed to compensation in
      credits, travel vouchers or frequent flyer miles. For the current list, see the October 2026 dashboard point
      below.
    issues: [flight_cancellation, flight_delay]
    source: https://www.federalregister.gov/documents/2025/11/17/2025-20042/airline-passenger-rights-withdrawal
    last_verified: 2026-10-14
  - kind: policy
    claim: >-
      DOT's Airline Cancellation and Delay Dashboard (page last updated September 11, 2025), checked on October
      14, 2026, lists nine airlines: Alaska, Allegiant, American, Delta, Frontier, Hawaiian, JetBlue, Southwest and
      United. For a controllable cancellation or delay, all nine commit to rebooking on the same airline at no
      additional cost and to a meal or meal cash/voucher when the wait is 3 hours or more. Eight (all except
      Frontier) commit to a complimentary hotel and ground transportation for an overnight disruption. None
      commits to cash compensation. Alaska, Hawaiian, JetBlue and Southwest commit to a credit or travel voucher,
      and Alaska and Hawaiian to frequent flyer miles. DOT says airlines "with a red 'x' may provide these
      services and amenities in some instances in their discretion".
    issues: [flight_cancellation, flight_delay]
    verified_via: browser
    source: https://www.transportation.gov/airconsumer/airline-cancellation-delay-dashboard
    last_verified: 2026-10-14
  - kind: policy
    claim: >-
      On October 14, 2026 the dashboard still described a controllable disruption as "essentially a delay or
      cancellation caused by the airline", with the examples "maintenance or crew problems; cabin cleaning;
      baggage loading; and fueling". It did not yet mention the ten Section 511(b) events that stop counting as
      "Air Carrier" causes on October 19, 2026 (rule dot-delay-cause-categories). It says the commitments "do not
      impact your entitlement to a refund".
    issues: [flight_cancellation, flight_delay]
    verified_via: browser
    source: https://www.transportation.gov/airconsumer/airline-cancellation-delay-dashboard
    last_verified: 2026-10-14
  - kind: policy
    claim: >-
      Each covered carrier must adopt a Customer Service Plan for its scheduled flights and adhere to the plan's
      terms.
    issues: [flight_cancellation, flight_delay]
    source: https://www.ecfr.gov/current/title-14/chapter-II/subchapter-A/part-259/section-259.5
    last_verified: 2026-10-12
  - kind: policy
    claim: >-
      DOT stated on December 10, 2025 that airlines are obligated to abide by their customer service commitments,
      and that it aligned the "controllable" standard with the "Air Carrier" cause category in its delay
      reporting rules (14 CFR 234.4).
    issues: [flight_cancellation, flight_delay]
    source: https://www.federalregister.gov/documents/2025/12/10/2025-22415/airline-customer-service-commitments-for-controllable-flight-disruptions-unscheduled-maintenance-in
    last_verified: 2026-10-14
  - kind: policy
    claim: >-
      Since December 10, 2025, DOT will not take action against airlines that do not provide services, amenities
      or compensation for delays or cancellations caused by unscheduled maintenance required by an FAA
      airworthiness directive that cannot be deferred or must be addressed before flight (such as Emergency AD
      2025-24-51). The notice says this policy "remains in effect until further notice or conclusion of" the
      cause-of-delay rulemaking (RIN 2105-AF29). That rulemaking produced the final rule effective October 19,
      2026 (rule dot-delay-cause-categories), which covers all non-deferrable unscheduled maintenance, not only
      maintenance required by an airworthiness directive. DOT also said airlines "may still choose to provide
      meals, hotels, free rebooking, and other amenities" voluntarily.
    issues: [flight_cancellation, flight_delay]
    source: https://www.federalregister.gov/documents/2025/12/10/2025-22415/airline-customer-service-commitments-for-controllable-flight-disruptions-unscheduled-maintenance-in
    last_verified: 2026-10-14
  - kind: policy
    claim: >-
      Effective October 19, 2026, ten event types move out of the "Air Carrier" (controllable) delay and
      cancellation cause category into a new "Section 511(b)" category (rule dot-delay-cause-categories). They
      include aircraft damage caused by extreme weather, foreign object debris or sabotage, cybersecurity attacks,
      unexpected government system failures, unscheduled maintenance that cannot be deferred or must be addressed
      before flight, medical emergencies through no fault of the carrier, removal of an unruly passenger, and
      airport closures from volcanic ash, wind or wind shear. DOT says "the number of delays and cancellations for
      which air carriers provide amenities and compensation to consumers is expected to be reduced". Crew
      problems and other maintenance stay "Air Carrier" causes.
    issues: [flight_cancellation, flight_delay]
    source: https://www.federalregister.gov/documents/2026/09/03/2026-18040/cause-of-airline-delay-and-cancellation-categories-under-section-511b-of-the-faa-reauthorization-act
    last_verified: 2026-10-14
  - kind: policy
    claim: >-
      DOT stated in August 2026 that the delay and cancellation dashboard and the family seating dashboard
      currently exist on its website, and that a seat size dashboard has not yet been created.
    issues: [flight_cancellation, flight_delay]
    source: https://www.federalregister.gov/documents/2026/08/31/2026-17721/aviation-consumer-protection-advisory-committee-notice-of-public-meeting
    last_verified: 2026-10-12
status_note: >-
  In force as a disclosure and enforcement mechanism, not as a compensation rule. Section 506 of the FAA
  Reauthorization Act of 2024 requires DOT to maintain the dashboard; DOT confirmed on August 31, 2026 that it
  exists. On October 14, 2026 the dashboard was live at
  transportation.gov/airconsumer/airline-cancellation-delay-dashboard (last updated September 11, 2025), and the
  combined Airline Customer Service Dashboard at transportation.gov/airconsumer/airline-customer-service-dashboard
  (last updated December 10, 2024) linked to it. Both tables list nine airlines; the cancellation and delay page
  still says "These ten large U.S. airlines" and still links Spirit Airlines' plan. The commitments are chosen by each airline and can change; check the
  airline's current customer service plan. DOT withdrew its 2024 proposal to require compensation (see
  rules/dot-delay-compensation-proposal). The cause-category rule (91 FR 56588, rules/dot-delay-cause-categories)
  narrows what DOT counts as controllable from October 19, 2026. Whether DOT has formally ended the December 10,
  2025 enforcement notice was not confirmed; its stated end is the conclusion of RIN 2105-AF29.
source: https://www.federalregister.gov/documents/2025/11/17/2025-20042/airline-passenger-rights-withdrawal
last_verified: 2026-10-14
