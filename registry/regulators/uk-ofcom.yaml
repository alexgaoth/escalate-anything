id: uk-ofcom
name: Ofcom (UK communications regulator)
short_name: Ofcom
level: national
country: gb
covers_sectors: [wireless, internet_tv]
covers_issues:
  - billing_error
  - bill_increase
  - cancel_service
  - service_outage
  - poor_service
website: https://www.ofcom.org.uk
when_to_use: >-
  Ofcom does NOT resolve individual complaints about phone, broadband or pay-TV providers. Complain to the provider
  first; after 6 weeks (complaints first raised on or after 8 April 2026) or a deadlock letter, go to the provider's
  ADR scheme - the Communications Ombudsman or CISAS - which can order a fix or compensation. Tell Ofcom about the
  problem as well if you want it on record: Ofcom uses reports to watch for patterns and can investigate and fine
  providers. Ofcom does handle complaints about premium-rate services (09 and 118 numbers) directly.

channels:
  - id: helpline
    type: phone
    label: Ofcom helpline (0300 123 3333)
    value: +44-300-123-3333
    hours: 9.00am to 5pm, Monday to Friday
    purposes: [billing_error, poor_service]
    notes: >-
      Number and hours as printed in Sky's complaints code, in its premium-rate section. Ofcom's own site blocks
      automated reading, so this was not checked on ofcom.org.uk.
    verified_via: browser
    source: https://www.sky.com/help/articles/sky-customer-complaints-code-of-practice/
    last_verified: 2026-11-19
  - id: helpline-geographic
    type: phone
    label: Ofcom helpline, alternative number (020 7981 3040)
    value: +44-20-7981-3040
    hours: 9.00am to 5pm, Monday to Friday
    notes: Same source as the 0300 number. Not checked on ofcom.org.uk.
    verified_via: browser
    source: https://www.sky.com/help/articles/sky-customer-complaints-code-of-practice/
    last_verified: 2026-11-19
  - id: helpline-welsh
    type: phone
