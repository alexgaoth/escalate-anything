id: uk-cisas
name: CISAS - Communications and Internet Services Adjudication Scheme (Ofcom-approved ADR scheme)
short_name: CISAS
level: ombudsman
country: gb
covers_sectors: [wireless, internet_tv]
covers_issues:
  - billing_error
  - bill_increase
  - cancel_service
  - service_outage
  - equipment_return
  - poor_service
  - number_port_out
  - early_termination_fee
website: https://www.cedr-assist.com/consumer/cisas/overview/
when_to_use: >-
  Use for a phone, mobile, broadband or pay-TV dispute when the provider is a CISAS member. On 2026-11-19 the CISAS list
  included Sky, NOW, Virgin Media, O2, Vodafone (also for VOXI), Three, SMARTY and TalkTalk Group. Complain to the
  provider first. You can apply when at least 6 weeks have passed since you first complained, or earlier if you have a
  deadlock (ADR) letter. CISAS is free for consumers. It does not take claims over GBP 10,000 or cases already in court.

channels:
  - id: apply-online
    type: web_form
    label: CISAS online application
    value: https://3joav.share-eu1.hsforms.com/2nZMfDXK9QnCPmuZREaYbFg
    purposes: [billing_error, bill_increase, cancel_service, service_outage, equipment_return, poor_service]
    notes: >-
      Linked as "Set up online application" from the CISAS make-a-complaint page (the form is hosted by HubSpot for
      CEDR). Have ready the date you first complained, any deadlock/ADR letter and its date, contact history with
      names, the compensation you want and supporting documents (docx, doc, pdf, png, jpg, jpeg, .msg; up to 40MB
      online, 10MB by email).
    verified_via: page
    source: https://www.cedr-assist.com/consumer/cisas/make-a-complaint/
    last_verified: 2026-11-19
  - id: make-a-complaint-page
