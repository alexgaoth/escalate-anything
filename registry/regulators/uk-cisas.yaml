facts:
  - kind: policy
    claim: >-
      "CISAS is managed independently by Centre for Effective Dispute Resolution (CEDR)" and "CISAS is an Ofcom
      approved alternative dispute resolution provider." It is free to use.
    source: https://www.cedr-assist.com/consumer/cisas/overview/
    verified_via: page
    last_verified: 2026-11-19
  - kind: deadline
    claim: >-
      You can apply if you have already complained to the company and "At least six weeks have passed since you first
      complained to them or you have received a deadlock/ ADR letter".
    source: https://www.cedr-assist.com/consumer/cisas/make-a-complaint/
    verified_via: page
    last_verified: 2026-11-19
  - kind: limit
    claim: >-
      The complaint must not be the subject of court action and must not exceed GBP 10,000. CISAS excludes complaints
      about fraud, property damage, discrimination or data protection, and you must be based in the UK (not the
      Republic of Ireland).
    source: https://www.cedr-assist.com/consumer/cisas/make-a-complaint/
    verified_via: page
    last_verified: 2026-11-19
  - kind: compensation
    claim: >-
      If a settlement or award is made, it is applied as a credit to your existing account. CISAS publishes a Guide to
      Compensation for Inconvenience and Distress to help you decide what to ask for.
    source: https://www.cedr-assist.com/consumer/cisas/make-a-complaint/
    verified_via: page
    last_verified: 2026-11-19
  - kind: policy
    claim: >-
      The CISAS list of companies covered includes Sky, NOW, Virgin Media, O2, Vodafone, Three, SMARTY and "TalkTalk Group
      (including Shell Energy Broadband)". VOXI complaints are filed by selecting Vodafone. BT, EE, giffgaff and
      Plusnet are not listed as members (EE appears only inside a business reseller's entry).
    source: https://www.cedr-assist.com/consumer/cisas/companies-covered/
    verified_via: page
    last_verified: 2026-11-19

notes: >-
  CISAS is run by CEDR (Centre for Effective Dispute Resolution). cisas.org.uk did not respond on 2026-11-19 and
  cedr.com/consumer/cisas redirects to cedr-assist.com. The CISAS pages read on 2026-11-19 do not state a time limit
  after the deadlock letter, how long decisions take, or how long you have to accept a decision; these are in the CISAS
  Scheme Rules, which were not read. The Communications Ombudsman is the other Ofcom-approved scheme.
