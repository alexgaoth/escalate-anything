facts:
  - kind: policy
    claim: >-
      The FCA says: we can't investigate individual complaints or give you information about any investigations; we
      can't recover money lost to scams; we can't provide advice or interpret our rules. The Financial Ombudsman Service
      handles individual complaints against firms.
    source: https://www.fca.org.uk/contact
    verified_via: page
    last_verified: 2026-11-19
  - kind: process
    claim: >-
      If you are unhappy with a financial product or service, contact the firm, tell it what happened and when, ask it
      to put things right, and keep a record. If unhappy with its decision or you do not hear back in time, the
      Financial Ombudsman Service may help; contact it within 6 months of the firm's final response.
    source: https://www.fca.org.uk/consumers/how-complain
    verified_via: page
    last_verified: 2026-11-19
  - kind: contact
    claim: >-
      To report fraud: Report Fraud on 0300 123 2040 or reportfraud.police.uk; in Scotland, Police Scotland on 101 or
      Advice Direct Scotland on 0808 164 6000. The FCA Warning List lists unauthorised firms and individuals.
    issues: [fraud]
    source: https://www.fca.org.uk/contact
    verified_via: page
    last_verified: 2026-11-19

notes: >-
  Included so agents know not to send individual complaints here. Read on 2026-11-19. The Payment Systems Regulator's
  functions (including APP scam reimbursement) are due to move to the FCA under the Financial Services and Markets
  Bill introduced in May 2026 (PSR news item, July 2026).
