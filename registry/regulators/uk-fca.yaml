id: uk-fca
name: Financial Conduct Authority
short_name: FCA
level: national
country: gb
covers_sectors: [bank, credit_union, payments, investing]
covers_issues:
  - fraud
website: https://www.fca.org.uk
when_to_use: >-
  Not for individual complaints: the FCA says it cannot investigate individual complaints, recover money lost to scams
  or give advice. For a problem with your bank or card, complain to the firm and then to the Financial Ombudsman Service
  (uk-fos). Use the FCA to check that a firm is authorised (Financial Services Register), to check the Warning List of
  unauthorised firms, and to report a scam, an unauthorised firm, or a payment or e-money firm's conduct. Reports help
  the FCA regulate but do not get your money back.

