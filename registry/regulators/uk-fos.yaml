id: uk-fos
name: Financial Ombudsman Service
short_name: Financial Ombudsman
level: ombudsman
country: gb
covers_sectors: [bank, credit_union, payments, investing, insurance_property, insurance_health]
covers_issues:
  - unauthorized_charge
  - fraud
  - transaction_dispute
  - fee_reversal
  - frozen_funds
  - identity_theft
  - account_access
  - billing_error
  - poor_service
  - claim_denial
website: https://www.financial-ombudsman.org.uk
when_to_use: >-
  Use after you complained to the bank, card issuer, building society, payment firm or insurer and it sent a final
  response you disagree with, or did not reply within 8 weeks (15 days for fraud, scams and payment services, up to 35
  in some cases). Refer within 6 months of the final response. It covers refused refunds of unauthorised payments, APP
  scam reimbursement, chargeback and Section 75 refusals, blocked or closed accounts, charges and poor service. Free;
  no claims company needed. If you accept the ombudsman's decision, the firm must follow it.

channels:
  - id: complaint-form
    type: web_form
    label: Make a new complaint online
    value: https://complaintsubmission.financial-ombudsman.org.uk/
    purposes: [unauthorized_charge, fraud, transaction_dispute, fee_reversal, frozen_funds, identity_theft, account_access, billing_error, poor_service, claim_denial]
    access: open
    notes: Have the firm's final response and your evidence ready. If the form fails, the helpline takes the complaint by phone.
    verified_via: page
    source: https://www.financial-ombudsman.org.uk/contact-us
    last_verified: 2026-11-19
  - id: helpline
    type: phone
    label: Consumer helpline (0800 023 4567)
    value: +44-800-023-4567
    hours: Monday to Friday, 8am to 5pm
    purposes: [unauthorized_charge, fraud, transaction_dispute, fee_reversal, frozen_funds, identity_theft, account_access, billing_error, poor_service, claim_denial]
    notes: >-
      For new complaints and people without a case handler yet; also for urgent ill health or financial difficulty.
      The line can be busy. Other numbers on the same page: 0300 123 9 123 (costs no more than 01 or 02 numbers);
      Relay UK (18002) 020 7964 1000; BSL through SignVideo.
    verified_via: page
    source: https://www.financial-ombudsman.org.uk/contact-us
    last_verified: 2026-11-19
  - id: helpline-0300
    type: phone
    label: Consumer helpline, 0300 number (0300 123 9 123)
    value: +44-300-123-9123
    hours: Monday to Friday, 8am to 5pm
    verified_via: page
    source: https://www.financial-ombudsman.org.uk/contact-us
    last_verified: 2026-11-19
  - id: from-abroad
    type: phone
    label: Calling from abroad (+44 20 7964 0500)
    value: +44-20-7964-0500
    notes: The page offers to call you back if you are concerned about the cost.
    verified_via: page
    source: https://www.financial-ombudsman.org.uk/contact-us
