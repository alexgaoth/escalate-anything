facts:
  - kind: process
    claim: >-
      Citizens Advice says to contact your energy supplier straight away about a problem; you can go to the Energy
      Ombudsman only after you complained to the supplier. Contact the consumer service if you need more help, for
      example if you cannot reach the supplier, the problem is not fixed, you have been or may be disconnected, the
      issue is complex, or the supplier considers you vulnerable.
    source: https://www.citizensadvice.org.uk/consumer/energy/energy-supply/complain-about-an-energy-company/complain-to-your-energy-supplier/
    verified_via: page
    last_verified: 2026-11-19
  - kind: policy
    claim: >-
      Consumer service advisers give practical, impartial advice, explain the law, can pass a complaint to your energy
      supplier and can pass complaint information to Trading Standards. They cannot make a complaint for you or take
      legal action for you.
    source: https://www.citizensadvice.org.uk/consumer/get-more-help/if-you-need-more-help-about-a-consumer-issue/
    verified_via: page
    last_verified: 2026-11-19
  - kind: policy
    claim: >-
      Under the energy complaints handling regulations, Citizens Advice and Citizens Advice Scotland are the "consumer
      advocacy body", and every energy company must have arrangements to deal effectively with complaints they refer.
    source: https://www.legislation.gov.uk/uksi/2008/1898/regulation/9
    verified_via: page
    last_verified: 2026-11-19
  - kind: process
    claim: >-
      Ofgem: in England or Wales, Citizens Advice may refer you to the Extra Help Unit if you need support with a
      difficult or urgent complaint, cannot deal with the supplier alone, are considered vulnerable, or risk being
      disconnected.
    issues: [disconnection]
    source: https://www.ofgem.gov.uk/your-energy-supply/problems-your-energy-supply/complain-about-your-energy-supplier-or-network-operator
    verified_via: page
    last_verified: 2026-11-19
  - kind: policy
    claim: >-
      The Extra Help Unit is part of Citizens Advice Scotland and works across England, Scotland and Wales. It raises
      complaints with energy suppliers for people who may be vulnerable or at risk of disconnection, and its service is
      free. Its site gives no direct public contact route.
    issues: [disconnection]
    source: https://ehu.org.uk/
    verified_via: page
    last_verified: 2026-11-19
  - kind: contact
    claim: >-
      For a phone, internet or TV bill dispute, Citizens Advice says to contact its consumer helpline on 0808 223 1133
      if you need more help, and to use the provider's alternative dispute resolution (ADR) scheme (listed by Ofcom) if
      the provider does not respond or you disagree with its decision.
    source: https://www.citizensadvice.org.uk/consumer/phone-internet-downloads-or-tv/dispute-a-phone-internet-or-tv-bill/
    verified_via: page
    last_verified: 2026-11-19

notes: >-
  Not the official first stop: Ofgem and Citizens Advice both say to complain to the supplier first, then use the
  Energy Ombudsman after 8 weeks or a deadlock letter; Citizens Advice gives help alongside that. Its consumer pages say
  they apply to England, with separate pages for Wales, Scotland and Northern Ireland. Ofgem lists the same helpline for
  England and Wales and energyadvice.scot for Scotland. Read on 2026-11-19.
