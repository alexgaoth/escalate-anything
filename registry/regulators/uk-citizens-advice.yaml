id: uk-citizens-advice
name: Citizens Advice consumer service
short_name: Citizens Advice
level: nonprofit
country: gb
covers_sectors: [utility, internet_tv, wireless]
covers_issues:
  - billing_error
  - bill_increase
  - payment_assistance
  - disconnection
  - slamming
  - refund_request
  - cancel_service
  - poor_service
website: https://www.citizensadvice.org.uk
when_to_use: >-
  Free, impartial advice at any stage of an energy, phone, broadband or TV problem. It is not the first stop and not a
  complaints body: complain to the company first (Ofgem and Citizens Advice both say so). Call or use the online form
  when the company does not reply or fix the problem, you face disconnection, the issue is complex, or you are
  vulnerable. Advisers explain your rights, can pass a complaint to your energy supplier, can pass information to
  Trading Standards, and may refer urgent or vulnerable energy cases to the Extra Help Unit. They cannot complain for
  you or take legal action. The helpline serves England and Wales; for energy in Scotland Ofgem lists Energy Advice
  Scotland (Advice Direct Scotland).

