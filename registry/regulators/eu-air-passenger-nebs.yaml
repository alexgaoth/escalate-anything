facts:
  - kind: policy
    claim: >-
      Article 16(1): "Each Member State shall designate a body responsible for the enforcement of this Regulation as
      regards flights from airports situated on its territory and flights from a third country to such airports."
      Article 16(2) lets each passenger complain to any designated body "about an alleged infringement of this
      Regulation at any airport situated on the territory of a Member State or concerning any flight from a third
      country to an airport situated on that territory."
    verified_via: browser
    source: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32004R0261
    last_verified: 2026-11-19
  - kind: process
    claim: >-
      The Commission's NEB page says passengers should "contact the body in the country where the incident took
      place."
    source: https://transport.ec.europa.eu/transport-themes/passenger-rights/national-enforcement-bodies-neb_en
    last_verified: 2026-11-19
  - kind: process
    claim: >-
      Your Europe says to always send the complaint to the airline first. "If you don't receive a reply from the airline
      within 2 months or if you are not satisfied with the reply, you can lodge a complaint with the relevant national
      authority [...] in the country where the incident took place, within a reasonable timeframe." The national
      authority "should provide you with a non-binding legal opinion on how to proceed with your claim."
    verified_via: browser
    source: https://europa.eu/youreurope/citizens/travel/passenger-rights/air/index_en.htm
    last_verified: 2026-11-19
  - kind: process
    claim: >-
      Your Europe says you can also use out-of-court procedures or an alternative dispute resolution entity, but
      "Access to alternative dispute resolution procedures is only available to EU residents." A local European
      Consumer Centre can also help.
    verified_via: browser
    source: https://europa.eu/youreurope/citizens/travel/passenger-rights/air/index_en.htm
    last_verified: 2026-11-19
  - kind: process
    claim: >-
      The Irish NEB states the rule in practice: the appropriate body is the one in the EU Member State (or Iceland,
      Norway or Switzerland) "from where the disrupted flight was due to depart". On a Dublin-Malaga return trip, a
      disrupted outbound flight goes to the IAA and a disrupted return flight to Spain's AESA. For flights departing
      from outside those countries, "the destination of the flight determines which authority you should contact",
      and only if the flight is operated by a Community-licensed carrier.
    verified_via: browser
    source: https://www.iaa.ie/consumer-protection/air-passenger-rights
    last_verified: 2026-11-19
  - kind: policy
    claim: >-
      Ireland: "The Irish Aviation Authority (IAA) is the National Enforcement Body for EC 261/2004." Complaints go
      through the IAA's MySRS customer portal.
    verified_via: browser
    source: https://www.iaa.ie/consumer-protection/air-passenger-rights
    last_verified: 2026-11-19
  - kind: policy
    claim: >-
      Spain: Orden TMA/201/2022 of 14 March 2022 (BOE 17 March 2022) regulates AESA's alternative dispute resolution
      procedure for air passengers. Article 18.1: "La decisión del Director de la Agencia es vinculante para la compañía
      aérea"; it does not bind the passenger (Article 18.2). Article 6 requires a prior complaint to the airline, which
      must answer within one month. Article 3(f) excludes claims for destruction, loss, damage or delay of checked
      baggage.
    source: https://www.boe.es/buscar/act.php?id=BOE-A-2022-4201
    last_verified: 2026-11-19
  - kind: policy
    claim: >-
      Spain: Orden TMA/469/2023 of 17 April 2023 accredits AESA as the ADR entity for air transport. AESA's e-office
      lists two complaint procedures: "resolución alternativa de litigios" for flights from 2 June 2023, and an
      information-only procedure ("vía informativa") for flights up to 1 June 2023. File with AESA within one year of
      your complaint to the airline.
    source: https://sede.seguridadaerea.gob.es/sede-aesa/catalogo-de-procedimientos/reclamaciones-por-cancelaciones-retrasos-denegaciones-de-embarque-y-pmr
    last_verified: 2026-11-19
  - kind: policy
    claim: >-
      Germany: the LBA "cannot enforce civil law claims of individual passengers against the airline concerned" and
      does not provide compensation or reimbursement services. Complain to the airline first. If its reply is
      unsatisfactory, the LBA recommends conciliation (free in principle for consumers) or the competent court. A
      three-year limitation period applies in Germany.
    source: https://www.lba.de/EN/AirPassengersRights/_functions_Kacheln_neu/Kachel_6/Complaint_Procedure_node.html
    last_verified: 2026-11-19
  - kind: process
    claim: >-
      Germany: air conciliation is done by Schlichtungsstelle Reise & Verkehr e.V. (private law); the Schlichtungsstelle
      Luftverkehr at the Bundesamt für Justiz takes cases where the airline refuses the private scheme. You must first
      contact the airline without success. The conciliation proposal binds only when all parties accept it.
    source: https://www.lba.de/EN/AirPassengersRights/_functions_Kacheln_neu/Kachel_4/Conciliation_Node.html
    last_verified: 2026-11-19
  - kind: policy
    claim: >-
      Italy: complaints to ENAC "must be submitted exclusively" through https://carta-diritti.enac.gov.it/en. They serve
      to sanction and monitor; the procedure "is not meant to obtain reimbursement or compensation". For compensation or
      a ticket refund, use the Transport Regulatory Authority's (ART) dispute settlement service on the ConciliaWeb
      platform (https://www.autorita-trasporti.it/conciliaweb/).
    verified_via: document
    source: https://transport.ec.europa.eu/document/download/d7b5dd33-4083-4faa-8132-b6dc8b3a1c07_en?filename=2004_261_national_enforcement_bodies.pdf
    last_verified: 2026-11-19
  - kind: process
    claim: >-
      Estonia: complain to the airline first; if it does not answer within six weeks or you are not satisfied, contact
      the competent NEB with the ticket or booking confirmation, your complaint to the airline and any reply. TTJA asks
      the airline for its position and may then issue its own opinion, which "is not legally binding". For airlines
      established in Estonia, the Consumer Disputes Committee is an ADR option (https://komisjon.ee/et/avalduse-esitamine).
    verified_via: browser
    source: https://ttja.ee/en/private-client/consumer-rights/trade-services/travel-services
    last_verified: 2026-11-19
  - kind: process
    claim: >-
      Greece: the HCAA is the NEB for flights departing from Greek airports and for flights from non-EU airports to
      Greece on an EU airline. It will not process a complaint unless you show you contacted the airline first. If it
      finds a violation it asks the airline to respond within six weeks, then sends two reminders (two weeks, then
      seven days).
    source: https://hcaa.gov.gr/en/diadikasia-ypobolis-kataggelias
    last_verified: 2026-11-19
  - kind: policy
    claim: >-
      Switzerland: "FOCA is unable to enforce compensation payments"; in case of an infringement FOCA could sanction the
      airline, and you can still bring a civil claim in court. Contact the operating airline first.
    source: https://www.bazl.admin.ch/en/airpassengerrights
    last_verified: 2026-11-19
  - kind: deadline
    claim: >-
      Norway: Transportklagenemnda takes a case after you tried to settle with the airline. If the airline gave neither
      an interim nor a final reply within four weeks of your complaint you may file; after an interim reply, you may
      file eight weeks after your complaint.
    verified_via: browser
    source: https://www.reiselivsforum.no/web/slik_klager_du/fly/
    last_verified: 2026-11-19
  - kind: policy
    claim: >-
      Finland splits the NEB role: the Consumer Disputes Board handles complaints from private consumers; Traficom
      supervises the rights of non-consumers (business travellers) and the Consumer Ombudsman (Finnish Competition and
      Consumer Authority) supervises consumers' collective interests, neither handling individual cases. Hungary and
      Poland also split complaint handling and enforcement between two bodies.
    verified_via: document
    source: https://transport.ec.europa.eu/document/download/d7b5dd33-4083-4faa-8132-b6dc8b3a1c07_en?filename=2004_261_national_enforcement_bodies.pdf
    last_verified: 2026-11-19
  - kind: policy
    claim: >-
      Baggage is outside the EU261 complaint procedure at several NEBs. Portugal's ANAC form is only for denied
      boarding, downgrading, cancellation or long delay, and it sends baggage complaints (after the airline) to the
      European Consumer Centres.
    source: https://www.anac.pt/vPT/Passageiros/DireitosPassageiro/comoapresentarumaqueixa/Paginas/Comoapresentarumareclamacao.aspx
    last_verified: 2026-11-19
  - kind: policy
    claim: >-
      The Czech CAA's EU261 complaint form covers cancellation, delay, denied boarding, downgrading and lack of care,
      and does not cover luggage.
    source: https://www.caa.gov.cz/en/passengers/denied-boarding-delay-or-cancellation-of-flight/air-passenger-complaint-form/
    last_verified: 2026-11-19
  - kind: policy
    claim: >-
      The Commission keeps a separate NEB list for Regulation (EC) No 1107/2006 (disabled passengers and passengers
      with reduced mobility), dated 5 December 2025. Use it for accessibility complaints; the body can differ from the
      EU261 body.
    issues: [accessibility]
    source: https://transport.ec.europa.eu/transport-themes/passenger-rights/national-enforcement-bodies-neb_en
    last_verified: 2026-11-19
  - kind: policy
    claim: >-
      Romania: ANPC enforces EU261, while the National Authority for the Protection of the Rights of Persons with
      Disabilities enforces Regulation 1107/2006 (except Article 8).
    issues: [accessibility]
    verified_via: browser
    source: https://www.anpc.ro/transport-aerian
    last_verified: 2026-11-19
  - kind: policy
    claim: >-
      Belgium's BCAA page (changed 10 November 2026) says the revision of Regulation 261/2004 was agreed politically
      by the European Parliament and the Council on 15 June 2026 and formally approved in July 2026. It enters into
      force 20 days after publication in the Official Journal, with a transition period. "At present, the rules
      currently in force remain fully applicable."
    verified_via: browser
    source: https://mobilit.belgium.be/en/aviation/passengers/passengers-right
    last_verified: 2026-11-19
  - kind: process
    claim: >-
      Belgium: legal action on a passenger contract, including EU261 claims, must be brought within two years of the
      flight (Article X.49 of the Economic Law Code). The BCAA complaint is a separate procedure; you need not use it
      before going to court.
    verified_via: browser
    source: https://mobilit.belgium.be/en/aviation/passengers/passengers-right
    last_verified: 2026-11-19

notes: >-
  Built from the Commission's list "National enforcement bodies under regulation (EC) No 261/2004" (PDF, "Updated: 13
  October 2026"; linked from the Commission NEB page with that date). The list says each Member State is responsible for
  its own entries. It covers the EU 27, Iceland and Norway (EEA) and Switzerland (equivalent rules under the
  EU-Switzerland air transport agreement). Each channel was checked on the body's own site on 2026-11-19, except Estonia,
  Hungary and Lithuania, where the value comes only from the list. Ireland: the list names the Irish Aviation Authority
  (apr@iaa.ie), and the former Commission for Aviation Regulation site (aviationreg.ie) redirects to iaa.ie; older
  documents name the Commission for Aviation Regulation as Ireland's NEB. Several list entries are out of date: Malta's links
  return 404 and its email differs, Czechia moved to caa.gov.cz, the Netherlands English page moved, Slovakia's English
  link is an internal file path, and Norway's address changed. Channel id neb-gr uses ISO code GR (the EU's own code for
  Greece is EL).
