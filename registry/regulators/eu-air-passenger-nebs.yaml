    value: https://servicerequest.mobilit.fgov.be/p/question/en/LV_PAXR
    purposes: [flight_cancellation, flight_delay, denied_boarding]
    notes: >-
      English version (the Commission list also gives Dutch and French). Use it after the airline rejected the
      complaint, did not answer, or you disagree with its answer. The BCAA enforces only: it can fine airlines but does
      not act in place of the airline on compensation or refunds, and cannot tell you about its investigation. The form
      can take 30 seconds to load. Incomplete forms or illegible documents are dropped without notice. Examination can
      take up to six months.
