id: eu-air-passenger-nebs
name: National Enforcement Bodies for EU air passenger rights (Regulation (EC) No 261/2004)
short_name: NEBs
country: eu
level: national
covers_sectors: [airline]
covers_issues: [flight_cancellation, flight_delay, denied_boarding, accessibility]
website: https://transport.ec.europa.eu/transport-themes/passenger-rights/national-enforcement-bodies-neb_en
when_to_use: >-
  Use after the airline rejected an EU261 claim (denied boarding, cancellation or long delay) or did not answer it.
  Complain to the airline first; Your Europe says to wait 2 months for a reply, and several NEBs set their own wait
  (from 4 weeks to 2 months, see each channel). Pick the NEB of the country where the incident took place: in
  practice the country of the departure airport, and for a flight from outside the EU, Iceland, Norway or Switzerland
  on an EU airline, the country of arrival. Most NEBs only enforce the rules and fine airlines: they give a
  non-binding opinion or none, and do not make the airline pay you. Spain (AESA, flights from 2 June 2023) is the
  main exception: its decision binds the airline. Separate ADR (conciliation) bodies and the courts can award money;
  baggage problems are usually not an NEB matter.

channels:
  - id: neb-at
    type: web_form
    label: "Austria: Agentur für Passagier- und Fahrgastrechte (apf) flight conciliation form"
    value: https://en.apf.gv.at/beschwerdeformular-flug
    purposes: [flight_cancellation, flight_delay, denied_boarding]
    notes: >-
      English and German. apf runs a conciliation (Schlichtung) procedure. You must first complain to the airline in
      writing; apply if it rejects the claim or does not answer satisfactorily within six weeks. Attach at least the
      booking confirmation, the correspondence with the airline and invoices for assistance costs.
    source: https://en.apf.gv.at/beschwerdeformular-flug
    last_verified: 2026-11-19
  - id: neb-be
