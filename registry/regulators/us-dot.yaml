id: us-dot
name: U.S. Department of Transportation, Office of Aviation Consumer Protection
short_name: DOT OACP
level: federal
covers_sectors: [airline, travel_agency]
covers_issues:
  - flight_cancellation
  - flight_delay
  - denied_boarding
  - delayed_baggage
  - lost_baggage
  - damaged_baggage
  - ancillary_fee_refund
  - travel_credit
  - accessibility
website: https://www.transportation.gov/airconsumer
when_to_use: >-
  Use after the airline or ticket agent did not fix an air travel service, refund or disability
  problem. Try the airline first. Safety problems go to the FAA and security problems go to TSA.

channels:
  - id: complaint-form
    type: web_form
    label: OACP complaint, comment and compliment form (ACERS consumer portal)
    value: https://airconsumer.dot.gov/consumer/s/oacp-form
    purposes: [flight_cancellation, flight_delay, denied_boarding, delayed_baggage, lost_baggage, damaged_baggage, ancillary_fee_refund, travel_credit, accessibility]
    access: open
    notes: >-
      Linked from DOT's File a Consumer Complaint page. Also for civil rights complaints, including disability.
      Have the booking details (ticket, itinerary or invoice), flight details (dates, flight numbers, city pairs) and
      supporting documents ready; the form cannot be saved and finished later. The portal home is
      https://airconsumer.dot.gov/consumer/s/.
    source: https://www.transportation.gov/airconsumer/file-consumer-complaint
    last_verified: 2026-10-12
  - id: disability-hotline
    type: phone
    label: Toll-free hotline for air travelers with disabilities
    value: +1-800-778-4838
    hours: 9 a.m. to 5 p.m. Eastern time, Monday through Friday, except federal holidays
    purposes: [accessibility]
    notes: Voice line. Deaf, hard of hearing or speech-disabled callers dial 711 for relay. For general information and time-sensitive disability problems. For a DOT investigation, submit the complaint in writing or online.
    source: https://www.transportation.gov/airconsumer/toll-free-hotline-air-travelers-disabilities
    last_verified: 2026-10-12
  - id: mail
    type: mail
    label: Complaint by mail
    value: Office of Aviation Consumer Protection, U.S. Department of Transportation, 1200 New Jersey Avenue, SE, Washington, DC 20590
    notes: Include your full address, email address and phone number, and complete information about the trip and the problem.
    source: https://www.transportation.gov/airconsumer/file-consumer-complaint
    last_verified: 2026-10-12

facts:
  - kind: process
    claim: >-
      DOT says that under ACERS, when a complaint, comment or compliment is submitted, the airline or
      ticket agent receives it in real time in the ACERS Aviation Industry Portal and by email. Under
      the old system it took over a month.
    source: https://www.transportation.gov/briefing-room/usdot-modernizes-aviation-consumer-complaint-system
    last_verified: 2026-10-12
  - kind: deadline
    claim: >-
      DOT requires airlines to acknowledge consumer complaints within 30 days of receiving them and to
      send written responses within 60 days of receiving them (30 days for disability-related
      complaints).
    source: https://www.transportation.gov/airconsumer/complaint-process
    last_verified: 2026-10-12
  - kind: process
    claim: >-
      For a complaint filed with DOT, OACP directs the airline or ticket agent to respond directly to
      the consumer and to give OACP a copy of the response. OACP investigates every civil rights
      (discrimination) complaint, but does not investigate every other consumer complaint; it runs
      targeted or sample reviews instead.
    source: https://www.transportation.gov/airconsumer/complaint-process
    last_verified: 2026-10-12
  - kind: process
    claim: >-
      A mailed complaint should include your full name and contact details, a description of the
      problem, the ticket, itinerary or invoice, the flight dates, numbers and city pairs, and copies of
      supporting documents such as the complaint you sent the airline.
    source: https://www.transportation.gov/airconsumer/complaint-process
    last_verified: 2026-10-12
  - kind: deadline
    claim: >-
      For a disability (Air Carrier Access Act) complaint, a formal complaint must be filed within six
      months of the incident to make sure DOT investigates it.
    issues: [accessibility]
    source: https://www.law.cornell.edu/cfr/text/14/382.159
    last_verified: 2026-10-12
  - kind: process
    claim: >-
      For a disability problem during the trip, ask to speak to the airline's Complaint Resolution
      Official (CRO), who has authority to resolve complaints for the airline.
    issues: [accessibility]
    source: https://www.transportation.gov/airconsumer/complaint-process
    last_verified: 2026-10-12
  - kind: process
    claim: >-
      DOT says to give the airline a chance to resolve the problem first. Airline safety problems go
      to the FAA, and aviation security problems go to TSA (1-866-289-9673).
    source: https://www.transportation.gov/airconsumer/file-consumer-complaint
    last_verified: 2026-10-12

notes: >-
  The office was formerly named the Aviation Consumer Protection Division (C-75); older documents use
  that name. DOT replaced its 1990s complaint system with ACERS (announced as "recently launched" in a press release dated
  August 13, 2025). Checked by loading transportation.gov and airconsumer.dot.gov pages on 2026-10-12.
