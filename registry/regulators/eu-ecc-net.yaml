    purposes: [flight_cancellation, flight_delay, denied_boarding, delayed_baggage, lost_baggage, damaged_baggage, refund_request, reservation_problem, damage_claim, damaged_item]
    access: open
    notes: >-
      For consumers who live in Belgium, against a trader in another EU country, Iceland, Norway or the UK.
      Contact the trader in writing first and wait a reasonable time. Send one complete complaint with the
      full proof of purchase, proof of payment and the main correspondence (one PDF or Word file); no ZIP
      files. ECC Belgium asks for your IBAN and BIC only when a refund is involved. No other body (ombudsman,
      court, lawyer, payment provider) may handle the case at the same time. Response time can be up to
      three months.
    source: https://www.eccbe.eu/en/solve-your-problem/looking-for-legal-support/
    last_verified: 2026-11-19
