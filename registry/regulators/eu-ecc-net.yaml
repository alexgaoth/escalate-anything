facts:
  - kind: fee
    claim: >-
      ECC-Net gives free, confidential expert advice on consumer rights and free help with cross-border
      consumer complaints.
    source: https://www.eccnet.eu/ecc-network/our-services
    last_verified: 2026-11-19
  - kind: policy
    claim: >-
      ECC-Net covers the 27 EU member states plus Norway and Iceland. The consumer and the trader must be in
      different countries. The United Kingdom is no longer a member of ECC-Net, but the network still takes
      up complaints against traders based in the UK. UK residents with a cross-border complaint go to the UK
      International Consumer Centre (UKICC).
    source: https://www.eccnet.eu/ecc-network/our-services
    last_verified: 2026-11-19
  - kind: limit
    claim: >-
      ECC-Net cannot mediate when the trader is based in Switzerland, China, the United States or another
      non-EU country (Norway, Iceland and the UK excepted). ECC Netherlands and ECC Portugal also name
      Switzerland as a country they cannot help with.
    source: https://www.eccbe.eu/en/solve-your-problem/looking-for-legal-support/
    last_verified: 2026-11-19
  - kind: process
    claim: >-
      First file a complaint with the trader and make sure it is registered and acknowledged. If you cannot
      resolve the dispute with the trader, submit a complaint to the European Consumer Centre in your country
      of residence. If the case is outside ECC-Net's remit, the ECC can advise on legal and out-of-court
      options.
    source: https://www.eccnet.eu/ecc-network/our-services/our-work
    last_verified: 2026-11-19
  - kind: process
    claim: >-
      Your ECC makes a legal assessment of the complaint and asks for evidence. If it finds the case
      justified, it forwards it to the ECC in the trader's country, which contacts the trader directly to
      seek a solution. If the trader does not resolve the complaint, the ECC tells the consumer about
      alternative dispute resolution (ADR) options. ECC Hungary says claims for non-material damage must go
      to a civil court.
    source: https://nkfh.gov.hu/en/european-consumer-centre
    last_verified: 2026-11-19
  - kind: limit
    claim: >-
      ECC Germany says it is neither an arbitration body nor a public authority. It has no enforcement
      powers, cannot force a company to act or impose sanctions, and does not investigate; the result
      depends on the company's willingness to cooperate. ECC-Net says the same for the whole network ("we do
      not have enforcement powers").
    source: https://www.evz.de/en/question-complaint/
    last_verified: 2026-11-19
  - kind: limit
    claim: >-
      ECC-Net cannot help with consumer-to-consumer or business-to-business transactions, or when the
      business refuses to cooperate, the consumer has already started legal action, the business cannot be
      located or identified, the business is involved in fraud, or the purchase is a financial or investment
      product (gambling, investment funds, cryptocurrencies, stock markets).
    source: https://www.eccnet.eu/ecc-network/our-services
    last_verified: 2026-11-19
  - kind: deadline
    claim: >-
      An ECC's involvement does not interrupt the limitation period for a court claim. If the deadline is
      near, ECC Germany says to contact a lawyer or use a European court procedure (European Small Claims
      Procedure or European Payment Order). ECC Belgium and ECC Portugal say the same.
    source: https://www.evz.de/en/question-complaint/
    last_verified: 2026-11-19
  - kind: deadline
    claim: >-
      ECC Germany acts only after you complained to the company in writing (with a copy) and gave it at
      least four weeks to answer. ECC France asks you to wait 3 weeks for the trader's answer.
    source: https://www.evz.de/en/question-complaint/
    last_verified: 2026-11-19
  - kind: policy
    claim: >-
      The EU Online Dispute Resolution (ODR) platform is closed. Regulation (EU) 2024/3228 repealed the ODR
      Regulation (EU) No 524/2013 with effect from 20 July 2025; new complaints to the platform stopped on
      20 March 2025, and all case data was to be deleted by 20 July 2025. A trader's terms or website that
      still point to the ODR platform (ec.europa.eu/consumers/odr) are out of date; use the trader's ADR body
      or the ECC instead.
    verified_via: browser
    source: https://eur-lex.europa.eu/eli/reg/2024/3228/oj/eng
    last_verified: 2026-11-19
  - kind: policy
    claim: >-
      The old ODR platform address now redirects to a Commission page that says the ODR platform is
      discontinued as of 20 July 2025 and points to the Commission's list of national consumer dispute
      resolution (ADR) bodies at https://consumer-redress.ec.europa.eu/dispute-resolution-bodies.
    source: https://consumer-redress.ec.europa.eu/site-relocation_en
    last_verified: 2026-11-19
  - kind: policy
    claim: >-
      ECC-Net's air passenger guidance says Regulation (EC) No 261/2004 applies to flights within the EU
      (EU or non-EU airline), flights into the EU from outside on an EU airline, and flights from the EU to a
      non-EU country (any airline). Outbound and return flights count as two separate flights. Only the
      operating air carrier is responsible, and in a wet lease the airline that hires the aircraft and crew
      is the operating carrier.
    issues: [flight_cancellation, flight_delay, denied_boarding]
    source: https://www.eccnet.eu/consumer-rights/what-are-my-consumer-rights/travel-and-passenger-rights/air-passenger-rights
    last_verified: 2026-11-19
  - kind: deadline
    claim: >-
      ECC-Net's air passenger guidance on the Montreal Convention says to report baggage problems at once
      and at the latest: damaged baggage, claim against the airline within 7 days; delayed baggage, report
      within 21 days; lost baggage, claim within 2 years. Keep receipts for emergency purchases.
    issues: [damaged_baggage, delayed_baggage, lost_baggage]
    source: https://www.eccnet.eu/consumer-rights/what-are-my-consumer-rights/travel-and-passenger-rights/air-passenger-rights
    last_verified: 2026-11-19
  - kind: policy
    claim: >-
      The reform of Regulation (EC) No 261/2004 that ECC-Net reported on 8 July 2026 was adopted as Regulation (EU)
      2026/2202 of 16 September 2026 (OJ L, 2 October 2026). Under its Article 3 it applies from 23 October 2027;
      until then the 2004 rules apply. See rules/eu261 for the details.
    issues: [flight_cancellation, flight_delay, denied_boarding]
    source: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32026R2202
    last_verified: 2026-11-19
  - kind: process
    claim: >-
      ECC-Net warns of scammers who pose as ECC-Net staff (for example a "Chief Inspector of the European
      Consumer Rights Centre") and offer to recover lost money. ECC-Net does not recover lost funds, never
      contacts consumers to ask for payments or personal details, and never charges for help.
    source: https://www.eccnet.eu/news/scam-fraudulent-consumer-protection-representatives-impersonating-ecc-net
    last_verified: 2026-11-19

notes: >-
  ECC-Net has 29 centres (one in each EU country, plus Norway and Iceland), co-funded by the European
  Commission and national governments; the network site is https://www.eccnet.eu. Most centres use one of two
  shared form platforms (webforms.eccnet.eu or eccwebforms.eu); Portugal uses the ECC-Net service desk behind
  EU Login. Many centres warn of response times of several months. Not verified on 2026-11-19: Romania
  (eccromania.ro served a "Verifying your browser" bot check) and Lithuania (ecc.lt returned HTTP 403), so
  they have no channel here; use the ECC-Net directory for them. Sweden routes ECC cases through
  Konsumentverket. For UK residents the UK International Consumer Centre is at https://www.ukecc.net/.
  Checked by loading the Commission, eccnet.eu and national centre pages on 2026-11-19 (Portugal and the
  EUR-Lex text in a browser; Norway and the konsumenteuropa.se pages by a plain fetch that curl could not
  repeat).
