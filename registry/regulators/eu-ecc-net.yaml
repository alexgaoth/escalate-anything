id: eu-ecc-net
name: European Consumer Centres Network (ECC-Net)
short_name: ECC-Net
country: eu
level: supranational
covers_sectors: [airline, travel_agency, lodging, car_rental, ground_transport, cruise, retail]
covers_issues:
  - flight_cancellation
  - flight_delay
  - denied_boarding
  - delayed_baggage
  - lost_baggage
  - damaged_baggage
  - accessibility
  - refund_request
  - reservation_problem
  - damage_claim
  - damaged_item
  - warranty_claim
website: https://commission.europa.eu/topics/consumers/consumer-rights-and-complaints/resolve-your-consumer-complaint/european-consumer-centres-network-ecc-net_en
when_to_use: >-
  Free help when you live in an EU country, Iceland or Norway and have a consumer complaint against a
  trader based in a different one of those countries (a cross-border complaint), for example an airline,
  hotel, car rental company, travel agency or web shop. Complain to the trader in writing first and give it
  time to answer. Then contact the European Consumer Centre (ECC) in the country where YOU live, not the
  trader's country. ECCs also take complaints against traders in the United Kingdom, but the UK left
  ECC-Net, so UK residents go to the UK International Consumer Centre. ECC-Net cannot help with traders in
  Switzerland or other non-EU countries, with domestic complaints, or with fraud and financial products.
  ECCs mediate; they cannot force a trader to pay.

channels:
  - id: ecc-net-commission
    type: portal
    label: European Commission ECC-Net page, with a link to the centre in each country
    value: https://commission.europa.eu/topics/consumers/consumer-rights-and-complaints/resolve-your-consumer-complaint/european-consumer-centres-network-ecc-net_en
    notes: >-
      Says "You must contact ECC Net in the country where you live." The country links go to each
      centre's home page; some of them are old addresses that redirect (for example Hungary and Spain).
      The ECC-Net directory (channel ecc-net-directory) links straight to each centre's complaint or
      contact page.
    source: https://commission.europa.eu/topics/consumers/consumer-rights-and-complaints/resolve-your-consumer-complaint/european-consumer-centres-network-ecc-net_en
    last_verified: 2026-11-19
  - id: ecc-net-directory
    type: portal
    label: ECC-Net directory "Contact your local ECC" (one card per centre, linked to its complaint or contact page)
    value: https://www.eccnet.eu/contact-your-local-ecc
    notes: >-
      Lists 31 offices for the 29 centres (Austria and Italy have two offices each). The page says to
      click your local ECC's card and submit the enquiry on that national ECC's website, and that replies
      can take a while because ECCs receive more cases than usual. The UK is not listed "because it left
      the EU in 2020".
    source: https://www.eccnet.eu/contact-your-local-ecc
    last_verified: 2026-11-19

